name: HealthIA Wave4 LIVE resource navigation

on:
  pull_request:
    paths:
      - "scripts/wave4_live_resource_probe.py"
      - ".github/workflows/wave4-live-resource-proof.yml"
      - "healthia_one/google_maps_connector.py"
      - "healthia_one/google_navigation_coordinator.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthia-wave4-live-resource-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: healthia-6088a
  MAPS_SECRET_NAME: healthia-google-maps-api-key

jobs:
  live-resource-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4

      - name: Authenticate to controlled Google Cloud project
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Require existing Maps secret metadata
        shell: bash
        run: |
          set -euo pipefail
          state="$(gcloud secrets versions describe latest --secret "$MAPS_SECRET_NAME" --project "$PROJECT_ID" --format='value(state)')"
          test "$state" = ENABLED
          echo HEALTHIA_WAVE4_MAPS_SECRET_METADATA_PASS

      - name: Run bounded real Google Places mission proof
        shell: bash
        run: |
          set -euo pipefail
          maps_key="$(gcloud secrets versions access latest --secret "$MAPS_SECRET_NAME" --project "$PROJECT_ID")"
          test -n "$maps_key"
          echo "::add-mask::$maps_key"
          export GOOGLE_MAPS_API_KEY="$maps_key"
          python scripts/wave4_live_resource_probe.py
          unset GOOGLE_MAPS_API_KEY maps_key

      - name: Upload sanitized LIVE proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave4-LIVE-Resource-Proof
          path: dist/wave4-live-resource-proof/report.json
          if-no-files-found: warn
          retention-days: 30
