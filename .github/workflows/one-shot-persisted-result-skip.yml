name: One-shot persisted result no-extra-call repair

on:
  push:
    branches:
      - kira/event-driven-results-twin-p1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/event-driven-results-twin-p1
          fetch-depth: 0
      - name: Skip redundant Gemini calls for already-closed result missions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('healthia_one/gemini.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from healthia_one.models import ChatResponse, PatientState, RiskLevel\n'
          new_import = 'from healthia_one.models import ChatResponse, MissionStatus, PatientState, RiskLevel\n'
          if old_import not in text:
              raise SystemExit('Gemini model import anchor not found')
          text = text.replace(old_import, new_import, 1)

          anchor = '''        if isinstance(interview, dict):\n            return await self._enhance_clinical_interview(state, patient_text, draft, interview)\n\n        if self.settings.llm_backend != "gemini_api" or not self.settings.adk_ready:\n'''
          replacement = '''        if isinstance(interview, dict):\n            return await self._enhance_clinical_interview(state, patient_text, draft, interview)\n\n        if (\n            draft.mission is not None\n            and draft.mission.mission_type == "result_explanation"\n            and draft.mission.status == MissionStatus.COMPLETED\n        ):\n            # The upload path already used Gemini to interpret and persist this\n            # evidence. Reopening the same persisted result is a retrieval task,\n            # not a reason to spend another model request or risk paraphrase drift.\n            draft.message.metadata.update(\n                {\n                    "llm_backend": self.settings.llm_backend,\n                    "llm_status": "persisted_result_retrieval",\n                    "model": self.settings.model,\n                    "store": False,\n                    "ai_request_skipped": True,\n                    "skip_reason": "durable_result_evidence_already_available",\n                    "cost_guard": self.cost_guard.snapshot(),\n                }\n            )\n            self.last_status = "persisted_result_retrieval"\n            self.last_error = ""\n            return draft\n\n        if self.settings.llm_backend != "gemini_api" or not self.settings.adk_ready:\n'''
          if anchor not in text:
              raise SystemExit('Gemini enhance anchor not found')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          test = Path('tests/test_result_taskmaster_closure.py')
          existing = test.read_text(encoding='utf-8')
          addition = r'''


def test_completed_result_retrieval_spends_no_second_gemini_request() -> None:
    import asyncio

    from healthia_one.config import Settings
    from healthia_one.gemini import GeminiResponder

    state = seed_state()
    result = HealthResult(
        filename="synthetic-lab.pdf",
        panel="Laboratorio sintético",
        status="parsed",
        explained=True,
        explanation="Explicación ya generada y persistida durante la carga.",
    )
    document = ClinicalDocument(
        patient_id=state.profile.id,
        title="Evidencia laboratorio",
        filename="synthetic-lab.pdf",
        storage_path="uploads/patient_demo/synthetic-lab.pdf",
        status="parsed",
        related_result_id=result.id,
    )
    state.results.append(result)
    state.documents.append(document)
    response = respond(state, "Explícame el resultado synthetic-lab.pdf que subí")
    original_content = response.message.content

    class ExplodingInteractions:
        def create(self, **_kwargs):
            raise AssertionError("persisted result retrieval must not call Gemini")

    class ExplodingClient:
        interactions = ExplodingInteractions()

    responder = GeminiResponder(
        Settings(
            llm_backend="gemini_api",
            store_backend="memory",
            cost_mode="guarded",
            ai_request_limit=2,
            cost_guard_start_enabled=True,
        ),
        client_factory=lambda: ExplodingClient(),
    )
    enhanced = asyncio.run(responder.enhance(state, "Explícame ese resultado", response))

    assert enhanced.message.content == original_content
    assert enhanced.message.metadata["llm_status"] == "persisted_result_retrieval"
    assert enhanced.message.metadata["ai_request_skipped"] is True
    assert enhanced.message.metadata["skip_reason"] == "durable_result_evidence_already_available"
    assert responder.cost_status()["requests_used"] == 0
'''
          if 'test_completed_result_retrieval_spends_no_second_gemini_request' not in existing:
              test.write_text(existing + addition, encoding='utf-8')
          PY
          python -m pip install -e ".[test]" >/dev/null
          python -m pytest -q tests/test_result_taskmaster_closure.py
          python -m compileall -q healthia_one/gemini.py
          git rm .github/workflows/one-shot-persisted-result-skip.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add healthia_one/gemini.py tests/test_result_taskmaster_closure.py
          git commit -m "fix: reuse persisted result explanation without extra Gemini call"
          git push origin HEAD:kira/event-driven-results-twin-p1
