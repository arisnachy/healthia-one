name: Candidate Taskmaster one-request proof

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate branch or commit to test
        required: true
        default: kira/event-driven-results-twin-p1
  pull_request:
    branches: [main]
    paths:
      - "healthia_one/**"
      - "healthia_agent/**"
      - "scripts/live_taskmaster_proof.py"
      - "deployment/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  taskmaster-proof:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GOOGLE_GENAI_USE_VERTEXAI: "true"
      GOOGLE_CLOUD_PROJECT: healthia-6088a
      GOOGLE_CLOUD_LOCATION: global
      HEALTHIA_ENV: ci_live
      HEALTHIA_STORE_BACKEND: json
      HEALTHIA_DATA_PATH: /tmp/healthia-taskmaster/state.json
      HEALTHIA_ACCOUNTS_PATH: /tmp/healthia-taskmaster/accounts.json
      HEALTHIA_AUTH_REQUIRED: "true"
      HEALTHIA_ALLOW_REGISTRATION: "true"
      HEALTHIA_LLM_BACKEND: gemini_api
      HEALTHIA_MODEL: gemini-3.5-flash
      HEALTHIA_COST_MODE: guarded
      HEALTHIA_AI_REQUEST_LIMIT: "1"
      HEALTHIA_COST_GUARD_START_ENABLED: "true"
      HEALTHIA_AI_MAX_OUTPUT_TOKENS: "1400"
      HEALTHIA_LLM_TIMEOUT_SECONDS: "45"
      HEALTHIA_PROACTIVE_ENABLED: "false"
      HEALTHIA_COST_CONTROL_UI: "true"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_ref }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Confirm hackathon-compliant Vertex configuration
        shell: bash
        run: |
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "::error title=Google Cloud auth missing::ADC credential file was not created."
            exit 2
          fi
          if [ "$HEALTHIA_MODEL" != "gemini-3.5-flash" ]; then
            echo "::error title=Hackathon model mismatch::Taskmaster proof must run Gemini 3.5 Flash."
            exit 3
          fi
          echo "### Vertex Taskmaster proof" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: \`$GOOGLE_CLOUD_PROJECT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Location: \`$GOOGLE_CLOUD_LOCATION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Model: \`$HEALTHIA_MODEL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authentication: **Google Cloud ADC**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gemini API key: **not used**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Model gate: **Gemini 3.5 hackathon requirement satisfied**" >> "$GITHUB_STEP_SUMMARY"

      - name: Create and mask ephemeral signing secrets
        shell: bash
        run: |
          session_secret=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          device_secret=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          echo "::add-mask::$session_secret"
          echo "::add-mask::$device_secret"
          {
            echo "HEALTHIA_SESSION_SECRET=$session_secret"
            echo "HEALTHIA_DEVICE_TOKEN_SECRET=$device_secret"
          } >> "$GITHUB_ENV"

      - name: Install exact candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Execute one-request Vertex Taskmaster proof
        shell: bash
        run: |
          set +e
          python scripts/live_taskmaster_proof.py > /tmp/healthia-taskmaster-proof.log 2>&1
          code=$?
          set -e
          cat /tmp/healthia-taskmaster-proof.log

          if [ -f deployment/live-taskmaster-proof-latest.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          payload = json.loads(Path('deployment/live-taskmaster-proof-latest.json').read_text(encoding='utf-8'))
          print(f"- Status: **{payload.get('status', 'unknown')}**")
          print(f"- AI transport: **{payload.get('ai_transport', 'unknown')}**")
          print(f"- Request ceiling: **{payload.get('gemini_request_ceiling', 1)}**")
          if payload.get('checks'):
              print(f"- Checks completed: **{len(payload['checks'])}**")
              for check in payload['checks']:
                  print(f"  - {check}")
          mission = payload.get('mission') or {}
          if mission:
              print(f"- Mission: `{mission.get('type')}` → **{mission.get('status')}**")
              print(f"- Correlated evidence IDs: **{mission.get('evidence_count', 0)}**")
          if payload.get('error_type'):
              print(f"- Error type: `{payload['error_type']}`")
          if payload.get('error'):
              print(f"- Exact failure: `{str(payload['error'])[:900]}`")
          PY
          fi

          if [ "$code" -ne 0 ]; then
            detail=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('deployment/live-taskmaster-proof-latest.json')
          if p.exists():
              payload=json.loads(p.read_text(encoding='utf-8'))
              print(str(payload.get('error') or payload.get('error_type') or 'Vertex Taskmaster proof failed')[:700].replace('\n',' '))
          else:
              print('Vertex Taskmaster proof failed before producing sanitized evidence')
          PY
            )
            echo "::error title=Vertex Taskmaster live proof failed::$detail"
            exit "$code"
          fi

      - name: Upload sanitized Taskmaster proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-vertex-taskmaster-one-request-proof
          path: deployment/live-taskmaster-proof-latest.json
          if-no-files-found: warn
          retention-days: 7
