name: Cloud fresh service strict proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: healthia-cloud-fresh-service-strict-proof
  cancel-in-progress: true

jobs:
  fresh-service-proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      VERTEX_LOCATION: global
      SOURCE_SERVICE: healthia-one-demo
      JUDGE_SERVICE: healthia-one-judge
      RUNTIME_SA: healthia-one-demo@healthia-6088a.iam.gserviceaccount.com
      BUCKET_NAME: healthia-6088a-healthia-evidence
      PROVISION_PRINCIPAL: healthia-github-vertex-9@healthia-6088a.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a

      - name: Temporarily grant Cloud Run Admin
        run: |
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${PROVISION_PRINCIPAL}" \
            --role="roles/run.admin" \
            --condition=None \
            --quiet >/dev/null

      - name: Resolve exact already-built HealthIA image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          curl -fsSL \
            -H "Authorization: Bearer ${token}" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${SOURCE_SERVICE}" \
            > /tmp/source-service.json
          image="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/source-service.json'))
          print(((d.get('template') or {}).get('containers') or [{}])[0].get('image',''))
          PY
          )"
          if [[ -z "$image" || "$image" != *@sha256:* ]]; then
            echo "::error::Expected immutable HealthIA image digest, got '$image'"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Using immutable image digest: ${image}"

      - name: Deploy clean judge-facing service from immutable image
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          env_vars="HEALTHIA_ENV=cloud,HEALTHIA_LLM_BACKEND=gemini_api,HEALTHIA_MODEL=gemini-3.5-flash,HEALTHIA_STORE_BACKEND=firestore,HEALTHIA_AUTH_REQUIRED=true,HEALTHIA_ALLOW_REGISTRATION=true,HEALTHIA_COST_MODE=cloud_demo,HEALTHIA_AI_REQUEST_LIMIT=20,HEALTHIA_COST_GUARD_START_ENABLED=true,HEALTHIA_COST_CONTROL_UI=false,HEALTHIA_AI_MAX_OUTPUT_TOKENS=1400,HEALTHIA_PROACTIVE_ENABLED=false,HEALTHIA_GCS_BUCKET=${BUCKET_NAME},GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${VERTEX_LOCATION}"
          gcloud run deploy "$JUDGE_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image '${{ steps.image.outputs.image }}' \
            --service-account "$RUNTIME_SA" \
            --min 0 \
            --max 1 \
            --concurrency 20 \
            --cpu 1 \
            --memory 512Mi \
            --timeout 600 \
            --set-env-vars "$env_vars" \
            --set-secrets 'HEALTHIA_DEVICE_TOKEN_SECRET=healthia-device-token-secret:latest,HEALTHIA_SESSION_SECRET=healthia-session-secret:latest' \
            --no-invoker-iam-check \
            --quiet >/dev/null
          token="$(gcloud auth print-access-token)"
          curl -fsSL -H "Authorization: Bearer ${token}" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${JUDGE_SERVICE}" \
            > /tmp/judge-service.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/judge-service.json'))
          print('urls=',d.get('urls'))
          print('revision=',d.get('latestReadyRevision'))
          print('ready=',(d.get('terminalCondition') or {}).get('state'))
          print('invokerIamDisabled=',d.get('invokerIamDisabled'))
          if (d.get('terminalCondition') or {}).get('state') != 'CONDITION_SUCCEEDED':
              raise SystemExit('Fresh judge service is not Ready')
          PY
          url="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/judge-service.json'))
          urls=d.get('urls') or []
          print(urls[0] if urls else d.get('uri',''))
          PY
          )"
          revision="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/judge-service.json'))
          print((d.get('latestReadyRevision') or '').split('/')[-1])
          PY
          )"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Prove fresh route reaches HealthIA
        id: health
        shell: bash
        run: |
          set -euo pipefail
          url='${{ steps.deploy.outputs.url }}'
          for i in {1..15}; do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$url/healthz" || true)"
            echo "attempt=$i HTTP=$code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              echo
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 4
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::error::Fresh Cloud Run service still did not route to HealthIA"
          head -c 500 /tmp/health.json || true
          exit 1

      - uses: actions/setup-python@v6
        if: steps.health.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact verifier
        if: steps.health.outputs.ok == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Execute strict Cloud Run + Vertex + Firestore + GCS proof
        if: steps.health.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python deployment/verify_cloud_demo.py \
            --url '${{ steps.deploy.outputs.url }}' \
            --project "$PROJECT_ID" \
            --bucket "$BUCKET_NAME" \
            --json | tee deployment/cloud-proof-latest.json

      - name: Capture sanitized fresh-service evidence
        if: always()
        env:
          CLOUD_URL: ${{ steps.deploy.outputs.url }}
          CLOUD_REVISION: ${{ steps.deploy.outputs.revision }}
          IMAGE: ${{ steps.image.outputs.image }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          HEALTH_OK: ${{ steps.health.outputs.ok }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload={
            'project': os.environ.get('PROJECT_ID',''),
            'region': os.environ.get('REGION',''),
            'service': os.environ.get('JUDGE_SERVICE',''),
            'url': os.environ.get('CLOUD_URL',''),
            'revision': os.environ.get('CLOUD_REVISION',''),
            'image': os.environ.get('IMAGE',''),
            'workflow_candidate_sha': os.environ.get('CANDIDATE_SHA',''),
            'fresh_route_health_ok': os.environ.get('HEALTH_OK') == 'true',
            'platform_public_application_auth_required': True,
            'model': 'gemini-3.5-flash',
            'vertex_adc': True,
            'firestore': True,
            'private_gcs': True,
          }
          Path('deployment/cloud-fresh-service-evidence.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          PY

      - name: Remove temporary Cloud Run Admin
        if: always()
        run: |
          gcloud projects remove-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${PROVISION_PRINCIPAL}" \
            --role="roles/run.admin" \
            --condition=None \
            --quiet >/dev/null || true

      - name: Upload strict Cloud evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-cloud-fresh-service-strict-proof
          path: |
            deployment/cloud-fresh-service-evidence.json
            deployment/cloud-proof-latest.json
          if-no-files-found: warn
          retention-days: 14
