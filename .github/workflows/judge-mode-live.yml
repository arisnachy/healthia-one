name: HealthIA public read-only Judge Mode

on:
  push:
    branches:
      - kira/autonomous-continuity-mainline
    paths:
      - "healthia_one/judge_mode.py"
      - "healthia_one/autonomous_continuity.py"
      - "healthia_one/bp_followup_guardian.py"
      - "healthia_one/mission_evidence_api.py"
      - "healthia_one/store.py"
      - "tests/test_judge_mode.py"
      - "tests/test_autonomous_continuity_mainline_contract.py"
      - ".github/workflows/judge-mode-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthia-public-judge-mode
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE: healthia-one-judge
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify read-only Judge Mode contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_judge_mode.py tests/test_autonomous_continuity_mainline_contract.py

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build exact-head Judge Mode image without log-stream privilege
        id: build
        shell: bash
        run: |
          set -euo pipefail
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/healthia-one-judge:${GITHUB_SHA}"
          build_id="$(gcloud builds submit . --project "$PROJECT_ID" --region "$REGION" --tag "$image" --async --format='value(id)' --quiet)"
          test -n "$build_id"
          digest=''
          for _ in $(seq 1 120); do
            digest="$(gcloud artifacts docker images describe "$image" --project "$PROJECT_ID" --format='value(image_summary.digest)' 2>/dev/null || true)"
            [[ -n "$digest" ]] && break
            sleep 5
          done
          test -n "$digest"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy public GET-only synthetic evidence surface
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          # Cloud Run's current recommended public-access mechanism is to disable
          # the Invoker IAM check for this deliberately read-only service.  This
          # avoids depending on an allUsers IAM binding while the private HealthIA
          # workers retain normal IAM enforcement.
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "${{ steps.build.outputs.image }}" \
            --no-invoker-iam-check \
            --min 0 \
            --max 1 \
            --concurrency 80 \
            --memory 256Mi \
            --cpu 1 \
            --command uvicorn \
            --args "healthia_one.judge_mode:app,--host,0.0.0.0,--port,8080" \
            --set-env-vars "HEALTHIA_JUDGE_SOURCE_SHA=${GITHUB_SHA},HEALTHIA_JUDGE_LIVE_PROOF_RUN=pending-exact-head-proof" \
            --quiet

          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/judge-service.json
          revision="$(jq -r '.status.latestReadyRevisionName // empty' /tmp/judge-service.json)"
          invoker_disabled="$(jq -r '.metadata.annotations["run.googleapis.com/invoker-iam-disabled"] // "false"' /tmp/judge-service.json)"
          project_number="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          canonical="https://${SERVICE}-${project_number}.${REGION}.run.app"
          status_url="$(jq -r '.status.url // empty' /tmp/judge-service.json)"
          annotation_urls="$(jq -r '.metadata.annotations["run.googleapis.com/urls"] // "[]"' /tmp/judge-service.json | jq -r '.[]?' 2>/dev/null || true)"
          test -n "$revision" && test -n "$project_number"
          [[ "$invoker_disabled" == "true" ]]

          url=''
          for _ in $(seq 1 30); do
            while IFS= read -r candidate; do
              [[ -n "$candidate" ]] || continue
              body="$(curl -sS --max-time 10 "$candidate/healthz" 2>/dev/null || true)"
              if [[ "$(jq -r '.mode // empty' <<<"$body" 2>/dev/null || true)" == "judge_read_only_synthetic" ]]; then
                url="$candidate"
                break 2
              fi
            done < <(printf '%s\n%s\n%s\n' "$canonical" "$status_url" "$annotation_urls" | awk 'NF && !seen[$0]++')
            sleep 2
          done
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "invoker_disabled=$invoker_disabled" >> "$GITHUB_OUTPUT"

      - name: Anonymous public verification
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}"
          curl -fsS "$url/healthz" > /tmp/health.json
          curl -fsS "$url/api/proof" > /tmp/proof.json
          curl -fsS "$url/" > /tmp/home.html
          [[ "$(jq -r '.mode' /tmp/health.json)" == "judge_read_only_synthetic" ]]
          [[ "$(jq -r '.mutations' /tmp/health.json)" == "false" ]]
          [[ "$(jq -r '.model_calls' /tmp/health.json)" == "false" ]]
          [[ "$(jq -r '.secrets' /tmp/health.json)" == "false" ]]
          [[ "$(jq -r '.source_sha' /tmp/health.json)" == "$GITHUB_SHA" ]]
          [[ "$(jq -r '.boundary_count' /tmp/proof.json)" == "5" ]]
          grep -F "Nobody prompted it." /tmp/home.html >/dev/null
          for path in /api/proof /api/synthetic-state /; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$url$path")"
            [[ "$code" == "405" ]]
          done

      - name: Publish sanitized Judge Mode evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/judge-mode
          cat > dist/judge-mode/report.md <<EOF
          # HealthIA ONE — public Judge Mode

          - URL: ${{ steps.deploy.outputs.url }}
          - Source SHA: ${GITHUB_SHA}
          - Cloud Build id: ${{ steps.build.outputs.build_id }}
          - Image digest: ${{ steps.build.outputs.digest }}
          - Cloud Run revision: ${{ steps.deploy.outputs.revision }}
          - Invoker IAM check disabled for this read-only public surface: ${{ steps.deploy.outputs.invoker_disabled }}
          - Public anonymous access: PASS
          - Mutation endpoints: NONE / POST checks return 405
          - Secrets embedded in surface: NONE
          - Model calls from surface: NONE
          - Patient data: SYNTHETIC ONLY
          - min instances: 0
          - max instances: 1
          - Exact-head autonomous live proof: PENDING separate gate
          EOF

      - name: Upload Judge Mode evidence
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-public-Judge-Mode-${{ github.sha }}
          path: dist/judge-mode/
          if-no-files-found: error
          retention-days: 30
