name: HealthIA public read-only Judge Mode

on:
  push:
    branches:
      - kira/autonomous-continuity-mainline
    paths:
      - "healthia_one/judge_mode.py"
      - "healthia_one/autonomous_continuity.py"
      - "tests/test_judge_mode.py"
      - ".github/workflows/judge-mode-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthia-public-judge-mode
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE: healthia-one-judge
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify read-only Judge Mode contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_judge_mode.py tests/test_autonomous_continuity_mainline_contract.py

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build exact-head Judge Mode image
        id: build
        shell: bash
        run: |
          set -euo pipefail
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/healthia-one-judge:${GITHUB_SHA}"
          gcloud builds submit . --project "$PROJECT_ID" --region "$REGION" --tag "$image" --quiet
          digest="$(gcloud artifacts docker images describe "$image" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          test -n "$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy public GET-only synthetic evidence surface
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "${{ steps.build.outputs.image }}" \
            --allow-unauthenticated \
            --min 0 \
            --max 1 \
            --concurrency 80 \
            --memory 256Mi \
            --cpu 1 \
            --command uvicorn \
            --args "healthia_one.judge_mode:app,--host,0.0.0.0,--port,8080" \
            --set-env-vars "HEALTHIA_JUDGE_SOURCE_SHA=${GITHUB_SHA},HEALTHIA_JUDGE_LIVE_PROOF_RUN=pending-exact-head-proof" \
            --quiet
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$url" && test -n "$revision"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Anonymous public verification
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}"
          curl -fsS "$url/healthz" > /tmp/health.json
          curl -fsS "$url/api/proof" > /tmp/proof.json
          curl -fsS "$url/" > /tmp/home.html
          [[ "$(jq -r '.mode' /tmp/health.json)" == "judge_read_only_synthetic" ]]
          [[ "$(jq -r '.mutations' /tmp/health.json)" == "false" ]]
          [[ "$(jq -r '.model_calls' /tmp/health.json)" == "false" ]]
          [[ "$(jq -r '.boundary_count' /tmp/proof.json)" == "5" ]]
          grep -F "Nobody prompted it." /tmp/home.html >/dev/null
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$url/api/proof")"
          [[ "$code" == "405" ]]

      - name: Publish sanitized Judge Mode evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/judge-mode
          cat > dist/judge-mode/report.md <<EOF
          # HealthIA ONE — public Judge Mode

          - URL: ${{ steps.deploy.outputs.url }}
          - Source SHA: ${GITHUB_SHA}
          - Image digest: ${{ steps.build.outputs.digest }}
          - Cloud Run revision: ${{ steps.deploy.outputs.revision }}
          - Public anonymous access: PASS
          - Mutation endpoints: NONE / POST proof check returns 405
          - Secrets embedded in surface: NONE
          - Model calls from surface: NONE
          - Patient data: SYNTHETIC ONLY
          - min instances: 0
          - max instances: 1
          - Exact-head autonomous live proof: PENDING separate gate
          EOF

      - name: Upload Judge Mode evidence
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-public-Judge-Mode-${{ github.sha }}
          path: dist/judge-mode/
          if-no-files-found: error
          retention-days: 30
