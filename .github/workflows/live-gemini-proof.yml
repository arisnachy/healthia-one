name: Live Gemini + ADK proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HEALTHIA_ENV: ci_live
      HEALTHIA_STORE_BACKEND: json
      HEALTHIA_DATA_PATH: /tmp/healthia-live/state.json
      HEALTHIA_ACCOUNTS_PATH: /tmp/healthia-live/accounts.json
      HEALTHIA_AUTH_REQUIRED: "true"
      HEALTHIA_ALLOW_REGISTRATION: "true"
      HEALTHIA_LLM_BACKEND: gemini_api
      HEALTHIA_MODEL: gemini-3.6-flash
      HEALTHIA_COST_MODE: guarded
      HEALTHIA_AI_REQUEST_LIMIT: "12"
      HEALTHIA_COST_GUARD_START_ENABLED: "true"
      HEALTHIA_AI_MAX_OUTPUT_TOKENS: "1400"
      HEALTHIA_LLM_TIMEOUT_SECONDS: "45"
      HEALTHIA_PROACTIVE_ENABLED: "false"
      HEALTHIA_COST_CONTROL_UI: "true"
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Require repository Gemini secret
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "HEALTHIA_LIVE_PROOF_BLOCKED: repository secret GEMINI_API_KEY is not configured."
            exit 2
          fi

      - name: Create ephemeral runtime signing secrets
        shell: bash
        run: |
          python - <<'PY'
          import os, secrets
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"HEALTHIA_SESSION_SECRET={secrets.token_urlsafe(48)}\n")
              output.write(f"HEALTHIA_DEVICE_TOKEN_SECRET={secrets.token_urlsafe(48)}\n")
          PY

      - name: Install candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Syntax guard
        run: |
          python -m compileall -q app healthia_one healthia_agent tests scripts deployment/verify_google_ai.py deployment/verify_cloud_demo.py
          node --check web/app.js
          node --check web/clinical-council.js
          node --check web/account.js
          node --check web/auth.js

      - name: Execute strict synthetic live proof
        run: python scripts/live_gemini_proof.py

      - name: Upload sanitized proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-live-gemini-proof
          path: deployment/live-gemini-proof-latest.json
          if-no-files-found: warn
          retention-days: 7
