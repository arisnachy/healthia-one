name: HealthIA V10 Charon master narration

on:
  push:
    branches: [kira/video-v6-demo-final]
    paths:
      - ".github/workflows/v10-charon-master-narration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a
      - name: Generate Charon master narration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/v10-narration
          python - <<'PY'
          import json
          text = """HealthIA ONE starts from one simple problem: a patient's health should not restart every time a new conversation begins. The system creates a patient-owned longitudinal health layer where profile, diagnoses, family history, pathological genogram, treatments, documents, appointments, visit preparation, health timeline, permissions and follow-up can remain connected. A patient can review the story in one place, keep treatment and medication check-ins organized, prepare for the next visit, preserve uploaded documents, control privacy, audit access and export information when needed. That continuity is the foundation.

Now the main consultation flow. The patient speaks naturally instead of filling out a rigid form. HealthIA uses the context it already knows, identifies the goal, recalls relevant history, asks only the next useful questions and moves the clinical context forward. Gemini and Google ADK support adaptive reasoning, while deterministic rules protect identity, safety and exact state transitions. The consultation is not a disconnected chatbot exchange; each answer can update the living patient context for the next step.

When evidence enters the conversation, the original source comes first. A laboratory result or clinical document is uploaded through the real product, preserved as evidence, parsed with provenance and linked to the longitudinal record. HealthIA can explain what it found, but if the evidence is incomplete or uncertain it fails closed instead of inventing a result. This evidence-first pattern also feeds the patient's digital clinical twin and future follow-up.

HealthIA then turns unresolved needs into durable missions. A mission survives the conversation and waits for a real outcome instead of disappearing as a suggestion. Before an external action uses location or sensitive context, autonomy pauses for mission-scoped consent. After permission, HealthIA can use real Google Places to find validated nearby resources. If the patient says, 'the second one,' the system selects that exact candidate, not a guessed substitute. Human choice remains the boundary. After sign-out and sign-in, the mission, evidence and patient state still belong to the same account.

The platform also extends beyond the consultation. Authorized Health Connect data can add measurements such as activity, heart rate, sleep or weight, with device identity, allowed metrics and revocation controls. Opportunity Autopilot can watch authorized patient or family needs and surface discoveries only when they become useful. The scientific radar can query PubMed, Europe PMC and ClinicalTrials dot gov, compare new evidence with the current treatment context, and create a reviewable next step without silently changing therapy. A missing creatinine study, for example, can become a concrete mission with real nearby laboratory options.

HealthIA Explain adds another layer: complex health information can be transformed into a patient-friendly explanation, automatically adapted to language, and presented with generated visual media using Gemini, Veo and Gemini text to speech. The purpose is not decoration; it is comprehension without losing the underlying evidence.

Across every version, the same principle has become stronger: artificial intelligence when reasoning matters, deterministic systems when exactness matters, preserved evidence when trust matters, and human consent when the decision is human. HealthIA ONE is not one feature. It is the connected journey from consultation, evidence and family context to missions, devices, scientific discovery, explanations and real-world action. Your health never starts over."""
          payload = {
            "input": {"text": text},
            "voice": {"languageCode": "en-US", "name": "en-US-Chirp3-HD-Charon"},
            "audioConfig": {"audioEncoding": "MP3", "speakingRate": 1.08, "pitch": 0.0},
          }
          open('dist/v10-narration/tts-request.json','w',encoding='utf-8').write(json.dumps(payload))
          open('dist/v10-narration/narration.txt','w',encoding='utf-8').write(text)
          PY
          token="$(gcloud auth print-access-token)"
          curl -fsS -X POST "https://texttospeech.googleapis.com/v1/text:synthesize" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data-binary @dist/v10-narration/tts-request.json > dist/v10-narration/tts-response.json
          python - <<'PY'
          import base64, json
          data=json.load(open('dist/v10-narration/tts-response.json',encoding='utf-8'))
          if not data.get('audioContent'):
              raise SystemExit(data)
          open('dist/v10-narration/HealthIA_V10_Charon_Master_Narration.mp3','wb').write(base64.b64decode(data['audioContent']))
          PY
          ffprobe -v error -show_entries format=duration -of csv=p=0 dist/v10-narration/HealthIA_V10_Charon_Master_Narration.mp3 | tee dist/v10-narration/duration.txt
      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-V10-Charon-Master-Narration
          path: |
            dist/v10-narration/HealthIA_V10_Charon_Master_Narration.mp3
            dist/v10-narration/narration.txt
            dist/v10-narration/duration.txt
          retention-days: 7
