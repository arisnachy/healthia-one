name: Patch final demo with HealthIA Explain once

on:
  push:
    branches:
      - feature/patient-education-video-20260813
    paths:
      - .github/workflows/patch-final-demo-healthia-explain-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/patient-education-video-20260813
          fetch-depth: 0

      - name: Add live HealthIA Explain sequence and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          recorder = Path('scripts/record_final_live_english_demo.py')
          text = recorder.read_text(encoding='utf-8')
          anchor = '''        page.locator("#accountPill").click()\n'''
          if anchor not in text:
              raise SystemExit('logout anchor missing')
          if 'healthia_explain_private_video_completed' not in text:
              block = '''        page.locator('.main-nav [data-open="chat"]').click()\n        before_video = latest_assistant_message(page)\n        send_chat(page, "Create a short private video in English about my glucose result.")\n        video_reply = wait_for_assistant_after(page, str(before_video.get("id") or ""), timeout_s=190.0)\n        video_meta = video_reply.get("metadata") or {}\n        video_record = video_meta.get("education_video") or {}\n        require(video_record.get("status") == "completed", f"HealthIA Explain did not complete: {video_record}")\n        require(video_record.get("private") is True, "HealthIA Explain media is not private")\n        require(video_record.get("locale") == "en", f"HealthIA Explain locale mismatch: {video_record}")\n        require(video_record.get("narration_status") == "gemini_tts", f"HealthIA Explain did not use Gemini TTS: {video_record}")\n        video_id = str(video_record.get("video_id") or "")\n        require(video_id.startswith("video_"), f"HealthIA Explain video id missing: {video_record}")\n        manifest = api_json(page, f"/api/education/videos/{video_id}/manifest")\n        require(manifest.get("private") is True, f"HealthIA Explain manifest is not private: {manifest}")\n        require(manifest.get("narration_status") == "gemini_tts", f"HealthIA Explain manifest did not preserve Gemini TTS: {manifest}")\n        report["education_video"] = {\n            "video_id": video_id,\n            "title": video_record.get("title"),\n            "locale": video_record.get("locale"),\n            "private": video_record.get("private"),\n            "narration_status": video_record.get("narration_status"),\n            "veo_enhanced": bool(video_record.get("veo_enhanced")),\n        }\n        report["checks"].extend([\n            "healthia_explain_private_video_completed",\n            "healthia_explain_gemini_tts_narration",\n        ])\n        checkpoint(report)\n        page.wait_for_selector(".education-video-card video", timeout=15_000)\n        overlay(page, "HealthIA Explain", "The patient asks for a private visual explanation. Gemini plans the education flow, Gemini TTS narrates it, and patient facts remain on controlled HealthIA cards. Veo is limited to generic PHI-free visual enrichment.", 5)\n        clear_overlay(page)\n        media = page.locator(".education-video-card video").last\n        media.evaluate("el => { el.muted = true; el.currentTime = 0; return el.play(); }")\n        page.wait_for_timeout(7000)\n        require(media.evaluate("el => !el.error"), "HealthIA Explain video element reported a playback error")\n        report["checks"].append("healthia_explain_video_playback")\n        checkpoint(report)\n\n'''
              text = text.replace(anchor, block + anchor, 1)
              recorder.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/final-live-english-demo.yml')
          w = workflow.read_text(encoding='utf-8')
          env_anchor = 'HEALTHIA_EDUCATION_TTS_VOICE=Charon,GOOGLE_GENAI_USE_VERTEXAI=true'
          if env_anchor in w:
              w = w.replace(
                  env_anchor,
                  'HEALTHIA_EDUCATION_TTS_VOICE=Charon,HEALTHIA_EDUCATION_VEO_ENABLED=true,HEALTHIA_EDUCATION_VEO_MODEL=veo-3.1-fast-generate-001,HEALTHIA_EDUCATION_VEO_WAIT_SECONDS=90,GOOGLE_GENAI_USE_VERTEXAI=true',
                  1,
              )
          required_anchor = "              'taskmaster_mission_completed_from_persisted_evidence',\n"
          if required_anchor not in w:
              raise SystemExit('CUTLOCK required-check anchor missing')
          if "'healthia_explain_private_video_completed'" not in w:
              w = w.replace(
                  required_anchor,
                  required_anchor
                  + "              'healthia_explain_private_video_completed',\n"
                  + "              'healthia_explain_gemini_tts_narration',\n"
                  + "              'healthia_explain_video_playback',\n",
                  1,
              )
          workflow.write_text(w, encoding='utf-8')
          PY

          rm -f .github/workflows/patch-final-demo-healthia-explain-once.yml
          git config user.name "healthia-one-maintenance"
          git config user.email "127772990+arisnachy@users.noreply.github.com"
          git add scripts/record_final_live_english_demo.py .github/workflows/final-live-english-demo.yml .github/workflows/patch-final-demo-healthia-explain-once.yml
          git commit -m "Show HealthIA Explain in final live demo"
          git push origin HEAD:feature/patient-education-video-20260813
