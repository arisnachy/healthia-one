name: Candidate Cloud browser proof launcher note

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delegated:
    runs-on: ubuntu-22.04
    steps:
      - name: Explain authoritative Cloud gate
        run: |
          echo "The authoritative exact-candidate Cloud deploy and browser proof now lives in gcp-auth-probe.yml."
