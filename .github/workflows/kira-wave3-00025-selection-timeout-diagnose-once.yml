name: KIRA Wave 3 00025 selection timeout diagnosis once

on:
  push:
    branches:
      - kira/google-constellation-wave2-live
    paths:
      - .github/workflows/kira-wave3-00025-selection-timeout-diagnose-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      REVISION: healthia-one-demo-00025-lr8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 899ff8fb568ce3a2ad552068deda89861f221eb3
      - name: Authenticate read-only diagnostic identity
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Firestore client only
        run: python -m pip install 'google-cloud-firestore>=2.21,<3'
      - name: Read sanitized selection durability and request timing
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.revision_name="healthia-one-demo-00025-lr8" AND timestamp>="2026-08-11T20:14:00Z" AND timestamp<="2026-08-11T20:16:10Z"' \
            --project "$PROJECT_ID" --limit 250 --format=json > /tmp/logs.json
          python - <<'PY'
          import json,re
          from datetime import datetime,timezone
          from google.cloud import firestore

          def as_dt(value):
              if isinstance(value,datetime): return value if value.tzinfo else value.replace(tzinfo=timezone.utc)
              if isinstance(value,str) and value:
                  try:
                      p=datetime.fromisoformat(value.replace('Z','+00:00'))
                      return p if p.tzinfo else p.replace(tzinfo=timezone.utc)
                  except ValueError: pass
              return datetime.min.replace(tzinfo=timezone.utc)

          db=firestore.Client(project='healthia-6088a')
          threshold=datetime(2026,8,11,20,13,30,tzinfo=timezone.utc)
          matches=[]
          for snap in db.collection_group('missions').stream():
              raw=snap.to_dict() or {}
              if as_dt(raw.get('created_at')) < threshold: continue
              loc=raw.get('location') or {}
              if 'santiago de los caballeros' not in str(loc.get('text') or '').casefold(): continue
              matches.append((as_dt(raw.get('updated_at')),raw))
          matches.sort(key=lambda x:x[0],reverse=True)
          mission=matches[0][1] if matches else {}
          selected=mission.get('selected_place') or {}
          candidates=(mission.get('tool_outputs') or {}).get('place_candidates') or []
          events=[]
          for e in (mission.get('public_events') or [])[-10:]:
              events.append({
                  'event_type':str(e.get('event_type') or ''),
                  'summary':re.sub(r'[A-Za-z0-9_-]{20,}','[id]',str(e.get('summary') or ''))[:220],
              })

          logs=json.load(open('/tmp/logs.json',encoding='utf-8'))
          requests=[]
          error_signals=[]
          for item in logs:
              http=item.get('httpRequest') or {}
              url=str(http.get('requestUrl') or '')
              if '/api/chat' in url:
                  requests.append({
                      'timestamp':str(item.get('timestamp') or ''),
                      'method':str(http.get('requestMethod') or ''),
                      'status':http.get('status'),
                      'latency':str(http.get('latency') or ''),
                  })
              severity=str(item.get('severity') or '')
              combined=(str(item.get('textPayload') or '')+' '+json.dumps(item.get('jsonPayload') or {},default=str)).lower()
              kinds=[]
              for k in ('timeouterror','deadline exceeded','costguardblocked','select_discovered_candidate','function_response','gemini'):
                  if k in combined: kinds.append(k)
              if kinds or severity in {'ERROR','CRITICAL','ALERT','EMERGENCY'}:
                  error_signals.append({'timestamp':str(item.get('timestamp') or ''),'severity':severity,'kinds':kinds})

          selected_index=None
          if selected:
              selected_id=str(selected.get('id') or '')
              for i,c in enumerate(candidates):
                  if selected_id and str(c.get('id') or '')==selected_id:
                      selected_index=i
                      break

          out={
              'status':'PASS',
              'revision':'healthia-one-demo-00025-lr8',
              'mission_found':bool(mission),
              'mission_state':str(mission.get('state') or ''),
              'candidate_count':len(candidates),
              'selected_place_present':bool(selected),
              'selected_candidate_zero_based_index':selected_index,
              'provider_email_present':bool(str(mission.get('provider_email') or '').strip()),
              'authorization_boundary_kind':str(((mission.get('tool_outputs') or {}).get('authorization_boundary') or {}).get('kind') or ''),
              'recent_public_events':events,
              'chat_request_logs':requests,
              'sanitized_error_signals':error_signals,
              'patient_identifier_exposed':False,
              'mission_identifier_exposed':False,
              'place_identifier_exposed':False,
              'secret_material_exposed':False,
              'provider_write':False,
              'model_call_performed':False,
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          rm -f /tmp/logs.json
