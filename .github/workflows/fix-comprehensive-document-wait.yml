name: Fix comprehensive document upload wait

on:
  push:
    branches:
      - feature/patient-education-video-20260813
    paths:
      - ".github/workflows/fix-comprehensive-document-wait.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/patient-education-video-20260813
      - name: Make document proof wait for real upload completion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/record_final_comprehensive_demo.py')
          text = p.read_text(encoding='utf-8')
          old = '''        page.locator('#documentForm button[type="submit"]').click()\n        page.wait_for_function(\n            """() => document.querySelector('#documentsRoot')?.textContent?.includes('Synthetic care note') === true""",\n            timeout=15_000,\n        )\n        page.wait_for_timeout(700)\n'''
          new = '''        page.locator('#documentForm button[type="submit"]').click()\n        page.wait_for_selector("#documentDialog", state="hidden", timeout=60_000)\n        page.wait_for_function(\n            """() => document.querySelector('#documentsRoot')?.textContent?.includes('Synthetic care note') === true""",\n            timeout=30_000,\n        )\n        page.wait_for_timeout(700)\n'''
          if old not in text:
              raise SystemExit('expected document upload wait block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile scripts/record_final_comprehensive_demo.py
          git config user.name "healthia-recorder-bot"
          git config user.email "healthia-recorder-bot@users.noreply.github.com"
          git add scripts/record_final_comprehensive_demo.py
          git commit -m "Wait for real document upload in comprehensive demo"
          git push origin HEAD:feature/patient-education-video-20260813
