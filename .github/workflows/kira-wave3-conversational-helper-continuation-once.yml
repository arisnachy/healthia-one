name: KIRA Wave 3 conversational helper continuation once

on:
  pull_request:
    branches:
      - kira/golden-google-constellation-live-891745e1
    paths:
      - .github/workflows/kira-wave3-conversational-helper-continuation-once.yml

permissions:
  contents: write

concurrency:
  group: kira-wave3-conversational-helper-00019-once
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-22.04
    outputs:
      claimed: ${{ steps.claim.outputs.claimed }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: kira/google-constellation-wave2-live
      MARKER: .kira/wave3-conversational-helper-00019-consumed.json
    steps:
      - name: Claim this harness-only continuation once
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          if gh api "/repos/${REPO}/contents/${MARKER}?ref=${BRANCH}" >/dev/null 2>&1; then
            echo "claimed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' '{"candidate_sha":"0a0eb9e2f79f920514192a9e8373c33bf4aefbe5","revision":"healthia-one-demo-00019-t4k","scope":"harness-only current conversational 1-at-a-time clinical helper; no product mutation; no redeploy","public_release_performed":false}' >/tmp/marker.json
          encoded="$(base64 -w0 /tmp/marker.json)"
          gh api --method PUT "/repos/${REPO}/contents/${MARKER}" -f message='KIRA Wave 3: claim conversational helper continuation' -f content="$encoded" -f branch="$BRANCH" >/dev/null
          echo "claimed=true" >> "$GITHUB_OUTPUT"

  record:
    needs: claim
    if: needs.claim.outputs.claimed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 38
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-demo
      GCS_BUCKET: healthia-6088a-healthia-evidence
      CANDIDATE_SHA: 0a0eb9e2f79f920514192a9e8373c33bf4aefbe5
      EXPECTED_REVISION: healthia-one-demo-00019-t4k
      EXPECTED_IMAGE: us-central1-docker.pkg.dev/healthia-6088a/cloud-run-source-deploy/healthia-one-demo@sha256:793b7a9d56b7e88a3bc476a0e50183dc16f80de73fd4703360654d1d8dcdf064
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Prove exact candidate and clean workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
      - name: Patch only stale recorder assumptions to current shipped conversational UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          recorder=Path('scripts/record_submission_demo.py')
          text=recorder.read_text(encoding='utf-8')
          old='        require("Case-specific questions" in first_block.inner_text(), "clinical block chrome is not English")\n'
          new=(
              '        require("I will ask one useful thing at a time" in first_block.inner_text(), "clinical conversational block chrome is not English")\n'
              '        require(first_block.locator(".clinical-next-question").inner_text() == "Continue", "clinical conversational control is not English")\n'
          )
          if text.count(old) != 1:
              raise SystemExit('stale i18n assertion not found exactly once')
          recorder.write_text(text.replace(old,new,1),encoding='utf-8')

          helper=Path('scripts/cloud_browser_judge_proof.py')
          text=helper.read_text(encoding='utf-8')
          old='''def answer_visible_block(page: Page) -> None:\n    \"\"\"Answer all five contract questions through the patient-visible 2+3 flow.\"\"\"\n    block = page.locator('.clinical-question-block[data-question-source=\"gemini_dynamic\"]').last\n    require(block.locator(\".clinical-question\").count() == 5, \"dynamic clinical block is not exactly five questions\")\n    require(block.locator(\".clinical-question:visible\").count() == 2, \"progressive clinical block must start with two visible questions\")\n    reveal = block.locator(\".clinical-show-all\")\n    require(reveal.is_visible(), \"progressive clinical block has no 2+3 continuation control\")\n    reveal.click()\n    require(block.locator(\".clinical-question:visible\").count() == 5, \"remaining three clinical questions did not reveal\")\n    for field in block.locator(\".clinical-question\").all():\n        field.locator(\".clinical-option\").first.click()\n    submit = block.locator(\".clinical-submit\")\n    require(submit.is_visible(), \"clinical submit did not appear after revealing all five questions\")\n    submit.click()\n'''
          new='''def answer_visible_block(page: Page) -> None:\n    \"\"\"Answer all five Gemini questions through the shipped one-at-a-time conversation UI.\"\"\"\n    block = page.locator('.clinical-question-block[data-question-source=\"gemini_dynamic\"]').last\n    require(block.locator(\".clinical-question\").count() == 5, \"dynamic clinical block is not exactly five questions\")\n    control = block.locator(\".clinical-next-question\")\n    require(control.is_visible(), \"clinical conversational continuation control is missing\")\n    for index in range(5):\n        visible = block.locator(\".clinical-question:visible\")\n        require(visible.count() == 1, f\"clinical conversation must expose exactly one question at turn {index + 1}\")\n        field = visible.first\n        detail = field.locator(\".clinical-detail\")\n        require(detail.is_visible(), f\"clinical free-text answer is missing at turn {index + 1}\")\n        detail.fill(f\"Synthetic demo answer {index + 1}\")\n        expected = \"Send and continue\" if index == 4 else \"Continue\"\n        require(control.inner_text().strip() == expected, f\"clinical control text mismatch at turn {index + 1}\")\n        control.click()\n        if index < 4:\n            page.wait_for_timeout(150)\n            require(block.locator(\".clinical-question:visible\").count() == 1, f\"next clinical question did not advance at turn {index + 1}\")\n'''
          if text.count(old) != 1:
              raise SystemExit('stale 2+3 helper not found exactly once')
          helper.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'scripts/record_submission_demo.py'
          printf '%s\n' "${changed[@]}" | grep -Fx 'scripts/cloud_browser_judge_proof.py'
          git diff --check
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Bind exact same-image timeout60 revision; no redeploy
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          test "$revision" = "$EXPECTED_REVISION"
          image="$(gcloud run revisions describe "$revision" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.containers[0].image)')"
          test "$image" = "$EXPECTED_IMAGE"
          timeout_value="$(gcloud run revisions describe "$revision" --project "$PROJECT_ID" --region "$REGION" --format=json | python -c "import json,sys; d=json.load(sys.stdin); print(next((x.get('value','') for x in d['spec']['containers'][0].get('env',[]) if x.get('name')=='HEALTHIA_LLM_TIMEOUT_SECONDS'),''))")"
          test "$timeout_value" = "60"
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          token="$(gcloud auth print-identity-token --audiences="$url")"
          test -n "$url" && test -n "$token"
          echo "::add-mask::$token"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require readiness and at least ten model calls remaining before recorder
        env:
          HEALTHIA_CLOUD_URL: ${{ steps.cloud.outputs.url }}
          HEALTHIA_CLOUD_ID_TOKEN: ${{ steps.cloud.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud storage buckets describe "gs://${GCS_BUCKET}" --project "$PROJECT_ID" --format='value(name)' | grep -Fx "$GCS_BUCKET" >/dev/null
          python - <<'PY'
          import json,os,urllib.request
          req=urllib.request.Request(os.environ['HEALTHIA_CLOUD_URL'].rstrip('/')+'/api/readiness',headers={'Authorization':'Bearer '+os.environ['HEALTHIA_CLOUD_ID_TOKEN'],'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r: d=json.load(r)
          required={'ready':True,'ai_ready':True,'adk_ready':True,'store_backend':'firestore','evidence_backend':'gcs','auth_required':True}
          bad={k:(v,d.get(k)) for k,v in required.items() if d.get(k)!=v}
          if bad: raise SystemExit(f'readiness mismatch: {bad}')
          cost=d.get('cost_control') or {}
          remaining=int(cost.get('requests_remaining') or 0)
          print(json.dumps({'status':'PASS','requests_remaining':remaining,'request_limit':cost.get('request_limit'),'blocked_requests':cost.get('blocked_requests')},sort_keys=True))
          if remaining < 10: raise SystemExit(f'insufficient bounded model budget for one-take: {remaining} remaining')
          PY
      - name: Install recorder dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m playwright install --with-deps chromium
      - name: Record continuous exact-candidate Wave 3 journey
        env:
          HEALTHIA_CLOUD_URL: ${{ steps.cloud.outputs.url }}
          HEALTHIA_CLOUD_ID_TOKEN: ${{ steps.cloud.outputs.token }}
          HEALTHIA_CLOUD_REVISION: ${{ steps.cloud.outputs.revision }}
          HEALTHIA_CLOUD_IMAGE: ${{ steps.cloud.outputs.image }}
          HEALTHIA_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          HEALTHIA_CLOUD_REGION: ${{ env.REGION }}
          HEALTHIA_CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          HEALTHIA_GCS_BUCKET: ${{ env.GCS_BUCKET }}
          HEALTHIA_DEMO_TARGET_SECONDS: "285"
        run: python scripts/record_submission_demo.py
      - name: Require exact binding and every Wave 3 gate
        shell: bash
        run: |
          set -euo pipefail
          python - "$CANDIDATE_SHA" "$EXPECTED_REVISION" <<'PY'
          import json,pathlib,sys
          expected,revision=sys.argv[1:3]
          report=json.loads(pathlib.Path('dist/submission-demo/report.json').read_text(encoding='utf-8'))
          if report.get('status')!='PASS': raise SystemExit('recorder status not PASS')
          if report.get('candidate_sha')!=expected: raise SystemExit('candidate mismatch')
          if report.get('cloud_revision')!=revision: raise SystemExit('revision mismatch')
          required={'wave3_unanchored_reference_fails_closed','wave3_evidence_backed_reference_resolution','wave3_places_stops_before_mission_location_consent','wave3_mission_scoped_location_consent_then_real_places','wave3_ordinal_resumes_and_selects_durable_mission','relogin_continuity_including_google_mission','zero_browser_console_or_page_errors'}
          missing=sorted(required-set(report.get('checks') or []))
          if missing: raise SystemExit(f'missing gates: {missing}')
          print('HEALTHIA_WAVE3_EXACT_BINDING_AND_ALL_GATES_PASS')
          PY
      - name: Verify bounded continuous duration
        shell: bash
        run: |
          set -euo pipefail
          video="$(find dist/submission-demo/video -type f -name '*.webm' | head -n1)"; test -n "$video"
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$video")"
          python - "$duration" <<'PY'
          import sys
          d=float(sys.argv[1])
          if not 250 <= d <= 360: raise SystemExit(f'duration outside 4:10-6:00: {d:.2f}s')
          print(f'HEALTHIA_WAVE3_DURATION_PASS {d:.2f}s')
          PY
      - name: Add sanitized private evidence envelope
        env:
          REVISION: ${{ steps.cloud.outputs.revision }}
          IMAGE: ${{ steps.cloud.outputs.image }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('dist/submission-demo'); report=json.loads((root/'report.json').read_text(encoding='utf-8')); video=next((root/'video').glob('*.webm'))
          out={'status':'PASS','candidate_sha':os.environ['CANDIDATE_SHA'],'cloud_revision':os.environ['REVISION'],'cloud_image':os.environ['IMAGE'],'runtime_llm_timeout_seconds':60,'same_candidate_image':True,'source_rebuild_performed':False,'recorder_harness_only_edits':['stale_i18n_header_assertion','stale_2_plus_3_answer_helper'],'video_sha256':hashlib.sha256(video.read_bytes()).hexdigest(),'synthetic_only':bool(report.get('synthetic_only')),'checks':report.get('checks') or [],'public_release_performed':False,'secrets_exposed':False,'veo_invoked':False}
          (root/'wave3_exact_head_evidence.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          PY
      - name: Upload private PASS evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave3-exact-head-one-take-0a0-PASS
          path: dist/submission-demo
          if-no-files-found: error
          retention-days: 30
      - name: Upload private diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave3-conversational-helper-failure
          path: dist/submission-demo
          if-no-files-found: warn
          retention-days: 7
