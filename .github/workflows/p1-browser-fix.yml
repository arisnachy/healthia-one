name: P1 browser auth alignment

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'kira/omega-100-agentic-runtime'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/omega-100-agentic-runtime
          fetch-depth: 1
      - name: Align local Chromium with auth gate and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/browser_smoke.py')
          text = path.read_text(encoding='utf-8')
          if '/api/auth/config' not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if "if(url.includes('/api/readiness'))" in line:
                      indent = line[:len(line)-len(line.lstrip())]
                      lines.insert(i, indent + "if(url.includes('/api/auth/config')) return new MockResponse({{enabled:false,mode:'local',providers:[]}});")
                      break
              else:
                  raise SystemExit('readiness mock not found')
              text = '\n'.join(lines) + '\n'
          needle = '        for script in (\n            "app.js",'
          if '            "auth.js",\n            "app.js",' not in text:
              if needle not in text:
                  raise SystemExit('browser script tuple not found')
              text = text.replace(needle, '        for script in (\n            "auth.js",\n            "app.js",', 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/p1-browser-fix.yml
          git config user.name "KIRA FORJA verification"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test: align Chromium smoke with local auth mode"
          git push origin HEAD:kira/omega-100-agentic-runtime
