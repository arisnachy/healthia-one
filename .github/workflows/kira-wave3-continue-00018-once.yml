name: KIRA Wave 3 continue exact revision 00018 once

on:
  pull_request:
    branches:
      - kira/golden-google-constellation-live-891745e1
    paths:
      - .github/workflows/kira-wave3-continue-00018-once.yml

permissions:
  contents: write

concurrency:
  group: kira-wave3-continue-00018-xs2-once
  cancel-in-progress: false

jobs:
  claim-continuation:
    runs-on: ubuntu-22.04
    outputs:
      claimed: ${{ steps.claim.outputs.claimed }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TARGET_BRANCH: kira/google-constellation-wave2-live
      MARKER_PATH: .kira/wave3-00018-continuation-consumed.json
    steps:
      - name: Claim this no-redeploy continuation exactly once
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          if gh api "/repos/${REPO}/contents/${MARKER_PATH}?ref=${TARGET_BRANCH}" >/tmp/existing.json 2>/dev/null; then
            echo "claimed=false" >> "$GITHUB_OUTPUT"
            echo "HEALTHIA_WAVE3_CONTINUATION_ALREADY_CLAIMED"
            exit 0
          fi
          printf '%s\n' '{"candidate_sha":"0a0eb9e2f79f920514192a9e8373c33bf4aefbe5","expected_revision":"healthia-one-demo-00018-xs2","scope":"same authorized take; no redeploy; one warm clinical probe then private recorder","public_release_performed":false}' > /tmp/marker.json
          encoded="$(base64 -w0 /tmp/marker.json)"
          gh api --method PUT "/repos/${REPO}/contents/${MARKER_PATH}" \
            -f message='KIRA Wave 3: claim no-redeploy 00018 continuation' \
            -f content="$encoded" \
            -f branch="$TARGET_BRANCH" >/dev/null
          echo "claimed=true" >> "$GITHUB_OUTPUT"
          echo "HEALTHIA_WAVE3_CONTINUATION_CLAIMED"

  probe-record:
    needs: claim-continuation
    if: needs.claim-continuation.outputs.claimed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-demo
      GCS_BUCKET: healthia-6088a-healthia-evidence
      CANDIDATE_SHA: 0a0eb9e2f79f920514192a9e8373c33bf4aefbe5
      EXPECTED_REVISION: healthia-one-demo-00018-xs2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Prove recorder source is exact authorized candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Bind only to existing exact revision; never redeploy
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          test "$revision" = "$EXPECTED_REVISION"
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          image="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          token="$(gcloud auth print-identity-token --audiences="$url")"
          test -n "$url" && test -n "$image" && test -n "$token"
          echo "::add-mask::$token"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "HEALTHIA_WAVE3_EXISTING_REVISION_BOUND $revision"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Warm clinical probe must be live Gemini ADK, not fallback
        env:
          HEALTHIA_CLOUD_URL: ${{ steps.cloud.outputs.url }}
          HEALTHIA_CLOUD_ID_TOKEN: ${{ steps.cloud.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/submission-demo
          python - <<'PY'
          import http.cookiejar, json, os, secrets, urllib.request
          base=os.environ['HEALTHIA_CLOUD_URL'].rstrip('/')
          token=os.environ['HEALTHIA_CLOUD_ID_TOKEN']
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def call(path,payload):
              data=json.dumps(payload).encode()
              req=urllib.request.Request(base+path,data=data,method='POST',headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json'})
              with opener.open(req,timeout=55) as r: return json.load(r)
          suffix=secrets.token_hex(6)
          call('/api/auth/register',{'email':f'wave3-warm-{suffix}@example.test','password':f'Wave3!{suffix}Aa9','display_name':'Wave 3 Synthetic Warm Probe'})
          result=call('/api/chat',{'message':'Since yesterday I have burning pain when I urinate and I need to go very often. Help me understand what information is still missing.'})
          meta=(result.get('message') or {}).get('metadata') or {}
          interview=meta.get('clinical_interview') or {}
          questions=(interview.get('question_block') or {}).get('questions') or []
          ok=(meta.get('llm_status')=='dynamic_clinical_questions' and interview.get('question_source')=='gemini_dynamic' and len(questions)==5)
          report={
            'status':'PASS' if ok else 'FAIL',
            'candidate_sha':os.environ['CANDIDATE_SHA'],
            'cloud_revision':os.environ['EXPECTED_REVISION'],
            'llm_status':meta.get('llm_status'),
            'question_source':interview.get('question_source'),
            'question_count':len(questions),
            'selected_agent_count':meta.get('selected_agent_count'),
            'cost_guard':{k:(meta.get('cost_guard') or {}).get(k) for k in ('request_limit','requests_used','requests_remaining','blocked_requests')},
            'synthetic_only':True,
            'secrets_exposed':False,
          }
          open('dist/submission-demo/warm_probe.json','w',encoding='utf-8').write(json.dumps(report,indent=2))
          print(json.dumps(report,sort_keys=True))
          if not ok: raise SystemExit('Warm clinical probe did not produce live Gemini/ADK dynamic questions')
          PY
      - name: Install exact-candidate recorder dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m playwright install --with-deps chromium
      - name: Read-only bucket and runtime readiness gate
        env:
          HEALTHIA_CLOUD_URL: ${{ steps.cloud.outputs.url }}
          HEALTHIA_CLOUD_ID_TOKEN: ${{ steps.cloud.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud storage buckets describe "gs://${GCS_BUCKET}" --project "$PROJECT_ID" --format='value(name)' | grep -Fx "$GCS_BUCKET" >/dev/null
          python - <<'PY'
          import json, os, urllib.request
          req=urllib.request.Request(os.environ['HEALTHIA_CLOUD_URL'].rstrip('/')+'/api/readiness',headers={'Authorization':'Bearer '+os.environ['HEALTHIA_CLOUD_ID_TOKEN'],'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          required={'ready':True,'ai_ready':True,'adk_ready':True,'store_backend':'firestore','evidence_backend':'gcs','auth_required':True}
          bad={k:(v,data.get(k)) for k,v in required.items() if data.get(k)!=v}
          if bad: raise SystemExit(f'readiness mismatch: {bad}')
          print('HEALTHIA_WAVE3_READONLY_READINESS_PASS')
          PY
      - name: Record continuous Wave 3 judge journey on existing revision
        env:
          HEALTHIA_CLOUD_URL: ${{ steps.cloud.outputs.url }}
          HEALTHIA_CLOUD_ID_TOKEN: ${{ steps.cloud.outputs.token }}
          HEALTHIA_CLOUD_REVISION: ${{ steps.cloud.outputs.revision }}
          HEALTHIA_CLOUD_IMAGE: ${{ steps.cloud.outputs.image }}
          HEALTHIA_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          HEALTHIA_CLOUD_REGION: ${{ env.REGION }}
          HEALTHIA_CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          HEALTHIA_GCS_BUCKET: ${{ env.GCS_BUCKET }}
          HEALTHIA_DEMO_TARGET_SECONDS: "285"
        run: python scripts/record_submission_demo.py
      - name: Require all exact-head Wave 3 report gates
        shell: bash
        run: |
          set -euo pipefail
          python - "$CANDIDATE_SHA" "$EXPECTED_REVISION" <<'PY'
          import json, pathlib, sys
          expected,revision=sys.argv[1:3]
          report=json.loads(pathlib.Path('dist/submission-demo/report.json').read_text(encoding='utf-8'))
          if report.get('status')!='PASS': raise SystemExit('Wave 3 recorder did not PASS')
          if report.get('candidate_sha')!=expected: raise SystemExit('Recorder candidate mismatch')
          if report.get('cloud_revision')!=revision: raise SystemExit('Recorder revision mismatch')
          required={
            'wave3_unanchored_reference_fails_closed',
            'wave3_evidence_backed_reference_resolution',
            'wave3_places_stops_before_mission_location_consent',
            'wave3_mission_scoped_location_consent_then_real_places',
            'wave3_ordinal_resumes_and_selects_durable_mission',
            'relogin_continuity_including_google_mission',
            'zero_browser_console_or_page_errors',
          }
          missing=sorted(required-set(report.get('checks') or []))
          if missing: raise SystemExit(f'Missing Wave 3 gates: {missing}')
          print('HEALTHIA_WAVE3_REPORT_EXACT_HEAD_PASS')
          PY
      - name: Verify continuous recording duration
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          video="$(find dist/submission-demo/video -type f -name '*.webm' | head -n 1)"
          test -n "$video"
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$video")"
          python - "$duration" <<'PY'
          import sys
          d=float(sys.argv[1])
          if not 250 <= d <= 360: raise SystemExit(f'Wave 3 duration outside 4:10-6:00: {d:.2f}s')
          print(f'HEALTHIA_WAVE3_ONE_TAKE_DURATION_OK {d:.2f}s')
          PY
      - name: Add sanitized exact-head evidence envelope
        env:
          REVISION: ${{ steps.cloud.outputs.revision }}
          IMAGE: ${{ steps.cloud.outputs.image }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('dist/submission-demo')
          report=json.loads((root/'report.json').read_text(encoding='utf-8'))
          video=next((root/'video').glob('*.webm'))
          evidence={
            'status':'PASS','candidate_sha':os.environ['CANDIDATE_SHA'],
            'cloud_revision':os.environ['REVISION'],'cloud_image':os.environ['IMAGE'],
            'video_sha256':hashlib.sha256(video.read_bytes()).hexdigest(),
            'synthetic_only':bool(report.get('synthetic_only')),
            'checks':report.get('checks') or [],'public_release_performed':False,
            'secrets_exposed':False,'redeploy_performed_in_continuation':False,'veo_invoked':False,
            'truth_boundary':'Private exact-head Wave 3 recording on the already deployed authorized revision; no automatic public replacement.'
          }
          (root/'wave3_exact_head_evidence.json').write_text(json.dumps(evidence,indent=2),encoding='utf-8')
          PY
      - name: Upload private PASS evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave3-exact-head-one-take-0a0-PASS
          path: dist/submission-demo
          if-no-files-found: error
          retention-days: 30
      - name: Upload continuation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave3-00018-continuation-failure
          path: dist/submission-demo
          if-no-files-found: warn
          retention-days: 7
