name: HealthIA architecture 100 guarded patch

on:
  push:
    branches:
      - kira/architecture-100-20260821
    paths:
      - scripts/apply_architecture100_patch.py
      - .github/workflows/architecture100-apply-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply exact-anchor patch
        run: python scripts/apply_architecture100_patch.py
      - name: Verify patch scope and syntax
        shell: bash
        run: |
          python -m py_compile app/main.py healthia_one/runtime_architecture.py healthia_one/distributed_events.py healthia_one/pairing.py healthia_one/pairing_backends.py
          git diff --check
          git diff -- app/main.py deployment/deploy-cloud-demo.ps1 .env.example
      - name: Commit guarded patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "healthia-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/main.py deployment/deploy-cloud-demo.ps1 .env.example
          git commit -m "architecture: wire resilient multi-instance runtime"
          git push origin HEAD:kira/architecture-100-20260821
