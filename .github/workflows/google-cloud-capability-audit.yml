name: Google Health Constellation Cloud audit

on:
  pull_request:
    paths:
      - ".github/workflows/google-cloud-capability-audit.yml"
      - ".github/google-cloud-audit-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live')
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      BUILD_ID: 71fc2bd2-cf8b-436b-9005-39214b5d07bc
      SERVICE: healthia-gmail-worker
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate read-only diagnostic
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Inspect failed Wave 2 operator build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/google-cloud-audit
          gcloud builds describe "$BUILD_ID" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/build.json
          current_image="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          current_revision="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          export CURRENT_IMAGE="$current_image" CURRENT_REVISION="$current_revision"
          python - <<'PY'
          import json, os
          data=json.load(open('/tmp/build.json', encoding='utf-8'))
          failure=data.get('failureInfo') or {}
          out={
              'build_id': str(data.get('id') or ''),
              'status': str(data.get('status') or ''),
              'status_detail': str(data.get('statusDetail') or '')[:400],
              'service_account_resource': str(data.get('serviceAccount') or ''),
              'failure_type': str(failure.get('type') or ''),
              'failure_detail': str(failure.get('detail') or '')[:700],
              'steps': [
                  {'index':i,'id':str(s.get('id') or ''),'name':str(s.get('name') or ''),'status':str(s.get('status') or ''),'exit_code':s.get('exitCode')}
                  for i,s in enumerate(data.get('steps') or [])
              ],
              'worker_revision_after_rollback': os.environ.get('CURRENT_REVISION',''),
              'wave2_image_still_active': '/healthia-gmail-wave2:' in os.environ.get('CURRENT_IMAGE',''),
              'read_only': True,
          }
          open('dist/google-cloud-audit/build-diagnostic.json','w',encoding='utf-8').write(json.dumps(out,sort_keys=True,indent=2)+'\n')
          PY

          # Read only the failed build logs, then keep error-relevant lines. Scrub
          # emails/tokens/credential-shaped text before artifact upload.
          (gcloud builds log "$BUILD_ID" --project "$PROJECT_ID" --region "$REGION" --stream 2>&1 || true) \
            | grep -Ei '(FAIL|ERROR|PERMISSION|DENIED|Forbidden|RuntimeError|Google REST|Scheduler|Firestore|expected exactly|Traceback|status)' \
            | tail -n 120 \
            | sed -E \
                -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[email]/g' \
                -e 's/(refresh_token|client_secret|access_token|id_token)[^[:space:]]*/[credential-field]/gi' \
                -e 's/ya29\.[A-Za-z0-9._-]+/[token]/g' \
            > dist/google-cloud-audit/build-error-sanitized.txt || true

          if grep -REiq '(BEGIN PRIVATE KEY|refresh_token|client_secret["=: ]|access_token["=: ]|ya29\.)' dist/google-cloud-audit; then
            rm -rf dist/google-cloud-audit
            exit 1
          fi
          cat dist/google-cloud-audit/build-diagnostic.json
          cat dist/google-cloud-audit/build-error-sanitized.txt || true
      - name: Upload sanitized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave2-CloudBuild-diagnostic
          path: dist/google-cloud-audit
          if-no-files-found: error
          retention-days: 7
