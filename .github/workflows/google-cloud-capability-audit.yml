name: Google Health Constellation Cloud audit

on:
  pull_request:
    paths:
      - ".github/workflows/google-cloud-capability-audit.yml"
      - ".github/google-cloud-audit-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live')
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      PROJECT_ID: healthia-6088a
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate read-only API audit
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Check Wave 2 API enablement only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/google-cloud-audit
          enabled="$(gcloud services list --project "$PROJECT_ID" --enabled --format='value(config.name)')"
          python - "$enabled" <<'PY'
          import json,sys
          enabled=set((sys.argv[1] or '').splitlines())
          names=['speech.googleapis.com','documentai.googleapis.com','healthcare.googleapis.com','texttospeech.googleapis.com','aiplatform.googleapis.com','fcm.googleapis.com','firebase.googleapis.com']
          out={
              'status':'READ_ONLY_AUDIT',
              'apis':{name:(name in enabled) for name in names},
              'api_enable_mutation':False,
              'iam_mutation':False,
              'secret_material_exposed':False,
          }
          open('dist/google-cloud-audit/wave2-api-enablement.json','w',encoding='utf-8').write(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Upload sanitized API enablement evidence
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave2-API-Enablement
          path: dist/google-cloud-audit/wave2-api-enablement.json
          if-no-files-found: error
          retention-days: 7
