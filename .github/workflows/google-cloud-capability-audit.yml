name: Google Health Constellation Cloud audit

on:
  pull_request:
    paths:
      - ".github/workflows/google-cloud-capability-audit.yml"
      - ".github/google-cloud-audit-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthia-google-cloud-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-health-constellation')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud read-only audit
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Collect sanitized capability inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/google-cloud-audit
          out="dist/google-cloud-audit/inventory.md"
          {
            echo "# HealthIA Google Cloud capability audit"
            echo
            echo "Project: $PROJECT_ID"
            echo "Region: $REGION"
            echo "Commit: $GITHUB_SHA"
            echo "Mode: read-only inventory; no secret values requested"
            echo
            echo "## Enabled relevant APIs"
            gcloud services list --project "$PROJECT_ID" --enabled --format='value(config.name)' \
              | grep -E '^(run|firestore|secretmanager|pubsub|cloudscheduler|artifactregistry|cloudbuild|eventarc|aiplatform|places-backend|routes|gmail|calendar|people|tasks|drive|documentai|healthcare|speech|texttospeech|translate|fcm|firebase)\.googleapis\.com$' \
              | sort || true
            echo
            echo "## Cloud Run services"
            gcloud run services list --project "$PROJECT_ID" --region "$REGION" \
              --format='table(metadata.name,status.url,status.latestReadyRevisionName)' || true
            echo
            echo "## Service accounts"
            gcloud iam service-accounts list --project "$PROJECT_ID" \
              --format='value(email)' | sort || true
            echo
            echo "## Pub/Sub topics"
            gcloud pubsub topics list --project "$PROJECT_ID" --format='value(name)' | sort || true
            echo
            echo "## Pub/Sub subscriptions"
            gcloud pubsub subscriptions list --project "$PROJECT_ID" \
              --format='table(name,topic,pushConfig.pushEndpoint)' || true
            echo
            echo "## Cloud Scheduler jobs"
            gcloud scheduler jobs list --project "$PROJECT_ID" --location "$REGION" \
              --format='table(name,schedule,state,httpTarget.uri)' || true
            echo
            echo "## Artifact Registry repositories"
            gcloud artifacts repositories list --project "$PROJECT_ID" --location "$REGION" \
              --format='table(name,format)' || true
            echo
            echo "## Secret Manager secret names only"
            gcloud secrets list --project "$PROJECT_ID" --format='value(name)' | sort || true
            echo
            echo "## Firestore databases"
            gcloud firestore databases list --project "$PROJECT_ID" \
              --format='table(name,locationId,type)' || true
          } > "$out"

          # Reject accidental credential/token-shaped content before upload.
          if grep -Eiq '(BEGIN PRIVATE KEY|refresh_token|client_secret|ya29\.|sk-[A-Za-z0-9])' "$out"; then
            echo "Sensitive-looking material appeared in the audit output; refusing artifact upload."
            rm -f "$out"
            exit 1
          fi
          cat "$out"
      - name: Upload sanitized Cloud inventory
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Google-Cloud-audit
          path: dist/google-cloud-audit/inventory.md
          if-no-files-found: error
          retention-days: 7
