name: Google Health Constellation Cloud audit

on:
  pull_request:
    paths:
      - ".github/workflows/google-cloud-capability-audit.yml"
      - ".github/google-cloud-audit-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PROJECT_ID: healthia-6088a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate read-only FCM registration audit
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Install Firestore client
        run: python -m pip install --quiet 'google-cloud-firestore>=2.21,<3'
      - name: Count active FCM registrations without token disclosure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/google-cloud-audit
          python - <<'PY'
          import json, os
          from google.cloud import firestore
          client=firestore.Client(project=os.environ['PROJECT_ID'])
          total=0
          active=0
          valid_hashes=0
          for snap in client.collection_group('devices').stream():
              data=snap.to_dict() or {}
              if 'registration_token' not in data or 'token_sha256' not in data:
                  continue
              total += 1
              if bool(data.get('enabled', True)):
                  active += 1
              digest=str(data.get('token_sha256') or '')
              if len(digest)==64 and all(c in '0123456789abcdefABCDEF' for c in digest):
                  valid_hashes += 1
          out={
              'status':'READ_ONLY_AUDIT',
              'fcm_registration_documents':total,
              'active_fcm_registrations':active,
              'registrations_with_valid_sha256':valid_hashes,
              'raw_device_secret_emitted':False,
              'iam_mutation':False,
              'secret_material_exposed':False,
          }
          open('dist/google-cloud-audit/fcm-registration-readiness.json','w',encoding='utf-8').write(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
          if grep -Eiq '(registration_token|private_key|client_secret|access_token|id_token|refresh_token|ya29\.|@[A-Za-z0-9.-]+\.[A-Za-z]{2,})' dist/google-cloud-audit/fcm-registration-readiness.json; then
            rm -f dist/google-cloud-audit/fcm-registration-readiness.json
            exit 1
          fi
      - name: Upload sanitized FCM registration readiness
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave2-FCM-Device-Readiness
          path: dist/google-cloud-audit/fcm-registration-readiness.json
          if-no-files-found: error
          retention-days: 7
