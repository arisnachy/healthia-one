name: Google Health Constellation Cloud audit

on:
  pull_request:
    paths:
      - ".github/workflows/google-cloud-capability-audit.yml"
      - ".github/google-cloud-audit-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live')
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      BUILD_ID: 71fc2bd2-cf8b-436b-9005-39214b5d07bc
      SERVICE: healthia-gmail-worker
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate read-only diagnostic
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Inspect failed Wave 2 operator build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/google-cloud-audit
          gcloud builds describe "$BUILD_ID" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/build.json
          current_image="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          current_revision="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          export CURRENT_IMAGE="$current_image" CURRENT_REVISION="$current_revision"
          python - <<'PY'
          import json, os
          data=json.load(open('/tmp/build.json', encoding='utf-8'))
          failure=data.get('failureInfo') or {}
          steps=[]
          for i, step in enumerate(data.get('steps') or []):
              steps.append({
                  'index': i,
                  'id': str(step.get('id') or ''),
                  'name': str(step.get('name') or ''),
                  'status': str(step.get('status') or ''),
                  'exit_code': step.get('exitCode'),
              })
          out={
              'build_id': str(data.get('id') or ''),
              'status': str(data.get('status') or ''),
              'status_detail': str(data.get('statusDetail') or '')[:400],
              'service_account_resource': str(data.get('serviceAccount') or ''),
              'failure_type': str(failure.get('type') or ''),
              'failure_detail': str(failure.get('detail') or '')[:700],
              'steps': steps,
              'worker_revision_after_rollback': os.environ.get('CURRENT_REVISION',''),
              'wave2_image_still_active': '/healthia-gmail-wave2:' in os.environ.get('CURRENT_IMAGE',''),
              'read_only': True,
          }
          path='dist/google-cloud-audit/build-diagnostic.json'
          open(path,'w',encoding='utf-8').write(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True,indent=2))
          PY
          if grep -Eiq '(refresh_token|client_secret|access_token|id_token|ya29\.|BEGIN PRIVATE KEY)' dist/google-cloud-audit/build-diagnostic.json; then
            rm -f dist/google-cloud-audit/build-diagnostic.json
            exit 1
          fi
      - name: Upload sanitized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave2-CloudBuild-diagnostic
          path: dist/google-cloud-audit/build-diagnostic.json
          if-no-files-found: error
          retention-days: 7
