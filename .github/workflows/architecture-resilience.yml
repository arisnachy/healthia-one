name: HealthIA architecture resilience gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resilience:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install known-good dependency set
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-release.txt -e ".[test]"
      - name: Compile architecture boundary
        run: |
          python -m compileall -q app healthia_one healthia_agent
      - name: Architecture 100 contracts
        run: |
          pytest -q \
            tests/test_architecture_100.py \
            tests/test_pairing.py \
            tests/test_cold_boot_contract.py \
            tests/test_fcm_device_api_e2e.py \
            tests/test_autopilot_crash_recovery.py
      - name: No-import cloud client construction contract
        env:
          HEALTHIA_ENV: cloud
          HEALTHIA_STORE_BACKEND: firestore
          HEALTHIA_AUTH_REQUIRED: 'true'
          HEALTHIA_LLM_BACKEND: gemini_api
          HEALTHIA_DEVICE_TOKEN_SECRET: architecture-test-device-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          HEALTHIA_SESSION_SECRET: architecture-test-session-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_CLOUD_PROJECT: healthia-architecture-test
        run: |
          python - <<'PY'
          import app.main as main
          from healthia_one.google_constellation_runtime import _stores
          assert main.service.store.client_initialized is False
          assert main.service.broker.client_initialized is False
          assert main.pairing_manager.backend.client_initialized is False
          assert main.fcm_registration_store.client_initialized is False
          assert all(store.client_initialized is False for store in _stores(main.settings))
          print('HEALTHIA_IMPORT_WITHOUT_CLOUD_IO_PASS')
          PY
      - name: Multi-instance and TTL deployment contract
        run: |
          python - <<'PY'
          from pathlib import Path
          deploy = Path('deployment/deploy-cloud-demo.ps1').read_text('utf-8')
          assert '"--max-instances", "3"' in deploy
          assert 'estado, pairing y eventos distribuidos' in deploy
          assert 'gcloud firestore fields ttls update' in deploy
          assert 'Collection = "healthia_device_pairings"' in deploy
          assert 'Field = "ttl_at"' in deploy
          assert 'Collection = "healthia_stream_events"' in deploy
          assert 'Field = "expires_at"' in deploy
          assert '--enable-ttl' in deploy
          print('HEALTHIA_MULTI_INSTANCE_TTL_DEPLOYMENT_PASS')
          PY
      - name: Existing crash recovery contract
        run: |
          pytest -q tests/test_autopilot_crash_recovery.py
      - name: Architecture promotion marker
        run: echo HEALTHIA_ARCHITECTURE_RESILIENCE_PASS
