name: Security exact-SHA live proof control

on:
  push:
    branches:
      - kira/security-live-proof-control
    paths:
      - .github/workflows/security-live-proof-control.yml

permissions:
  contents: read

concurrency:
  group: healthia-security-live-proof-f0c2f518
  cancel-in-progress: false

env:
  CANDIDATE_SHA: f0c2f518a54ba3a8de9750cba2f017a1915f2241
  PROJECT_ID: healthia-6088a
  REGION: us-central1
  VERTEX_LOCATION: global
  SERVICE_NAME: healthia-one-security-candidate
  RUNTIME_SA: healthia-one-security-candidate
  BUILD_SA: healthia-one-security-build
  BUCKET_NAME: healthia-6088a-security-candidate-evidence

jobs:
  exact-sha-live-security:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact Daybreak candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Prove exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          echo "HEALTHIA_SECURITY_EXACT_SHA_PASS=$actual"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Remote-SHA security regression gate
        env:
          HEALTHIA_AUTH_REQUIRED: "false"
        run: |
          python -m pytest -q tests/test_security_hardening.py tests/test_device_ingestion_hardening.py tests/test_gemini.py
          python scripts/smoke_test.py
          PYTHONPATH=. python scripts/full_system_check.py
          PYTHONPATH=. python scripts/dialogbench.py

      - name: Preflight GCP permissions without mutation
        run: python deployment/check_cloud_permissions.py --project "$PROJECT_ID" --json-out deployment/security-live-cloud-permissions.json

      - name: Deploy isolated candidate and execute strict Cloud proof
        shell: pwsh
        run: |
          ./deployment/deploy-cloud-demo.ps1 `
            -ProjectId $env:PROJECT_ID `
            -Region $env:REGION `
            -VertexLocation $env:VERTEX_LOCATION `
            -BucketName $env:BUCKET_NAME `
            -ServiceName $env:SERVICE_NAME `
            -RuntimeServiceAccount $env:RUNTIME_SA `
            -BuildServiceAccount $env:BUILD_SA `
            -RequestLimit 24 `
            -MaxOutputTokens 1400 `
            -Confirmed

      - name: Verify deployed release SHA and run LIVE boundary probes
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          image="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          id_token="$(gcloud auth print-identity-token --audiences="$url")"
          echo "::add-mask::$id_token"
          export HEALTHIA_SECURITY_URL="$url"
          export HEALTHIA_SECURITY_REVISION="$revision"
          export HEALTHIA_SECURITY_IMAGE="$image"
          export HEALTHIA_CLOUD_ID_TOKEN="$id_token"
          python - <<'PY'
          import hashlib, json, os, secrets, time
          import requests
          from google.cloud import firestore

          url=os.environ['HEALTHIA_SECURITY_URL'].rstrip('/')
          cloud_token=os.environ['HEALTHIA_CLOUD_ID_TOKEN']
          sha=os.environ['CANDIDATE_SHA']
          project=os.environ['PROJECT_ID']
          cloud_headers={'Authorization': f'Bearer {cloud_token}'}

          def must(resp, expected, label):
              if resp.status_code not in expected:
                  raise AssertionError(f'{label}: HTTP {resp.status_code} {resp.text[:500]}')
              return resp

          readiness=must(requests.get(url+'/api/readiness', headers=cloud_headers, timeout=30), {200}, 'readiness').json()
          assert readiness.get('release_sha') == sha, readiness
          assert readiness.get('auth_required') is True, readiness
          assert readiness.get('model') == 'gemini-3.5-flash', readiness
          assert readiness.get('adk_ready') is True, readiness
          assert readiness.get('store_backend') == 'firestore', readiness

          suffix=secrets.token_hex(6)
          email=f'security-live-{suffix}@example.com'
          password='HealthIA-Security-2026!'
          s=requests.Session(); s.headers.update(cloud_headers)
          reg=must(s.post(url+'/api/auth/register', json={'email':email,'password':password,'display_name':'Security Live Patient'}, timeout=30), {201}, 'register')
          old_cookie=s.cookies.get('healthia_session')
          assert old_cookie
          must(s.get(url+'/api/bootstrap', timeout=30), {200}, 'authenticated bootstrap')

          # Canonical consent must survive an ordinary profile update.
          consent=must(s.get(url+'/api/consent', timeout=30), {200}, 'get consent').json()
          bootstrap=must(s.get(url+'/api/bootstrap', timeout=30), {200}, 'bootstrap for profile').json()
          profile=dict(bootstrap['profile'])
          profile['consented_signal_types']=['attacker_override']
          must(s.put(url+'/api/profile', json=profile, timeout=30), {200}, 'profile update')
          profile_after=must(s.get(url+'/api/bootstrap', timeout=30), {200}, 'profile after').json()['profile']
          assert profile_after.get('consented_signal_types') == consent.get('signal_types')

          # Oversized profile payload must fail validation.
          oversized=dict(profile_after)
          oversized['allergies']=['X'*1000 for _ in range(100)]
          must(s.put(url+'/api/profile', json=oversized, timeout=30), {422}, 'oversized profile rejected')

          # Pair -> persist connection immediately -> disconnect before first sync -> bearer must die.
          pair=must(s.post(url+'/api/devices/pairing', timeout=30), {200}, 'create pairing').json()
          device_id='security-device-'+suffix
          claim_headers={'X-Serverless-Authorization': f'Bearer {cloud_token}'}
          claim=must(requests.post(url+'/api/devices/pairing/claim', headers=claim_headers, json={'code':pair['code'],'device_id':device_id,'display_name':'Security Probe'}, timeout=30), {200}, 'claim pairing').json()
          connection_id=claim['connection_id']; device_token=claim['access_token']
          must(s.delete(url+f'/api/devices/{connection_id}', timeout=30), {200}, 'disconnect before sync')
          sync_headers={
              'X-Serverless-Authorization': f'Bearer {cloud_token}',
              'Authorization': f'Bearer {device_token}',
          }
          sync_payload={'device_id':device_id,'background_read':False,'granted_metrics':[],'records':[]}
          must(requests.post(url+'/api/devices/health-connect/sync', headers=sync_headers, json=sync_payload, timeout=30), {401}, 'revoked device bearer')

          # Logout must revoke the old signed browser session, not merely delete the browser cookie.
          must(s.post(url+'/api/auth/logout', timeout=30), {200}, 'logout')
          replay=requests.Session(); replay.headers.update(cloud_headers); replay.cookies.set('healthia_session', old_cookie)
          must(replay.get(url+'/api/bootstrap', timeout=30), {401}, 'old cookie replay rejected')

          # Disabled account must invalidate an already-issued cookie as well.
          email2=f'security-disable-{suffix}@example.com'
          s2=requests.Session(); s2.headers.update(cloud_headers)
          must(s2.post(url+'/api/auth/register', json={'email':email2,'password':password,'display_name':'Disable Probe'}, timeout=30), {201}, 'register disable probe')
          cookie2=s2.cookies.get('healthia_session'); assert cookie2
          doc_id=hashlib.sha256(email2.encode()).hexdigest()
          db=firestore.Client(project=project)
          db.collection('healthia_one_accounts').document(doc_id).update({'disabled':True})
          replay2=requests.Session(); replay2.headers.update(cloud_headers); replay2.cookies.set('healthia_session', cookie2)
          must(replay2.get(url+'/api/bootstrap', timeout=30), {401}, 'disabled account cookie rejected')

          # Account-scoped login throttling must become 429 under abuse.
          email3=f'security-rate-{suffix}@example.com'
          s3=requests.Session(); s3.headers.update(cloud_headers)
          must(s3.post(url+'/api/auth/register', json={'email':email3,'password':password,'display_name':'Rate Probe'}, timeout=30), {201}, 'register rate probe')
          statuses=[]
          for _ in range(8):
              r=requests.post(url+'/api/auth/login', headers=cloud_headers, json={'email':email3,'password':'wrong-password-value'}, timeout=30)
              statuses.append(r.status_code)
              if r.status_code == 429:
                  break
          assert 429 in statuses, statuses

          result={
              'schema':'healthia-security-live-proof/v1',
              'status':'PASS',
              'candidate_sha':sha,
              'cloud_revision':os.environ['HEALTHIA_SECURITY_REVISION'],
              'cloud_image':os.environ['HEALTHIA_SECURITY_IMAGE'],
              'checks':{
                  'exact_release_sha':True,
                  'cloud_auth_forced':True,
                  'gemini_adk_ready':True,
                  'firestore_ready':True,
                  'canonical_consent_preserved_on_profile_update':True,
                  'oversized_profile_rejected':True,
                  'pre_sync_disconnect_revokes_device_bearer':True,
                  'logout_revokes_old_cookie':True,
                  'disabled_account_revokes_existing_cookie':True,
                  'login_rate_limit_live':True,
              }
          }
          os.makedirs('dist/security-live-proof', exist_ok=True)
          open('dist/security-live-proof/security-live.json','w',encoding='utf-8').write(json.dumps(result,indent=2))
          print('HEALTHIA_SECURITY_LIVE_BOUNDARIES_PASS', json.dumps(result['checks'], sort_keys=True))
          PY

      - name: Verify minimum IAM on isolated runtime identity
        shell: bash
        run: |
          set -euo pipefail
          runtime_email="$RUNTIME_SA@$PROJECT_ID.iam.gserviceaccount.com"
          roles="$(gcloud projects get-iam-policy "$PROJECT_ID" --flatten='bindings[].members' --filter="bindings.members=serviceAccount:$runtime_email" --format='value(bindings.role)' | sort)"
          echo "$roles"
          echo "$roles" | grep -Fx 'roles/aiplatform.user'
          echo "$roles" | grep -Fx 'roles/datastore.user'
          if echo "$roles" | grep -Eq 'roles/(owner|editor|storage.objectAdmin|secretmanager.secretAccessor|run.admin|iam.serviceAccountAdmin)'; then
            echo 'Candidate runtime identity still has an impermissibly broad project role.' >&2
            exit 1
          fi
          python - <<'PY'
          import json, os, subprocess
          runtime=f"{os.environ['RUNTIME_SA']}@{os.environ['PROJECT_ID']}.iam.gserviceaccount.com"
          roles=subprocess.check_output([
              'gcloud','projects','get-iam-policy',os.environ['PROJECT_ID'],
              '--flatten=bindings[].members',f'--filter=bindings.members=serviceAccount:{runtime}',
              '--format=value(bindings.role)'
          ], text=True).split()
          p='dist/security-live-proof/iam.json'
          os.makedirs(os.path.dirname(p), exist_ok=True)
          open(p,'w',encoding='utf-8').write(json.dumps({'runtime_service_account':runtime,'project_roles':sorted(roles)},indent=2))
          PY

      - name: Upload LIVE proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-security-live-proof-f0c2f518
          path: |
            dist/security-live-proof/
            deployment/security-live-cloud-permissions.json
            deployment/cloud-proof-latest.json
            deployment/cloud-provider-binding-latest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove isolated Cloud Run service
        if: always()
        shell: bash
        run: |
          gcloud run services delete "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --quiet || true
