name: KIRA one-shot FCM backend refresh

on:
  pull_request:
    paths:
      - '.github/workflows/kira-fcm-backend-refresh-once.yml'

jobs:
  refresh-fcm-backend:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live'
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE: healthia-one-fcm
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Confirm existing isolated FCM service
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(metadata.name)' | grep -Fx "$SERVICE"

      - name: Refresh existing service from exact source head
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --quiet

      - name: Prove refreshed service and protected FCM route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/fcm-backend-refresh
          URL="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          READINESS_STATUS="$(curl -sS -o /tmp/readiness.json -w '%{http_code}' "$URL/api/readiness")"
          FCM_STATUS="$(curl -sS -o /tmp/fcm.json -w '%{http_code}' -X POST "$URL/api/devices/fcm/register/enable" -H 'Content-Type: application/json' --data '{"device_id":"probe-device","registration_token":"probe-registration-token-1234567890","notifications_opt_in":true}')"
          export URL REVISION READINESS_STATUS FCM_STATUS
          python - <<'PY'
          import json, os
          from pathlib import Path
          readiness=json.loads(Path('/tmp/readiness.json').read_text() or '{}')
          out={
            'status':'PASS' if os.environ['READINESS_STATUS']=='200' and os.environ['FCM_STATUS']=='401' else 'FAIL',
            'source_sha':os.environ.get('GITHUB_SHA',''),
            'service':os.environ['SERVICE'],
            'revision':os.environ['REVISION'],
            'url':os.environ['URL'],
            'readiness_http_status':int(os.environ['READINESS_STATUS']),
            'fcm_no_bearer_http_status':int(os.environ['FCM_STATUS']),
            'fcm_private_notifications': 'fcm_private_notifications' in readiness.get('capabilities',[]),
            'iam_mutation':False,
            'api_enable_mutation':False,
            'secret_material_exposed':False,
          }
          Path('dist/fcm-backend-refresh/result.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          if out['status']!='PASS' or not out['fcm_private_notifications']:
            raise SystemExit('Refreshed FCM service failed protected-route readiness proof')
          PY

      - name: Upload sanitized refresh evidence
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-FCM-Backend-Refresh
          path: dist/fcm-backend-refresh/result.json
          if-no-files-found: error
          retention-days: 7
