name: KIRA validate-then-one FCM LIVE proof

on:
  pull_request:
    paths:
      - '.github/workflows/kira-fcm-validate-then-live-once.yml'

permissions:
  contents: read

concurrency:
  group: kira-fcm-validate-then-live-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-then-live:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live'
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    env:
      PROJECT_ID: healthia-6088a
      DEVICE_AUTHORIZATION: I_AUTHORIZE_CONTROLLED_FCM_PROOF
      TEMP_ROLE: roles/firebasecloudmessaging.admin
    steps:
      - name: Enforce one-shot authorization
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_RUN_ATTEMPT}" == "1" ]] || { echo 'Retry refused.' >&2; exit 1; }
          [[ "$DEVICE_AUTHORIZATION" == "I_AUTHORIZE_CONTROLLED_FCM_PROOF" ]] || { echo 'Exact authorization missing.' >&2; exit 1; }

      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bind source
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Install Firestore client
        run: python -m pip install --quiet "google-cloud-firestore>=2.21,<3"

      - name: Require exactly one active registration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/fcm-validate-live
          python - <<'PY'
          import json, os
          from pathlib import Path
          from google.cloud import firestore
          c=[]; total=0
          for s in firestore.Client(project=os.environ['PROJECT_ID']).collection_group('devices').stream():
              if not s.reference.path.startswith('healthia_fcm_registrations/'): continue
              f=s.to_dict() or {}
              if not {'patient_id','connection_id','device_id','enabled'} <= set(f): continue
              total += 1
              raw=str(f.get('registration_token') or ''); d=str(f.get('token_sha256') or '')
              valid=len(d)==64 and all(x in '0123456789abcdefABCDEF' for x in d)
              if bool(f.get('enabled',True)) and len(raw)>=16 and valid: c.append((s.reference.path,raw,d))
          out={'status':'READY_DEVICE_PRESENT' if len(c)==1 else 'BLOCKED_DEVICE_COUNT','active_fcm_registration_count':len(c),'fcm_registration_documents':total,'source_sha':os.environ.get('SOURCE_SHA',''),'raw_token_exposed':False,'secret_material_exposed':False}
          Path('dist/fcm-validate-live/preflight.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          if len(c)!=1: raise SystemExit('Exactly one active FCM registration required')
          Path('/tmp/fcm-path').write_text(c[0][0]); Path('/tmp/fcm-token').write_text(c[0][1]); Path('/tmp/fcm-digest').write_text(c[0][2])
          PY

      - name: Grant temporary FCM API send role and allow FCM authorizer propagation
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"; test -n "$ACCOUNT"; echo "::add-mask::$ACCOUNT"
          MEMBER="serviceAccount:$ACCOUNT"; echo "::add-mask::$MEMBER"; printf '%s' "$MEMBER" >/tmp/fcm-member
          gcloud projects add-iam-policy-binding "$PROJECT_ID" --member="$MEMBER" --role="$TEMP_ROLE" --condition=None --quiet >/dev/null
          touch /tmp/fcm-temp-role-granted
          echo 'Temporary FCM send role granted. Waiting 60 seconds for FCM authorization propagation.'
          sleep 60

      - name: Validate sender and token without delivery
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/fcm-token)"; echo "::add-mask::$TOKEN"
          ACCESS="$(gcloud auth print-access-token)"; echo "::add-mask::$ACCESS"
          export TOKEN ACCESS
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          from pathlib import Path
          payload={'validate_only':True,'message':{'token':os.environ['TOKEN'],'data':{'kind':'healthia_update','proof_id':'validation_only_not_delivered'},'android':{'priority':'HIGH'}}}
          req=urllib.request.Request(f"https://fcm.googleapis.com/v1/projects/{os.environ['PROJECT_ID']}/messages:send",data=json.dumps(payload,separators=(',',':')).encode(),headers={'Authorization':'Bearer '+os.environ['ACCESS'],'Content-Type':'application/json'},method='POST')
          status=0; fcm_code=''; rpc_status=''; ok=False
          try:
              with urllib.request.urlopen(req,timeout=60) as r:
                  status=r.status; json.loads(r.read().decode() or '{}'); ok=(status==200)
          except urllib.error.HTTPError as e:
              status=e.code
              try: body=json.loads(e.read().decode() or '{}')
              except Exception: body={}
              err=body.get('error') or {}; rpc_status=str(err.get('status') or '')
              for detail in err.get('details') or []:
                  if isinstance(detail,dict) and detail.get('errorCode'): fcm_code=str(detail['errorCode'])
          out={'status':'VALIDATION_PASS' if ok else 'VALIDATION_FAIL','validate_only':True,'http_status':status,'rpc_status':rpc_status,'fcm_error_code':fcm_code,'message_delivered':False,'source_sha':os.environ.get('SOURCE_SHA',''),'raw_token_exposed':False,'secret_material_exposed':False}
          Path('dist/fcm-validate-live/validation.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          if not ok: raise SystemExit('FCM validate_only failed; refusing actual delivery')
          PY

      - name: Send exactly one actual PHI-neutral message and require visible durable ACK
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/fcm-token)"; PATH_DOC="$(cat /tmp/fcm-path)"; DIGEST="$(cat /tmp/fcm-digest)"; echo "::add-mask::$TOKEN"
          ACCESS="$(gcloud auth print-access-token)"; echo "::add-mask::$ACCESS"
          PROOF="fcmproof_$(python -c 'import secrets; print(secrets.token_hex(16))')"
          export TOKEN PATH_DOC DIGEST ACCESS PROOF
          python - <<'PY'
          import hashlib, json, os, time, urllib.error, urllib.request
          from pathlib import Path
          from google.cloud import firestore
          payload={'message':{'token':os.environ['TOKEN'],'data':{'kind':'healthia_update','proof_id':os.environ['PROOF']},'android':{'priority':'HIGH'}}}
          req=urllib.request.Request(f"https://fcm.googleapis.com/v1/projects/{os.environ['PROJECT_ID']}/messages:send",data=json.dumps(payload,separators=(',',':')).encode(),headers={'Authorization':'Bearer '+os.environ['ACCESS'],'Content-Type':'application/json'},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=60) as r: result=json.loads(r.read().decode() or '{}')
          except urllib.error.HTTPError as e: raise RuntimeError(f'Actual FCM send rejected before acceptance HTTP {e.code}') from None
          name=str(result.get('name') or '')
          if not name: raise RuntimeError('FCM accepted response lacked message resource')
          ref=firestore.Client(project=os.environ['PROJECT_ID']).document(os.environ['PATH_DOC'])
          ack=False; shown=False; ack_at=None
          for _ in range(60):
              f=ref.get().to_dict() or {}
              if str(f.get('last_delivery_proof_id') or '')==os.environ['PROOF']:
                  ack=True; shown=f.get('last_delivery_notification_shown') is True; ack_at=f.get('last_delivery_ack_at'); break
              time.sleep(4)
          out={'status':'LIVE_PASS' if ack and shown else ('ACK_WITHOUT_VISIBLE_NOTIFICATION' if ack else 'PROVIDER_ACCEPTED_NO_ACK'),'provider_message_accepted':True,'exactly_one_actual_message':True,'controlled_device_ack':ack,'controlled_device_notification_shown':shown,'acknowledged_at_present':ack_at is not None,'provider_message_name_sha256':hashlib.sha256(name.encode()).hexdigest(),'registration_token_sha256':os.environ['DIGEST'],'proof_id_sha256':hashlib.sha256(os.environ['PROOF'].encode()).hexdigest(),'clinical_content':False,'data_message_kind':'healthia_update','raw_token_exposed':False,'raw_proof_id_exposed':False,'source_sha':os.environ.get('SOURCE_SHA',''),'secret_material_exposed':False}
          Path('dist/fcm-validate-live/live.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          if out['status']!='LIVE_PASS': raise SystemExit(out['status'])
          PY

      - name: Remove temporary FCM send role
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/fcm-temp-role-granted && -f /tmp/fcm-member ]]; then
            MEMBER="$(cat /tmp/fcm-member)"; echo "::add-mask::$MEMBER"
            gcloud projects remove-iam-policy-binding "$PROJECT_ID" --member="$MEMBER" --role="$TEMP_ROLE" --condition=None --quiet >/dev/null || gcloud projects remove-iam-policy-binding "$PROJECT_ID" --member="$MEMBER" --role="$TEMP_ROLE" --quiet >/dev/null
          fi

      - name: Verify cleanup and summarize
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/fcm-validate-live
          LEFT=false
          if [[ -f /tmp/fcm-member ]]; then MEMBER="$(cat /tmp/fcm-member)"; echo "::add-mask::$MEMBER"; if gcloud projects get-iam-policy "$PROJECT_ID" --flatten='bindings[].members' --filter="bindings.role:$TEMP_ROLE AND bindings.members:$MEMBER" --format='value(bindings.role)' | grep -Fxq "$TEMP_ROLE"; then LEFT=true; fi; fi
          export LEFT
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=Path('dist/fcm-validate-live'); v=json.loads((r/'validation.json').read_text()) if (r/'validation.json').exists() else None; l=json.loads((r/'live.json').read_text()) if (r/'live.json').exists() else None
          out={'status':l.get('status') if l else 'VALIDATION_BLOCKED','validation_status':v.get('status') if v else 'MISSING','validation_http_status':v.get('http_status') if v else None,'validation_fcm_error_code':v.get('fcm_error_code') if v else '', 'provider_message_accepted':bool(l and l.get('provider_message_accepted')),'exactly_one_actual_message':bool(l and l.get('exactly_one_actual_message')),'controlled_device_ack':bool(l and l.get('controlled_device_ack')),'controlled_device_notification_shown':bool(l and l.get('controlled_device_notification_shown')),'temporary_send_role_removed':os.environ.get('LEFT','true').lower()!='true','api_enable_mutation':False,'secret_material_exposed':False,'source_sha':os.environ.get('SOURCE_SHA','')}
          (r/'summary.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n'); print(json.dumps(out,sort_keys=True))
          if not out['temporary_send_role_removed']: raise SystemExit('Temporary role cleanup failed')
          PY
          rm -f /tmp/fcm-token /tmp/fcm-path /tmp/fcm-digest /tmp/fcm-member /tmp/fcm-temp-role-granted
          if grep -R -Eiq '(BEGIN PRIVATE KEY|refresh_token|client_secret|access_token|id_token|ya29\.|registration_token["=: ]|proof_id["=: ]|@[A-Za-z0-9.-]+\.[A-Za-z]{2,})' dist/fcm-validate-live; then rm -rf dist/fcm-validate-live; echo 'Sensitive evidence blocked.' >&2; exit 1; fi

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-FCM-Validate-Then-LIVE
          path: dist/fcm-validate-live
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce LIVE PASS
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('dist/fcm-validate-live/summary.json'); s=json.loads(p.read_text()) if p.exists() else {}
          if s.get('status')!='LIVE_PASS': raise SystemExit('FCM is not LIVE_PASS')
          print(json.dumps({'status':'LIVE_PASS','exactly_one_actual_message':s.get('exactly_one_actual_message'),'temporary_send_role_removed':s.get('temporary_send_role_removed')},sort_keys=True))
          PY
