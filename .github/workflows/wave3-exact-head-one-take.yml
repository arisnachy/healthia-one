name: HealthIA Wave 3 exact-head winning one-take

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-char HealthIA candidate SHA to deploy and record
        required: true
        type: string
      authorization:
        description: Exact explicit cost/recording authorization phrase
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: healthia-wave3-exact-head-one-take
  cancel-in-progress: false

jobs:
  exact-head-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    outputs:
      candidate_sha: ${{ steps.gate.outputs.candidate_sha }}
    steps:
      - name: Require exact explicit Wave 3 recording authorization
        id: gate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          set -euo pipefail
          if [ "$AUTHORIZATION" != "I_AUTHORIZE_WAVE3_EXACT_CLOUD_ONE_TAKE" ]; then
            echo "Wave 3 exact-head Cloud recording is blocked without the exact authorization phrase." >&2
            exit 1
          fi
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "candidate_sha must be an exact 40-character Git commit SHA." >&2
            exit 1
          fi
          echo "candidate_sha=${CANDIDATE_SHA,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Prove checkout is the exact requested candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "HEALTHIA_WAVE3_EXACT_SHA_OK ${actual:0:12}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Fail before Cloud spend if exact-head product gates are not green
        run: |
          pytest -q
          python scripts/full_system_check.py
          python scripts/dialogbench.py
          python scripts/judge_omega.py

  deploy-and-record:
    needs: exact-head-preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-demo
      CANDIDATE_SHA: ${{ needs.exact-head-preflight.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.exact-head-preflight.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Reconfirm exact candidate before any Cloud mutation
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact-candidate runtime verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Deploy the exact candidate with bounded model usage
        shell: pwsh
        run: |
          ./deployment/deploy-cloud-demo.ps1 -ProjectId $env:PROJECT_ID -RequestLimit 20 -Confirmed
      - name: Bind the recorder to the newly deployed exact-candidate revision
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          image="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          token="$(gcloud auth print-identity-token --audiences="$url")"
          test -n "$url" && test -n "$revision" && test -n "$image" && test -n "$token"
          echo "::add-mask::$token"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Prove deployed runtime is healthy before recording
        env:
          HEALTHIA_CLOUD_URL: ${{ steps.cloud.outputs.url }}
          HEALTHIA_CLOUD_ID_TOKEN: ${{ steps.cloud.outputs.token }}
        run: python deployment/verify_cloud_demo.py
      - name: Install isolated Chromium recorder
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Record one continuous Wave 3 judge journey
        env:
          HEALTHIA_CLOUD_URL: ${{ steps.cloud.outputs.url }}
          HEALTHIA_CLOUD_ID_TOKEN: ${{ steps.cloud.outputs.token }}
          HEALTHIA_CLOUD_REVISION: ${{ steps.cloud.outputs.revision }}
          HEALTHIA_CLOUD_IMAGE: ${{ steps.cloud.outputs.image }}
          HEALTHIA_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          HEALTHIA_CLOUD_REGION: ${{ env.REGION }}
          HEALTHIA_CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          HEALTHIA_DEMO_TARGET_SECONDS: "285"
        run: python scripts/record_submission_demo.py
      - name: Verify report is bound to the exact candidate and Wave 3 gates passed
        shell: bash
        run: |
          set -euo pipefail
          python - "$CANDIDATE_SHA" <<'PY'
          import json, pathlib, sys
          expected = sys.argv[1]
          report = json.loads(pathlib.Path("dist/submission-demo/report.json").read_text(encoding="utf-8"))
          if report.get("status") != "PASS":
              raise SystemExit("Wave 3 recorder did not PASS")
          if report.get("candidate_sha") != expected:
              raise SystemExit("Recorder evidence is not bound to the exact candidate SHA")
          required = {
              "wave3_unanchored_reference_fails_closed",
              "wave3_evidence_backed_reference_resolution",
              "wave3_places_stops_before_mission_location_consent",
              "wave3_mission_scoped_location_consent_then_real_places",
              "wave3_ordinal_resumes_and_selects_durable_mission",
              "relogin_continuity_including_google_mission",
              "zero_browser_console_or_page_errors",
          }
          missing = sorted(required - set(report.get("checks") or []))
          if missing:
              raise SystemExit(f"Wave 3 recorder missing required gates: {missing}")
          print("HEALTHIA_WAVE3_REPORT_EXACT_HEAD_PASS")
          PY
      - name: Verify continuous recording duration
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          video="$(find dist/submission-demo/video -type f -name '*.webm' | head -n 1)"
          test -n "$video"
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$video")"
          python - "$duration" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if not 250 <= duration <= 360:
              raise SystemExit(f"Wave 3 one-take duration is outside the bounded 4:10–6:00 window: {duration:.2f}s")
          print(f"HEALTHIA_WAVE3_ONE_TAKE_DURATION_OK {duration:.2f}s")
          PY
      - name: Add sanitized exact-head evidence envelope
        shell: bash
        env:
          REVISION: ${{ steps.cloud.outputs.revision }}
          IMAGE: ${{ steps.cloud.outputs.image }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path("dist/submission-demo")
          report = json.loads((root / "report.json").read_text(encoding="utf-8"))
          video = next((root / "video").glob("*.webm"))
          evidence = {
              "status": "PASS",
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "cloud_revision": os.environ["REVISION"],
              "cloud_image": os.environ["IMAGE"],
              "video_sha256": hashlib.sha256(video.read_bytes()).hexdigest(),
              "synthetic_only": bool(report.get("synthetic_only")),
              "checks": report.get("checks") or [],
              "public_release_performed": False,
              "secrets_exposed": False,
              "truth_boundary": "This artifact proves the private exact-head Wave 3 recording only. It does not replace or publish the preserved judge video automatically.",
          }
          (root / "wave3_exact_head_evidence.json").write_text(json.dumps(evidence, indent=2), encoding="utf-8")
          PY
      - name: Upload private Wave 3 exact-head one-take evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave3-exact-head-one-take
          path: dist/submission-demo
          if-no-files-found: error
          retention-days: 30
