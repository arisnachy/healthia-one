name: Google FCM controlled-device LIVE delivery

on:
  pull_request:
    paths:
      - ".github/workflows/google-fcm-live-delivery.yml"
      - "healthia_one/fcm_registration.py"
      - "healthia_one/fcm_device_api.py"
      - "android-health-bridge/app/src/main/java/com/healthia/one/bridge/FirebaseRuntime.kt"
      - "android-health-bridge/app/src/main/java/com/healthia/one/bridge/FcmRegistrationWorker.kt"
      - "android-health-bridge/app/src/main/java/com/healthia/one/bridge/FcmDeliveryAckWorker.kt"
      - "android-health-bridge/app/src/main/java/com/healthia/one/bridge/HealthiaFirebaseMessagingService.kt"
      - "android-health-bridge/app/src/main/java/com/healthia/one/bridge/HealthiaApi.kt"
      - "android-health-bridge/app/src/main/java/com/healthia/one/bridge/MainActivity.kt"
      - "android-health-bridge/app/src/main/AndroidManifest.xml"
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight is read-only; live sends exactly one PHI-neutral data push"
        required: true
        default: preflight
        type: choice
        options: [preflight, live]
      controlled_device_authorization:
        description: "For live only, type I_AUTHORIZE_CONTROLLED_FCM_PROOF"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: healthia-fcm-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  fcm-delivery:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live')
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      PROJECT_ID: healthia-6088a
      LIVE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'live' }}
      DEVICE_AUTHORIZATION: ${{ github.event_name == 'workflow_dispatch' && inputs.controlled_device_authorization || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bind exact source head
        shell: bash
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Install Firestore read client
        shell: bash
        run: python -m pip install --quiet "google-cloud-firestore>=2.21,<3"

      - name: Read-only FCM device preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/wave2-fcm-live
          python - <<'PY'
          import json, os
          from pathlib import Path
          from google.cloud import firestore

          client=firestore.Client(project=os.environ['PROJECT_ID'])
          try:
              snapshots=list(client.collection_group('devices').stream())
          except Exception:
              raise RuntimeError('Firestore FCM registration scan failed') from None

          candidates=[]
          total=0
          valid_hashes=0
          for snapshot in snapshots:
              fields=snapshot.to_dict() or {}
              if 'registration_token' not in fields or 'token_sha256' not in fields:
                  continue
              total += 1
              raw=str(fields.get('registration_token') or '')
              digest=str(fields.get('token_sha256') or '')
              valid_digest=len(digest)==64 and all(c in '0123456789abcdefABCDEF' for c in digest)
              if valid_digest:
                  valid_hashes += 1
              if bool(fields.get('enabled', True)) and len(raw)>=16 and valid_digest:
                  candidates.append({'path':snapshot.reference.path,'token':raw,'digest':digest})

          status='READY_DEVICE_PRESENT' if len(candidates)==1 else ('BLOCKED_DEVICE' if not candidates else 'BLOCKED_AMBIGUOUS_DEVICES')
          out={
            'status':status,
            'source_sha':os.environ.get('SOURCE_SHA',''),
            'fcm_registration_documents':total,
            'active_fcm_registration_count':len(candidates),
            'registrations_with_valid_sha256':valid_hashes,
            'registration_hash_count':len({item['digest'] for item in candidates}),
            'raw_token_exposed':False,
            'provider_write':False,
            'iam_mutation':False,
            'secret_material_exposed':False,
          }
          Path('dist/wave2-fcm-live/preflight.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))

          if os.environ.get('LIVE_MODE','').lower()=='true':
              if len(candidates)!=1:
                  raise SystemExit('LIVE FCM proof requires exactly one active controlled-device registration')
              Path('/tmp/fcm-token.txt').write_text(candidates[0]['token'],encoding='utf-8')
              Path('/tmp/fcm-document-path.txt').write_text(candidates[0]['path'],encoding='utf-8')
              Path('/tmp/fcm-token-digest.txt').write_text(candidates[0]['digest'],encoding='utf-8')
          PY

      - name: Enforce explicit controlled-device authorization
        if: env.LIVE_MODE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEVICE_AUTHORIZATION" != "I_AUTHORIZE_CONTROLLED_FCM_PROOF" ]]; then
            echo "LIVE FCM send blocked: exact controlled-device authorization phrase is missing." >&2
            exit 1
          fi

      - name: Send exactly one PHI-neutral FCM data message and require device ACK
        if: env.LIVE_MODE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          registration_token="$(cat /tmp/fcm-token.txt)"
          document_path="$(cat /tmp/fcm-document-path.txt)"
          token_digest="$(cat /tmp/fcm-token-digest.txt)"
          test -n "$registration_token" && test -n "$document_path"
          echo "::add-mask::$registration_token"
          proof_id="fcmproof_$(python -c 'import secrets; print(secrets.token_hex(16))')"
          access_token="$(gcloud auth print-access-token)"
          test -n "$access_token"
          echo "::add-mask::$access_token"
          export ACCESS_TOKEN="$access_token" REGISTRATION_TOKEN="$registration_token" DOCUMENT_PATH="$document_path" TOKEN_DIGEST="$token_digest" PROOF_ID="$proof_id"

          python - <<'PY'
          import hashlib, json, os, time, urllib.error, urllib.request
          from pathlib import Path
          from google.cloud import firestore

          project=os.environ['PROJECT_ID']; access=os.environ['ACCESS_TOKEN']; registration=os.environ['REGISTRATION_TOKEN']
          document_path=os.environ['DOCUMENT_PATH']; proof_id=os.environ['PROOF_ID']; token_digest=os.environ['TOKEN_DIGEST']
          payload={'message':{'token':registration,'data':{'kind':'healthia_update','proof_id':proof_id},'android':{'priority':'HIGH'}}}
          req=urllib.request.Request(
              f'https://fcm.googleapis.com/v1/projects/{project}/messages:send',
              data=json.dumps(payload,separators=(',',':')).encode(),
              headers={'Authorization':'Bearer '+access,'Content-Type':'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req,timeout=60) as response:
                  result=json.loads(response.read().decode() or '{}')
          except urllib.error.HTTPError as exc:
              raise RuntimeError(f'FCM provider send failed with HTTP {exc.code}') from None
          message_name=str(result.get('name') or '')
          if not message_name:
              raise RuntimeError('FCM provider did not return a message resource')

          client=firestore.Client(project=project)
          reference=client.document(document_path)
          acknowledged=False; acknowledged_at=None
          # WorkManager can apply exponential backoff after a transient Android-side
          # network/process failure, so the LIVE verifier allows four minutes for the
          # durable ACK rather than assuming the first in-process request succeeds.
          for _ in range(60):
              try:
                  snapshot=reference.get()
              except Exception:
                  raise RuntimeError('Firestore FCM acknowledgement reread failed') from None
              fields=snapshot.to_dict() or {}
              if str(fields.get('last_delivery_proof_id') or '') == proof_id:
                  acknowledged=True
                  acknowledged_at=fields.get('last_delivery_ack_at')
                  break
              time.sleep(4)
          if not acknowledged:
              raise RuntimeError('FCM was accepted by the provider but no matching controlled-device ACK was observed')

          out={
            'status':'LIVE_PASS',
            'source_sha':os.environ.get('SOURCE_SHA',''),
            'provider':'fcm.googleapis.com',
            'provider_message_name_sha256':hashlib.sha256(message_name.encode()).hexdigest(),
            'registration_token_sha256':token_digest,
            'proof_id_sha256':hashlib.sha256(proof_id.encode()).hexdigest(),
            'controlled_device_ack':True,
            'acknowledged_at_present':acknowledged_at is not None,
            'data_message_kind':'healthia_update',
            'clinical_content':False,
            'notification_copy_server_supplied':False,
            'raw_token_exposed':False,
            'raw_proof_id_exposed':False,
            'iam_mutation':False,
            'secret_material_exposed':False,
          }
          Path('dist/wave2-fcm-live/live.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
          rm -f /tmp/fcm-token.txt /tmp/fcm-document-path.txt /tmp/fcm-token-digest.txt

      - name: Build sanitized FCM summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/wave2-fcm-live
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('dist/wave2-fcm-live')
          preflight=json.loads((root/'preflight.json').read_text()) if (root/'preflight.json').exists() else {}
          live=json.loads((root/'live.json').read_text()) if (root/'live.json').exists() else None
          live_mode=os.environ.get('LIVE_MODE','').lower()=='true'
          out={'status':'LIVE_PASS' if live and live.get('controlled_device_ack') else (preflight.get('status','INCOMPLETE') if not live_mode else 'INCOMPLETE'),'source_sha':os.environ.get('SOURCE_SHA',''),'live_mode':live_mode,'controlled_device_ack':bool(live and live.get('controlled_device_ack')),'preflight':preflight,'truth_rule':'CODE PASS != LIVE PASS','iam_mutation':False,'secret_material_exposed':False}
          (root/'summary.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
          if grep -R -Eiq '(BEGIN PRIVATE KEY|refresh_token|client_secret|access_token|id_token|ya29\.|registration_token["=: ]|proof_id["=: ]|@[A-Za-z0-9.-]+\.[A-Za-z]{2,})' dist/wave2-fcm-live; then
            echo "Sensitive-looking material appeared in FCM evidence; refusing artifact upload." >&2
            rm -rf dist/wave2-fcm-live
            exit 1
          fi
          rm -f /tmp/fcm-token.txt /tmp/fcm-document-path.txt /tmp/fcm-token-digest.txt

      - name: Upload sanitized FCM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave2-FCM-LIVE
          path: dist/wave2-fcm-live
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce truth-preserving workflow conclusion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('dist/wave2-fcm-live/summary.json')
          if not path.exists():
              raise SystemExit('FCM evidence summary missing')
          summary=json.loads(path.read_text())
          status=str(summary.get('status') or '')
          live=os.environ.get('LIVE_MODE','').lower()=='true'
          allowed={'BLOCKED_DEVICE','READY_DEVICE_PRESENT','BLOCKED_AMBIGUOUS_DEVICES'}
          if live and status!='LIVE_PASS':
              raise SystemExit('FCM LIVE proof did not receive a controlled-device ACK')
          if not live and status not in allowed:
              raise SystemExit('FCM preflight did not produce a valid provider-truth state')
          print(json.dumps({'status':status,'truth_rule':'CODE PASS != LIVE PASS'},sort_keys=True))
          PY
