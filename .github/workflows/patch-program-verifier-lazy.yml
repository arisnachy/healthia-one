name: HealthIA guarded Program verifier lazy patch

on:
  push:
    branches:
      - kira/architecture-100-20260821
    paths:
      - scripts/patch_program_verifier_lazy.py
      - .github/workflows/patch-program-verifier-lazy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply exact-anchor patch
        run: python scripts/patch_program_verifier_lazy.py
      - name: Verify target
        run: |
          python -m py_compile healthia_one/program_source_verifier.py
          git diff --check
          git diff -- healthia_one/program_source_verifier.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "healthia-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add healthia_one/program_source_verifier.py
          git commit -m "architecture: lazily construct Program verifier Firestore client"
          git push origin HEAD:kira/architecture-100-20260821
