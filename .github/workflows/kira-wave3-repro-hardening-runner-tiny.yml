name: KIRA Wave 3 reproducibility hardening runner

on:
  push:
    branches: [kira/google-constellation-wave2-live]
    paths: [.github/workflows/kira-wave3-repro-hardening-runner-tiny.yml]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/google-constellation-wave2-live
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reproducible Wave 3 hardening
        run: python .kira/apply_wave3_repro_hardening.py
      - name: Run focused hardening and mission regressions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest -q tests/test_wave3_repro_hardening.py tests/test_wave3_exact_head_one_take.py tests/test_google_mission_location_consent.py tests/test_google_mission_conversation_autonomy.py
      - name: Push only tested reproducibility files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KIRA Omega'
          git config user.email 'actions@users.noreply.github.com'
          git add deployment/deploy-cloud-demo.ps1 scripts/record_submission_demo.py scripts/cloud_browser_judge_proof.py tests/test_wave3_repro_hardening.py
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git diff --cached --check
          git commit -m 'KIRA Wave 3: persist live-proven timeout and current recorder contract'
          git push origin HEAD:kira/google-constellation-wave2-live
