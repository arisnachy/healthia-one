name: KIRA Cloud Healthcare LRO-safe LIVE proof once

on:
  pull_request:
    paths:
      - '.github/workflows/kira-healthcare-lro-live-proof-once.yml'

permissions:
  contents: read

concurrency:
  group: kira-healthcare-lro-live-proof-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  healthcare-live:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PROJECT_ID: healthia-6088a
      LOCATION: us-central1
      AUTHORIZATION: I_AUTHORIZE_STT_DOCUMENTAI_HEALTHCARE_LIVE
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Enforce authorized one-shot Healthcare proof
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]] || { echo 'Retry refused: Healthcare proof is one-shot.' >&2; exit 1; }
          [[ "$AUTHORIZATION" == "I_AUTHORIZE_STT_DOCUMENTAI_HEALTHCARE_LIVE" ]] || { echo 'Exact authorization missing.' >&2; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify Healthcare API remains enabled
        shell: bash
        run: |
          set -euo pipefail
          gcloud services list --project "$PROJECT_ID" --enabled --format='value(config.name)' | grep -Fxq healthcare.googleapis.com

      - name: Grant only temporary Healthcare roles not already present
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"; test -n "$ACCOUNT"; echo "::add-mask::$ACCOUNT"
          MEMBER="serviceAccount:$ACCOUNT"; echo "::add-mask::$MEMBER"; printf '%s' "$MEMBER" >/tmp/healthcare-member
          : >/tmp/healthcare-granted-roles
          roles=(roles/healthcare.datasetAdmin roles/healthcare.fhirStoreAdmin roles/healthcare.fhirResourceEditor roles/healthcare.dicomStoreAdmin roles/healthcare.dicomEditor)
          for role in "${roles[@]}"; do
            if gcloud projects get-iam-policy "$PROJECT_ID" --flatten='bindings[].members' --filter="bindings.role:$role AND bindings.members:$MEMBER" --format='value(bindings.role)' | grep -Fxq "$role"; then
              echo "Preserving pre-existing role: $role"
            else
              gcloud projects add-iam-policy-binding "$PROJECT_ID" --member="$MEMBER" --role="$role" --condition=None --quiet >/dev/null
              printf '%s\n' "$role" >>/tmp/healthcare-granted-roles
            fi
          done
          sleep 90

      - name: Create dataset and stores with provider-aware lifecycle
        shell: bash
        run: |
          set -euo pipefail
          suffix="$(printf '%s' "$GITHUB_RUN_ID" | tr -cd '[:alnum:]' | tail -c 20)"
          DATASET_ID="wave2${suffix}"
          FHIR_ID="fhir${suffix}"
          DICOM_ID="dicom${suffix}"
          printf '%s' "$DATASET_ID" >/tmp/healthcare-dataset
          printf '%s' "$FHIR_ID" >/tmp/healthcare-fhir
          printf '%s' "$DICOM_ID" >/tmp/healthcare-dicom
          gcloud healthcare datasets create "$DATASET_ID" --location="$LOCATION" --project="$PROJECT_ID" --quiet
          gcloud healthcare fhir-stores create "$FHIR_ID" --dataset="$DATASET_ID" --location="$LOCATION" --project="$PROJECT_ID" --version=R4 --quiet
          gcloud healthcare dicom-stores create "$DICOM_ID" --dataset="$DATASET_ID" --location="$LOCATION" --project="$PROJECT_ID" --quiet

      - name: FHIR R4 create and provider reread
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/kira-healthcare-lro-live
          DATASET_ID="$(cat /tmp/healthcare-dataset)"; FHIR_ID="$(cat /tmp/healthcare-fhir)"
          ACCESS="$(gcloud auth print-access-token)"; echo "::add-mask::$ACCESS"; export ACCESS DATASET_ID FHIR_ID
          python - <<'PY'
          import hashlib,json,os,urllib.request
          from pathlib import Path
          base=f"https://healthcare.googleapis.com/v1/projects/{os.environ['PROJECT_ID']}/locations/{os.environ['LOCATION']}/datasets/{os.environ['DATASET_ID']}/fhirStores/{os.environ['FHIR_ID']}/fhir"
          body={'resourceType':'Patient','active':True,'meta':{'tag':[{'system':'https://healthia.invalid/proof','code':'synthetic-wave2'}]}}
          req=urllib.request.Request(base+'/Patient',data=json.dumps(body,separators=(',',':')).encode(),headers={'Authorization':'Bearer '+os.environ['ACCESS'],'Content-Type':'application/fhir+json','Accept':'application/fhir+json'},method='POST')
          with urllib.request.urlopen(req,timeout=120) as r: created=json.loads(r.read().decode() or '{}')
          rid=str(created.get('id') or '')
          if not rid: raise SystemExit('FHIR provider did not return a resource id')
          req=urllib.request.Request(base+'/Patient/'+urllib.request.quote(rid) if False else base+'/Patient/'+rid,headers={'Authorization':'Bearer '+os.environ['ACCESS'],'Accept':'application/fhir+json'},method='GET')
          with urllib.request.urlopen(req,timeout=120) as r: reread=json.loads(r.read().decode() or '{}')
          if reread.get('resourceType')!='Patient' or reread.get('id')!=rid: raise SystemExit('FHIR R4 create+reread did not round-trip')
          out={'status':'LIVE_PASS','provider':'healthcare.googleapis.com','fhir_version':'R4','fhir_create_reread':True,'resource_id_sha256':hashlib.sha256(rid.encode()).hexdigest(),'synthetic_resource':True,'clinical_content':False,'secret_material_exposed':False}
          Path('dist/kira-healthcare-lro-live/fhir.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n'); print(json.dumps(out,sort_keys=True))
          PY

      - name: DICOM STOW and metadata provider reread
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pydicom>=3,<4'
          DATASET_ID="$(cat /tmp/healthcare-dataset)"; DICOM_ID="$(cat /tmp/healthcare-dicom)"
          ACCESS="$(gcloud auth print-access-token)"; echo "::add-mask::$ACCESS"; export ACCESS DATASET_ID DICOM_ID
          python - <<'PY'
          import hashlib,json,os,tempfile,urllib.parse,urllib.request
          from pathlib import Path
          import pydicom
          from pydicom.dataset import Dataset, FileDataset, FileMetaDataset
          from pydicom.uid import ExplicitVRLittleEndian, SecondaryCaptureImageStorage, generate_uid
          study=generate_uid(); series=generate_uid(); sop=generate_uid()
          meta=FileMetaDataset(); meta.MediaStorageSOPClassUID=SecondaryCaptureImageStorage; meta.MediaStorageSOPInstanceUID=sop; meta.TransferSyntaxUID=ExplicitVRLittleEndian; meta.ImplementationClassUID=generate_uid()
          ds=FileDataset(None,{},file_meta=meta,preamble=b'\0'*128); ds.is_little_endian=True; ds.is_implicit_VR=False
          ds.SOPClassUID=SecondaryCaptureImageStorage; ds.SOPInstanceUID=sop; ds.StudyInstanceUID=study; ds.SeriesInstanceUID=series
          ds.PatientName='SYNTHETIC^HEALTHIA'; ds.PatientID='SYNTHETIC'; ds.Modality='OT'; ds.StudyDate='20260810'; ds.SeriesNumber='1'; ds.InstanceNumber='1'
          ds.SamplesPerPixel=1; ds.PhotometricInterpretation='MONOCHROME2'; ds.Rows=1; ds.Columns=1; ds.BitsAllocated=8; ds.BitsStored=8; ds.HighBit=7; ds.PixelRepresentation=0; ds.PixelData=b'\0\0'
          path=Path('/tmp/healthia-wave2.dcm'); pydicom.dcmwrite(path,ds,enforce_file_format=True); payload=path.read_bytes()
          boundary='healthia-wave2-boundary'; multipart=(('--'+boundary+'\r\nContent-Type: application/dicom\r\n\r\n').encode()+payload+('\r\n--'+boundary+'--\r\n').encode())
          base=f"https://healthcare.googleapis.com/v1/projects/{os.environ['PROJECT_ID']}/locations/{os.environ['LOCATION']}/datasets/{os.environ['DATASET_ID']}/dicomStores/{os.environ['DICOM_ID']}/dicomWeb"
          req=urllib.request.Request(base+'/studies',data=multipart,headers={'Authorization':'Bearer '+os.environ['ACCESS'],'Content-Type':f'multipart/related; type="application/dicom"; boundary={boundary}','Accept':'application/dicom+json'},method='POST')
          with urllib.request.urlopen(req,timeout=120) as r:
              if r.status not in (200,202): raise SystemExit('DICOM STOW did not succeed')
              r.read()
          url=base+'/studies/'+urllib.parse.quote(study,safe='.')+'/series/'+urllib.parse.quote(series,safe='.')+'/instances/'+urllib.parse.quote(sop,safe='.')+'/metadata'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['ACCESS'],'Accept':'application/dicom+json'},method='GET')
          with urllib.request.urlopen(req,timeout=120) as r: metadata=json.loads(r.read().decode() or '[]')
          if not isinstance(metadata,list) or not metadata: raise SystemExit('DICOM metadata provider reread was empty')
          out={'status':'LIVE_PASS','provider':'healthcare.googleapis.com','dicom_stow_metadata_reread':True,'dicom_instance_sha256':hashlib.sha256(payload).hexdigest(),'synthetic_resource':True,'clinical_content':False,'secret_material_exposed':False}
          Path('dist/kira-healthcare-lro-live/dicom.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n'); print(json.dumps(out,sort_keys=True)); path.unlink(missing_ok=True)
          PY

      - name: Cleanup synthetic Healthcare resources
        if: always()
        shell: bash
        run: |
          set +e
          DATASET_ID="$(cat /tmp/healthcare-dataset 2>/dev/null)"; FHIR_ID="$(cat /tmp/healthcare-fhir 2>/dev/null)"; DICOM_ID="$(cat /tmp/healthcare-dicom 2>/dev/null)"
          [[ -n "$DICOM_ID" && -n "$DATASET_ID" ]] && gcloud healthcare dicom-stores delete "$DICOM_ID" --dataset="$DATASET_ID" --location="$LOCATION" --project="$PROJECT_ID" --quiet >/dev/null 2>&1
          [[ -n "$FHIR_ID" && -n "$DATASET_ID" ]] && gcloud healthcare fhir-stores delete "$FHIR_ID" --dataset="$DATASET_ID" --location="$LOCATION" --project="$PROJECT_ID" --quiet >/dev/null 2>&1
          [[ -n "$DATASET_ID" ]] && gcloud healthcare datasets delete "$DATASET_ID" --location="$LOCATION" --project="$PROJECT_ID" --quiet >/dev/null 2>&1
          set -e
          cleaned=false
          if [[ -n "$DATASET_ID" ]]; then
            for _ in $(seq 1 20); do
              if ! gcloud healthcare datasets describe "$DATASET_ID" --location="$LOCATION" --project="$PROJECT_ID" >/dev/null 2>&1; then cleaned=true; break; fi
              sleep 3
            done
          fi
          mkdir -p dist/kira-healthcare-lro-live
          CLEANED="$cleaned" python - <<'PY'
          import json,os
          from pathlib import Path
          out={'dataset_absent_after_cleanup':os.environ.get('CLEANED')=='true','synthetic_resources_only':True,'secret_material_exposed':False}
          Path('dist/kira-healthcare-lro-live/cleanup.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n'); print(json.dumps(out,sort_keys=True))
          PY

      - name: Remove only Healthcare roles granted by this proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/healthcare-member && -f /tmp/healthcare-granted-roles ]]; then
            MEMBER="$(cat /tmp/healthcare-member)"; echo "::add-mask::$MEMBER"
            while IFS= read -r role; do
              [[ -z "$role" ]] && continue
              gcloud projects remove-iam-policy-binding "$PROJECT_ID" --member="$MEMBER" --role="$role" --condition=None --quiet >/dev/null || gcloud projects remove-iam-policy-binding "$PROJECT_ID" --member="$MEMBER" --role="$role" --quiet >/dev/null
            done </tmp/healthcare-granted-roles
          fi

      - name: Enforce final Healthcare LIVE truth and sanitized cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          left=0; granted=0
          if [[ -f /tmp/healthcare-member && -f /tmp/healthcare-granted-roles ]]; then
            MEMBER="$(cat /tmp/healthcare-member)"; echo "::add-mask::$MEMBER"; granted="$(grep -cve '^$' /tmp/healthcare-granted-roles || true)"
            while IFS= read -r role; do
              [[ -z "$role" ]] && continue
              if gcloud projects get-iam-policy "$PROJECT_ID" --flatten='bindings[].members' --filter="bindings.role:$role AND bindings.members:$MEMBER" --format='value(bindings.role)' | grep -Fxq "$role"; then left=$((left+1)); fi
            done </tmp/healthcare-granted-roles
          fi
          export LEFT="$left" GRANTED="$granted"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('dist/kira-healthcare-lro-live')
          def read(n):
              p=root/n; return json.loads(p.read_text()) if p.exists() else {}
          f=read('fhir.json'); d=read('dicom.json'); c=read('cleanup.json')
          out={'status':'LIVE_PASS' if f.get('status')=='LIVE_PASS' and d.get('status')=='LIVE_PASS' and c.get('dataset_absent_after_cleanup') else 'INCOMPLETE','fhir_r4_create_reread':f.get('status')=='LIVE_PASS','dicom_stow_metadata_reread':d.get('status')=='LIVE_PASS','synthetic_dataset_cleaned':bool(c.get('dataset_absent_after_cleanup')),'temporary_roles_granted_count':int(os.environ.get('GRANTED','0') or 0),'temporary_roles_remaining_count':int(os.environ.get('LEFT','0') or 0),'api_enable_mutation':False,'clinical_content':False,'secret_material_exposed':False,'source_sha':os.environ.get('SOURCE_SHA','')}
          (root/'summary.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n'); print(json.dumps(out,sort_keys=True))
          if out['temporary_roles_remaining_count']!=0: raise SystemExit('Healthcare role cleanup failed')
          if out['status']!='LIVE_PASS': raise SystemExit('Healthcare LIVE proof incomplete')
          PY
          rm -f /tmp/healthcare-member /tmp/healthcare-granted-roles /tmp/healthcare-dataset /tmp/healthcare-fhir /tmp/healthcare-dicom
          if grep -R -Eiq '(BEGIN PRIVATE KEY|refresh_token|client_secret|access_token|id_token|ya29\.|@[A-Za-z0-9.-]+\.[A-Za-z]{2,})' dist/kira-healthcare-lro-live; then rm -rf dist/kira-healthcare-lro-live; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HealthIA-Healthcare-FHIR-DICOM-LRO-LIVE
          path: dist/kira-healthcare-lro-live
          if-no-files-found: warn
          retention-days: 30
