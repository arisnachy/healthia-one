name: KIRA one-shot Firebase viewer authorization

on:
  pull_request:
    paths:
      - '.github/workflows/fcm-viewer-authorized-once.yml'
      - '.kira/authorizations/fcm-viewer-ci.once'

concurrency:
  group: healthia-fcm-viewer-authorized-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  authorize-once:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PROJECT_ID: healthia-6088a
      MARKER: .kira/authorizations/fcm-viewer-ci.once
      REQUIRED_AUTHORIZATION: I_AUTHORIZE_FCM_VIEWER_FOR_CI
      REQUIRED_ROLE: roles/firebasecloudmessaging.viewer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Bind exact authorized head and marker
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "${{ github.event.pull_request.head.sha }}"
          test -f "$MARKER"
          authorization="$(tr -d '\r\n' < "$MARKER")"
          if [[ "$authorization" != "$REQUIRED_AUTHORIZATION" ]]; then
            echo 'One-shot IAM authorization marker is absent or invalid.' >&2
            exit 1
          fi
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Grant only Firebase Cloud Messaging API Viewer and require Firebase 200
        id: authorize
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/fcm-viewer-authorized-once
          account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n 1)"
          test -n "$account"
          case "$account" in
            *.iam.gserviceaccount.com) ;;
            *) echo 'Active CI identity is not a service account.' >&2; exit 1 ;;
          esac
          echo "::add-mask::$account"
          export CI_ACCOUNT="$account"

          token="$(gcloud auth print-access-token)"
          test -n "$token"
          echo "::add-mask::$token"

          before="$(curl -sS -o /tmp/firebase-before.json -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/json' \
            "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}/androidApps" || true)"
          rm -f /tmp/firebase-before.json

          mutated=false
          can_set=false
          iam_test_code=0
          if [[ "$before" != '200' ]]; then
            iam_test_code="$(curl -sS -o /tmp/iam-test.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${token}" \
              -H 'Content-Type: application/json; charset=utf-8' \
              -d '{"permissions":["resourcemanager.projects.setIamPolicy"]}' \
              "https://cloudresourcemanager.googleapis.com/v1/projects/${PROJECT_ID}:testIamPermissions" || true)"
            if [[ "$iam_test_code" == '200' ]]; then
              can_set="$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              payload=json.loads(Path('/tmp/iam-test.json').read_text(encoding='utf-8'))
          except Exception:
              payload={}
          print('true' if 'resourcemanager.projects.setIamPolicy' in set(payload.get('permissions') or []) else 'false')
          PY
              )"
            fi
            rm -f /tmp/iam-test.json
            if [[ "$can_set" != 'true' ]]; then
              echo 'CI identity cannot set project IAM policy; refusing mutation.' >&2
              exit 1
            fi
            gcloud projects add-iam-policy-binding "$PROJECT_ID" \
              --member="serviceAccount:${account}" \
              --role="$REQUIRED_ROLE" \
              --condition=None \
              --quiet >/tmp/fcm-viewer-grant.txt
            rm -f /tmp/fcm-viewer-grant.txt
            mutated=true
          fi

          after=0
          for _ in 1 2 3 4 5 6; do
            token="$(gcloud auth print-access-token)"
            echo "::add-mask::$token"
            after="$(curl -sS -o /tmp/firebase-after.json -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/json' \
              "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}/androidApps" || true)"
            rm -f /tmp/firebase-after.json
            [[ "$after" == '200' ]] && break
            sleep 10
          done

          export BEFORE="$before" AFTER="$after" MUTATED="$mutated" CAN_SET="$can_set" IAM_TEST_CODE="$iam_test_code"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out={
              'status':'LIVE_PASS' if os.environ.get('AFTER') == '200' else 'BLOCKED_FIREBASE_READ_IAM',
              'source_sha':os.environ.get('SOURCE_SHA',''),
              'project_id':os.environ['PROJECT_ID'],
              'required_role':os.environ['REQUIRED_ROLE'],
              'firebase_management_list_http_status_before':int(os.environ.get('BEFORE') or 0),
              'firebase_management_list_http_status_after':int(os.environ.get('AFTER') or 0),
              'iam_test_http_status':int(os.environ.get('IAM_TEST_CODE') or 0),
              'ci_can_set_project_iam_policy':os.environ.get('CAN_SET') == 'true',
              'active_service_account_sha256':hashlib.sha256(os.environ['CI_ACCOUNT'].encode()).hexdigest(),
              'iam_mutation':os.environ.get('MUTATED') == 'true',
              'api_enable_mutation':False,
              'provider_write':False,
              'authorization_marker_consumed':True,
              'secret_material_exposed':False,
          }
          Path('dist/fcm-viewer-authorized-once/result.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,sort_keys=True))
          PY

          if [[ "$after" != '200' ]]; then
            echo 'Authorized viewer grant did not converge to Firebase HTTP 200.' >&2
            exit 1
          fi
          echo 'firebase_ready=true' >> "$GITHUB_OUTPUT"

      - name: Refuse secret-like evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -Eiq '(BEGIN PRIVATE KEY|client_secret|access_token|refresh_token|ya29\.|AIza[0-9A-Za-z_-]{20,}|1:[0-9]+:android:[0-9a-f]+|iam\.gserviceaccount\.com)' dist/fcm-viewer-authorized-once; then
            rm -rf dist/fcm-viewer-authorized-once
            echo 'Sensitive-looking material detected; refusing upload.' >&2
            exit 1
          fi

      - name: Upload one-shot IAM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Firebase-CI-One-Shot-Authorization
          path: dist/fcm-viewer-authorized-once/result.json
          if-no-files-found: error
          retention-days: 30

      - name: Dispatch Android build after Firebase 200
        if: steps.authorize.outputs.firebase_ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d '{"ref":"kira/google-constellation-wave2-live"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/android-bridge.yml/dispatches"
          echo 'Android build dispatched after verified Firebase HTTP 200.'
