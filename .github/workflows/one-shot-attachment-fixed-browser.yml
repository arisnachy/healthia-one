name: One-shot attachment-fixed real browser proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: healthia-attachment-fixed-browser
  cancel-in-progress: false

jobs:
  browser:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-judge
      CANDIDATE_SHA: 1df8237212ca79d4df46acb56fb8a1c344239fd3
      EXPECTED_REVISION: healthia-one-judge-00005-xh8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
      - name: Verify exact deployed candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact candidate and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m playwright install --with-deps chromium
      - name: Bind browser to exact revision
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          image="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          test "$revision" = "$EXPECTED_REVISION"
          token="$(gcloud auth print-identity-token --audiences="$url")"
          echo "::add-mask::$token"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          code="$(curl -sS -o /tmp/readiness.json -w '%{http_code}' -H "Authorization: Bearer ${token}" "$url/api/readiness")"
          test "$code" = 200
          python - <<'PY'
          import json
          p=json.load(open('/tmp/readiness.json',encoding='utf-8'))
          assert p.get('ready') is True
          assert p.get('ai_ready') is True and p.get('adk_ready') is True
          assert p.get('model') == 'gemini-3.5-flash'
          assert p.get('store_backend') == 'firestore'
          assert p.get('evidence_backend') == 'gcs'
          PY
      - name: Execute full unmocked browser journey
        env:
          HEALTHIA_CLOUD_URL: ${{ steps.cloud.outputs.url }}
          HEALTHIA_CLOUD_ID_TOKEN: ${{ steps.cloud.outputs.token }}
        run: python scripts/cloud_browser_judge_proof.py
      - name: Bind evidence to runtime
        if: always()
        env:
          CLOUD_URL: ${{ steps.cloud.outputs.url }}
          CLOUD_REVISION: ${{ steps.cloud.outputs.revision }}
          CLOUD_IMAGE: ${{ steps.cloud.outputs.image }}
        run: |
          mkdir -p dist/cloud-browser-judge-proof
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('dist/cloud-browser-judge-proof/runtime.json').write_text(json.dumps({
            'candidate_sha':os.environ['CANDIDATE_SHA'],
            'cloud_url':os.environ.get('CLOUD_URL',''),
            'cloud_revision':os.environ.get('CLOUD_REVISION',''),
            'image':os.environ.get('CLOUD_IMAGE',''),
            'project':os.environ['PROJECT_ID'],
            'region':os.environ['REGION'],
            'service':os.environ['SERVICE_NAME'],
            'model':'gemini-3.5-flash',
            'transport':'vertex_ai_adc',
            'store_backend':'firestore',
            'evidence_backend':'gcs',
            'mocked':False
          },indent=2),encoding='utf-8')
          PY
      - name: Upload video screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-attachment-fixed-browser-proof
          path: dist/cloud-browser-judge-proof
          if-no-files-found: warn
          retention-days: 14
