name: Apply Android Health Profile

on:
  push:
    branches: [kira/android-health-profile]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/android-health-profile
          fetch-depth: 0
      - name: Apply verified source bundle
        shell: bash
        run: |
          cat .healthia-bundle/chunk* > /tmp/healthia.b64
          base64 --decode --ignore-garbage /tmp/healthia.b64 > /tmp/healthia.tar.gz
          echo "7936c9302e356269b8052edf17dd6e65b4c531fef85aac6eca29263a2be9bfa6  /tmp/healthia.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/healthia.tar.gz
          rm -rf .healthia-bundle
          rm -f .github/workflows/apply-health-profile-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Android Health Connect and complete patient profile"
          git push origin HEAD:kira/android-health-profile
