name: KIRA one-shot FCM LIVE durable readback

on:
  pull_request:
    paths:
      - '.github/workflows/kira-fcm-postproof-readback-once.yml'

permissions:
  contents: read

jobs:
  durable-readback:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      PROJECT_ID: healthia-6088a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Bind source SHA
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate read-only provider access
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Install Firestore client
        run: python -m pip install --quiet "google-cloud-firestore>=2.21,<3"
      - name: Reread durable controlled-device FCM proof state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/fcm-postproof-readback
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from google.cloud import firestore

          rows=[]
          for snapshot in firestore.Client(project=os.environ['PROJECT_ID']).collection_group('devices').stream():
              if not snapshot.reference.path.startswith('healthia_fcm_registrations/'):
                  continue
              f=snapshot.to_dict() or {}
              if not {'patient_id','connection_id','device_id','enabled'} <= set(f):
                  continue
              raw=str(f.get('registration_token') or '')
              digest=str(f.get('token_sha256') or '')
              valid_digest=len(digest)==64 and all(c in '0123456789abcdefABCDEF' for c in digest)
              if bool(f.get('enabled',True)) and len(raw)>=16 and valid_digest:
                  proof=str(f.get('last_delivery_proof_id') or '')
                  rows.append({
                    'token_sha256':digest,
                    'last_delivery_proof_id_sha256':hashlib.sha256(proof.encode()).hexdigest() if proof else '',
                    'ack_present':f.get('last_delivery_ack_at') is not None,
                    'notification_shown':f.get('last_delivery_notification_shown') is True,
                  })

          one=len(rows)==1
          row=rows[0] if one else {}
          live=bool(one and row.get('ack_present') and row.get('notification_shown') and row.get('last_delivery_proof_id_sha256'))
          out={
            'status':'LIVE_PASS_DURABLE_READBACK' if live else 'READBACK_NOT_LIVE',
            'active_fcm_registration_count':len(rows),
            'durable_ack_present':bool(row.get('ack_present')),
            'durable_notification_shown':bool(row.get('notification_shown')),
            'durable_proof_hash_present':bool(row.get('last_delivery_proof_id_sha256')),
            'registration_hash_present':bool(row.get('token_sha256')),
            'provider_write':False,
            'iam_mutation':False,
            'api_enable_mutation':False,
            'raw_token_exposed':False,
            'raw_proof_id_exposed':False,
            'secret_material_exposed':False,
            'source_sha':os.environ.get('SOURCE_SHA',''),
          }
          Path('dist/fcm-postproof-readback/summary.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          if out['status']!='LIVE_PASS_DURABLE_READBACK':
              raise SystemExit('Durable FCM LIVE readback failed')
          PY
      - name: Upload sanitized durable readback
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-FCM-LIVE-Durable-Readback
          path: dist/fcm-postproof-readback/summary.json
          if-no-files-found: error
          retention-days: 30
