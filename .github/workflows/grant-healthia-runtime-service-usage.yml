name: Grant HealthIA runtime service usage

on:
  push:
    branches:
      - feature/patient-education-video-20260813
    paths:
      - ".github/workflows/grant-healthia-runtime-service-usage.yml"

permissions:
  contents: read

jobs:
  grant:
    runs-on: ubuntu-22.04
    steps:
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a
      - name: Grant narrow quota-consumer role to HealthIA runtime
        shell: bash
        run: |
          set -euo pipefail
          gcloud projects add-iam-policy-binding healthia-6088a \
            --member="serviceAccount:healthia-one-demo@healthia-6088a.iam.gserviceaccount.com" \
            --role="roles/serviceusage.serviceUsageConsumer" \
            --condition=None \
            --quiet
          gcloud projects get-iam-policy healthia-6088a \
            --flatten="bindings[].members" \
            --filter="bindings.role:roles/serviceusage.serviceUsageConsumer AND bindings.members:healthia-one-demo@healthia-6088a.iam.gserviceaccount.com" \
            --format="value(bindings.role,bindings.members)" | grep -F "roles/serviceusage.serviceUsageConsumer"
