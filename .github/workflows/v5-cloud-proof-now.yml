name: HealthIA V5 cloud proof instant probe

on:
  push:
    branches: [kira/live-product-film-20260819]
    paths:
      - ".github/workflows/v5-cloud-proof-now.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-22.04
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      TARGET_RUN: "32328293833"
      PROBE_REVISION: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/live-product-film-20260819
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Capture sanitized external-loop progress
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q google-cloud-firestore
          gcloud run jobs list --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/jobs.json
          python - <<'PY'
          import json, os
          from google.cloud import firestore
          target=os.environ['TARGET_RUN']; prefix='hfilm-'+target[-8:]+'-'
          raw=json.load(open('/tmp/jobs.json')); jobs=[]
          for item in raw:
              meta=item.get('metadata') or {}; name=str(meta.get('name') or '')
              if not name.startswith(prefix): continue
              status=item.get('status') or {}; conditions=status.get('conditions') or []
              jobs.append({'name':name,'latest_execution':status.get('latestCreatedExecution'),'conditions':[{k:c.get(k) for k in ('type','status','reason','message') if c.get(k) is not None} for c in conditions]})
          db=firestore.Client(project=os.environ['PROJECT_ID']); proofs=[]; doc_prefix='film_'+target+'_'
          allowed={'status','mission_status','outbox_status','eventarc_outbound','gmail_pubsub_inbound','no_chat_prompt_used','trigger_model_calls','trigger_network_calls','vital_source_type','processed_reply_count','mainline_scope'}
          for snap in db.collection('healthia_wave14_stitch_proofs').stream():
              if snap.id.startswith(doc_prefix):
                  data=snap.to_dict() or {}; proofs.append({'id':snap.id, **{k:data.get(k) for k in allowed if k in data}})
          open('hackathon/v5_cloud_proof_now.json','w').write(json.dumps({'target_run':target,'probe_revision':os.environ['PROBE_REVISION'],'jobs':jobs,'proofs':proofs},indent=2,default=str))
          PY
          git config user.name "healthia-v5-cloud-probe"; git config user.email "actions@users.noreply.github.com"
          git add hackathon/v5_cloud_proof_now.json
          git commit -m "film: capture V5 external proof progress"
          git push origin HEAD:kira/live-product-film-20260819
