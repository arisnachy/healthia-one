name: One-shot authenticated browser E2E upgrade

on:
  push:
    branches:
      - kira/event-driven-results-twin-p1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/event-driven-results-twin-p1
          fetch-depth: 0
      - name: Upgrade browser contract and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('web/app.js')
          text = app.read_text(encoding='utf-8')
          old = '  patientName: $("#patientName"),'
          new = '  patientName: $("#patientName") || $("#heroPatientName"),'
          if old in text:
              text = text.replace(old, new, 1)
              app.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('patient-name selector contract not found')

          browser = Path('scripts/browser_smoke.py')
          browser.write_text(r'''from __future__ import annotations

import json
import os
import shutil
import threading
import time
from pathlib import Path

os.environ["HEALTHIA_ENV"] = "local"
os.environ["HEALTHIA_STORE_BACKEND"] = "memory"
os.environ["HEALTHIA_LLM_BACKEND"] = "mock"
os.environ["HEALTHIA_AUTH_REQUIRED"] = "true"
os.environ["HEALTHIA_ALLOW_REGISTRATION"] = "true"
os.environ["HEALTHIA_ACCOUNTS_PATH"] = ".healthia-browser/accounts.json"
os.environ["HEALTHIA_PROACTIVE_ENABLED"] = "false"
os.environ["HEALTHIA_COST_MODE"] = "local"
os.environ["HEALTHIA_AI_REQUEST_LIMIT"] = "0"
os.environ["HEALTHIA_SESSION_SECRET"] = "browser-smoke-session-secret-0123456789-abcdefghijklmnopqrstuvwxyz"
os.environ["HEALTHIA_DEVICE_TOKEN_SECRET"] = "browser-smoke-device-secret-0123456789-abcdefghijklmnopqrstuvwxyz"

ROOT = Path(__file__).resolve().parents[1]
OUT = ROOT / "dist" / "browser-smoke"
TMP = ROOT / ".healthia-browser"
if TMP.exists():
    shutil.rmtree(TMP)
OUT.mkdir(parents=True, exist_ok=True)

from playwright.sync_api import sync_playwright
import uvicorn

from app.main import app, service
from healthia_one.gemini import GeminiResponder
from healthia_one.config import settings


QUESTIONS = {
    1: [
        ("inicio", "¿Cuándo comenzó el ardor al orinar?", ["Hoy", "Ayer", "Hace 2 a 3 días"]),
        ("frecuencia", "¿Con qué frecuencia estás orinando comparado con lo habitual?", ["Algo más", "Mucho más", "Casi constantemente"]),
        ("fiebre", "¿Has tenido fiebre o escalofríos desde que comenzó?", ["No", "Fiebre sin escalofríos", "Fiebre con escalofríos"]),
        ("dolor", "¿Dónde sientes dolor además del ardor?", ["Solo al orinar", "Bajo vientre", "Espalda o costado"]),
        ("alarma", "¿Ha aparecido alguna señal que te preocupe especialmente?", ["Ninguna", "Vómitos", "Sangre visible en orina"]),
    ],
    2: [
        ("embarazo", "¿Existe posibilidad de embarazo actualmente?", ["No", "Sí", "No estoy segura"]),
        ("flujo", "¿Has notado flujo o irritación genital junto con estos síntomas?", ["No", "Irritación", "Flujo diferente"]),
        ("episodios", "¿Has tenido antes un episodio parecido confirmado por un profesional?", ["Nunca", "Sí, una vez", "Sí, varias veces"]),
        ("antibioticos", "¿Has usado antibióticos recientemente por este u otro motivo?", ["No", "En el último mes", "En los últimos 3 meses"]),
        ("alergias", "¿Tienes alguna alergia conocida a medicamentos?", ["No", "Sí", "No estoy segura"]),
    ],
}


def block(stage: int) -> dict:
    questions = []
    for question_id, prompt, options in QUESTIONS[stage]:
        questions.append({
            "id": question_id,
            "prompt": prompt,
            "options": options,
            "multiple": False,
            "allow_detail": True,
            "detail_placeholder": "Agrega un detalle si ayuda",
        })
    return {
        "stage": stage,
        "title": "Preguntas para entender mejor lo que te pasa",
        "instruction": "Se generaron usando lo que ya contaste y la memoria de esta consulta.",
        "questions": questions,
        "submit_label": "Continuar",
    }


class BrowserResponder(GeminiResponder):
    async def enhance(self, state, patient_message, draft):
        metadata = draft.message.metadata
        interview = metadata.get("clinical_interview")
        if not isinstance(interview, dict):
            return draft
        status = interview.get("status")
        if status == "awaiting_answers":
            stage = int(interview.get("stage") or 1)
            if stage in QUESTIONS:
                interview["question_block"] = block(stage)
                interview["question_source"] = "gemini_dynamic"
                metadata["clinical_interview"] = interview
                metadata["question_source"] = "gemini_dynamic"
                metadata["llm_status"] = "dynamic_clinical_questions"
                metadata["judge_review"] = {"approved": True, "score": 96, "verdict": "APPROVED"}
                draft.message.content = "Entendí lo que me cuentas. Voy a preguntarte solo lo que falta para orientarte mejor."
                return draft
        if status == "ready_for_synthesis":
            previous = interview.get("previous_answers") or interview.get("answers") or []
            metadata["llm_status"] = "clinical_ai_orientation_completed"
            metadata["clinical_synthesis_source"] = "gemini"
            metadata["interview_memory_count"] = len(previous)
            interview["status"] = "completed"
            metadata["clinical_interview"] = interview
            draft.message.content = (
                "Ya reuní la información de esta consulta. Por el patrón descrito, una infección urinaria baja "
                "es una posibilidad que un profesional puede valorar, pero esta conversación no confirma un diagnóstico. "
                "Si aparece fiebre alta, dolor en el costado, vómitos persistentes, embarazo o empeoramiento importante, "
                "busca evaluación presencial con mayor prioridad."
            )
        return draft


service.gemini = BrowserResponder(settings)


def start_server() -> tuple[uvicorn.Server, threading.Thread]:
    config = uvicorn.Config(app, host="127.0.0.1", port=8765, log_level="warning")
    server = uvicorn.Server(config)
    thread = threading.Thread(target=server.run, daemon=True)
    thread.start()
    deadline = time.time() + 15
    while time.time() < deadline:
        if server.started:
            return server, thread
        time.sleep(0.05)
    raise RuntimeError("Browser smoke server did not start")


def answer_visible_block(page) -> None:
    form = page.locator("form.clinical-question-block")
    form.wait_for(state="visible", timeout=10000)
    questions = form.locator(".clinical-question")
    if questions.count() != 5:
        raise AssertionError(f"Expected exactly five adaptive questions, found {questions.count()}")
    for index in range(questions.count()):
        field = questions.nth(index)
        choice = field.locator("input").first
        choice.check()
    form.locator("button.clinical-submit").click()


def run() -> dict:
    server, thread = start_server()
    browser = None
    console_errors: list[str] = []
    page = None
    try:
        with sync_playwright() as playwright:
            browser = playwright.chromium.launch(headless=True)
            context = browser.new_context(viewport={"width": 1440, "height": 1000})
            page = context.new_page()
            page.on("console", lambda message: console_errors.append(message.text) if message.type == "error" else None)
            page.on("pageerror", lambda error: console_errors.append(str(error)))

            page.goto("http://127.0.0.1:8765/", wait_until="networkidle")
            page.wait_for_url("**/login")
            page.screenshot(path=str(OUT / "01-login.png"), full_page=True)

            page.locator("#registerTab").click()
            page.locator('#registerForm input[name="display_name"]').fill("Paciente Sintético Browser")
            page.locator('#registerForm input[name="email"]').fill("browser.patient@example.test")
            page.locator('#registerForm input[name="password"]').fill("BrowserSmoke!2026")
            page.locator("#registerForm button[type='submit']").click()
            page.wait_for_url("http://127.0.0.1:8765/", timeout=10000)
            page.wait_for_load_state("networkidle")

            patient_name = page.locator("#heroPatientName")
            patient_name.wait_for(state="visible", timeout=10000)
            if "Paciente Sintético Browser" not in patient_name.inner_text():
                raise AssertionError("Authenticated patient name was not rendered in the continuity strip")
            if page.locator("body").inner_text().find("Ana Martínez") >= 0:
                raise AssertionError("Authenticated patient inherited synthetic demo identity")
            page.screenshot(path=str(OUT / "02-authenticated-home.png"), full_page=True)

            page.locator("#chatInput").fill("Desde ayer me arde al orinar y tengo que ir al baño a cada rato")
            page.locator("#chatForm").evaluate("form => form.requestSubmit()")
            answer_visible_block(page)

            page.locator("form.clinical-question-block").wait_for(state="visible", timeout=10000)
            badge = page.locator(".clinical-source.is-dynamic").last
            if "Gemini + ADK" not in badge.inner_text():
                raise AssertionError("Dynamic question provenance badge is missing")
            answer_visible_block(page)

            page.locator("form.clinical-question-block").wait_for(state="detached", timeout=10000)
            page.wait_for_function("() => document.querySelector('#messageList')?.innerText.includes('Ya reuní la información')", timeout=10000)
            transcript = page.locator("#messageList").inner_text()
            if "INTERVIEWER" in transcript or "SENTINEL" in transcript:
                raise AssertionError("Internal agent names leaked into patient transcript")
            page.screenshot(path=str(OUT / "03-clinical-orientation.png"), full_page=True)

            page.locator("#accountPill").click()
            page.locator("#accountDialog").wait_for(state="visible", timeout=5000)
            account_text = page.locator("#accountDialog").inner_text()
            for marker in ("Cuenta y configuración", "Perfil de salud", "Permisos y privacidad", "Dispositivos", "Cerrar sesión"):
                if marker not in account_text:
                    raise AssertionError(f"Account dialog missing: {marker}")
            page.screenshot(path=str(OUT / "04-account-settings.png"), full_page=True)

            page.locator("#logoutButton").click()
            page.wait_for_url("**/login", timeout=10000)
            page.locator('#loginForm input[name="email"]').fill("browser.patient@example.test")
            page.locator('#loginForm input[name="password"]').fill("BrowserSmoke!2026")
            page.locator("#loginForm button[type='submit']").click()
            page.wait_for_url("http://127.0.0.1:8765/", timeout=10000)
            page.wait_for_load_state("networkidle")
            page.wait_for_function("() => document.querySelector('#messageList')?.innerText.includes('Ya reuní la información')", timeout=10000)
            if "Paciente Sintético Browser" not in page.locator("#heroPatientName").inner_text():
                raise AssertionError("Patient identity was not restored after logout/login")
            page.screenshot(path=str(OUT / "05-relogin-restored.png"), full_page=True)

            serious = [item for item in console_errors if "favicon" not in item.lower()]
            if serious:
                raise AssertionError("Browser console/page errors: " + " | ".join(serious[:10]))

            result = {
                "status": "PASS",
                "proof": [
                    "real_login_registration_ui",
                    "authenticated_patient_identity_rendered",
                    "no_demo_identity_leak",
                    "two_five-question_adaptive_blocks",
                    "dynamic_question_provenance_badge",
                    "patient_facing_orientation",
                    "account_settings_menu",
                    "logout_login_roundtrip",
                    "conversation_memory_restored",
                    "no_browser_console_errors",
                ],
            }
            (OUT / "result.json").write_text(json.dumps(result, indent=2, ensure_ascii=False), encoding="utf-8")
            return result
    except Exception as exc:
        (OUT / "error.txt").write_text(f"{type(exc).__name__}: {exc}\n" + "\n".join(console_errors), encoding="utf-8")
        if page is not None:
            try:
                page.screenshot(path=str(OUT / "99-error.png"), full_page=True)
            except Exception:
                pass
        raise
    finally:
        if browser is not None:
            try:
                browser.close()
            except Exception:
                pass
        server.should_exit = True
        thread.join(timeout=10)


if __name__ == "__main__":
    print(json.dumps(run(), ensure_ascii=False, indent=2))
''', encoding='utf-8')
          PY
          rm -f .github/workflows/one-shot-browser-dom-fix.yml
          git rm .github/workflows/one-shot-browser-e2e-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app.js scripts/browser_smoke.py .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: prove authenticated adaptive browser workflow"
          git push origin HEAD:kira/event-driven-results-twin-p1
