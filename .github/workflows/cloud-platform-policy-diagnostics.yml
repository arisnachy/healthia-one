name: Cloud platform policy diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: healthia-cloud-platform-policy-diagnostics
  cancel-in-progress: true

jobs:
  diagnose-platform:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-demo
      DEPLOY_PRINCIPAL: healthia-github-vertex-9@healthia-6088a.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a

      - name: Inspect Cloud Run v2 service boundary
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          curl -fsSL \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/json" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE_NAME}" \
            > /tmp/run-v2.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/run-v2.json'))
          keep={
            'name': d.get('name'),
            'uri': d.get('uri'),
            'urls': d.get('urls'),
            'ingress': d.get('ingress'),
            'iapEnabled': d.get('iapEnabled'),
            'invokerIamDisabled': d.get('invokerIamDisabled'),
            'defaultUriDisabled': d.get('defaultUriDisabled'),
            'customAudiences': d.get('customAudiences'),
            'launchStage': d.get('launchStage'),
            'reconciling': d.get('reconciling'),
            'latestReadyRevision': d.get('latestReadyRevision'),
            'latestCreatedRevision': d.get('latestCreatedRevision'),
            'traffic': d.get('traffic'),
            'trafficStatuses': d.get('trafficStatuses'),
            'terminalCondition': d.get('terminalCondition'),
            'conditions': [
              {k:c.get(k) for k in ('type','state','severity','reason','message')}
              for c in (d.get('conditions') or [])
            ],
            'templateServiceAccount': (d.get('template') or {}).get('serviceAccount'),
            'containerPorts': [
              p for c in ((d.get('template') or {}).get('containers') or [])
              for p in (c.get('ports') or [])
            ],
            'containerImages': [c.get('image') for c in ((d.get('template') or {}).get('containers') or [])],
            'annotations': {
              k:v for k,v in (d.get('annotations') or {}).items()
              if k.startswith('run.googleapis.com/')
            },
          }
          print(json.dumps(keep,indent=2,ensure_ascii=False))
          Path('deployment/cloud-platform-run-v2.json').write_text(json.dumps(keep,indent=2,ensure_ascii=False),encoding='utf-8')
          PY

      - name: Inspect project policy and proof principal roles
        shell: bash
        run: |
          set +e
          mkdir -p deployment
          {
            echo '=== PROJECT ANCESTRY ==='
            gcloud projects get-ancestors "$PROJECT_ID" --format='table(type,id)' 2>&1
            echo
            echo '=== RUN ALLOWED INGRESS ==='
            gcloud resource-manager org-policies describe constraints/run.allowedIngress --project="$PROJECT_ID" --effective --format=json 2>&1
            echo
            echo '=== RUN REQUIRE INVOKER IAM ==='
            gcloud resource-manager org-policies describe constraints/run.managed.requireInvokerIam --project="$PROJECT_ID" --effective --format=json 2>&1
            echo
            echo '=== RUN ALLOWED VPC EGRESS ==='
            gcloud resource-manager org-policies describe constraints/run.allowedVPCEgress --project="$PROJECT_ID" --effective --format=json 2>&1
            echo
            echo '=== PROJECT ROLES FOR PROOF PRINCIPAL ==='
            gcloud projects get-iam-policy "$PROJECT_ID" \
              --flatten='bindings[].members' \
              --filter="bindings.members:serviceAccount:${DEPLOY_PRINCIPAL}" \
              --format='value(bindings.role)' 2>&1 | sort -u
          } | tee deployment/cloud-platform-policy.txt
          exit 0

      - name: Read exact Cloud Run request logs and app logs
        shell: bash
        run: |
          set +e
          request_filter="resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${SERVICE_NAME}\" AND logName=\"projects/${PROJECT_ID}/logs/run.googleapis.com%2Frequests\""
          stdout_filter="resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${SERVICE_NAME}\" AND (logName=\"projects/${PROJECT_ID}/logs/run.googleapis.com%2Fstdout\" OR logName=\"projects/${PROJECT_ID}/logs/run.googleapis.com%2Fstderr\")"
          gcloud logging read "$request_filter" --project="$PROJECT_ID" --freshness=60m --limit=100 --format=json > deployment/cloud-run-request-logs.json 2>deployment/cloud-run-request-logs.err
          request_rc=$?
          gcloud logging read "$stdout_filter" --project="$PROJECT_ID" --freshness=60m --limit=100 --format=json > deployment/cloud-run-app-logs.json 2>deployment/cloud-run-app-logs.err
          app_rc=$?
          python - <<'PY'
          import json
          from pathlib import Path
          def load(path, err, rc):
              raw=Path(path).read_text(encoding='utf-8',errors='replace') if Path(path).exists() else ''
              e=Path(err).read_text(encoding='utf-8',errors='replace') if Path(err).exists() else ''
              out={'command_rc':rc,'query_succeeded':False,'entry_count':0,'statuses':[],'methods':[],'paths':[],'revisions':[],'error':e[:1200]}
              try:
                  data=json.loads(raw or '[]')
                  if isinstance(data,list):
                      out['query_succeeded']=True
                      out['entry_count']=len(data)
                      for item in data:
                          req=item.get('httpRequest') or {}
                          if req.get('status') is not None: out['statuses'].append(req.get('status'))
                          if req.get('requestMethod'): out['methods'].append(req.get('requestMethod'))
                          if req.get('requestUrl'):
                              try:
                                  from urllib.parse import urlsplit
                                  out['paths'].append(urlsplit(req['requestUrl']).path)
                              except Exception: pass
                          rev=((item.get('resource') or {}).get('labels') or {}).get('revision_name')
                          if rev: out['revisions'].append(rev)
              except Exception as exc:
                  out['error']=(e or f'{type(exc).__name__}: {exc}; raw={raw[:800]}')[:1200]
              out['statuses']=out['statuses'][-50:]
              out['methods']=out['methods'][-50:]
              out['paths']=out['paths'][-50:]
              out['revisions']=sorted(set(out['revisions']))
              return out
          summary={
              'requests': load('deployment/cloud-run-request-logs.json','deployment/cloud-run-request-logs.err',0),
              'app': load('deployment/cloud-run-app-logs.json','deployment/cloud-run-app-logs.err',0),
          }
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          Path('deployment/cloud-run-log-summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding='utf-8')
          PY
          exit 0

      - name: Probe DNS and TLS routing metadata without secrets
        shell: bash
        run: |
          set +e
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          host="${url#https://}"
          {
            echo "host=$host"
            echo '=== getent ==='
            getent ahosts "$host" | head -n 12
            echo '=== curl headers ==='
            curl -sS -D - -o /dev/null "$url/healthz" | sed -n '1,30p'
          } | tee deployment/cloud-route-network.txt
          exit 0

      - name: Test service-level IAM permissions
        shell: bash
        run: |
          set +e
          token="$(gcloud auth print-access-token)"
          curl -sS -o deployment/cloud-run-test-iam.json \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE_NAME}:testIamPermissions" \
            -d '{"permissions":["run.routes.invoke","run.services.get","run.services.update","run.services.setIamPolicy"]}'
          python -m json.tool deployment/cloud-run-test-iam.json || true
          exit 0

      - name: Upload sanitized platform diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-cloud-platform-policy-diagnostics
          path: |
            deployment/cloud-platform-run-v2.json
            deployment/cloud-platform-policy.txt
            deployment/cloud-run-log-summary.json
            deployment/cloud-route-network.txt
            deployment/cloud-run-test-iam.json
          if-no-files-found: warn
          retention-days: 7
