name: HealthIA ONE live product film V5 probe 2026-08-19

on:
  push:
    branches: [kira/live-product-film-20260819]
    paths:
      - ".github/workflows/live-product-film-v5-probe-20260819.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/live-product-film-20260819
          fetch-depth: 0
      - name: Wait for exact V5 run and publish status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: d67eb6ac9fb2b3d30cdbff8453a6b666a508537b
        shell: bash
        run: |
          set -euo pipefail
          run=''
          for _ in $(seq 1 120); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow live-product-film-v5-20260819.yml --branch kira/live-product-film-20260819 --limit 20 --json databaseId,headSha,status,conclusion,url,createdAt)"
            run="$(jq -c --arg sha "$TARGET_SHA" '[.[] | select(.headSha==$sha)][0] // empty' <<<"$runs")"
            if [[ -n "$run" ]]; then
              status="$(jq -r '.status' <<<"$run")"
              [[ "$status" == completed ]] && break
            fi
            sleep 20
          done
          test -n "$run"
          mkdir -p hackathon
          jq -n --arg target "$TARGET_SHA" --argjson run "$run" '{target_sha:$target,run:$run,observed_at:(now|todate)}' > hackathon/live_product_film_v5_probe_20260819.json
          git config user.name "healthia-v5-probe"
          git config user.email "actions@users.noreply.github.com"
          git add hackathon/live_product_film_v5_probe_20260819.json
          git commit -m "film: record V5 workflow status" || exit 0
          git push origin HEAD:kira/live-product-film-20260819
