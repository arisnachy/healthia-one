name: Cloud canonical URL strict proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: healthia-cloud-canonical-strict-proof
  cancel-in-progress: true

jobs:
  verify-existing-cloud:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-demo
      BUCKET_NAME: healthia-6088a-healthia-evidence
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verifier dependencies from exact candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Resolve deterministic Cloud Run URL and revision
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          project_number="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          reported_url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          if [ -z "$project_number" ] || [ -z "$revision" ]; then
            echo "::error::Cloud Run deterministic URL inputs are missing"
            exit 1
          fi
          canonical_url="https://${SERVICE_NAME}-${project_number}.${REGION}.run.app"
          echo "url=$canonical_url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "reported_url=$reported_url" >> "$GITHUB_OUTPUT"
          echo "Cloud Run canonical URL: $canonical_url"
          echo "Cloud Run API-reported URL: $reported_url"
          echo "Cloud Run revision: $revision"

      - name: Mint audience-bound ID token and verify health
        id: authcheck
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud auth print-identity-token --audiences='${{ steps.cloud.outputs.url }}')"
          if [ -z "$token" ]; then
            echo "::error::Could not mint an audience-bound Cloud Run ID token"
            exit 1
          fi
          code="$(curl -sS -o /tmp/healthia-health.json -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            '${{ steps.cloud.outputs.url }}/healthz')"
          echo "HTTP $code"
          cat /tmp/healthia-health.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Canonical Cloud Run health check failed with HTTP $code"
            exit 1
          fi
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Execute strict Cloud Run + Vertex + Firestore + GCS proof
        shell: bash
        run: |
          set -euo pipefail
          python deployment/verify_cloud_demo.py \
            --url '${{ steps.cloud.outputs.url }}' \
            --project "$PROJECT_ID" \
            --bucket "$BUCKET_NAME" \
            --identity-token '${{ steps.authcheck.outputs.token }}' \
            --json | tee deployment/cloud-proof-latest.json

      - name: Capture sanitized canonical Cloud evidence
        if: always()
        env:
          CLOUD_URL: ${{ steps.cloud.outputs.url }}
          REPORTED_URL: ${{ steps.cloud.outputs.reported_url }}
          REVISION: ${{ steps.cloud.outputs.revision }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "project": os.environ.get("PROJECT_ID", ""),
              "region": os.environ.get("REGION", ""),
              "service": os.environ.get("SERVICE_NAME", ""),
              "canonical_url": os.environ.get("CLOUD_URL", ""),
              "api_reported_url": os.environ.get("REPORTED_URL", ""),
              "latest_ready_revision": os.environ.get("REVISION", ""),
              "candidate_sha": os.environ.get("CANDIDATE_SHA", ""),
              "model": "gemini-3.5-flash",
              "vertex_adc": True,
              "gemini_api_key_used": False,
          }
          Path("deployment/cloud-canonical-runtime-evidence.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          PY

      - name: Upload sanitized strict-proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-cloud-canonical-strict-proof
          path: |
            deployment/cloud-canonical-runtime-evidence.json
            deployment/cloud-proof-latest.json
          if-no-files-found: warn
          retention-days: 14
