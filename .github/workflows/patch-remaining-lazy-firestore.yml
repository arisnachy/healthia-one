name: HealthIA guarded remaining lazy Firestore patch

on:
  push:
    branches:
      - kira/architecture-100-20260821
    paths:
      - scripts/patch_remaining_lazy_firestore.py
      - .github/workflows/patch-remaining-lazy-firestore.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply exact-anchor patch
        run: python scripts/patch_remaining_lazy_firestore.py
      - name: Verify scope and syntax
        run: |
          python -m compileall -q healthia_one
          git diff --check
          git diff -- healthia_one/autopilot_claims.py healthia_one/autopilot_events.py healthia_one/autopilot_receipts.py healthia_one/gmail_mission_events.py healthia_one/guardian_email_reply.py healthia_one/opportunity_permissions.py healthia_one/opportunity_store.py healthia_one/program_source_verifier.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "healthia-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add healthia_one/autopilot_claims.py healthia_one/autopilot_events.py healthia_one/autopilot_receipts.py healthia_one/gmail_mission_events.py healthia_one/guardian_email_reply.py healthia_one/opportunity_permissions.py healthia_one/opportunity_store.py healthia_one/program_source_verifier.py
          git commit -m "architecture: make remaining Firestore workers lazy"
          git push origin HEAD:kira/architecture-100-20260821
