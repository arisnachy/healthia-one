name: Final Devpost Taskmaster demo

on:
  push:
    branches:
      - feature/patient-education-video-20260813
    paths:
      - ".github/final-taskmaster-demo-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthia-final-devpost-taskmaster
  cancel-in-progress: true

jobs:
  final-taskmaster-demo:
    name: Build final HealthIA ONE Devpost master
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-final-devpost
      BUCKET_NAME: healthia-6088a-healthia-evidence
      BUILD_SA: projects/healthia-6088a/serviceAccounts/healthia-one-build@healthia-6088a.iam.gserviceaccount.com
      RUNTIME_SA: healthia-one-demo@healthia-6088a.iam.gserviceaccount.com
      NARRATION_MODEL: gemini-2.5-pro-tts
      NARRATION_VOICE: Charon
      NARRATION_LANGUAGE: en-US

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prove exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${GITHUB_SHA}"
          echo "HEALTHIA_EXACT_HEAD_PASS $actual"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify Google prerequisites
        shell: bash
        run: |
          set -euo pipefail
          enabled="$(gcloud services list --project "$PROJECT_ID" --enabled --format='value(config.name)')"
          grep -Fxq 'run.googleapis.com' <<<"$enabled"
          grep -Fxq 'aiplatform.googleapis.com' <<<"$enabled"
          grep -Fxq 'texttospeech.googleapis.com' <<<"$enabled"

      - name: Deploy exact commit to temporary private Cloud Run
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE_NAME" \
            --source . \
            --build-service-account "$BUILD_SA" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --min 0 \
            --max 1 \
            --concurrency 20 \
            --cpu 1 \
            --memory 512Mi \
            --timeout 600 \
            --set-env-vars "HEALTHIA_ENV=cloud,HEALTHIA_LLM_BACKEND=gemini_api,HEALTHIA_MODEL=gemini-3.5-flash,HEALTHIA_STORE_BACKEND=firestore,HEALTHIA_AUTH_REQUIRED=true,HEALTHIA_ALLOW_REGISTRATION=true,HEALTHIA_COST_MODE=cloud_demo,HEALTHIA_AI_REQUEST_LIMIT=24,HEALTHIA_COST_GUARD_START_ENABLED=true,HEALTHIA_COST_CONTROL_UI=false,HEALTHIA_AI_MAX_OUTPUT_TOKENS=1400,HEALTHIA_PROACTIVE_ENABLED=false,HEALTHIA_GCS_BUCKET=${BUCKET_NAME},HEALTHIA_EDUCATION_MEDIA_ENABLED=true,HEALTHIA_EDUCATION_TTS_MODEL=gemini-2.5-pro-tts,HEALTHIA_EDUCATION_TTS_VOICE=Charon,HEALTHIA_EDUCATION_VEO_ENABLED=true,HEALTHIA_EDUCATION_VEO_MODEL=veo-3.1-fast-generate-001,HEALTHIA_EDUCATION_VEO_WAIT_SECONDS=90,GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global" \
            --set-secrets "HEALTHIA_DEVICE_TOKEN_SECRET=healthia-device-token-secret:latest,HEALTHIA_SESSION_SECRET=healthia-session-secret:latest" \
            --no-allow-unauthenticated \
            --quiet

      - name: Bind recorder to exact deployed revision
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          image="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          token="$(gcloud auth print-identity-token --audiences="$url")"
          test -n "$url" && test -n "$revision" && test -n "$image" && test -n "$token"
          echo "::add-mask::$token"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install recorder and media tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Record live Taskmaster application path
        env:
          HEALTHIA_CLOUD_URL: ${{ steps.cloud.outputs.url }}
          HEALTHIA_CLOUD_ID_TOKEN: ${{ steps.cloud.outputs.token }}
          HEALTHIA_CLOUD_REVISION: ${{ steps.cloud.outputs.revision }}
          HEALTHIA_CLOUD_IMAGE: ${{ steps.cloud.outputs.image }}
          HEALTHIA_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          HEALTHIA_CLOUD_REGION: ${{ env.REGION }}
          HEALTHIA_CANDIDATE_SHA: ${{ github.sha }}
        run: python scripts/record_final_live_english_demo.py

      - name: Generate natural male Gemini narration
        shell: bash
        run: |
          set -euo pipefail
          base=dist/final-live-english-demo
          mkdir -p "$base/audio"
          GOOGLE_CLOUD_PROJECT="$PROJECT_ID" python scripts/synthesize_gemini_demo_narration.py \
            --input docs/FINAL_DEMO_NARRATION_EN.txt \
            --output "$base/audio/narration.wav" \
            --project "$PROJECT_ID" \
            --language-code "$NARRATION_LANGUAGE" \
            --voice "$NARRATION_VOICE" \
            --model "$NARRATION_MODEL" \
            --style "Narrate in natural English with a warm adult male voice. Sound calm, grounded, intelligent and reassuring, like a thoughtful physician-engineer explaining a real healthcare product to judges. Use a medium-low pitch, natural pauses, clear articulation and a relaxed conversational rhythm. Never sound like an announcer, advertisement, synthetic assistant or dramatic trailer."

      - name: Build narrated master under four minutes
        shell: bash
        run: |
          set -euo pipefail
          base=dist/final-live-english-demo
          mkdir -p "$base/master"
          raw="$(find "$base/video" -type f -name '*.webm' -print -quit)"
          test -n "$raw"
          test -s "$base/audio/narration.wav"
          raw_duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$raw")"
          narration_duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$base/audio/narration.wav")"
          read video_factor audio_speed target < <(python - "$raw_duration" "$narration_duration" <<'PY'
          import sys
          raw=float(sys.argv[1]); narration=float(sys.argv[2])
          if raw <= 0 or narration <= 0:
              raise SystemExit('invalid live-video or narration duration')
          target=min(235.0, max(205.0, raw*1.45))
          video_factor=target/raw
          audio_speed=narration/max(1.0, target-1.0)
          if not 0.5 <= audio_speed <= 2.0:
              raise SystemExit(f'audio speed outside ffmpeg atempo range: {audio_speed:.4f}')
          print(f"{video_factor:.8f} {audio_speed:.8f} {target:.3f}")
          PY
          )
          echo "CINE_TIMING raw=${raw_duration}s narration=${narration_duration}s target=${target}s"
          ffmpeg -hide_banner -loglevel error -y -i "$base/audio/narration.wav" \
            -af "atempo=${audio_speed},loudnorm=I=-16:LRA=7:TP=-1.5,apad" -t "$target" \
            -c:a aac -ar 48000 -b:a 160k "$base/master/narration-master.m4a"
          ffmpeg -hide_banner -loglevel error -y -i "$raw" \
            -vf "setpts=${video_factor}*PTS" -an -c:v libx264 -preset veryfast -crf 21 \
            -pix_fmt yuv420p -movflags +faststart "$base/master/video-master.mp4"
          ffmpeg -hide_banner -loglevel error -y \
            -i "$base/master/video-master.mp4" -i "$base/master/narration-master.m4a" \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a copy -t "$target" -movflags +faststart \
            "$base/HealthIA-ONE-Gemini-Taskmaster-final.mp4"

      - name: CUTLOCK final Devpost master
        shell: bash
        run: |
          set -euo pipefail
          final=dist/final-live-english-demo/HealthIA-ONE-Gemini-Taskmaster-final.mp4
          report=dist/final-live-english-demo/report.json
          narration_meta=dist/final-live-english-demo/audio/narration.wav.json
          test -s "$final" && test -s "$report" && test -s "$narration_meta"
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$final")"
          audio_streams="$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$final" | wc -l | tr -d ' ')"
          video_streams="$(ffprobe -v error -select_streams v -show_entries stream=index -of csv=p=0 "$final" | wc -l | tr -d ' ')"
          python - "$duration" "$audio_streams" "$video_streams" "$report" "$narration_meta" <<'PY'
          import json, sys
          duration=float(sys.argv[1]); audio_streams=int(sys.argv[2]); video_streams=int(sys.argv[3])
          report=json.load(open(sys.argv[4], encoding='utf-8'))
          narration=json.load(open(sys.argv[5], encoding='utf-8'))
          if not 180 <= duration < 240:
              raise SystemExit(f'final demo must be 3-4 minutes and under four minutes: {duration:.2f}s')
          if audio_streams < 1 or video_streams < 1:
              raise SystemExit('final demo must contain video and audio')
          if narration.get('provider') != 'Google Cloud Gemini TTS' or narration.get('model') != 'gemini-2.5-pro-tts' or narration.get('voice') != 'Charon':
              raise SystemExit(f'wrong narration contract: {narration}')
          if report.get('status') != 'PASS':
              raise SystemExit(f"recorder report is not PASS: {report}")
          if report.get('live_app_only') is not True or report.get('static_screenshots_used') is not False:
              raise SystemExit('demo is not certified live-app-only')
          required={
              'exact_candidate_live_google_runtime',
              'results_workspace_opened',
              'multimodal_original_result_and_provenance',
              'english_multimodal_result_explanation',
              'explicit_current_topic_overrides_stale_context',
              'assistant_mission_link_matches_persisted_taskmaster',
              'taskmaster_mission_completed_from_persisted_evidence',
              'healthia_explain_private_video_completed',
              'healthia_explain_gemini_tts_narration',
              'healthia_explain_video_playback',
              'logout_login_durable_continuity',
              'visible_exact_candidate_cloud_proof',
              'zero_browser_console_or_page_errors',
          }
          missing=required-set(report.get('checks') or [])
          if missing:
              raise SystemExit(f'missing demo gates: {sorted(missing)}')
          print(f'HEALTHIA_FINAL_DEVPOST_CUTLOCK_PASS duration={duration:.2f}s narration=Gemini-TTS-Charon')
          PY
          sha256sum "$final" | tee dist/final-live-english-demo/final-video.sha256

      - name: Upload final Devpost judge artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-ONE-FINAL-DEVPOST-TASKMASTER
          path: dist/final-live-english-demo
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary Cloud Run service
        if: always()
        shell: bash
        run: |
          gcloud run services delete "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --quiet || true
