name: Cloud revision reconnect continuity proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: healthia-cloud-revision-continuity-proof
  cancel-in-progress: true

jobs:
  revision-continuity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-judge
      BUCKET_NAME: healthia-6088a-healthia-evidence
      STATE_FILE: /tmp/healthia-revision-proof-private.json
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact candidate proof dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Resolve current service and prepare durable synthetic state
        id: before
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          token="$(gcloud auth print-identity-token --audiences="$url")"
          echo "::add-mask::$token"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          python deployment/verify_cloud_revision_continuity.py prepare \
            --url "$url" --project "$PROJECT_ID" --bucket "$BUCKET_NAME" \
            --identity-token "$token" --state-file "$STATE_FILE" --before-revision "$revision"
          test -s "$STATE_FILE"
          chmod 600 "$STATE_FILE"
      - name: Force a new Cloud Run revision without changing durable resources
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          marker="revision-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud run services update "$SERVICE_NAME" \
            --project "$PROJECT_ID" --region "$REGION" \
            --update-env-vars "HEALTHIA_REVISION_PROOF=${marker}" --quiet >/dev/null
          after="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          before='${{ steps.before.outputs.revision }}'
          echo "Before revision: $before"
          echo "After revision:  $after"
          test -n "$after" && test "$after" != "$before"
          echo "revision=$after" >> "$GITHUB_OUTPUT"
          echo "marker=$marker" >> "$GITHUB_OUTPUT"
      - name: Reconnect from a fresh client and verify durable A/B boundaries
        id: after
        shell: bash
        run: |
          set -euo pipefail
          url='${{ steps.before.outputs.url }}'
          token="$(gcloud auth print-identity-token --audiences="$url")"
          echo "::add-mask::$token"
          code=000
          for i in {1..30}; do
            code="$(curl -sS -o /tmp/readiness-after.json -w '%{http_code}' -H "Authorization: Bearer ${token}" "$url/api/readiness" || true)"
            echo "new-revision readiness attempt=$i HTTP=$code"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          python deployment/verify_cloud_revision_continuity.py verify \
            --url "$url" --project "$PROJECT_ID" --bucket "$BUCKET_NAME" \
            --identity-token "$token" --state-file "$STATE_FILE" \
            --after-revision '${{ steps.revision.outputs.revision }}' \
            --evidence-file deployment/cloud-revision-continuity-latest.json
          rm -f "$STATE_FILE"
          echo "private_state_removed=true" >> "$GITHUB_OUTPUT"
      - name: Capture sanitized revision metadata
        if: always()
        env:
          BEFORE_REVISION: ${{ steps.before.outputs.revision }}
          AFTER_REVISION: ${{ steps.revision.outputs.revision }}
          REVISION_MARKER: ${{ steps.revision.outputs.marker }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          PRIVATE_STATE_REMOVED: ${{ steps.after.outputs.private_state_removed }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload={'project':'healthia-6088a','region':'us-central1','service':'healthia-one-judge','before_revision':os.environ.get('BEFORE_REVISION',''),'after_revision':os.environ.get('AFTER_REVISION',''),'revision_marker':os.environ.get('REVISION_MARKER',''),'candidate_sha':os.environ.get('CANDIDATE_SHA',''),'private_state_removed':os.environ.get('PRIVATE_STATE_REMOVED') == 'true','durable_backends':['firestore','gcs'],'model':'gemini-3.5-flash'}
          Path('deployment/cloud-revision-runtime-evidence.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          PY
          rm -f "$STATE_FILE"
      - name: Upload sanitized revision/reconnect evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-cloud-revision-continuity-proof
          path: |
            deployment/cloud-revision-continuity-latest.json
            deployment/cloud-revision-runtime-evidence.json
          if-no-files-found: warn
          retention-days: 14
