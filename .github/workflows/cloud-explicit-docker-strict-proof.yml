name: Cloud explicit Docker strict proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: healthia-cloud-explicit-docker-strict-proof
  cancel-in-progress: true

jobs:
  explicit-docker-proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      VERTEX_LOCATION: global
      FINAL_SERVICE: healthia-one-final
      RUNTIME_SA: healthia-one-demo@healthia-6088a.iam.gserviceaccount.com
      BUCKET_NAME: healthia-6088a-healthia-evidence
      AR_REPO: cloud-run-source-deploy
      PROVISION_PRINCIPAL: healthia-github-vertex-9@healthia-6088a.iam.gserviceaccount.com
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a

      - name: Build exact Dockerfile locally
        id: build
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          local_image="healthia-one-explicit:${short_sha}"
          remote_image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/healthia-one-explicit:${short_sha}"
          docker build --pull --no-cache -t "$local_image" .
          echo "local_image=$local_image" >> "$GITHUB_OUTPUT"
          echo "remote_image=$remote_image" >> "$GITHUB_OUTPUT"
          docker image inspect "$local_image" --format='image_id={{.Id}} cmd={{json .Config.Cmd}} entrypoint={{json .Config.Entrypoint}} env={{json .Config.Env}}'

      - name: Prove the built container locally before Cloud
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run -d -p 18080:8080 '${{ steps.build.outputs.local_image }}')"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          code=000
          for i in {1..30}; do
            code="$(curl -sS -o /tmp/local-health.json -w '%{http_code}' http://127.0.0.1:18080/healthz || true)"
            echo "local attempt=$i HTTP=$code"
            if [ "$code" = 200 ]; then
              cat /tmp/local-health.json
              echo
              docker logs "$cid" 2>&1 | tail -n 40
              exit 0
            fi
            if ! docker ps --format '{{.ID}}' | grep -qx "$cid"; then
              echo "::error::Explicit Docker image exited before local health became ready"
              docker logs "$cid" 2>&1 || true
              exit 1
            fi
            sleep 1
          done
          echo "::error::Explicit Docker image did not pass local /healthz"
          docker logs "$cid" 2>&1 || true
          exit 1

      - name: Temporarily grant only image-push and Cloud Run administration
        run: |
          set -euo pipefail
          for role in roles/artifactregistry.writer roles/run.admin; do
            gcloud projects add-iam-policy-binding "$PROJECT_ID" \
              --member="serviceAccount:${PROVISION_PRINCIPAL}" \
              --role="$role" --condition=None --quiet >/dev/null
          done

      - name: Push explicit image to Artifact Registry
        id: push
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet >/dev/null
          docker tag '${{ steps.build.outputs.local_image }}' '${{ steps.build.outputs.remote_image }}'
          docker push '${{ steps.build.outputs.remote_image }}'
          digest="$(gcloud artifacts docker images describe '${{ steps.build.outputs.remote_image }}' --format='value(image_summary.digest)' 2>/dev/null || true)"
          if [ -z "$digest" ]; then
            digest="$(docker inspect --format='{{index .RepoDigests 0}}' '${{ steps.build.outputs.remote_image }}' | sed 's/.*@//')"
          fi
          if [[ "$digest" != sha256:* ]]; then
            echo "::error::Could not resolve pushed immutable digest: '$digest'"
            exit 1
          fi
          immutable="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/healthia-one-explicit@${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "immutable=$immutable" >> "$GITHUB_OUTPUT"
          echo "Explicit immutable image: $immutable"

      - name: Deploy minimal fresh service from explicit image
        id: minimal
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$FINAL_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image '${{ steps.push.outputs.immutable }}' \
            --min 0 --max 1 \
            --no-invoker-iam-check \
            --quiet >/dev/null
          token="$(gcloud auth print-access-token)"
          curl -fsSL -H "Authorization: Bearer ${token}" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${FINAL_SERVICE}" > /tmp/minimal.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/minimal.json'))
          print('urls=', d.get('urls'))
          print('revision=', d.get('latestReadyRevision'))
          print('ready=', (d.get('terminalCondition') or {}).get('state'))
          print('image=', (((d.get('template') or {}).get('containers') or [{}])[0]).get('image'))
          PY
          python - <<'PY' > /tmp/urls.txt
          import json
          d=json.load(open('/tmp/minimal.json'))
          print('\n'.join(d.get('urls') or [d.get('uri','')]))
          PY
          success_url=""
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            for i in {1..15}; do
              code="$(curl -sS -o /tmp/cloud-health.json -w '%{http_code}' "$url/healthz" || true)"
              echo "minimal url=$url attempt=$i HTTP=$code"
              if [ "$code" = 200 ]; then
                success_url="$url"
                break 2
              fi
              sleep 2
            done
          done < /tmp/urls.txt
          if [ -z "$success_url" ]; then
            echo "::error::Explicit Docker image passed locally but still did not route on Cloud Run"
            exit 1
          fi
          echo "url=$success_url" >> "$GITHUB_OUTPUT"
          echo "EXPLICIT_DOCKER_CLOUD_ROUTE_OK url=$success_url"

      - name: Upgrade same service to full HealthIA Cloud runtime
        id: full
        shell: bash
        run: |
          set -euo pipefail
          env_vars="HEALTHIA_ENV=cloud,HEALTHIA_LLM_BACKEND=gemini_api,HEALTHIA_MODEL=gemini-3.5-flash,HEALTHIA_STORE_BACKEND=firestore,HEALTHIA_AUTH_REQUIRED=true,HEALTHIA_ALLOW_REGISTRATION=true,HEALTHIA_COST_MODE=cloud_demo,HEALTHIA_AI_REQUEST_LIMIT=20,HEALTHIA_COST_GUARD_START_ENABLED=true,HEALTHIA_COST_CONTROL_UI=false,HEALTHIA_AI_MAX_OUTPUT_TOKENS=1400,HEALTHIA_PROACTIVE_ENABLED=false,HEALTHIA_GCS_BUCKET=${BUCKET_NAME},GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${VERTEX_LOCATION}"
          before="$(gcloud run services describe "$FINAL_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          gcloud run services update "$FINAL_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --concurrency 20 --cpu 1 --memory 512Mi --timeout 600 \
            --update-env-vars "$env_vars" \
            --set-secrets 'HEALTHIA_DEVICE_TOKEN_SECRET=healthia-device-token-secret:latest,HEALTHIA_SESSION_SECRET=healthia-session-secret:latest' \
            --no-invoker-iam-check \
            --quiet >/dev/null
          after="$(gcloud run services describe "$FINAL_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          if [ -z "$after" ] || [ "$after" = "$before" ]; then
            echo "::error::Full runtime update did not produce a new Ready revision"
            exit 1
          fi
          echo "minimal_revision=$before" >> "$GITHUB_OUTPUT"
          echo "full_revision=$after" >> "$GITHUB_OUTPUT"
          echo "url=${{ steps.minimal.outputs.url }}" >> "$GITHUB_OUTPUT"
          for i in {1..20}; do
            code="$(curl -sS -o /tmp/full-health.json -w '%{http_code}' '${{ steps.minimal.outputs.url }}/healthz' || true)"
            echo "full-runtime attempt=$i HTTP=$code"
            if [ "$code" = 200 ]; then
              cat /tmp/full-health.json
              echo
              exit 0
            fi
            sleep 2
          done
          echo "::error::Route regressed after full HealthIA runtime configuration"
          exit 1

      - name: Set up Python for strict verifier
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact candidate verifier
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Execute strict Cloud Run + Vertex + Firestore + GCS proof
        shell: bash
        run: |
          set -euo pipefail
          python deployment/verify_cloud_demo.py \
            --url '${{ steps.full.outputs.url }}' \
            --project "$PROJECT_ID" \
            --bucket "$BUCKET_NAME" \
            --json | tee deployment/cloud-proof-latest.json

      - name: Capture sanitized explicit-image evidence
        if: always()
        env:
          CLOUD_URL: ${{ steps.full.outputs.url }}
          MINIMAL_REVISION: ${{ steps.full.outputs.minimal_revision }}
          FULL_REVISION: ${{ steps.full.outputs.full_revision }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.push.outputs.immutable }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload={
            'project': os.environ.get('PROJECT_ID',''),
            'region': os.environ.get('REGION',''),
            'service': os.environ.get('FINAL_SERVICE',''),
            'url': os.environ.get('CLOUD_URL',''),
            'minimal_revision': os.environ.get('MINIMAL_REVISION',''),
            'full_revision': os.environ.get('FULL_REVISION',''),
            'image_digest': os.environ.get('IMAGE_DIGEST',''),
            'image': os.environ.get('IMAGE',''),
            'candidate_sha': os.environ.get('CANDIDATE_SHA',''),
            'explicit_docker_build': True,
            'local_health_proven_before_push': True,
            'model': 'gemini-3.5-flash',
            'vertex_adc': True,
            'firestore': True,
            'private_gcs': True,
            'application_auth_required': True,
          }
          Path('deployment/cloud-explicit-docker-evidence.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          PY

      - name: Remove temporary provisioning roles
        if: always()
        run: |
          for role in roles/artifactregistry.writer roles/run.admin; do
            gcloud projects remove-iam-policy-binding "$PROJECT_ID" \
              --member="serviceAccount:${PROVISION_PRINCIPAL}" \
              --role="$role" --condition=None --quiet >/dev/null || true
          done

      - name: Upload explicit Docker strict-proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-cloud-explicit-docker-strict-proof
          path: |
            deployment/cloud-explicit-docker-evidence.json
            deployment/cloud-proof-latest.json
          if-no-files-found: warn
          retention-days: 14
