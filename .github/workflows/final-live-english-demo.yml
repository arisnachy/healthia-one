name: Final live English hackathon demo

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "healthia_one/**"
      - "web/**"
      - "healthia_agent/**"
      - "scripts/record_final_wave4_winner_demo.py"
      - "scripts/final_wave4_winner_narration.txt"
      - ".github/workflows/final-live-english-demo.yml"
      - "docs/HACKATHON_WIN_PLAN.md"
      - "tests/test_google_mission_location_consent.py"
      - "tests/test_google_mission_conversation_autonomy.py"
      - "tests/test_wave4_resource_ui.py"
      - "tests/test_final_wave4_winner_demo_contract.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: healthia-final-live-demo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-candidate-live-demo:
    name: Deploy exact candidate and record Wave 4 winner demo
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-final-video
      BUCKET_NAME: healthia-6088a-healthia-evidence
      MAPS_SECRET_NAME: healthia-google-maps-api-key
      BUILD_SA: projects/healthia-6088a/serviceAccounts/healthia-one-build@healthia-6088a.iam.gserviceaccount.com
      RUNTIME_SA: healthia-one-demo@healthia-6088a.iam.gserviceaccount.com
      RELEASE_TAG: healthia-one-wave4-winner-demo-2026
      RELEASE_ASSET: HealthIA-ONE-Wave4-Taskmaster-winner.mp4

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove checked-out SHA is the candidate SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "HEALTHIA_EXACT_HEAD_PASS $actual"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Require existing Google Maps secret
        shell: bash
        run: |
          set -euo pipefail
          state="$(gcloud secrets versions describe latest \
            --secret "$MAPS_SECRET_NAME" \
            --project "$PROJECT_ID" \
            --format='value(state)')"
          test "$state" = "ENABLED"
          echo "HEALTHIA_WINNER_MAPS_SECRET_PASS"

      - name: Deploy this exact commit to temporary private Cloud Run service
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE_NAME" \
            --source . \
            --build-service-account "$BUILD_SA" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --min 0 \
            --max 1 \
            --concurrency 20 \
            --cpu 1 \
            --memory 512Mi \
            --timeout 600 \
            --set-env-vars "HEALTHIA_ENV=cloud,HEALTHIA_LLM_BACKEND=gemini_api,HEALTHIA_MODEL=gemini-3.5-flash,HEALTHIA_STORE_BACKEND=firestore,HEALTHIA_AUTH_REQUIRED=true,HEALTHIA_ALLOW_REGISTRATION=true,HEALTHIA_COST_MODE=cloud_demo,HEALTHIA_AI_REQUEST_LIMIT=20,HEALTHIA_COST_GUARD_START_ENABLED=true,HEALTHIA_COST_CONTROL_UI=false,HEALTHIA_AI_MAX_OUTPUT_TOKENS=1400,HEALTHIA_PROACTIVE_ENABLED=false,HEALTHIA_GCS_BUCKET=${BUCKET_NAME},GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global" \
            --set-secrets "HEALTHIA_DEVICE_TOKEN_SECRET=healthia-device-token-secret:latest,HEALTHIA_SESSION_SECRET=healthia-session-secret:latest,GOOGLE_MAPS_API_KEY=${MAPS_SECRET_NAME}:latest" \
            --no-allow-unauthenticated \
            --quiet

      - name: Bind recorder to exact deployed revision
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          image="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          token="$(gcloud auth print-identity-token --audiences="$url")"
          test -n "$url" && test -n "$revision" && test -n "$image" && test -n "$token"
          echo "::add-mask::$token"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "HEALTHIA_EXACT_REVISION_BOUND $revision"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install recorder and media tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg flite jq
          ffmpeg -version | head -n 1

      - name: Record continuous Wave 4 live application demo
        env:
          HEALTHIA_CLOUD_URL: ${{ steps.cloud.outputs.url }}
          HEALTHIA_CLOUD_ID_TOKEN: ${{ steps.cloud.outputs.token }}
          HEALTHIA_CLOUD_REVISION: ${{ steps.cloud.outputs.revision }}
          HEALTHIA_CLOUD_IMAGE: ${{ steps.cloud.outputs.image }}
          HEALTHIA_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          HEALTHIA_CLOUD_REGION: ${{ env.REGION }}
          HEALTHIA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/record_final_wave4_winner_demo.py

      - name: Build new narrated winner master
        shell: bash
        run: |
          set -euo pipefail
          base=dist/final-live-english-demo
          mkdir -p "$base/audio" "$base/master"

          # Prefer the already-enabled authenticated Google Cloud TTS path for a
          # polished English voice. Never enable an API or mutate IAM here. If the
          # API is unavailable, fall back to local flite so the evidence workflow
          # remains deterministic and zero-purchase.
          narration="$base/audio/narration.wav"
          source_label="flite-fallback"
          enabled="$(gcloud services list --project "$PROJECT_ID" --enabled --format='value(config.name)')"
          if grep -qx 'texttospeech.googleapis.com' <<<"$enabled"; then
            access_token="$(gcloud auth print-access-token)"
            request="$base/audio/tts-request.json"
            response="$base/audio/tts-response.json"
            python - "$request" <<'PY'
          import json, pathlib, sys
          text=pathlib.Path('scripts/final_wave4_winner_narration.txt').read_text(encoding='utf-8')
          payload={
              'input': {'text': text},
              'voice': {'languageCode': 'en-US', 'ssmlGender': 'FEMALE'},
              'audioConfig': {'audioEncoding': 'MP3', 'speakingRate': 0.98, 'pitch': 0.0},
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(payload), encoding='utf-8')
          PY
            status="$(curl -sS -o "$response" -w '%{http_code}' \
              -X POST 'https://texttospeech.googleapis.com/v1/text:synthesize' \
              -H "Authorization: Bearer ${access_token}" \
              -H 'Content-Type: application/json' \
              --data-binary "@$request")"
            if [[ "$status" == "200" ]] && [[ -n "$(jq -r '.audioContent // empty' "$response")" ]]; then
              jq -r '.audioContent' "$response" | base64 -d > "$base/audio/narration-google.mp3"
              ffmpeg -hide_banner -loglevel error -y -i "$base/audio/narration-google.mp3" -c:a pcm_s16le "$narration"
              source_label="google-cloud-tts"
            fi
            rm -f "$request" "$response"
          fi

          if [[ ! -s "$narration" ]]; then
            if flite -lv 2>&1 | grep -qw slt; then voice=slt; else voice=kal; fi
            flite -voice "$voice" -f scripts/final_wave4_winner_narration.txt -o "$narration"
            source_label="flite-fallback"
          fi
          printf '%s\n' "$source_label" > "$base/narration-source.txt"
          echo "HEALTHIA_NARRATION_SOURCE=$source_label"

          raw="$(find "$base/video" -type f -name '*.webm' -print -quit)"
          test -n "$raw"
          raw_duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$raw")"
          narration_duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$narration")"

          read video_factor audio_speed target < <(python - "$raw_duration" "$narration_duration" <<'PY'
          import sys
          raw=float(sys.argv[1])
          narration=float(sys.argv[2])
          if raw <= 0 or narration <= 0:
              raise SystemExit('invalid live-video or narration duration')
          target=max(170.0, raw*1.22, narration+2.0)
          target=min(225.0, target)
          video_factor=target/raw
          audio_target=max(1.0, target-1.0)
          audio_speed=narration/audio_target
          if not 0.5 <= audio_speed <= 2.0:
              raise SystemExit(f'audio speed outside ffmpeg atempo range: {audio_speed:.4f}')
          if not 0.45 <= video_factor <= 2.50:
              raise SystemExit(f'video retiming would be visually unsafe: {video_factor:.4f}')
          print(f"{video_factor:.8f} {audio_speed:.8f} {target:.3f}")
          PY
          )
          echo "WINNER_TIMING raw=${raw_duration}s narration=${narration_duration}s target=${target}s video_factor=${video_factor} audio_speed=${audio_speed}"

          ffmpeg -hide_banner -loglevel error -y \
            -i "$narration" \
            -af "atempo=${audio_speed},loudnorm=I=-16:LRA=7:TP=-1.5,apad" -t "$target" \
            -c:a aac -b:a 160k "$base/master/narration-master.m4a"

          ffmpeg -hide_banner -loglevel error -y \
            -i "$raw" \
            -vf "setpts=${video_factor}*PTS" -an \
            -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p \
            -movflags +faststart "$base/master/video-master.mp4"

          ffmpeg -hide_banner -loglevel error -y \
            -i "$base/master/video-master.mp4" \
            -i "$base/master/narration-master.m4a" \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a copy \
            -t "$target" -movflags +faststart \
            "$base/$RELEASE_ASSET"

      - name: CUTLOCK — reject unsupported or weak winner demo
        shell: bash
        run: |
          set -euo pipefail
          final="dist/final-live-english-demo/$RELEASE_ASSET"
          report=dist/final-live-english-demo/report.json
          test -s "$final" && test -s "$report"
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$final")"
          audio_streams="$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$final" | wc -l | tr -d ' ')"
          video_streams="$(ffprobe -v error -select_streams v -show_entries stream=index -of csv=p=0 "$final" | wc -l | tr -d ' ')"
          python - "$duration" "$audio_streams" "$video_streams" "$report" <<'PY'
          import json, sys
          duration=float(sys.argv[1])
          audio_streams=int(sys.argv[2])
          video_streams=int(sys.argv[3])
          report=json.load(open(sys.argv[4], encoding='utf-8'))
          if not 160 <= duration <= 230:
              raise SystemExit(f'final Taskmaster demo must stay in the substantial competition window: {duration:.2f}s')
          if audio_streams < 1 or video_streams < 1:
              raise SystemExit('final demo must contain both continuous live video and English narration audio')
          if report.get('status') != 'PASS':
              raise SystemExit(f"recorder report is not PASS: {report}")
          if report.get('live_app_only') is not True or report.get('static_screenshots_used') is not False:
              raise SystemExit('demo is not certified as live-app-only')
          if int(report.get('candidate_count') or 0) < 2:
              raise SystemExit('winner demo did not prove at least two real resource candidates')
          if int(report.get('google_maps_uri_count') or 0) < 2:
              raise SystemExit('winner demo did not prove visible Google Maps-backed candidates')
          required={
              'exact_candidate_live_google_runtime',
              'zero_places_before_mission_scoped_consent',
              'same_durable_mission_resumed_after_consent',
              'real_google_places_candidates_visible',
              'exact_second_candidate_selected_without_model_interpretation',
              'multimodal_original_result_and_provenance',
              'logout_login_restores_evidence_and_selected_google_mission',
              'visible_exact_candidate_cloud_proof',
              'zero_browser_console_or_page_errors',
          }
          missing=required-set(report.get('checks') or [])
          if missing:
              raise SystemExit(f'missing winner demo gates: {sorted(missing)}')
          print(f'HEALTHIA_WINNER_CUTLOCK_PASS duration={duration:.2f}s candidates={report.get("candidate_count")} maps={report.get("google_maps_uri_count")}')
          PY
          sha256sum "$final" | tee dist/final-live-english-demo/final-video.sha256

      - name: Publish winner video as stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base=dist/final-live-english-demo
          final="$base/$RELEASE_ASSET"
          expected="$(awk '{print $1}' "$base/final-video.sha256")"
          notes="Continuous live-app Wave 4 Taskmaster judge demo. Exact source SHA: ${SOURCE_SHA}. GitHub Actions run: ${GITHUB_RUN_ID}. Proven gates: no Google Places candidates before mission-scoped consent; same durable mission resumes after consent; real Google Places candidates with Maps URIs; exact deterministic selection of candidate #2; multimodal original evidence provenance; logout/login continuity; zero browser console/page errors. Video SHA-256: ${expected}. Synthetic patient data only."
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title 'HealthIA ONE — Wave 4 Taskmaster Winner Demo' \
              --notes "$notes" \
              --latest=false
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title 'HealthIA ONE — Wave 4 Taskmaster Winner Demo' \
              --notes "$notes" \
              --latest=false
          fi
          gh release upload "$RELEASE_TAG" "$final" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Prove public winner video is anonymous and byte-identical
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base=dist/final-live-english-demo
          public_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${RELEASE_ASSET}"
          expected="$(awk '{print $1}' "$base/final-video.sha256")"
          curl --fail --location --silent --show-error "$public_url" -o /tmp/healthia-public-winner.mp4
          actual="$(sha256sum /tmp/healthia-public-winner.mp4 | awk '{print $1}')"
          test "$actual" = "$expected"
          PUBLIC_VIDEO_URL="$public_url" EXPECTED="$expected" ACTUAL="$actual" SOURCE_HEAD_SHA="$SOURCE_HEAD_SHA" python - <<'PY'
          import json, os, pathlib
          payload={
              'status':'PASS',
              'public_url':os.environ['PUBLIC_VIDEO_URL'],
              'anonymous_access':True,
              'byte_identical':os.environ['EXPECTED']==os.environ['ACTUAL'],
              'video_sha256':os.environ['EXPECTED'],
              'source_run_id':os.environ.get('GITHUB_RUN_ID',''),
              'source_sha':os.environ['SOURCE_HEAD_SHA'],
              'release_tag':os.environ.get('RELEASE_TAG',''),
          }
          pathlib.Path('dist/final-live-english-demo/public-video-proof.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          print(json.dumps(payload, indent=2))
          PY
          echo "HEALTHIA_PUBLIC_WINNER_VIDEO_PASS $public_url"

      - name: Upload exact-candidate Wave 4 winner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-ONE-Wave4-winner-demo
          path: dist/final-live-english-demo
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary Cloud Run video service
        if: always()
        shell: bash
        run: |
          gcloud run services delete "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --quiet || true
