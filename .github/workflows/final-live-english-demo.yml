name: Final live English hackathon demo

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "healthia_one/**"
      - "web/**"
      - "healthia_agent/**"
      - "scripts/record_final_wave4_winner_demo.py"
      - "scripts/final_wave4_winner_narration.txt"
      - ".github/workflows/final-live-english-demo.yml"
      - "docs/HACKATHON_WIN_PLAN.md"
      - "tests/test_google_mission_location_consent.py"
      - "tests/test_google_mission_conversation_autonomy.py"
      - "tests/test_wave4_resource_ui.py"
      - "tests/test_final_wave4_winner_demo_contract.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: healthia-final-live-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-candidate-live-demo:
    name: Deploy exact candidate and record Wave 4 winner demo
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-final-video
      JUDGE_SERVICE_NAME: healthia-one-final-judge-video
      BUCKET_NAME: healthia-6088a-healthia-evidence
      MAPS_SECRET_NAME: healthia-google-maps-api-key
      EVALUATION_SECRET_NAME: healthia-evaluation-access-key
      BUILD_SA: projects/healthia-6088a/serviceAccounts/healthia-one-build@healthia-6088a.iam.gserviceaccount.com
      RUNTIME_SA: healthia-one-demo@healthia-6088a.iam.gserviceaccount.com
      RELEASE_TAG: healthia-one-autonomous-winner-demo-2026
      RELEASE_ASSET: HealthIA-ONE-Autonomous-Taskmaster-Charon.mp4

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prove checked-out SHA is the candidate SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "HEALTHIA_EXACT_HEAD_PASS $actual"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Require existing Google Maps secret
        shell: bash
        run: |
          set -euo pipefail
          state="$(gcloud secrets versions describe latest \
            --secret "$MAPS_SECRET_NAME" \
            --project "$PROJECT_ID" \
            --format='value(state)')"
          test "$state" = "ENABLED"
          echo "HEALTHIA_WINNER_MAPS_SECRET_PASS"

      - name: Deploy this exact commit to temporary private Cloud Run service
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ github.sha }}"
          gcloud run deploy "$SERVICE_NAME" \
            --source . \
            --build-service-account "$BUILD_SA" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --min-instances 0 \
            --max-instances 1 \
            --concurrency 20 \
            --cpu 1 \
            --memory 512Mi \
            --timeout 600 \
            --set-env-vars "HEALTHIA_ENV=cloud,HEALTHIA_LLM_BACKEND=gemini_api,HEALTHIA_MODEL=gemini-3.5-flash,HEALTHIA_STORE_BACKEND=firestore,HEALTHIA_AUTH_REQUIRED=true,HEALTHIA_ALLOW_REGISTRATION=true,HEALTHIA_COST_MODE=cloud_demo,HEALTHIA_AI_REQUEST_LIMIT=20,HEALTHIA_COST_GUARD_START_ENABLED=true,HEALTHIA_COST_CONTROL_UI=false,HEALTHIA_AI_MAX_OUTPUT_TOKENS=1400,HEALTHIA_PROACTIVE_ENABLED=false,HEALTHIA_EVALUATION_ENABLED=true,HEALTHIA_EVALUATION_SESSION_MINUTES=30,HEALTHIA_EVALUATION_MAX_SESSIONS=2,HEALTHIA_EVALUATION_MAX_RUNS=2,HEALTHIA_RELEASE_SHA=${SOURCE_SHA},HEALTHIA_GCS_BUCKET=${BUCKET_NAME},GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global" \
            --set-secrets "HEALTHIA_DEVICE_TOKEN_SECRET=healthia-device-token-secret:latest,HEALTHIA_SESSION_SECRET=healthia-session-secret:latest,HEALTHIA_EVALUATION_ACCESS_KEY=${EVALUATION_SECRET_NAME}:latest,GOOGLE_MAPS_API_KEY=${MAPS_SECRET_NAME}:latest" \
            --no-allow-unauthenticated \
            --quiet

      - name: Bind recorder to exact deployed revision
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          image="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          token_file="$RUNNER_TEMP/healthia-cloud-identity-token"
          umask 077
          echo "HEALTHIA_CLOUD_ID_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
          gcloud auth print-identity-token --audiences="$url" > "$token_file"
          chmod 600 "$token_file"
          test -n "$url" && test -n "$revision" && test -n "$image" && test -s "$token_file"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "HEALTHIA_EXACT_REVISION_BOUND $revision"

      - name: Deploy exact-head private read-only Judge Mode
        id: judge
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud run deploy "$JUDGE_SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "${{ steps.cloud.outputs.image }}" \
            --command uvicorn \
            --args "healthia_one.judge_mode:app,--host,0.0.0.0,--port,8080" \
            --set-env-vars "HEALTHIA_JUDGE_SOURCE_SHA=${SOURCE_SHA},HEALTHIA_JUDGE_LIVE_PROOF_RUN=31972928348" \
            --min-instances 0 --max-instances 1 --memory 256Mi --cpu 1 \
            --ingress all --no-allow-unauthenticated --quiet
          url="$(gcloud run services describe "$JUDGE_SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          token_file="$RUNNER_TEMP/healthia-judge-identity-token"
          curl_config="$RUNNER_TEMP/healthia-judge-health.curlrc"
          cleanup_judge_files() {
            shred -u "$curl_config" 2>/dev/null || true
          }
          trap cleanup_judge_files EXIT
          umask 077
          echo "HEALTHIA_JUDGE_ID_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
          gcloud auth print-identity-token --audiences="$url" > "$token_file"
          chmod 600 "$token_file"
          test -n "$url" && test -s "$token_file"
          {
            printf 'url = "%s/judge-health"\n' "$url"
            printf 'header = "Authorization: Bearer %s"\n' "$(<"$token_file")"
            printf 'fail\nsilent\nshow-error\n'
          } > "$curl_config"
          chmod 600 "$curl_config"
          curl --config "$curl_config" > /tmp/judge-health.json
          test "$(jq -r '.source_sha' /tmp/judge-health.json)" = "$SOURCE_SHA"
          test "$(jq -r '.mode' /tmp/judge-health.json)" = "judge_read_only_synthetic"
          test "$(jq -r '.mutations' /tmp/judge-health.json)" = "false"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "HEALTHIA_EXACT_HEAD_PRIVATE_JUDGE_MODE_PASS $url"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize evaluator capability in a protected temporary file
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/healthia-evaluation-access-key"
          umask 077
          echo "HEALTHIA_EVALUATION_KEY_FILE=$key_file" >> "$GITHUB_ENV"
          gcloud secrets versions access latest \
            --secret "$EVALUATION_SECRET_NAME" \
            --project "$PROJECT_ID" > "$key_file"
          test -s "$key_file"
          chmod 600 "$key_file"
          echo "HEALTHIA_EVALUATION_KEY_FILE_READY"

      - name: Install recorder and media tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg flite jq
          ffmpeg -version | head -n 1

      - name: Record continuous Wave 4 live application demo
        env:
          HEALTHIA_CLOUD_URL: ${{ steps.cloud.outputs.url }}
          HEALTHIA_CLOUD_ID_TOKEN_FILE: ${{ runner.temp }}/healthia-cloud-identity-token
          HEALTHIA_CLOUD_REVISION: ${{ steps.cloud.outputs.revision }}
          HEALTHIA_CLOUD_IMAGE: ${{ steps.cloud.outputs.image }}
          HEALTHIA_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          HEALTHIA_CLOUD_REGION: ${{ env.REGION }}
          HEALTHIA_CANDIDATE_SHA: ${{ github.sha }}
          HEALTHIA_JUDGE_URL: ${{ steps.judge.outputs.url }}
          HEALTHIA_JUDGE_ID_TOKEN_FILE: ${{ runner.temp }}/healthia-judge-identity-token
          HEALTHIA_EVALUATION_ACCESS_KEY_FILE: ${{ runner.temp }}/healthia-evaluation-access-key
        run: python scripts/record_final_wave4_winner_demo.py

      - name: Build new narrated winner master
        shell: bash
        run: |
          set -euo pipefail
          base=dist/final-live-english-demo
          mkdir -p "$base/audio" "$base/master"

          # The requested speaker is an exact Google Cloud voice. Fail closed:
          # a different gender, unnamed voice, local fallback, or disabled API cannot pass.
          narration="$base/audio/narration.wav"
          voice_name="en-US-Chirp3-HD-Charon"
          enabled="$(gcloud services list --project "$PROJECT_ID" --enabled --format='value(config.name)')"
          grep -qx 'texttospeech.googleapis.com' <<<"$enabled"

          access_token_file="$RUNNER_TEMP/healthia-tts-access-token"
          voices_config="$RUNNER_TEMP/healthia-tts-voices.curlrc"
          request_config="$RUNNER_TEMP/healthia-tts-request.curlrc"
          cleanup_tts_secrets() {
            shred -u "$access_token_file" "$voices_config" "$request_config" 2>/dev/null || true
          }
          trap cleanup_tts_secrets EXIT
          umask 077
          gcloud auth print-access-token > "$access_token_file"
          chmod 600 "$access_token_file"
          voices="$base/audio/voices.json"
          {
            printf 'url = "https://texttospeech.googleapis.com/v1/voices?languageCode=en-US"\n'
            printf 'header = "Authorization: Bearer %s"\n' "$(<"$access_token_file")"
            printf 'output = "%s"\n' "$voices"
            printf 'fail\nsilent\nshow-error\n'
          } > "$voices_config"
          chmod 600 "$voices_config"
          curl --config "$voices_config"
          jq -e --arg voice "$voice_name" '.voices[] | select(.name == $voice and .ssmlGender == "MALE")' "$voices" >/dev/null

          request_dir="$base/audio/tts-requests"
          response_dir="$base/audio/tts-responses"
          chunk_dir="$base/audio/tts-chunks"
          mkdir -p "$request_dir" "$response_dir" "$chunk_dir"
          python - "$request_dir" "$voice_name" <<'PY'
          import json, pathlib, sys

          source=pathlib.Path('scripts/final_wave4_winner_narration.txt').read_text(encoding='utf-8').strip()
          limit=4300
          paragraphs=[part.strip() for part in source.split('\n\n') if part.strip()]
          chunks=[]
          current=''
          for paragraph in paragraphs:
              candidates=[paragraph]
              if len(paragraph.encode('utf-8')) > limit:
                  candidates=[]
                  piece=''
                  for word in paragraph.split():
                      trial=f'{piece} {word}'.strip()
                      if piece and len(trial.encode('utf-8')) > limit:
                          candidates.append(piece)
                          piece=word
                      else:
                          piece=trial
                  if piece:
                      candidates.append(piece)
              for candidate in candidates:
                  trial=f'{current}\n\n{candidate}'.strip()
                  if current and len(trial.encode('utf-8')) > limit:
                      chunks.append(current)
                      current=candidate
                  else:
                      current=trial
          if current:
              chunks.append(current)
          if not chunks or any(len(chunk.encode('utf-8')) > limit for chunk in chunks):
              raise SystemExit('unable to create safe Google TTS chunks')
          output=pathlib.Path(sys.argv[1])
          for index, text in enumerate(chunks, 1):
              payload={
                  'input': {'text': text},
                  'voice': {'languageCode': 'en-US', 'name': sys.argv[2]},
                  'audioConfig': {'audioEncoding': 'MP3', 'speakingRate': 0.98},
              }
              (output / f'tts-request-{index:03d}.json').write_text(
                  json.dumps(payload, ensure_ascii=False), encoding='utf-8'
              )
          print(f'HEALTHIA_TTS_CHUNKS_READY count={len(chunks)} max_bytes={max(len(c.encode("utf-8")) for c in chunks)}')
          PY
          concat_list="$base/audio/tts-concat.txt"
          : > "$concat_list"
          for request in "$request_dir"/tts-request-*.json; do
            stem="$(basename "$request" .json)"
            response="$response_dir/${stem}.json"
            mp3="$chunk_dir/${stem}.mp3"
            {
              printf 'url = "https://texttospeech.googleapis.com/v1/text:synthesize"\n'
              printf 'request = "POST"\n'
              printf 'header = "Authorization: Bearer %s"\n' "$(<"$access_token_file")"
              printf 'header = "Content-Type: application/json"\n'
              printf 'data-binary = "@%s"\n' "$request"
              printf 'output = "%s"\n' "$response"
              printf 'write-out = "%%{http_code}"\n'
              printf 'silent\nshow-error\n'
            } > "$request_config"
            chmod 600 "$request_config"
            status="$(curl --config "$request_config")"
            if [[ "$status" != "200" ]] || [[ -z "$(jq -r '.audioContent // empty' "$response")" ]]; then
              jq -c '{error: (.error.message // "missing audioContent")}' "$response" >&2 || true
              echo "Named male Google Cloud voice synthesis failed closed: $voice_name HTTP $status" >&2
              exit 1
            fi
            jq -r '.audioContent' "$response" | base64 -d > "$mp3"
            test -s "$mp3"
            printf "file '%s'\n" "$(realpath "$mp3")" >> "$concat_list"
          done
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i "$concat_list" -c:a pcm_s16le "$narration"
          test -s "$narration"
          python - "$base/narration-voice-proof.json" "$voice_name" <<'PY'
          import json, pathlib, sys
          payload={
              'status':'PASS',
              'provider':'Google Cloud Text-to-Speech',
              'voice_name':sys.argv[2],
              'voice_short_name':'Charon',
              'gender':'MALE',
              'language_code':'en-US',
              'voice_tier':'Chirp 3 HD',
              'fallback_used':False,
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(payload, indent=2), encoding='utf-8')
          print(json.dumps(payload))
          PY
          printf '%s\n' "google-cloud-tts-chirp3-hd-charon-male" > "$base/narration-source.txt"
          rm -rf "$request_dir" "$response_dir" "$chunk_dir"
          rm -f "$concat_list" "$voices"
          echo "HEALTHIA_NARRATION_VOICE_PASS $voice_name MALE"

          raw="$(find "$base/video" -type f -name '*.webm' -print -quit)"
          test -n "$raw"
          raw_duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$raw")"
          narration_duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$narration")"

          read video_factor audio_speed target < <(python - "$raw_duration" "$narration_duration" <<'PY'
          import sys
          raw=float(sys.argv[1])
          narration=float(sys.argv[2])
          if raw <= 0 or narration <= 0:
              raise SystemExit('invalid live-video or narration duration')
          target=max(215.0, raw*1.22, narration+2.0)
          target=min(235.0, target)
          video_factor=target/raw
          audio_target=max(1.0, target-1.0)
          audio_speed=narration/audio_target
          if not 0.5 <= audio_speed <= 2.0:
              raise SystemExit(f'audio speed outside ffmpeg atempo range: {audio_speed:.4f}')
          if not 0.45 <= video_factor <= 2.50:
              raise SystemExit(f'video retiming would be visually unsafe: {video_factor:.4f}')
          print(f"{video_factor:.8f} {audio_speed:.8f} {target:.3f}")
          PY
          )
          echo "WINNER_TIMING raw=${raw_duration}s narration=${narration_duration}s target=${target}s video_factor=${video_factor} audio_speed=${audio_speed}"

          ffmpeg -hide_banner -loglevel error -y \
            -i "$narration" \
            -af "atempo=${audio_speed},loudnorm=I=-16:LRA=7:TP=-1.5,apad" -t "$target" \
            -c:a aac -b:a 160k "$base/master/narration-master.m4a"

          ffmpeg -hide_banner -loglevel error -y \
            -i "$raw" \
            -vf "setpts=${video_factor}*PTS" -an \
            -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p \
            -movflags +faststart "$base/master/video-master.mp4"

          ffmpeg -hide_banner -loglevel error -y \
            -i "$base/master/video-master.mp4" \
            -i "$base/master/narration-master.m4a" \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a copy \
            -t "$target" -movflags +faststart \
            "$base/$RELEASE_ASSET"

      - name: CUTLOCK — reject unsupported or weak winner demo
        shell: bash
        run: |
          set -euo pipefail
          final="dist/final-live-english-demo/$RELEASE_ASSET"
          report=dist/final-live-english-demo/report.json
          test -s "$final" && test -s "$report"
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$final")"
          audio_streams="$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$final" | wc -l | tr -d ' ')"
          video_streams="$(ffprobe -v error -select_streams v -show_entries stream=index -of csv=p=0 "$final" | wc -l | tr -d ' ')"
          python - "$duration" "$audio_streams" "$video_streams" "$report" <<'PY'
          import json, sys
          duration=float(sys.argv[1])
          audio_streams=int(sys.argv[2])
          video_streams=int(sys.argv[3])
          report=json.load(open(sys.argv[4], encoding='utf-8'))
          if not 215 <= duration <= 240:
              raise SystemExit(f'final Taskmaster demo must stay in the substantial competition window: {duration:.2f}s')
          if audio_streams < 1 or video_streams < 1:
              raise SystemExit('final demo must contain both continuous live video and English narration audio')
          voice=json.load(open('dist/final-live-english-demo/narration-voice-proof.json', encoding='utf-8'))
          if voice != {
              'status':'PASS',
              'provider':'Google Cloud Text-to-Speech',
              'voice_name':'en-US-Chirp3-HD-Charon',
              'voice_short_name':'Charon',
              'gender':'MALE',
              'language_code':'en-US',
              'voice_tier':'Chirp 3 HD',
              'fallback_used':False,
          }:
              raise SystemExit(f'narration voice proof mismatch: {voice}')
          if report.get('status') != 'PASS':
              raise SystemExit(f"recorder report is not PASS: {report}")
          if report.get('live_app_only') is not True or report.get('static_screenshots_used') is not False:
              raise SystemExit('demo is not certified as live-app-only')
          living=report.get('living_system') or {}
          if living.get('waiting_event_count') != 10 or living.get('waiting_status') != 'waiting_human':
              raise SystemExit(f'Living System did not prove the 10/14 human boundary: {living}')
          if living.get('completed_event_count') != 14 or living.get('completed_twin_version') != 3 or living.get('model_calls') != 0:
              raise SystemExit(f'Living System did not prove 14/14 Twin v3 with zero model calls: {living}')
          if living.get('release_sha') != report.get('candidate_sha'):
              raise SystemExit('Living System report is not bound to the exact candidate SHA')
          if int(report.get('candidate_count') or 0) < 2:
              raise SystemExit('winner demo did not prove at least two real resource candidates')
          if int(report.get('google_maps_uri_count') or 0) < 2:
              raise SystemExit('winner demo did not prove visible Google Maps-backed candidates')
          required={
              'living_system_locked_without_capability',
              'living_system_capability_not_persisted_in_browser',
              'living_system_arm_run_waiting_human',
              'living_system_waiting_boundary_visible_10_of_14',
              'living_system_human_receipt_reaches_14_of_14',
              'living_system_twin_v3_visible',
              'living_system_zero_model_calls',
              'living_system_exact_sha_binding',
              'living_system_durable_replay_visible',
              'exact_candidate_live_google_runtime',
              'zero_places_before_mission_scoped_consent',
              'same_durable_mission_resumed_after_consent',
              'real_google_places_candidates_visible',
              'exact_second_candidate_selected_without_model_interpretation',
              'multimodal_original_result_and_provenance',
              'logout_login_restores_evidence_and_selected_google_mission',
              'synthetic_health_connect_event_visible_with_provenance',
              'unified_record_and_timeline_visible_after_relogin',
              'visible_exact_candidate_cloud_proof',
              'exact_head_autonomous_continuity_judge_mode',
              'zero_browser_console_or_page_errors',
          }
          missing=required-set(report.get('checks') or [])
          if missing:
              raise SystemExit(f'missing winner demo gates: {sorted(missing)}')
          print(f'HEALTHIA_WINNER_CUTLOCK_PASS duration={duration:.2f}s candidates={report.get("candidate_count")} maps={report.get("google_maps_uri_count")}')
          PY
          sha256sum "$final" | tee dist/final-live-english-demo/final-video.sha256

      - name: Upload exact-candidate Wave 4 winner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-ONE-autonomous-winner-demo-Charon
          path: dist/final-live-english-demo
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary Cloud Run video service
        if: always()
        shell: bash
        run: |
          if [[ -n "${HEALTHIA_EVALUATION_KEY_FILE:-}" && -f "$HEALTHIA_EVALUATION_KEY_FILE" ]]; then
            shred -u "$HEALTHIA_EVALUATION_KEY_FILE"
          fi
          for secret_file in \
            "${HEALTHIA_CLOUD_ID_TOKEN_FILE:-}" \
            "${HEALTHIA_JUDGE_ID_TOKEN_FILE:-}"; do
            if [[ -n "$secret_file" && -f "$secret_file" ]]; then
              shred -u "$secret_file"
            fi
          done
          gcloud run services delete "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --quiet || true
          gcloud run services delete "$JUDGE_SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --quiet || true

  publish-winner:
    name: Publish validated winner evidence
    needs: exact-candidate-live-demo
    if: needs.exact-candidate-live-demo.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: healthia-one-autonomous-winner-demo-2026
      RELEASE_ASSET: HealthIA-ONE-Autonomous-Taskmaster-Charon.mp4
    steps:
      - name: Download validated winner artifact
        uses: actions/download-artifact@v4
        with:
          name: HealthIA-ONE-autonomous-winner-demo-Charon
          path: dist/final-live-english-demo

      - name: Publish exact-SHA video and sanitized evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base=dist/final-live-english-demo
