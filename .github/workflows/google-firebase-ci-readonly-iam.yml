name: Google Firebase CI read-only IAM gate

on:
  pull_request:
    paths:
      - '.github/workflows/google-firebase-ci-readonly-iam.yml'
      - '.github/workflows/android-bridge.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight is read-only; authorize grants FCM API Viewer only to the active CI service account'
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - authorize
      authorization:
        description: 'For authorize only, type I_AUTHORIZE_FCM_VIEWER_FOR_CI'
        required: false
        type: string

concurrency:
  group: healthia-firebase-ci-readonly-iam-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  firebase-ci-readonly-iam:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live')
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      firebase_ready: ${{ steps.postcheck.outputs.firebase_ready }}
      can_set_iam_policy: ${{ steps.preflight.outputs.can_set_iam_policy }}
    env:
      PROJECT_ID: healthia-6088a
      AUTHORIZE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'authorize' }}
      AUTHORIZATION: ${{ github.event_name == 'workflow_dispatch' && inputs.authorization || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Bind source SHA
        shell: bash
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Read-only Firebase IAM preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/firebase-ci-readonly-iam
          account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n 1)"
          test -n "$account"
          case "$account" in
            *.iam.gserviceaccount.com) ;;
            *) echo 'Active CI identity is not a service account; refusing IAM workflow.' >&2; exit 1 ;;
          esac
          echo "::add-mask::$account"
          export CI_ACCOUNT="$account"

          access_token="$(gcloud auth print-access-token)"
          test -n "$access_token"
          echo "::add-mask::$access_token"

          pre_code="$(curl -sS -o /tmp/firebase-apps-pre.json -w '%{http_code}' \
            -H "Authorization: Bearer ${access_token}" \
            -H 'Accept: application/json' \
            "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}/androidApps" || true)"
          rm -f /tmp/firebase-apps-pre.json

          iam_test_code="$(curl -sS -o /tmp/iam-test.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${access_token}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{"permissions":["resourcemanager.projects.setIamPolicy"]}' \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${PROJECT_ID}:testIamPermissions" || true)"
          export IAM_TEST_CODE="$iam_test_code"
          can_set_iam_policy=false
          if [[ "$iam_test_code" == '200' ]]; then
            can_set_iam_policy="$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              payload=json.loads(Path('/tmp/iam-test.json').read_text(encoding='utf-8'))
          except Exception:
              payload={}
          permissions=set(payload.get('permissions') or []) if isinstance(payload,dict) else set()
          print('true' if 'resourcemanager.projects.setIamPolicy' in permissions else 'false')
          PY
            )"
          fi
          rm -f /tmp/iam-test.json

          echo "firebase_list_http_status=$pre_code" >> "$GITHUB_OUTPUT"
          echo "can_set_iam_policy=$can_set_iam_policy" >> "$GITHUB_OUTPUT"
          export PRE_CODE="$pre_code" CAN_SET_IAM_POLICY="$can_set_iam_policy"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          account=os.environ['CI_ACCOUNT']
          out={
              'status':'ALREADY_AUTHORIZED' if os.environ.get('PRE_CODE') == '200' else 'BLOCKED_FIREBASE_READ_IAM',
              'source_sha':os.environ.get('SOURCE_SHA',''),
              'project_id':os.environ['PROJECT_ID'],
              'firebase_management_list_http_status_before':int(os.environ.get('PRE_CODE') or 0),
              'iam_test_http_status':int(os.environ.get('IAM_TEST_CODE') or 0),
              'active_service_account_sha256':hashlib.sha256(account.encode()).hexdigest(),
              'required_role':'roles/firebasecloudmessaging.viewer',
              'required_permissions':['firebase.clients.get','firebase.clients.list','firebase.projects.get'],
              'ci_can_set_project_iam_policy':os.environ.get('CAN_SET_IAM_POLICY') == 'true',
              'iam_mutation':False,
              'api_enable_mutation':False,
              'provider_write':False,
              'secret_material_exposed':False,
          }
          Path('dist/firebase-ci-readonly-iam/preflight.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Enforce explicit FCM API Viewer authorization
        if: env.AUTHORIZE_MODE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$AUTHORIZATION" != "I_AUTHORIZE_FCM_VIEWER_FOR_CI" ]]; then
            echo 'IAM mutation blocked: exact authorization phrase is missing.' >&2
            exit 1
          fi

      - name: Enforce CI IAM grant capability before mutation
        if: env.AUTHORIZE_MODE == 'true' && steps.preflight.outputs.firebase_list_http_status != '200'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.preflight.outputs.can_set_iam_policy }}" != 'true' ]]; then
            echo 'CI principal cannot set project IAM policy; grant must be performed by a separate authorized identity.' >&2
            exit 1
          fi

      - name: Grant FCM API Viewer only to active CI service account
        if: env.AUTHORIZE_MODE == 'true' && steps.preflight.outputs.firebase_list_http_status != '200' && steps.preflight.outputs.can_set_iam_policy == 'true'
        id: grant
        shell: bash
        run: |
          set -euo pipefail
          account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n 1)"
          test -n "$account"
          case "$account" in
            *.iam.gserviceaccount.com) ;;
            *) echo 'Active CI identity is not a service account; refusing IAM mutation.' >&2; exit 1 ;;
          esac
          echo "::add-mask::$account"
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${account}" \
            --role='roles/firebasecloudmessaging.viewer' \
            --condition=None \
            --quiet >/tmp/firebase-iam-grant.txt
          rm -f /tmp/firebase-iam-grant.txt
          echo 'mutated=true' >> "$GITHUB_OUTPUT"

      - name: Verify Firebase read access after gate
        id: postcheck
        if: always() && (steps.preflight.conclusion == 'success')
        shell: bash
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          test -n "$access_token"
          echo "::add-mask::$access_token"
          post_code="$(curl -sS -o /tmp/firebase-apps-post.json -w '%{http_code}' \
            -H "Authorization: Bearer ${access_token}" \
            -H 'Accept: application/json' \
            "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}/androidApps" || true)"
          rm -f /tmp/firebase-apps-post.json
          if [[ "$post_code" == '200' ]]; then
            echo 'firebase_ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'firebase_ready=false' >> "$GITHUB_OUTPUT"
          fi
          export POST_CODE="$post_code"
          export MUTATED="${{ steps.grant.outputs.mutated || 'false' }}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          post=int(os.environ.get('POST_CODE') or 0)
          mutated=os.environ.get('MUTATED') == 'true'
          out={
              'status':'LIVE_PASS' if post == 200 else 'BLOCKED_FIREBASE_READ_IAM',
              'source_sha':os.environ.get('SOURCE_SHA',''),
              'firebase_management_list_http_status_after':post,
              'required_role':'roles/firebasecloudmessaging.viewer',
              'iam_mutation':mutated,
              'api_enable_mutation':False,
              'provider_write':False,
              'secret_material_exposed':False,
          }
          Path('dist/firebase-ci-readonly-iam/postcheck.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,sort_keys=True))
          PY

          if [[ "$AUTHORIZE_MODE" == 'true' && "$post_code" != '200' ]]; then
            echo 'Authorized FCM API Viewer IAM gate did not converge to HTTP 200.' >&2
            exit 1
          fi

      - name: Refuse secret-like artifact content
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -Eiq '(BEGIN PRIVATE KEY|client_secret|access_token|refresh_token|ya29\.|AIza[0-9A-Za-z_-]{20,}|1:[0-9]+:android:[0-9a-f]+|iam\.gserviceaccount\.com)' dist/firebase-ci-readonly-iam; then
            rm -rf dist/firebase-ci-readonly-iam
            echo 'Sensitive-looking IAM/Firebase material detected; refusing upload.' >&2
            exit 1
          fi

      - name: Upload sanitized Firebase CI IAM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Firebase-CI-Readonly-IAM
          path: dist/firebase-ci-readonly-iam/*.json
          if-no-files-found: error
          retention-days: 30

  dispatch-fcm-ready-android-build:
    needs: firebase-ci-readonly-iam
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'authorize' && needs.firebase-ci-readonly-iam.outputs.firebase_ready == 'true'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Dispatch Android FCM-ready build on Wave 2 branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d '{"ref":"kira/google-constellation-wave2-live"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/android-bridge.yml/dispatches"
          echo 'Android FCM-ready build dispatch accepted after verified Firebase read access.'
