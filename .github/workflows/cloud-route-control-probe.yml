name: Cloud Run route control probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: healthia-cloud-route-control-probe
  cancel-in-progress: true

jobs:
  control-probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      PROBE_SERVICE: healthia-route-control
      PROVISION_PRINCIPAL: healthia-github-vertex-9@healthia-6088a.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a

      - name: Temporarily grant Cloud Run Admin for reversible control service
        run: |
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${PROVISION_PRINCIPAL}" \
            --role="roles/run.admin" \
            --condition=None \
            --quiet >/dev/null

      - name: Deploy official Cloud Run hello control
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$PROBE_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "us-docker.pkg.dev/cloudrun/container/hello:latest" \
            --min 0 \
            --max 1 \
            --no-invoker-iam-check \
            --quiet >/dev/null
          token="$(gcloud auth print-access-token)"
          curl -fsSL -H "Authorization: Bearer ${token}" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${PROBE_SERVICE}" \
            > /tmp/probe.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/probe.json'))
          print('uri=',d.get('uri'))
          print('urls=',d.get('urls'))
          print('ready=',(d.get('terminalCondition') or {}).get('state'))
          print('invokerIamDisabled=',d.get('invokerIamDisabled'))
          PY
          urls="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/probe.json'))
          print('\n'.join(d.get('urls') or [d.get('uri','')]))
          PY
          )"
          printf '%s\n' "$urls" > /tmp/probe-urls.txt

      - name: Probe every serving URL
        id: http
        shell: bash
        run: |
          set -euo pipefail
          : > deployment/cloud-route-control-results.txt
          success=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            code=000
            for i in {1..12}; do
              code="$(curl -sS -o /tmp/probe-body.txt -w '%{http_code}' "$url/" || true)"
              echo "url=$url attempt=$i HTTP=$code" | tee -a deployment/cloud-route-control-results.txt
              if [ "$code" = "200" ]; then
                success=1
                break
              fi
              sleep 3
            done
          done < /tmp/probe-urls.txt
          echo "success=$success" >> "$GITHUB_OUTPUT"
          if [ "$success" = "1" ]; then
            echo "HEALTHIA_CLOUD_ROUTE_CONTROL_OK"
            head -c 300 /tmp/probe-body.txt || true
            echo
            exit 0
          fi
          echo "::error::Official Cloud Run hello control also failed to serve through every advertised URL"
          head -c 500 /tmp/probe-body.txt || true
          exit 1

      - name: Delete ephemeral control service
        if: always()
        run: |
          gcloud run services delete "$PROBE_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --quiet >/dev/null || true
          echo "Ephemeral route control removed."

      - name: Remove temporary Cloud Run Admin
        if: always()
        run: |
          gcloud projects remove-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${PROVISION_PRINCIPAL}" \
            --role="roles/run.admin" \
            --condition=None \
            --quiet >/dev/null || true

      - name: Upload route control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-cloud-route-control
          path: deployment/cloud-route-control-results.txt
          if-no-files-found: warn
          retention-days: 7
