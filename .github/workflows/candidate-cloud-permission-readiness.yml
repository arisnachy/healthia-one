name: Candidate Cloud deployment permission readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/cloud-proof-trigger.txt

permissions:
  contents: read

concurrency:
  group: cloud-permissions-kira-event-driven-results-twin-p1
  cancel-in-progress: true

jobs:
  cloud-permissions:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: kira/event-driven-results-twin-p1
          fetch-depth: 1

      - name: Record candidate SHA
        run: echo "HEALTHIA_CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install permission-probe dependencies
        run: python -m pip install --quiet google-auth requests

      - name: Test deploy permissions without mutating Cloud
        run: python deployment/check_cloud_permissions.py --project healthia-6088a --json-out deployment/cloud-permissions-latest.json

      - name: Bind permission evidence to exact candidate
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('deployment/cloud-permissions-latest.json')
          payload={}
          if path.exists():
              payload=json.loads(path.read_text(encoding='utf-8'))
          payload['candidate_sha']=os.environ.get('HEALTHIA_CANDIDATE_SHA','')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2), encoding='utf-8')
          PY

      - name: Upload sanitized permission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-cloud-permission-readiness
          path: deployment/cloud-permissions-latest.json
          if-no-files-found: warn
          retention-days: 7
