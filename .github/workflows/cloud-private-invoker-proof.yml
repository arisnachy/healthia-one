name: Cloud private invoker strict proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: healthia-cloud-private-invoker-proof
  cancel-in-progress: true

jobs:
  grant-and-prove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-demo
      BUCKET_NAME: healthia-6088a-healthia-evidence
      DEPLOY_PRINCIPAL: healthia-github-vertex-9@healthia-6088a.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a

      - name: Grant minimal private Cloud Run invoker role to proof principal
        run: |
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${DEPLOY_PRINCIPAL}" \
            --role="roles/run.invoker" \
            --condition=None \
            --quiet >/dev/null
          echo "Granted roles/run.invoker to the authenticated proof principal."

      - name: Resolve service URL and wait for invoker propagation
        id: service
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "URL: $url"
          echo "Revision: $revision"
          for i in {1..12}; do
            token="$(gcloud auth print-identity-token --audiences="$url")"
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' -H "Authorization: Bearer ${token}" "$url/healthz" || true)"
            echo "attempt=$i HTTP=$code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              echo
              echo "token=$token" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Cloud Run remained unreachable after explicit roles/run.invoker grant"
          head -c 500 /tmp/health.json || true
          exit 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact candidate verifier
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Execute strict deployed Cloud proof
        shell: bash
        run: |
          set -euo pipefail
          python deployment/verify_cloud_demo.py \
            --url '${{ steps.service.outputs.url }}' \
            --project "$PROJECT_ID" \
            --bucket "$BUCKET_NAME" \
            --identity-token '${{ steps.service.outputs.token }}' \
            --json | tee deployment/cloud-proof-latest.json

      - name: Capture sanitized Cloud evidence
        if: always()
        env:
          CLOUD_URL: ${{ steps.service.outputs.url }}
          CLOUD_REVISION: ${{ steps.service.outputs.revision }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload={
            "project": os.environ.get("PROJECT_ID",""),
            "region": os.environ.get("REGION",""),
            "service": os.environ.get("SERVICE_NAME",""),
            "url": os.environ.get("CLOUD_URL",""),
            "revision": os.environ.get("CLOUD_REVISION",""),
            "candidate_sha": os.environ.get("CANDIDATE_SHA",""),
            "proof_principal_has_explicit_run_invoker": True,
            "model": "gemini-3.5-flash",
            "vertex_adc": True,
            "gemini_api_key_used": False,
          }
          Path("deployment/cloud-private-invoker-evidence.json").write_text(json.dumps(payload,indent=2),encoding="utf-8")
          PY

      - name: Upload strict proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-cloud-private-invoker-strict-proof
          path: |
            deployment/cloud-private-invoker-evidence.json
            deployment/cloud-proof-latest.json
          if-no-files-found: warn
          retention-days: 14
