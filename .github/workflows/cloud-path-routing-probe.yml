name: Cloud HealthIA path routing probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: healthia-cloud-path-routing-probe
  cancel-in-progress: true

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-judge
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a

      - name: Probe multiple application paths through official Cloud Run proxy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment
          gcloud run services proxy "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --port 8099 > /tmp/proxy.log 2>&1 &
          proxy_pid=$!
          trap 'kill $proxy_pid 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            code="$(curl -sS -o /tmp/root.txt -w '%{http_code}' http://127.0.0.1:8099/ 2>/dev/null || true)"
            if [ "$code" != 000 ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "::error::Cloud Run proxy did not become reachable"
            tail -n 80 /tmp/proxy.log || true
            exit 1
          fi
          : > deployment/cloud-path-routing-probe.txt
          for path in / /healthz /api/readiness /openapi.json /login /api/auth/session; do
            code="$(curl -sS -o /tmp/body.txt -w '%{http_code}' "http://127.0.0.1:8099${path}" || true)"
            prefix="$(head -c 220 /tmp/body.txt 2>/dev/null | tr '\n' ' ' || true)"
            printf 'path=%s http=%s body_prefix=%q\n' "$path" "$code" "$prefix" | tee -a deployment/cloud-path-routing-probe.txt
          done
          echo '--- proxy log tail ---' | tee -a deployment/cloud-path-routing-probe.txt
          tail -n 80 /tmp/proxy.log | tee -a deployment/cloud-path-routing-probe.txt || true

      - name: Read matching request/access logs after path probe
        shell: bash
        run: |
          set +e
          {
            echo '--- Cloud Run request logs ---'
            gcloud logging read \
              "resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE_NAME} AND logName=\"projects/${PROJECT_ID}/logs/run.googleapis.com%2Frequests\"" \
              --project="$PROJECT_ID" --freshness=15m --limit=30 --order=asc \
              --format='table(timestamp,httpRequest.requestMethod,httpRequest.requestUrl,httpRequest.status)'
            echo '--- app stdout/stderr ---'
            gcloud logging read \
              "resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE_NAME} AND (logName=\"projects/${PROJECT_ID}/logs/run.googleapis.com%2Fstdout\" OR logName=\"projects/${PROJECT_ID}/logs/run.googleapis.com%2Fstderr\")" \
              --project="$PROJECT_ID" --freshness=15m --limit=50 --order=asc \
              --format='table(timestamp,textPayload)'
          } 2>&1 | tee -a deployment/cloud-path-routing-probe.txt
          exit 0

      - name: Upload path-routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-cloud-path-routing-probe
          path: deployment/cloud-path-routing-probe.txt
          if-no-files-found: warn
          retention-days: 7
