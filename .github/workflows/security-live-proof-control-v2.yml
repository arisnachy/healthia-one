name: Security exact-SHA live proof control v2

on:
  push:
    branches:
      - kira/security-live-proof-control
    paths:
      - .github/workflows/security-live-proof-control-v2.yml

permissions:
  contents: write

concurrency:
  group: healthia-security-live-proof-f0c2f518-v2
  cancel-in-progress: true

env:
  CANDIDATE_SHA: f0c2f518a54ba3a8de9750cba2f017a1915f2241
  PROJECT_ID: healthia-6088a
  REGION: us-central1
  VERTEX_LOCATION: global
  SERVICE_NAME: healthia-one-security-candidate-v2
  RUNTIME_SA: healthia-one-security-runtime-v2
  BUILD_SA: healthia-one-security-build-v2
  BUCKET_NAME: healthia-6088a-security-proof-v2

jobs:
  proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Exact SHA gate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p dist/security-live-proof
          printf '%s\n' "$CANDIDATE_SHA" > dist/security-live-proof/exact-sha.txt

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Remote exact-SHA regression
        env:
          HEALTHIA_AUTH_REQUIRED: "false"
        run: |
          python -m pytest -q tests/test_security_hardening.py tests/test_device_ingestion_hardening.py tests/test_gemini.py
          python scripts/smoke_test.py
          PYTHONPATH=. python scripts/full_system_check.py
          PYTHONPATH=. python scripts/dialogbench.py
          touch dist/security-live-proof/remote-regression.pass

      - name: Permission preflight
        run: |
          python deployment/check_cloud_permissions.py --project "$PROJECT_ID" --json-out deployment/security-live-cloud-permissions.json
          touch dist/security-live-proof/permission-preflight.pass

      - name: Deploy isolated exact SHA and strict proof
        shell: pwsh
        run: |
          ./deployment/deploy-cloud-demo.ps1 `
            -ProjectId $env:PROJECT_ID `
            -Region $env:REGION `
            -VertexLocation $env:VERTEX_LOCATION `
            -BucketName $env:BUCKET_NAME `
            -ServiceName $env:SERVICE_NAME `
            -RuntimeServiceAccount $env:RUNTIME_SA `
            -BuildServiceAccount $env:BUILD_SA `
            -RequestLimit 24 `
            -MaxOutputTokens 1400 `
            -Confirmed
          New-Item -ItemType File -Force -Path dist/security-live-proof/cloud-strict.pass | Out-Null

      - name: LIVE security boundaries
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          image="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          id_token="$(gcloud auth print-identity-token --audiences="$url")"
          echo "::add-mask::$id_token"
          export HEALTHIA_SECURITY_URL="$url" HEALTHIA_SECURITY_REVISION="$revision" HEALTHIA_SECURITY_IMAGE="$image" HEALTHIA_CLOUD_ID_TOKEN="$id_token"
          python - <<'PY'
          import hashlib, json, os, secrets
          import requests
          from google.cloud import firestore

          base=os.environ['HEALTHIA_SECURITY_URL'].rstrip('/')
          cloud=os.environ['HEALTHIA_CLOUD_ID_TOKEN']
          sha=os.environ['CANDIDATE_SHA']
          project=os.environ['PROJECT_ID']
          cloud_h={'Authorization':f'Bearer {cloud}'}
          def must(r,codes,label):
              if r.status_code not in codes:
                  raise AssertionError(f'{label}: {r.status_code} {r.text[:400]}')
              return r

          ready=must(requests.get(base+'/api/readiness',headers=cloud_h,timeout=30),{200},'readiness').json()
          assert ready['release_sha']==sha
          assert ready['auth_required'] is True
          assert ready['model']=='gemini-3.5-flash' and ready['adk_ready'] is True
          assert ready['store_backend']=='firestore'

          suffix=secrets.token_hex(6); pwd='HealthIA-Security-2026!'
          email=f'sec-live-{suffix}@example.com'
          s=requests.Session(); s.headers.update(cloud_h)
          must(s.post(base+'/api/auth/register',json={'email':email,'password':pwd,'display_name':'Security Live'},timeout=30),{201},'register')
          cookie=s.cookies.get('healthia_session'); assert cookie
          boot=must(s.get(base+'/api/bootstrap',timeout=30),{200},'bootstrap').json()
          consent=must(s.get(base+'/api/consent',timeout=30),{200},'consent').json()
          profile=dict(boot['profile']); profile['consented_signal_types']=['attacker_override']
          must(s.put(base+'/api/profile',json=profile,timeout=30),{200},'profile update')
          after=must(s.get(base+'/api/bootstrap',timeout=30),{200},'profile reread').json()['profile']
          assert after['consented_signal_types']==consent['signal_types']
          oversized=dict(after); oversized['allergies']=['X'*1000 for _ in range(100)]
          must(s.put(base+'/api/profile',json=oversized,timeout=30),{422},'oversized profile')

          pair=must(s.post(base+'/api/devices/pairing',timeout=30),{200},'pair create').json()
          device='security-device-'+suffix
          claim=must(requests.post(base+'/api/devices/pairing/claim',headers={'X-Serverless-Authorization':f'Bearer {cloud}'},json={'code':pair['code'],'device_id':device,'display_name':'Security Probe'},timeout=30),{200},'pair claim').json()
          must(s.delete(base+'/api/devices/'+claim['connection_id'],timeout=30),{200},'pre-sync disconnect')
          must(requests.post(base+'/api/devices/health-connect/sync',headers={'X-Serverless-Authorization':f'Bearer {cloud}','Authorization':'Bearer '+claim['access_token']},json={'device_id':device,'background_read':False,'granted_metrics':[],'records':[]},timeout=30),{401},'revoked device bearer')

          must(s.post(base+'/api/auth/logout',timeout=30),{200},'logout')
          replay=requests.Session(); replay.headers.update(cloud_h); replay.cookies.set('healthia_session',cookie)
          must(replay.get(base+'/api/bootstrap',timeout=30),{401},'old cookie replay')

          email2=f'sec-disable-{suffix}@example.com'; s2=requests.Session(); s2.headers.update(cloud_h)
          must(s2.post(base+'/api/auth/register',json={'email':email2,'password':pwd,'display_name':'Disable Live'},timeout=30),{201},'disable register')
          cookie2=s2.cookies.get('healthia_session'); assert cookie2
          firestore.Client(project=project).collection('healthia_one_accounts').document(hashlib.sha256(email2.encode()).hexdigest()).update({'disabled':True})
          replay2=requests.Session(); replay2.headers.update(cloud_h); replay2.cookies.set('healthia_session',cookie2)
          must(replay2.get(base+'/api/bootstrap',timeout=30),{401},'disabled cookie')

          email3=f'sec-rate-{suffix}@example.com'; s3=requests.Session(); s3.headers.update(cloud_h)
          must(s3.post(base+'/api/auth/register',json={'email':email3,'password':pwd,'display_name':'Rate Live'},timeout=30),{201},'rate register')
          statuses=[]
          for _ in range(8):
              r=requests.post(base+'/api/auth/login',headers=cloud_h,json={'email':email3,'password':'definitely-wrong'},timeout=30)
              statuses.append(r.status_code)
              if r.status_code==429: break
          assert 429 in statuses, statuses

          out={'schema':'healthia-security-live-proof/v2','status':'PASS','candidate_sha':sha,'cloud_revision':os.environ['HEALTHIA_SECURITY_REVISION'],'cloud_image':os.environ['HEALTHIA_SECURITY_IMAGE'],'checks':{'exact_release_sha':True,'cloud_auth_forced':True,'gemini_adk_ready':True,'firestore_ready':True,'canonical_consent':True,'oversized_profile_rejected':True,'pre_sync_disconnect_revocation':True,'logout_revocation':True,'disabled_account_revocation':True,'login_rate_limit':True}}
          os.makedirs('dist/security-live-proof',exist_ok=True)
          open('dist/security-live-proof/security-live.json','w',encoding='utf-8').write(json.dumps(out,indent=2))
          print('SECURITY_LIVE_BOUNDARIES_PASS',json.dumps(out['checks'],sort_keys=True))
          PY

      - name: Minimum IAM gate
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNTIME_SA@$PROJECT_ID.iam.gserviceaccount.com"
          roles="$(gcloud projects get-iam-policy "$PROJECT_ID" --flatten='bindings[].members' --filter="bindings.members=serviceAccount:$runtime" --format='value(bindings.role)' | sort)"
          echo "$roles" | grep -Fx 'roles/aiplatform.user'
          echo "$roles" | grep -Fx 'roles/datastore.user'
          if echo "$roles" | grep -Eq 'roles/(owner|editor|storage.objectAdmin|secretmanager.secretAccessor|run.admin|iam.serviceAccountAdmin)'; then exit 1; fi
          export IAM_ROLES="$roles"
          python - <<'PY'
          import json,os
          os.makedirs('dist/security-live-proof',exist_ok=True)
          open('dist/security-live-proof/iam.json','w',encoding='utf-8').write(json.dumps({'runtime_service_account':f"{os.environ['RUNTIME_SA']}@{os.environ['PROJECT_ID']}.iam.gserviceaccount.com",'project_roles':os.environ['IAM_ROLES'].splitlines()},indent=2))
          PY

      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-security-live-proof-f0c2f518-v2
          path: |
            dist/security-live-proof/
            deployment/security-live-cloud-permissions.json
            deployment/cloud-proof-latest.json
            deployment/cloud-provider-binding-latest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove isolated Cloud Run
        if: always()
        shell: bash
        run: gcloud run services delete "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --quiet || true

      - name: Checkout control branch for verdict publication
        if: always()
        uses: actions/checkout@v5
        with:
          ref: kira/security-live-proof-control
          path: control

      - name: Publish sanitized verdict to control branch
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -u
          live=false; iam=false; cloud=false; provider=false; regression=false; preflight=false
          test -f dist/security-live-proof/security-live.json && live=true
          test -f dist/security-live-proof/iam.json && iam=true
          test -f deployment/cloud-proof-latest.json && cloud=true
          test -f deployment/cloud-provider-binding-latest.json && provider=true
          test -f dist/security-live-proof/remote-regression.pass && regression=true
          test -f dist/security-live-proof/permission-preflight.pass && preflight=true
          status=FAIL
          if $live && $iam && $cloud && $provider && $regression && $preflight; then status=PASS; fi
          export LIVE="$live" IAM="$iam" CLOUD="$cloud" PROVIDER="$provider" REGRESSION="$regression" PREFLIGHT="$preflight" STATUS="$status"
          mkdir -p control/hackathon/security-live-control
          python - <<'PY'
          import json,os
          payload={'schema':'healthia-security-live-control/v1','status':os.environ['STATUS'],'candidate_sha':os.environ['CANDIDATE_SHA'],'run_id':os.environ['RUN_ID'],'run_attempt':os.environ['RUN_ATTEMPT'],'evidence':{'remote_regression':os.environ['REGRESSION']=='true','permission_preflight':os.environ['PREFLIGHT']=='true','cloud_strict_proof':os.environ['CLOUD']=='true','provider_exact_sha':os.environ['PROVIDER']=='true','live_boundaries':os.environ['LIVE']=='true','minimum_iam':os.environ['IAM']=='true'}}
          open('control/hackathon/security-live-control/latest.json','w',encoding='utf-8').write(json.dumps(payload,indent=2))
          PY
          if [ -f dist/security-live-proof/security-live.json ]; then cp dist/security-live-proof/security-live.json control/hackathon/security-live-control/security-live.json; fi
          if [ -f dist/security-live-proof/iam.json ]; then cp dist/security-live-proof/iam.json control/hackathon/security-live-control/iam.json; fi
          cd control
          git config user.name 'KIRA Security Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add hackathon/security-live-control
          git commit -m "evidence: publish security live proof verdict $RUN_ID" || true
          git push origin HEAD:kira/security-live-proof-control
