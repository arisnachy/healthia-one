name: One-shot revision marker verifier fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true
      - name: Validate revision marker through canonical bootstrap state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('deployment/verify_cloud_revision_continuity.py')
          text=p.read_text(encoding='utf-8')
          old='''    weight = _post_json(config, "/api/weight", {"weight_kg": weight_marker, "note": "synthetic revision continuity marker"})
    _require(abs(float(weight.get("weight_kg", 0)) - weight_marker) < 0.001, "Revision marker write failed")
'''
          new='''    _post_json(config, "/api/weight", {"weight_kg": weight_marker, "note": "synthetic revision continuity marker"})
    marker_state = _json(config, "GET", "/api/bootstrap")
    _require(
        any(abs(float(item.get("weight_kg", 0)) - weight_marker) < 0.001 for item in marker_state.get("weights") or []),
        "Revision marker was not persisted into canonical patient state",
    )
'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one direct weight-response assertion, found {text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          rm .github/workflows/one-shot-revision-marker-fix.yml
          git config user.name 'KIRA HealthIA CI'
          git config user.email 'actions@users.noreply.github.com'
          git add deployment/verify_cloud_revision_continuity.py .github/workflows/one-shot-revision-marker-fix.yml
          git diff --cached --check
          git commit -m 'cloud: verify revision marker through canonical patient state'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
