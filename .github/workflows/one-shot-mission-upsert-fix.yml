name: One-shot mission state race repair

on:
  push:
    branches:
      - kira/event-driven-results-twin-p1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/event-driven-results-twin-p1
          fetch-depth: 0
      - name: Make mission updates synchronous with chat responses
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('healthia_one/service.py')
          text = service.read_text(encoding='utf-8')
          old = '''            response.message.patient_id = state.profile.id\n            if response.mission is not None:\n                response.mission.patient_id = state.profile.id\n            state.messages.append(response.message)\n'''
          new = '''            response.message.patient_id = state.profile.id\n            if response.mission is None and response.message.mission_id:\n                response.mission = next(\n                    (item for item in state.missions if item.id == response.message.mission_id),\n                    None,\n                )\n            if response.mission is not None:\n                response.mission.patient_id = state.profile.id\n            state.messages.append(response.message)\n'''
          if old not in text:
              raise SystemExit('service mission response anchor not found')
          service.write_text(text.replace(old, new, 1), encoding='utf-8')

          app = Path('web/app.js')
          text = app.read_text(encoding='utf-8')
          old = '''    if (response.mission) state.data.missions.push(response.mission);\n    state.data.messages.push(response.message); renderMessage(response.message); renderContext(); renderMissions();\n'''
          new = '''    if (response.mission) {\n      const missionIndex = state.data.missions.findIndex(item => item.id === response.mission.id);\n      if (missionIndex >= 0) state.data.missions[missionIndex] = response.mission;\n      else state.data.missions.push(response.mission);\n    }\n    state.data.messages.push(response.message); renderMessage(response.message); renderContext(); renderMissions();\n'''
          if old not in text:
              raise SystemExit('frontend mission append anchor not found')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')

          smoke = Path('scripts/browser_smoke.py')
          text = smoke.read_text(encoding='utf-8')
          old = '''    if(response.mission) window.__mockSnapshot.missions.push(response.mission);\n    const interview=response.message?.metadata?.clinical_interview;\n'''
          new = '''    if(response.mission) {\n      const missionIndex=window.__mockSnapshot.missions.findIndex(item=>item.id===response.mission.id);\n      if(missionIndex>=0) window.__mockSnapshot.missions[missionIndex]=response.mission;\n      else window.__mockSnapshot.missions.push(response.mission);\n    }\n    const interview=response.message?.metadata?.clinical_interview;\n'''
          if old not in text:
              raise SystemExit('browser mock mission append anchor not found')
          smoke.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_chat_mission_response.py')
          test.write_text('''from pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef test_service_returns_updated_existing_mission_with_chat_response() -> None:\n    service = (ROOT / "healthia_one/service.py").read_text(encoding="utf-8")\n    assert "if response.mission is None and response.message.mission_id" in service\n    assert "item.id == response.message.mission_id" in service\n\n\ndef test_browser_upserts_missions_instead_of_appending_duplicates() -> None:\n    app = (ROOT / "web/app.js").read_text(encoding="utf-8")\n    assert "findIndex(item => item.id === response.mission.id)" in app\n    assert "state.data.missions[missionIndex] = response.mission" in app\n    assert "if (response.mission) state.data.missions.push(response.mission);" not in app\n''', encoding='utf-8')
          PY
          python -m pip install -e ".[test]" >/dev/null
          python -m pytest -q tests/test_chat_mission_response.py tests/test_chat_state_events.py tests/test_dynamic_clinical_questions.py
          node --check web/app.js
          git rm .github/workflows/one-shot-mission-upsert-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add healthia_one/service.py web/app.js scripts/browser_smoke.py tests/test_chat_mission_response.py
          git commit -m "fix: return and upsert updated chat missions synchronously"
          git push origin HEAD:kira/event-driven-results-twin-p1
