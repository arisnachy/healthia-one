name: Legacy manual Cloud proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delegated:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Explain authoritative Cloud gates
        shell: bash
        run: |
          echo "This legacy workflow is intentionally manual-only."
          echo "It must never deploy from workflow_run or from an ordinary pull-request update."
          echo "Use candidate-cloud-permission-readiness.yml for the explicit enabled=true exact-candidate Cloud + browser proof."
          echo "Use candidate-cloud-revision-continuity.yml for the separate explicit cross-revision persistence proof."
          echo "This file remains only as a non-billable pointer so stale external references do not trigger Cloud work."
