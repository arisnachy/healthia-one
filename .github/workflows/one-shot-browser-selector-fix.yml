name: One-shot browser selector fix and budget check

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-judge
      EXPECTED_REVISION: healthia-one-judge-00005-xh8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true
      - name: Make chat navigation selector unambiguous
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          proof=Path('scripts/cloud_browser_judge_proof.py')
          text=proof.read_text(encoding='utf-8')
          old='''        page.locator('[data-open="chat"]').click()\n'''
          new='''        page.locator('.main-nav [data-open="chat"]').click()\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one ambiguous chat click, found {text.count(old)}')
          proof.write_text(text.replace(old,new,1),encoding='utf-8')

          test=Path('tests/test_frontend_runtime_hygiene.py')
          body=test.read_text(encoding='utf-8').rstrip()
          marker='def test_real_cloud_browser_navigation_is_unambiguous() -> None:'
          addition='''def test_real_cloud_browser_navigation_is_unambiguous() -> None:\n    proof = (ROOT / "scripts" / "cloud_browser_judge_proof.py").read_text(encoding="utf-8")\n    assert "page.locator('.main-nav [data-open=\\\"chat\\\"]').click()" in proof\n    assert "page.locator('[data-open=\\\"chat\\\"]').click()" not in proof'''
          if marker not in body:
              test.write_text(body+'\n\n\n'+addition+'\n',encoding='utf-8')
          PY
          python -m py_compile scripts/cloud_browser_judge_proof.py
          rm .github/workflows/one-shot-browser-selector-fix.yml
          git config user.name 'KIRA HealthIA CI'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/cloud_browser_judge_proof.py tests/test_frontend_runtime_hygiene.py .github/workflows/one-shot-browser-selector-fix.yml
          git diff --cached --check
          git commit -m 'test: use unambiguous chat navigation in Cloud browser proof'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a
      - name: Read current Cloud AI request budget without spending it
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          test "$revision" = "$EXPECTED_REVISION"
          token="$(gcloud auth print-identity-token --audiences="$url")"
          echo "::add-mask::$token"
          curl -fsS -H "Authorization: Bearer ${token}" "$url/api/readiness" > /tmp/readiness.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/readiness.json',encoding='utf-8'))
          c=p.get('cost_control') or {}
          print('HEALTHIA_BROWSER_REQUESTS_USED=', c.get('requests_used'))
          print('HEALTHIA_BROWSER_REQUESTS_REMAINING=', c.get('requests_remaining'))
          assert p.get('ready') is True and p.get('ai_ready') is True and p.get('adk_ready') is True
          PY
