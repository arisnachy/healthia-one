name: KIRA Wave 3 deterministic ordinal selection fix runner

on:
  push:
    branches:
      - kira/google-constellation-wave2-live
    paths:
      - .github/workflows/kira-wave3-deterministic-ordinal-selection-fix-runner.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/google-constellation-wave2-live
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic ordinal candidate-selection patch
        run: python .kira/apply_wave3_deterministic_ordinal_selection_fix.py
      - name: Normalize generated files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('healthia_one/google_mission_chat.py','tests/test_google_mission_conversation_autonomy.py'):
              p=Path(name)
              p.write_text(p.read_text(encoding='utf-8').rstrip()+'\n',encoding='utf-8')
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run focused ordinal and mission regressions
        run: |
          python -m pytest -q tests/test_google_mission_conversation_autonomy.py tests/test_google_mission_location_consent.py tests/test_wave3_repro_hardening.py tests/test_wave3_exact_head_one_take.py
      - name: Run mission-wide static and judge gates
        run: |
          python -m compileall -q healthia_one tests
          python scripts/dialogbench.py
          python scripts/judge_omega.py
      - name: Push only tested product and regression files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KIRA Omega'
          git config user.email 'actions@users.noreply.github.com'
          git add healthia_one/google_mission_chat.py tests/test_google_mission_conversation_autonomy.py
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git commit -m 'KIRA Wave 3: resolve explicit candidate ordinals deterministically'
          git push origin HEAD:kira/google-constellation-wave2-live
          echo HEALTHIA_WAVE3_DETERMINISTIC_ORDINAL_FIX_PUSHED
