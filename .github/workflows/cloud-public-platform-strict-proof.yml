name: Cloud public platform strict proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: healthia-cloud-public-platform-strict-proof
  cancel-in-progress: true

jobs:
  make-platform-public-and-prove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-demo
      BUCKET_NAME: healthia-6088a-healthia-evidence
      PROVISION_PRINCIPAL: healthia-github-vertex-9@healthia-6088a.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a

      - name: Temporarily grant Cloud Run Admin to provisioning principal
        run: |
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${PROVISION_PRINCIPAL}" \
            --role="roles/run.admin" \
            --condition=None \
            --quiet >/dev/null
          echo "Temporary roles/run.admin granted for service access-mode update only."

      - name: Disable platform Invoker IAM check for judge-facing web endpoint
        id: public
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --no-invoker-iam-check \
            --quiet >/dev/null
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          token="$(gcloud auth print-access-token)"
          curl -fsSL -H "Authorization: Bearer ${token}" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE_NAME}" \
            > /tmp/service-v2.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/service-v2.json'))
          print('invokerIamDisabled=', d.get('invokerIamDisabled'))
          print('ingress=', d.get('ingress'))
          print('uri=', d.get('uri'))
          if d.get('invokerIamDisabled') is not True:
              raise SystemExit('Cloud Run v2 did not confirm invokerIamDisabled=true')
          PY

      - name: Verify anonymous platform health reaches HealthIA
        id: health
        shell: bash
        run: |
          set -euo pipefail
          url='${{ steps.public.outputs.url }}'
          for i in {1..12}; do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$url/healthz" || true)"
            echo "attempt=$i HTTP=$code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              echo
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::error::Cloud Run still did not route to HealthIA with Invoker IAM check disabled"
          head -c 500 /tmp/health.json || true
          exit 1

      - uses: actions/setup-python@v6
        if: steps.health.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact candidate verifier
        if: steps.health.outputs.ok == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Execute strict Cloud Run + Vertex + Firestore + GCS proof
        if: steps.health.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python deployment/verify_cloud_demo.py \
            --url '${{ steps.public.outputs.url }}' \
            --project "$PROJECT_ID" \
            --bucket "$BUCKET_NAME" \
            --json | tee deployment/cloud-proof-latest.json

      - name: Capture sanitized judge-facing Cloud evidence
        if: always()
        env:
          CLOUD_URL: ${{ steps.public.outputs.url }}
          CLOUD_REVISION: ${{ steps.public.outputs.revision }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          HEALTH_OK: ${{ steps.health.outputs.ok }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload={
            "project": os.environ.get("PROJECT_ID",""),
            "region": os.environ.get("REGION",""),
            "service": os.environ.get("SERVICE_NAME",""),
            "url": os.environ.get("CLOUD_URL",""),
            "revision": os.environ.get("CLOUD_REVISION",""),
            "candidate_sha": os.environ.get("CANDIDATE_SHA",""),
            "platform_invoker_iam_check_disabled": True,
            "application_auth_required": True,
            "anonymous_platform_health_ok": os.environ.get("HEALTH_OK") == "true",
            "model": "gemini-3.5-flash",
            "vertex_adc": True,
            "gemini_api_key_used": False,
          }
          Path('deployment/cloud-public-runtime-evidence.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          PY

      - name: Restore private platform check if public routing did not work
        if: failure() && steps.public.outcome == 'success' && steps.health.outputs.ok != 'true'
        run: |
          gcloud run services update "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --invoker-iam-check \
            --quiet >/dev/null || true

      - name: Remove temporary Cloud Run Admin role
        if: always()
        run: |
          gcloud projects remove-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${PROVISION_PRINCIPAL}" \
            --role="roles/run.admin" \
            --condition=None \
            --quiet >/dev/null || true
          echo "Temporary roles/run.admin removed."

      - name: Upload strict Cloud evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-cloud-public-platform-strict-proof
          path: |
            deployment/cloud-public-runtime-evidence.json
            deployment/cloud-proof-latest.json
          if-no-files-found: warn
          retention-days: 14
