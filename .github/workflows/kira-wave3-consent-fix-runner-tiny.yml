name: KIRA Wave 3 tiny consent auto-resume fixer

on:
  push:
    branches: [kira/google-constellation-wave2-live]
    paths: [.github/workflows/kira-wave3-consent-fix-runner-tiny.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/google-constellation-wave2-live
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply staged product and regression patch
        run: python .kira/apply_wave3_consent_autoresume_fix.py
      - name: Run focused mission consent regressions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest -q tests/test_google_mission_location_consent.py tests/test_google_mission_conversation_autonomy.py
      - name: Push only tested product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KIRA Omega'
          git config user.email 'actions@users.noreply.github.com'
          git add healthia_one/google_mission_chat.py tests/test_google_mission_location_consent.py
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git commit -m 'KIRA Wave 3: auto-resume safe Places search after mission location consent'
          git push origin HEAD:kira/google-constellation-wave2-live
