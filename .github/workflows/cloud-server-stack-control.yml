name: Cloud server stack control

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: healthia-cloud-server-stack-control
  cancel-in-progress: true

jobs:
  server-stack-control:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SOURCE_SERVICE: healthia-one-judge
      CONTROL_SERVICE: healthia-server-control
      PROVISION_PRINCIPAL: healthia-github-vertex-9@healthia-6088a.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a

      - name: Temporarily grant Cloud Run Admin
        run: |
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${PROVISION_PRINCIPAL}" \
            --role="roles/run.admin" --condition=None --quiet >/dev/null

      - name: Resolve immutable HealthIA image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          curl -fsSL -H "Authorization: Bearer ${token}" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${SOURCE_SERVICE}" > /tmp/source.json
          image="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/source.json'))
          print(((d.get('template') or {}).get('containers') or [{}])[0].get('image',''))
          PY
          )"
          test -n "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "image=$image"

      - name: Control A - Python stdlib HTTP server
        id: stdlib
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$CONTROL_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image '${{ steps.image.outputs.image }}' \
            --command python \
            --args=-m,http.server,8080,--bind,0.0.0.0 \
            --min 0 --max 1 \
            --no-invoker-iam-check \
            --quiet >/dev/null
          token="$(gcloud auth print-access-token)"
          curl -fsSL -H "Authorization: Bearer ${token}" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${CONTROL_SERVICE}" > /tmp/service.json
          url="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/service.json'))
          urls=d.get('urls') or []
          print(urls[0] if urls else d.get('uri',''))
          PY
          )"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          code=000
          for i in {1..15}; do
            code="$(curl -sS -o /tmp/stdlib-body.txt -w '%{http_code}' "$url/" || true)"
            echo "stdlib attempt=$i HTTP=$code"
            [ "$code" = 200 ] && break
            sleep 2
          done
          echo "stdlib_http=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != 200 ]; then
            echo "::error::Same image could not serve even with Python stdlib HTTP server"
            exit 1
          fi
          echo "HEALTHIA_SAME_IMAGE_STDLIB_HTTP_OK"

      - name: Control B - Uvicorn forced asyncio + h11
        id: h11
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "$CONTROL_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --command python \
            --args=-m,uvicorn,app.main:app,--host,0.0.0.0,--port,8080,--loop,asyncio,--http,h11,--log-level,info \
            --quiet >/dev/null
          url='${{ steps.stdlib.outputs.url }}'
          code=000
          for i in {1..20}; do
            code="$(curl -sS -o /tmp/h11-body.txt -w '%{http_code}' "$url/healthz" || true)"
            echo "h11 attempt=$i HTTP=$code"
            [ "$code" = 200 ] && break
            sleep 2
          done
          echo "h11_http=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 200 ]; then
            echo "HEALTHIA_UVICORN_ASYNCIO_H11_OK"
          else
            echo "HEALTHIA_UVICORN_ASYNCIO_H11_FAILED"
          fi

      - name: Control C - Uvicorn explicit auto stack
        id: auto
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "$CONTROL_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --command python \
            --args=-m,uvicorn,app.main:app,--host,0.0.0.0,--port,8080,--log-level,info \
            --quiet >/dev/null
          url='${{ steps.stdlib.outputs.url }}'
          code=000
          for i in {1..20}; do
            code="$(curl -sS -o /tmp/auto-body.txt -w '%{http_code}' "$url/healthz" || true)"
            echo "auto attempt=$i HTTP=$code"
            [ "$code" = 200 ] && break
            sleep 2
          done
          echo "auto_http=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 200 ]; then
            echo "HEALTHIA_UVICORN_AUTO_OK"
          else
            echo "HEALTHIA_UVICORN_AUTO_FAILED"
          fi

      - name: Summarize sanitized comparison
        if: always()
        env:
          STDLIB: ${{ steps.stdlib.outputs.stdlib_http }}
          H11: ${{ steps.h11.outputs.h11_http }}
          AUTO: ${{ steps.auto.outputs.auto_http }}
        run: |
          mkdir -p deployment
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload={
            'same_image': True,
            'stdlib_http': os.environ.get('STDLIB',''),
            'uvicorn_asyncio_h11_http': os.environ.get('H11',''),
            'uvicorn_auto_http': os.environ.get('AUTO',''),
          }
          print(json.dumps(payload,indent=2))
          Path('deployment/cloud-server-stack-control.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          PY

      - name: Delete ephemeral server control
        if: always()
        run: |
          gcloud run services delete "$CONTROL_SERVICE" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null || true

      - name: Remove temporary Cloud Run Admin
        if: always()
        run: |
          gcloud projects remove-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${PROVISION_PRINCIPAL}" \
            --role="roles/run.admin" --condition=None --quiet >/dev/null || true

      - name: Upload server-stack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-cloud-server-stack-control
          path: deployment/cloud-server-stack-control.json
          if-no-files-found: warn
          retention-days: 7
