name: KIRA Wave 3 Maps secret metadata read-only once

on:
  pull_request:
    branches:
      - kira/golden-google-constellation-live-891745e1
    paths:
      - .github/workflows/kira-wave3-maps-secret-metadata-readonly-once.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      PROJECT_ID: healthia-6088a
      MAPS_GITHUB_SECRET: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 888d54171b08fd26347cf3e688d02690da99221b
      - name: Authenticate read-only metadata identity
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Report only secret presence and matching Secret Manager names
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$MAPS_GITHUB_SECRET" ]]; then github_present=true; else github_present=false; fi
          mapfile -t names < <(gcloud secrets list --project "$PROJECT_ID" --format='value(name)' 2>/dev/null | grep -Ei 'map|place' || true)
          python - "$github_present" "${names[@]}" <<'PY'
          import json,sys
          github_present=sys.argv[1].lower()=='true'
          names=sys.argv[2:]
          print(json.dumps({
            'status':'PASS',
            'github_maps_secret_present':github_present,
            'matching_secret_manager_names':names,
            'secret_values_exposed':False,
            'provider_write':False,
            'api_enable_mutation':False,
            'iam_mutation':False,
          },indent=2,sort_keys=True))
          PY
