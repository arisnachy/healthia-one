name: HealthIA private Run invocation probe

on:
  push:
    branches: [kira/autonomous-continuity-mainline]
    paths: [".github/workflows/private-run-invocation-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE: healthia-one-autopilot
    steps:
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Authenticated GET against private Cloud Run only
        shell: bash
        run: |
          set -euo pipefail
          project_number="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          url="https://${SERVICE}-${project_number}.${REGION}.run.app"
          anonymous="$(curl -sS -o /dev/null -w '%{http_code}' "$url/healthz" || true)"
          [[ -n "$anonymous" && ! "$anonymous" =~ ^2 ]]
          token="$(gcloud auth print-identity-token --audiences="$url")"
          test -n "$token"
          code="$(curl -sS -o /tmp/health.json -w '%{http_code}' -H "Authorization: Bearer $token" "$url/healthz")"
          echo "anonymous_http=${anonymous} authenticated_http=${code}"
          [[ "$code" == "200" ]]
          jq '{status,worker,mainline_autonomy,care_continuity_schedule}' /tmp/health.json
