name: HealthIA private Run invocation probe

on:
  push:
    branches: [kira/autonomous-continuity-mainline]
    paths: [".github/workflows/private-run-invocation-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE: healthia-one-autopilot
    steps:
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Resolve and test all private Cloud Run URLs
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/service.json
          project_number="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          canonical="https://${SERVICE}-${project_number}.${REGION}.run.app"
          status_url="$(jq -r '.status.url // empty' /tmp/service.json)"
          annotation_urls="$(jq -r '.metadata.annotations["run.googleapis.com/urls"] // "[]"' /tmp/service.json | jq -r '.[]?' 2>/dev/null || true)"
          printf '%s\n%s\n%s\n' "$status_url" "$canonical" "$annotation_urls" | awk 'NF && !seen[$0]++' > /tmp/urls.txt
          winner=''
          while IFS= read -r url; do
            anonymous="$(curl -sS -o /dev/null -w '%{http_code}' "$url/healthz" || true)"
            token="$(gcloud auth print-identity-token --audiences="$url" 2>/dev/null || true)"
            authcode='token-failed'
            if [[ -n "$token" ]]; then
              authcode="$(curl -sS -o /tmp/health.json -w '%{http_code}' -H "Authorization: Bearer $token" "$url/healthz" || true)"
            fi
            echo "candidate=$(sed -E 's#https://[^.]+#https://[service]#' <<<"$url") anonymous=${anonymous} authenticated=${authcode}"
            if [[ "$authcode" == "200" ]]; then
              winner="$url"
              jq '{status,worker,mainline_autonomy,care_continuity_schedule}' /tmp/health.json
              break
            fi
          done < /tmp/urls.txt
          test -n "$winner"
          echo "PRIVATE_RUN_INVOCATION=PASS"
