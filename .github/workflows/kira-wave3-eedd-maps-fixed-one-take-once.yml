name: KIRA Wave 3 Maps-fixed exact-head one-take once

on:
  push:
    branches:
      - kira/google-constellation-wave2-live
    paths:
      - .github/workflows/kira-wave3-eedd-maps-fixed-one-take-once.yml

permissions:
  contents: read

concurrency:
  group: healthia-wave3-eedd-maps-fixed-one-take
  cancel-in-progress: false

env:
  CANDIDATE_SHA: eeddacffda9f41e1e3f5cdec0402947a33033b88
  PROJECT_ID: healthia-6088a
  REGION: us-central1
  SERVICE_NAME: healthia-one-demo
  GCS_BUCKET: healthia-6088a-healthia-evidence
  MAPS_SECRET_NAME: healthia-google-maps-api-key

jobs:
  one-take:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Bind authorized corrective candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$CANDIDATE_SHA" = "eeddacffda9f41e1e3f5cdec0402947a33033b88"
          authorization='I_AUTHORIZE_WAVE3_EXACT_CLOUD_ONE_TAKE'
          test "$authorization" = 'I_AUTHORIZE_WAVE3_EXACT_CLOUD_ONE_TAKE'
          echo HEALTHIA_WAVE3_CORRECTIVE_SHA_AUTHORIZED

      - uses: actions/checkout@v4
        with:
          ref: eeddacffda9f41e1e3f5cdec0402947a33033b88
          fetch-depth: 0

      - name: Prove exact source before any Cloud spend
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Exact-head preflight before Cloud spend
        run: |
          python -m pytest -q tests/test_wave3_repro_hardening.py tests/test_google_mission_location_consent.py tests/test_wave3_exact_head_one_take.py
          python scripts/full_system_check.py
          python scripts/dialogbench.py
          python scripts/judge_omega.py

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Reconfirm existing Maps secret metadata without value access
        shell: bash
        run: |
          set -euo pipefail
          state="$(gcloud secrets versions describe latest --secret "$MAPS_SECRET_NAME" --project "$PROJECT_ID" --format='value(state)')"
          test "$state" = ENABLED
          echo HEALTHIA_MAPS_SECRET_ENABLED_VALUE_NOT_ACCESSED

      - name: Deploy exact candidate bounded to 20 model requests
        shell: pwsh
        run: ./deployment/deploy-cloud-demo.ps1 -ProjectId $env:PROJECT_ID -RequestLimit 20 -Confirmed

      - name: Bind exact deployed revision
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          image="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          token="$(gcloud auth print-identity-token --audiences="$url")"
          test -n "$url" && test -n "$revision" && test -n "$image" && test -n "$token"
          echo "::add-mask::$token"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Prove Maps is mounted from Secret Manager on deployed revision
        shell: bash
        env:
          REVISION: ${{ steps.cloud.outputs.revision }}
        run: |
          set -euo pipefail
          gcloud run revisions describe "$REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/revision.json
          python - <<'PY'
          import json
          rev=json.load(open('/tmp/revision.json',encoding='utf-8'))
          containers=(rev.get('spec') or {}).get('containers') or []
          matches=[]
          for container in containers:
              for item in container.get('env') or []:
                  if item.get('name')=='GOOGLE_MAPS_API_KEY': matches.append(item)
          if len(matches)!=1: raise SystemExit(f'Expected exactly one GOOGLE_MAPS_API_KEY env binding, got {len(matches)}')
          item=matches[0]
          if str(item.get('value') or ''): raise SystemExit('Maps key must not be mounted as plaintext env value')
          ref=((item.get('valueFrom') or {}).get('secretKeyRef') or {})
          if ref.get('name')!='healthia-google-maps-api-key': raise SystemExit('Maps env is not bound to expected Secret Manager secret')
          if str(ref.get('key') or '')!='latest': raise SystemExit('Maps env is not bound to latest secret version')
          print('HEALTHIA_MAPS_SECRET_BINDING_PASS value_exposed=false')
          PY
          rm -f /tmp/revision.json

      - name: Strict Cloud Gemini ADK proof before recorder
        env:
          HEALTHIA_CLOUD_URL: ${{ steps.cloud.outputs.url }}
          HEALTHIA_CLOUD_ID_TOKEN: ${{ steps.cloud.outputs.token }}
          HEALTHIA_GCS_BUCKET: ${{ env.GCS_BUCKET }}
        run: python deployment/verify_cloud_demo.py

      - name: Install isolated Chromium recorder
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Record one continuous Wave 3 judge journey
        env:
          HEALTHIA_CLOUD_URL: ${{ steps.cloud.outputs.url }}
          HEALTHIA_CLOUD_ID_TOKEN: ${{ steps.cloud.outputs.token }}
          HEALTHIA_CLOUD_REVISION: ${{ steps.cloud.outputs.revision }}
          HEALTHIA_CLOUD_IMAGE: ${{ steps.cloud.outputs.image }}
          HEALTHIA_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          HEALTHIA_CLOUD_REGION: ${{ env.REGION }}
          HEALTHIA_CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          HEALTHIA_GCS_BUCKET: ${{ env.GCS_BUCKET }}
          HEALTHIA_DEMO_TARGET_SECONDS: "285"
        run: python scripts/record_submission_demo.py

      - name: Verify all seven Wave 3 semantic gates
        shell: bash
        run: |
          set -euo pipefail
          python - "$CANDIDATE_SHA" <<'PY'
          import json,pathlib,sys
          expected=sys.argv[1]
          report=json.loads(pathlib.Path('dist/submission-demo/report.json').read_text(encoding='utf-8'))
          if report.get('status')!='PASS': raise SystemExit('recorder report is not PASS')
          if report.get('candidate_sha')!=expected: raise SystemExit('candidate SHA mismatch')
          required={
            'wave3_unanchored_reference_fails_closed',
            'wave3_evidence_backed_reference_resolution',
            'wave3_places_stops_before_mission_location_consent',
            'wave3_mission_scoped_location_consent_then_real_places',
            'wave3_ordinal_resumes_and_selects_durable_mission',
            'relogin_continuity_including_google_mission',
            'zero_browser_console_or_page_errors',
          }
          checks=set(report.get('checks') or [])
          missing=sorted(required-checks)
          if missing: raise SystemExit(f'missing semantic gates: {missing}')
          print('HEALTHIA_WAVE3_SEVEN_GATES_PASS')
          PY

      - name: Verify continuous one-take duration
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          video="$(find dist/submission-demo/video -type f -name '*.webm' | head -n1)"
          test -n "$video"
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$video")"
          python - "$duration" <<'PY'
          import sys
          d=float(sys.argv[1])
          if not 250 <= d <= 360: raise SystemExit(f'duration outside 250-360s: {d:.2f}')
          print(f'HEALTHIA_WAVE3_DURATION_PASS {d:.2f}s')
          PY

      - name: Build sanitized private evidence envelope
        if: success()
        shell: bash
        env:
          REVISION: ${{ steps.cloud.outputs.revision }}
          IMAGE: ${{ steps.cloud.outputs.image }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('dist/submission-demo')
          report=json.loads((root/'report.json').read_text(encoding='utf-8'))
          video=next((root/'video').glob('*.webm'))
          out={
            'status':'LIVE_PASS',
            'candidate_sha':os.environ['CANDIDATE_SHA'],
            'cloud_revision':os.environ['REVISION'],
            'cloud_image':os.environ['IMAGE'],
            'maps_secret_manager_binding':True,
            'maps_secret_value_exposed':False,
            'video_sha256':hashlib.sha256(video.read_bytes()).hexdigest(),
            'checks':report.get('checks') or [],
            'synthetic_only':bool(report.get('synthetic_only')),
            'public_release_performed':False,
            'veo_invoked':False,
            'new_api_enabled':False,
            'secret_material_exposed':False,
          }
          (root/'wave3_exact_head_evidence.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in out.items() if k not in {'cloud_image','video_sha256'}},sort_keys=True))
          PY

      - name: Upload private PASS or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave3-eedd-Maps-fixed-one-take
          path: dist/submission-demo
          if-no-files-found: warn
          retention-days: 30
