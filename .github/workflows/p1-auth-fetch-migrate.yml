name: P1 authenticated fetch migration

on:
  push:
    branches:
      - kira/omega-100-agentic-runtime

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/omega-100-agentic-runtime
          fetch-depth: 1
      - name: Route every patient module through authenticated transport and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          web = Path("web")
          changed = []
          for path in web.glob("*.js"):
              if path.name in {"app.js", "auth.js"}:
                  continue
              text = path.read_text(encoding="utf-8")
              if "fetch(" not in text:
                  continue
              updated = text.replace("fetch(", "(window.healthiaFetch || fetch)(")
              path.write_text(updated, encoding="utf-8")
              changed.append(path.name)

          offenders = []
          for path in web.glob("*.js"):
              if path.name in {"app.js", "auth.js"}:
                  continue
              if "fetch(" in path.read_text(encoding="utf-8"):
                  offenders.append(path.name)
          if offenders:
              raise SystemExit("Raw fetch remains in: " + ", ".join(offenders))
          print("Authenticated transport migrated:", ", ".join(changed) or "none")
          PY
          rm .github/workflows/p1-auth-fetch-migrate.yml
          git config user.name "KIRA FORJA verification"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: authenticate every patient-facing API module"
          git push origin HEAD:kira/omega-100-agentic-runtime
