name: Google Health Constellation live proof

on:
  pull_request:
    paths:
      - ".github/workflows/google-cloud-live-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthia-wave2-scheduler-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  scheduler-natural-observer:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE: healthia-gmail-worker
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Extract sanitized natural Scheduler outcome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/wave2-scheduler-live
          worker_url="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          latest_revision="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          date_utc="$(date -u +%Y-%m-%d)"
          start="${date_utc}T04:59:00Z"
          end="${date_utc}T05:02:30Z"

          rows="$(gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE} AND timestamp>=\"${start}\" AND timestamp<=\"${end}\"" \
            --project "$PROJECT_ID" --limit 300 --order=asc --format=json || printf '[]')"
          scheduler_rows="$(gcloud logging read \
            "resource.type=cloud_scheduler_job AND resource.labels.job_id=\"healthia-gmail-watch-renewal\" AND timestamp>=\"${start}\" AND timestamp<=\"${end}\"" \
            --project "$PROJECT_ID" --limit 50 --order=asc --format=json || printf '[]')"

          python - "$worker_url" "$latest_revision" "$rows" "$scheduler_rows" <<'PY'
          import json,sys
          worker_url,latest=sys.argv[1],sys.argv[2]
          rows=json.loads(sys.argv[3] or '[]')
          scheduler_rows=json.loads(sys.argv[4] or '[]')

          http=[]
          outcome=[]
          wanted={'scheduler_request_bound','scheduler_job_bound','processed_count','renewed_count'}

          def harvest(obj, acc):
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      if k in wanted:
                          acc[k]=v
                      harvest(v,acc)
              elif isinstance(obj,list):
                  for v in obj:
                      harvest(v,acc)
              elif isinstance(obj,str) and any(k in obj for k in wanted):
                  try:
                      parsed=json.loads(obj)
                  except Exception:
                      parsed=None
                  if parsed is not None:
                      harvest(parsed,acc)
                  else:
                      for k in wanted:
                          needle=f'"{k}":'
                          if needle in obj:
                              tail=obj.split(needle,1)[1].lstrip()
                              if tail.startswith('true'): acc[k]=True
                              elif tail.startswith('false'): acc[k]=False
                              else:
                                  num=''
                                  for ch in tail:
                                      if ch in '-0123456789': num+=ch
                                      else: break
                                  if num: acc[k]=int(num)

          for row in rows:
              req=row.get('httpRequest') or {}
              if str(req.get('requestUrl') or '') == f'{worker_url}/scheduled/renew-gmail-watches':
                  http.append({
                      'timestamp':str(row.get('timestamp') or ''),
                      'revision':str(((row.get('resource') or {}).get('labels') or {}).get('revision_name') or ''),
                      'status':int(req.get('status') or 0),
                  })
              acc={}
              harvest(row.get('jsonPayload'),acc)
              harvest(row.get('textPayload'),acc)
              if acc:
                  outcome.append({
                      'timestamp':str(row.get('timestamp') or ''),
                      'revision':str(((row.get('resource') or {}).get('labels') or {}).get('revision_name') or ''),
                      **{k:acc.get(k) for k in sorted(wanted) if k in acc},
                  })

          scheduler=[]
          for row in scheduler_rows:
              scheduler.append({
                  'timestamp':str(row.get('timestamp') or ''),
                  'severity':str(row.get('severity') or ''),
              })

          best=None
          for item in outcome:
              if all(k in item for k in wanted):
                  best=item
                  break
          pass_http=any(x['status']==200 and x['revision']==latest for x in http)
          strict_noop=bool(best and best.get('scheduler_request_bound') is True and best.get('scheduler_job_bound') is True and best.get('processed_count')==0 and best.get('renewed_count')==0)
          out={
              'status':'OUTCOME_FOUND' if best else 'OUTCOME_NOT_FOUND',
              'latest_worker_revision':latest,
              'natural_scheduler_http_200_expected_revision':pass_http,
              'worker_http_requests':http,
              'scheduler_outcomes':outcome,
              'cloud_scheduler_event_count':len(scheduler),
              'strict_noop_fields_pass':strict_noop,
              'iam_mutation':False,
              'secret_material_exposed':False,
          }
          path='dist/wave2-scheduler-live/diagnostic.json'
          open(path,'w',encoding='utf-8').write(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps({'http200_expected_revision':pass_http,'outcome_found':bool(best),'strict_noop_fields_pass':strict_noop},sort_keys=True))
          PY
          if grep -Eiq '(patient_|@|refresh_token|client_secret|access_token|id_token|ya29\.)' dist/wave2-scheduler-live/diagnostic.json; then
            rm -f dist/wave2-scheduler-live/diagnostic.json
            exit 1
          fi
      - name: Upload sanitized Scheduler diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave2-Scheduler-Diagnostic
          path: dist/wave2-scheduler-live
          if-no-files-found: error
          retention-days: 30
