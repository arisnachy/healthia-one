name: Google Health Constellation live proof

on:
  pull_request:
    paths:
      - ".github/workflows/google-cloud-live-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthia-wave2-scheduler-retrospective-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  scheduler-retrospective-proof:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE: healthia-gmail-worker
      BASELINE_FINGERPRINT: ba8e70d1ff08fe90bba69f3eb55a80454ec077d55ee1e2460bfdc6f137c134c0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Install read-only Firestore client
        run: python -m pip install --quiet google-cloud-firestore
      - name: Correlate Scheduler provider event with persisted no-op state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/wave2-scheduler-live
          worker_url="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          latest_revision="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          date_utc="2026-08-10"
          start="${date_utc}T04:59:00Z"
          end="${date_utc}T05:02:30Z"

          run_rows="$(gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE} AND timestamp>=\"${start}\" AND timestamp<=\"${end}\"" \
            --project "$PROJECT_ID" --limit 300 --order=asc --format=json)"
          scheduler_rows="$(gcloud logging read \
            "resource.type=cloud_scheduler_job AND resource.labels.job_id=\"healthia-gmail-watch-renewal\" AND timestamp>=\"${start}\" AND timestamp<=\"${end}\"" \
            --project "$PROJECT_ID" --limit 50 --order=asc --format=json)"

          export WORKER_URL="$worker_url" LATEST_REVISION="$latest_revision" RUN_ROWS="$run_rows" SCHEDULER_ROWS="$scheduler_rows"
          python - <<'PY'
          import hashlib, json, os, time
          from google.cloud import firestore

          project=os.environ['PROJECT_ID']
          worker_url=os.environ['WORKER_URL']
          latest=os.environ['LATEST_REVISION']
          baseline=os.environ['BASELINE_FINGERPRINT']
          run_rows=json.loads(os.environ.get('RUN_ROWS') or '[]')
          scheduler_rows=json.loads(os.environ.get('SCHEDULER_ROWS') or '[]')

          http=[]
          for row in run_rows:
              req=row.get('httpRequest') or {}
              if str(req.get('requestUrl') or '') == f'{worker_url}/scheduled/renew-gmail-watches':
                  http.append({
                      'timestamp':str(row.get('timestamp') or ''),
                      'revision':str(((row.get('resource') or {}).get('labels') or {}).get('revision_name') or ''),
                      'status':int(req.get('status') or 0),
                  })
          natural=[x for x in http if x['status']==200 and x['revision']==latest]
          assert natural, 'No HTTP 200 natural Scheduler request on expected private worker revision'

          scheduler=[]
          for row in scheduler_rows:
              payload=row.get('jsonPayload') or {}
              status=payload.get('status') or {}
              if isinstance(status, dict):
                  status_code=status.get('code')
              else:
                  status_code=None
              scheduler.append({
                  'timestamp':str(row.get('timestamp') or ''),
                  'severity':str(row.get('severity') or ''),
                  'target_type':str(payload.get('targetType') or ''),
                  'status_code':status_code,
              })
          assert len(scheduler) >= 2, f'Expected Scheduler attempt lifecycle, got {len(scheduler)} events'

          client=firestore.Client(project=project)
          connections={d.id:(d.to_dict() or {}) for d in client.collection('healthia_google_oauth_connections').stream()}
          candidates=[]
          for d in client.collection('healthia_gmail_watch_state').stream():
              watch=d.to_dict() or {}
              conn=connections.get(d.id) or {}
              if bool(watch.get('enabled', True)) and bool(conn.get('enabled', False)):
                  candidates.append((d.id, watch))
          assert len(candidates)==1, f'Expected exactly one controlled enabled OAuth+watch pair, got {len(candidates)}'
          _, watch=candidates[0]
          history=str(watch.get('history_id') or '')
          expiration=watch.get('expiration_ms')
          assert history.isdigit(), 'Watch history id is not numeric'
          assert isinstance(expiration, int) and expiration > int(time.time()*1000), 'Watch expiration is not future'
          after=hashlib.sha256(f'{history}:{expiration}'.encode()).hexdigest()
          assert after == baseline, 'Persisted Gmail watch changed after natural Scheduler invocation'

          proof={
              'status':'LIVE_PASS_RETROSPECTIVE',
              'provider':'Cloud Scheduler + private Cloud Run + Firestore watch state',
              'natural_scheduler_http_status':200,
              'natural_scheduler_timestamp':natural[0]['timestamp'],
              'worker_revision':latest,
              'cloud_scheduler_event_count':len(scheduler),
              'cloud_scheduler_execution_correlated':True,
              'scheduler_headers_directly_observed':False,
              'scheduler_header_observation_gap_reason':'prior worker logger was not attached to Cloud Run handler',
              'watch_fingerprint_unchanged':True,
              'gmail_watch_expiration_future':True,
              'second_effect_noop':True,
              'iam_mutation':False,
              'secret_material_exposed':False,
          }
          path='dist/wave2-scheduler-live/proof.json'
          open(path,'w',encoding='utf-8').write(json.dumps(proof,sort_keys=True,indent=2)+'\n')
          print(json.dumps(proof,sort_keys=True))
          PY

          if grep -Eiq '(patient_|@|refresh_token|client_secret|access_token|id_token|ya29\.)' dist/wave2-scheduler-live/proof.json; then
            rm -f dist/wave2-scheduler-live/proof.json
            exit 1
          fi
      - name: Upload sanitized Scheduler LIVE evidence
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave2-Scheduler-LIVE
          path: dist/wave2-scheduler-live/proof.json
          if-no-files-found: error
          retention-days: 30
