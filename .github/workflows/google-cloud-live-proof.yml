name: Google Health Constellation live proof

on:
  pull_request:
    paths:
      - ".github/workflows/google-cloud-live-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthia-wave2-fcm-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  fcm-readiness-audit:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PROJECT_ID: healthia-6088a
      PACKAGE_NAME: com.healthia.one.bridge
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Inspect Firebase Android app registration without secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/wave2-fcm-audit
          token="$(gcloud auth print-access-token)"
          test -n "$token"
          echo "::add-mask::$token"
          code="$(curl -sS -o /tmp/apps.json -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/json' \
            "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}/androidApps")"
          python - "$code" <<'PY'
          import json, os, sys
          code=int(sys.argv[1])
          raw=json.load(open('/tmp/apps.json',encoding='utf-8')) if os.path.getsize('/tmp/apps.json') else {}
          apps=raw.get('apps') or [] if isinstance(raw,dict) else []
          package=os.environ['PACKAGE_NAME']
          matches=[a for a in apps if str(a.get('packageName') or '')==package]
          out={
              'status':'READ_ONLY_AUDIT',
              'firebase_management_http_status':code,
              'android_app_count':len(apps),
              'package_name':package,
              'matching_android_app_count':len(matches),
              'matching_app_has_app_id':bool(matches and matches[0].get('appId')),
              'matching_app_state':str(matches[0].get('state') or '') if matches else '',
              'fcm_client_sdk_present_in_repo':False,
              'device_registration_available':False,
              'iam_mutation':False,
              'secret_material_exposed':False,
          }
          if code != 200:
              err=str((raw.get('error') or {}).get('status') or '') if isinstance(raw,dict) else ''
              out['provider_error_status']=err[:80]
          open('dist/wave2-fcm-audit/readiness.json','w',encoding='utf-8').write(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
          rm -f /tmp/apps.json
          if grep -Eiq '(token|private_key|client_secret|access_token|id_token|ya29\.|@[A-Za-z0-9.-]+\.[A-Za-z]{2,})' dist/wave2-fcm-audit/readiness.json; then
            # "device_registration" is allowed; credential field names are not.
            if grep -Eiq '(private_key|client_secret|access_token|id_token|ya29\.|@[A-Za-z0-9.-]+\.[A-Za-z]{2,})' dist/wave2-fcm-audit/readiness.json; then
              rm -f dist/wave2-fcm-audit/readiness.json
              exit 1
            fi
          fi
      - name: Upload sanitized FCM readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave2-FCM-Readiness
          path: dist/wave2-fcm-audit/readiness.json
          if-no-files-found: error
          retention-days: 30
