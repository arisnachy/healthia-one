name: Google Health Constellation live proof

on:
  pull_request:
    paths:
      - ".github/workflows/google-cloud-live-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthia-wave2-scheduler-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  scheduler-natural-observer:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE: healthia-gmail-worker
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Diagnose natural Scheduler execution without IAM mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/wave2-scheduler-live
          worker_url="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          latest_revision="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          date_utc="$(date -u +%Y-%m-%d)"
          since="${date_utc}T04:45:00Z"

          run_rows="$(gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE} AND httpRequest.requestUrl=\"${worker_url}/scheduled/renew-gmail-watches\" AND timestamp>=\"${since}\"" \
            --project "$PROJECT_ID" --limit 50 --order=asc --format=json || printf '[]')"
          app_rows="$(gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE} AND textPayload:\"healthia_gmail_watch_scheduler\" AND timestamp>=\"${since}\"" \
            --project "$PROJECT_ID" --limit 50 --order=asc --format=json || printf '[]')"
          scheduler_rows="$(gcloud logging read \
            "resource.type=cloud_scheduler_job AND timestamp>=\"${since}\"" \
            --project "$PROJECT_ID" --limit 100 --order=asc --format=json || printf '[]')"

          python - "$latest_revision" "$run_rows" "$app_rows" "$scheduler_rows" <<'PY'
          import json,sys
          latest=sys.argv[1]
          run_rows=json.loads(sys.argv[2] or '[]')
          app_rows=json.loads(sys.argv[3] or '[]')
          scheduler_rows=json.loads(sys.argv[4] or '[]')

          http=[]
          for row in run_rows:
              req=row.get('httpRequest') or {}
              http.append({
                  'timestamp':str(row.get('timestamp') or ''),
                  'revision':str(((row.get('resource') or {}).get('labels') or {}).get('revision_name') or ''),
                  'status':int(req.get('status') or 0),
              })

          app=[]
          for row in app_rows:
              text=str(row.get('textPayload') or '')
              safe={
                  'timestamp':str(row.get('timestamp') or ''),
                  'revision':str(((row.get('resource') or {}).get('labels') or {}).get('revision_name') or ''),
                  'scheduler_request_bound':'"scheduler_request_bound":true' in text,
                  'scheduler_job_bound':'"scheduler_job_bound":true' in text,
                  'processed_zero':'"processed_count":0' in text,
                  'renewed_zero':'"renewed_count":0' in text,
              }
              app.append(safe)

          scheduler=[]
          for row in scheduler_rows:
              labels=((row.get('resource') or {}).get('labels') or {})
              payload=row.get('jsonPayload') or {}
              status=payload.get('status') or {}
              scheduler.append({
                  'timestamp':str(row.get('timestamp') or ''),
                  'job_id':str(labels.get('job_id') or ''),
                  'severity':str(row.get('severity') or ''),
                  'status_code':status.get('code') if isinstance(status,dict) else None,
              })

          out={
              'status':'DIAGNOSTIC',
              'latest_worker_revision':latest,
              'worker_http_requests':http,
              'scheduler_app_events':app,
              'cloud_scheduler_events':scheduler,
              'iam_mutation':False,
              'secret_material_exposed':False,
          }
          path='dist/wave2-scheduler-live/diagnostic.json'
          open(path,'w',encoding='utf-8').write(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps({
              'worker_http_count':len(http),
              'scheduler_app_count':len(app),
              'cloud_scheduler_event_count':len(scheduler),
              'latest_worker_revision':latest,
          },sort_keys=True))
          PY
          if grep -Eiq '(patient_|@|refresh_token|client_secret|access_token|id_token|ya29\.)' dist/wave2-scheduler-live/diagnostic.json; then
            rm -f dist/wave2-scheduler-live/diagnostic.json
            exit 1
          fi
      - name: Upload sanitized Scheduler diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave2-Scheduler-Diagnostic
          path: dist/wave2-scheduler-live
          if-no-files-found: error
          retention-days: 30
