name: Google Health Constellation live proof

on:
  pull_request:
    paths:
      - ".github/workflows/google-cloud-live-proof.yml"
      - "healthia_one/gmail_push_worker.py"
      - "healthia_one/gmail_watch_runtime.py"
      - "tests/test_gmail_scheduler_observability.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthia-wave2-scheduler-prep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  scheduler-prep:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE: healthia-gmail-worker
      CONTROLLED_PATIENT: patient_8b8c820ea54c4ca98b84ef12d6f4fafa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Deploy Wave 2 worker and force one real Gmail renewal
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$CONTROLLED_PATIENT"
          mkdir -p dist/wave2-scheduler-prep
          proof="dist/wave2-scheduler-prep/proof.json"
          source_sha="$(git rev-parse HEAD)"
          image_package="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/healthia-gmail-wave2"
          image="${image_package}:${source_sha}"
          original_image="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          original_revision="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          promoted=0

          rollback() {
            rc=$?
            if [[ $rc -ne 0 && $promoted -eq 1 && -n "$original_image" ]]; then
              echo "Scheduler prep failed; restoring previous worker image." >&2
              gcloud run services update "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --image "$original_image" --quiet >/dev/null 2>&1 || true
            fi
            if [[ $rc -ne 0 ]]; then
              gcloud artifacts docker images delete "$image" --project "$PROJECT_ID" --quiet --delete-tags >/dev/null 2>&1 || true
            fi
            exit $rc
          }
          trap rollback EXIT

          build_id="$(gcloud builds submit . --project "$PROJECT_ID" --region "$REGION" --tag "$image" --async --format='value(id)' --quiet)"
          test -n "$build_id"
          digest=""
          for _ in $(seq 1 60); do
            digest="$(gcloud artifacts docker images describe "$image" --project "$PROJECT_ID" --format='value(image_summary.digest)' 2>/dev/null || true)"
            [[ -n "$digest" ]] && break
            sleep 5
          done
          test -n "$digest"

          gcloud run services update "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --image "$image" --quiet
          promoted=1
          worker_url="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          new_revision="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$worker_url" && test -n "$new_revision" && test "$new_revision" != "$original_revision"

          id_token="$(gcloud auth print-identity-token --audiences="$worker_url")"
          test -n "$id_token"
          echo "::add-mask::$id_token"
          raw="$(mktemp)"
          status_code="$(curl -sS --max-time 60 -o "$raw" -w '%{http_code}' \
            -X POST "${worker_url}/internal/ensure-watch" \
            -H "Authorization: Bearer ${id_token}" \
            -H 'Content-Type: application/json' \
            --data "{\"patient_id\":\"${CONTROLLED_PATIENT}\",\"force\":true}")"
          [[ "$status_code" == "200" ]]

          python - "$raw" "$proof" "$source_sha" "$build_id" "$digest" "$new_revision" "$original_revision" <<'PY'
          import json, sys, time
          raw_path, proof_path, source_sha, build_id, digest, revision, previous = sys.argv[1:]
          data=json.load(open(raw_path, encoding='utf-8'))
          history=str(data.get('history_id') or '')
          expiration=data.get('expiration_ms')
          assert data.get('status') == 'renewed', data.get('status')
          assert history.isdigit(), 'Gmail watch history id is not numeric'
          assert isinstance(expiration, int) and expiration > int(time.time()*1000), 'Gmail watch expiration is not future'
          assert data.get('secret_material_exposed') is False
          safe={
              'status':'PREP_LIVE_PASS',
              'source_sha':source_sha,
              'cloud_build_id':build_id,
              'image_digest':digest,
              'worker_revision':revision,
              'previous_worker_revision':previous,
              'gmail_watch_history_numeric':True,
              'gmail_watch_expiration_future':True,
              'forced_real_renewal':True,
              'secret_material_exposed':False,
              'next_expected_scheduler_utc':'05:00',
          }
          open(proof_path,'w',encoding='utf-8').write(json.dumps(safe,sort_keys=True,indent=2)+'\n')
          PY
          rm -f "$raw"

          if grep -Eiq '(patient_|@|refresh_token|client_secret|access_token|id_token|ya29\.)' "$proof"; then
            rm -f "$proof"
            exit 1
          fi
          cat "$proof"
          trap - EXIT
      - name: Upload sanitized Scheduler prep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave2-Scheduler-PREP-LIVE
          path: dist/wave2-scheduler-prep
          if-no-files-found: warn
          retention-days: 30
