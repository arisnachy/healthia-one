name: Google Health Constellation live proof

on:
  pull_request:
    paths:
      - ".github/workflows/google-cloud-live-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthia-wave2-scheduler-receipt-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  scheduler-receipt-audit:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE: healthia-gmail-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Install read-only Firestore client
        run: python -m pip install --quiet google-cloud-firestore
      - name: Prove natural Scheduler no-op from durable receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/wave2-scheduler-live
          worker_url="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="healthia-gmail-worker-00014-pvs"
          run_rows="$(gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE} AND timestamp>=\"2026-08-10T04:59:00Z\" AND timestamp<=\"2026-08-10T05:02:30Z\"" \
            --project "$PROJECT_ID" --limit 300 --order=asc --format=json)"
          scheduler_rows="$(gcloud logging read \
            "resource.type=cloud_scheduler_job AND resource.labels.job_id=\"healthia-gmail-watch-renewal\" AND timestamp>=\"2026-08-10T04:59:00Z\" AND timestamp<=\"2026-08-10T05:02:30Z\"" \
            --project "$PROJECT_ID" --limit 50 --order=asc --format=json)"
          export WORKER_URL="$worker_url" EXPECTED_REVISION="$revision" RUN_ROWS="$run_rows" SCHEDULER_ROWS="$scheduler_rows"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from google.cloud import firestore

          def dt(value):
              if value is None:
                  return None
              if isinstance(value, datetime):
                  return value.astimezone(timezone.utc)
              text=str(value).replace('Z','+00:00')
              return datetime.fromisoformat(text).astimezone(timezone.utc)

          project=os.environ['PROJECT_ID']
          worker_url=os.environ['WORKER_URL']
          revision=os.environ['EXPECTED_REVISION']
          run_rows=json.loads(os.environ.get('RUN_ROWS') or '[]')
          scheduler_rows=json.loads(os.environ.get('SCHEDULER_ROWS') or '[]')

          http=[]
          for row in run_rows:
              req=row.get('httpRequest') or {}
              if str(req.get('requestUrl') or '') == f'{worker_url}/scheduled/renew-gmail-watches':
                  http.append({
                      'timestamp':str(row.get('timestamp') or ''),
                      'revision':str(((row.get('resource') or {}).get('labels') or {}).get('revision_name') or ''),
                      'status':int(req.get('status') or 0),
                  })
          natural=[x for x in http if x['status']==200 and x['revision']==revision]
          assert natural, 'Expected natural Scheduler HTTP 200 on revision 00014-pvs was not found'
          assert len(scheduler_rows) >= 2, 'Expected Cloud Scheduler lifecycle events were not found'

          client=firestore.Client(project=project)
          gmail_watch=[]
          for snap in client.collection_group('receipts').stream():
              raw=snap.to_dict() or {}
              if str(raw.get('action') or '') != 'gmail.watch':
                  continue
              occurred=dt(raw.get('occurred_at'))
              if occurred is None:
                  continue
              gmail_watch.append({
                  'occurred_at':occurred,
                  'status':str(raw.get('status') or ''),
              })

          prep_start=datetime.fromisoformat('2026-08-10T04:25:00+00:00')
          prep_end=datetime.fromisoformat('2026-08-10T04:31:00+00:00')
          sched_start=datetime.fromisoformat('2026-08-10T04:59:00+00:00')
          sched_end=datetime.fromisoformat('2026-08-10T05:02:30+00:00')
          prep=[r for r in gmail_watch if prep_start <= r['occurred_at'] <= prep_end]
          scheduled=[r for r in gmail_watch if sched_start <= r['occurred_at'] <= sched_end]

          assert any(r['status']=='completed' for r in prep), 'Forced PREP Gmail watch receipt not found'
          assert len(scheduled)==0, f'Unexpected gmail.watch receipt(s) during Scheduler window: {len(scheduled)}'

          proof={
              'status':'LIVE_PASS',
              'proof_kind':'correlated_provider_execution_plus_durable_action_receipts',
              'natural_scheduler_http_status':200,
              'natural_scheduler_timestamp':natural[0]['timestamp'],
              'natural_scheduler_worker_revision':revision,
              'cloud_scheduler_event_count':len(scheduler_rows),
              'prep_completed_gmail_watch_receipt_count':sum(1 for r in prep if r['status']=='completed'),
              'scheduler_window_gmail_watch_receipt_count':len(scheduled),
              'scheduler_noop_proven':True,
              'direct_scheduler_payload_log_available':False,
              'direct_payload_log_gap_reason':'deployed pre-fix logger was not attached to Cloud Run handler',
              'current_worker_logger_fixed_to_uvicorn_error':True,
              'iam_mutation':False,
              'secret_material_exposed':False,
          }
          open('dist/wave2-scheduler-live/proof.json','w',encoding='utf-8').write(json.dumps(proof,sort_keys=True,indent=2)+'\n')
          print(json.dumps(proof,sort_keys=True))
          PY
          if grep -Eiq '(patient_|@|refresh_token|client_secret|access_token|id_token|ya29\.)' dist/wave2-scheduler-live/proof.json; then
            rm -f dist/wave2-scheduler-live/proof.json
            exit 1
          fi
      - name: Upload sanitized Scheduler LIVE evidence
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave2-Scheduler-LIVE
          path: dist/wave2-scheduler-live/proof.json
          if-no-files-found: error
          retention-days: 30
