name: KIRA Wave 3 exact revision 00022 recorder continuation once

on:
  push:
    branches:
      - kira/google-constellation-wave2-live
    paths:
      - .github/workflows/kira-wave3-eedd-00022-recorder-continuation-once.yml

permissions:
  contents: read

concurrency:
  group: healthia-wave3-eedd-00022-recorder-continuation
  cancel-in-progress: false

env:
  CANDIDATE_SHA: eeddacffda9f41e1e3f5cdec0402947a33033b88
  PROJECT_ID: healthia-6088a
  REGION: us-central1
  SERVICE_NAME: healthia-one-demo
  EXPECTED_REVISION: healthia-one-demo-00022-lck
  GCS_BUCKET: healthia-6088a-healthia-evidence

jobs:
  record:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Bind authorized corrective continuation
        shell: bash
        run: |
          set -euo pipefail
          test "$CANDIDATE_SHA" = "eeddacffda9f41e1e3f5cdec0402947a33033b88"
          test "$EXPECTED_REVISION" = "healthia-one-demo-00022-lck"
          authorization='I_AUTHORIZE_WAVE3_EXACT_CLOUD_ONE_TAKE'
          test "$authorization" = 'I_AUTHORIZE_WAVE3_EXACT_CLOUD_ONE_TAKE'
          echo HEALTHIA_WAVE3_00022_CONTINUATION_AUTHORIZED

      - uses: actions/checkout@v4
        with:
          ref: eeddacffda9f41e1e3f5cdec0402947a33033b88
          fetch-depth: 0

      - name: Prove exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Bind existing exact revision without redeploy
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          test "$latest" = "$EXPECTED_REVISION"
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          image="$(gcloud run revisions describe "$EXPECTED_REVISION" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.containers[0].image)')"
          token="$(gcloud auth print-identity-token --audiences="$url")"
          test -n "$url" && test -n "$image" && test -n "$token"
          echo "::add-mask::$token"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo HEALTHIA_WAVE3_EXACT_REVISION_BOUND_NO_REDEPLOY

      - name: Reprove Maps Secret Manager binding without value exposure
        shell: bash
        run: |
          set -euo pipefail
          gcloud run revisions describe "$EXPECTED_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/revision.json
          python - <<'PY'
          import json
          rev=json.load(open('/tmp/revision.json',encoding='utf-8'))
          matches=[]
          for c in (rev.get('spec') or {}).get('containers') or []:
              matches.extend(i for i in (c.get('env') or []) if i.get('name')=='GOOGLE_MAPS_API_KEY')
          if len(matches)!=1: raise SystemExit(f'Expected one Maps env binding, got {len(matches)}')
          item=matches[0]
          if str(item.get('value') or ''): raise SystemExit('Maps secret appeared as plaintext')
          ref=((item.get('valueFrom') or {}).get('secretKeyRef') or {})
          if ref.get('name')!='healthia-google-maps-api-key' or str(ref.get('key') or '')!='latest':
              raise SystemExit('Maps secret binding mismatch')
          print('HEALTHIA_MAPS_BINDING_STILL_PASS value_exposed=false')
          PY
          rm -f /tmp/revision.json

      - name: Read sanitized cost guard and require recorder budget
        shell: bash
        env:
          URL: ${{ steps.cloud.outputs.url }}
          ID_TOKEN: ${{ steps.cloud.outputs.token }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 -H "Authorization: Bearer $ID_TOKEN" "$URL/api/cost-control" > /tmp/cost.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/cost.json',encoding='utf-8'))
          limit=int(data.get('request_limit') or 0)
          used=int(data.get('requests_used') or 0)
          remaining=int(data.get('requests_remaining') or 0)
          print(f'HEALTHIA_COST_GUARD limit={limit} used={used} remaining={remaining} enabled={bool(data.get("enabled"))}')
          if limit != 20: raise SystemExit(f'Unexpected request limit: {limit}')
          if remaining < 10: raise SystemExit(f'Insufficient bounded recorder budget: {remaining}')
          if not data.get('enabled'): raise SystemExit('Cost guard is not enabled')
          PY
          rm -f /tmp/cost.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact recorder dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Record one continuous Wave 3 judge journey on same revision
        env:
          HEALTHIA_CLOUD_URL: ${{ steps.cloud.outputs.url }}
          HEALTHIA_CLOUD_ID_TOKEN: ${{ steps.cloud.outputs.token }}
          HEALTHIA_CLOUD_REVISION: ${{ env.EXPECTED_REVISION }}
          HEALTHIA_CLOUD_IMAGE: ${{ steps.cloud.outputs.image }}
          HEALTHIA_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          HEALTHIA_CLOUD_REGION: ${{ env.REGION }}
          HEALTHIA_CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          HEALTHIA_GCS_BUCKET: ${{ env.GCS_BUCKET }}
          HEALTHIA_DEMO_TARGET_SECONDS: "285"
        run: python scripts/record_submission_demo.py

      - name: Verify exact semantic PASS and seven gates
        shell: bash
        run: |
          set -euo pipefail
          python - "$CANDIDATE_SHA" <<'PY'
          import json,pathlib,sys
          report=json.loads(pathlib.Path('dist/submission-demo/report.json').read_text(encoding='utf-8'))
          if report.get('status')!='PASS': raise SystemExit('recorder report is not PASS')
          if report.get('candidate_sha')!=sys.argv[1]: raise SystemExit('candidate SHA mismatch')
          required={
            'wave3_unanchored_reference_fails_closed',
            'wave3_evidence_backed_reference_resolution',
            'wave3_places_stops_before_mission_location_consent',
            'wave3_mission_scoped_location_consent_then_real_places',
            'wave3_ordinal_resumes_and_selects_durable_mission',
            'relogin_continuity_including_google_mission',
            'zero_browser_console_or_page_errors',
          }
          missing=sorted(required-set(report.get('checks') or []))
          if missing: raise SystemExit(f'missing gates: {missing}')
          print('HEALTHIA_WAVE3_SEVEN_GATES_PASS')
          PY

      - name: Verify continuous duration
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          video="$(find dist/submission-demo/video -type f -name '*.webm' | head -n1)"
          test -n "$video"
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$video")"
          python - "$duration" <<'PY'
          import sys
          d=float(sys.argv[1])
          if not 250 <= d <= 360: raise SystemExit(f'duration outside 250-360s: {d:.2f}')
          print(f'HEALTHIA_WAVE3_DURATION_PASS {d:.2f}s')
          PY

      - name: Build sanitized private LIVE PASS envelope
        if: success()
        shell: bash
        env:
          IMAGE: ${{ steps.cloud.outputs.image }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('dist/submission-demo')
          report=json.loads((root/'report.json').read_text(encoding='utf-8'))
          video=next((root/'video').glob('*.webm'))
          out={
            'status':'LIVE_PASS',
            'candidate_sha':os.environ['CANDIDATE_SHA'],
            'cloud_revision':os.environ['EXPECTED_REVISION'],
            'cloud_image':os.environ['IMAGE'],
            'maps_secret_manager_binding':True,
            'maps_secret_value_exposed':False,
            'video_sha256':hashlib.sha256(video.read_bytes()).hexdigest(),
            'checks':report.get('checks') or [],
            'synthetic_only':bool(report.get('synthetic_only')),
            'public_release_performed':False,
            'veo_invoked':False,
            'new_api_enabled':False,
            'secret_material_exposed':False,
            'redeploy_performed':False,
          }
          (root/'wave3_exact_head_evidence.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in out.items() if k not in {'cloud_image','video_sha256'}},sort_keys=True))
          PY

      - name: Upload private PASS or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave3-eedd-00022-recorder-continuation
          path: dist/submission-demo
          if-no-files-found: warn
          retention-days: 30
