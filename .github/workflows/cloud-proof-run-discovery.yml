name: Cloud proof run discovery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  discover:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Locate latest Cloud deploy proof run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/candidate-cloud-deploy-proof.yml/runs?per_page=10")"
          count="$(jq '.workflow_runs | length' <<<"$response")"
          if [ "$count" -lt 1 ]; then
            echo "HEALTHIA_CLOUD_DEPLOY_RUN_NOT_FOUND"
            exit 1
          fi
          echo "HEALTHIA_CLOUD_DEPLOY_RUN_FOUND"
          jq -r '.workflow_runs[0] | [
            "id=" + (.id|tostring),
            "status=" + (.status // ""),
            "conclusion=" + (.conclusion // ""),
            "event=" + (.event // ""),
            "head_branch=" + (.head_branch // ""),
            "head_sha=" + (.head_sha // ""),
            "html_url=" + (.html_url // ""),
            "run_number=" + (.run_number|tostring),
            "run_attempt=" + (.run_attempt|tostring),
            "created_at=" + (.created_at // ""),
            "updated_at=" + (.updated_at // "")
          ] | .[]' <<<"$response"
