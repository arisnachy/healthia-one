name: Cloud proof run discovery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  discover:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Locate latest Cloud deploy proof run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/candidate-cloud-deploy-proof.yml/runs?per_page=10")"
          python - <<'PY' <<<"$response"
          import json, sys
          data = json.load(sys.stdin)
          runs = data.get("workflow_runs") or []
          if not runs:
              raise SystemExit("HEALTHIA_CLOUD_DEPLOY_RUN_NOT_FOUND")
          run = runs[0]
          print("HEALTHIA_CLOUD_DEPLOY_RUN_FOUND")
          for key in ("id", "status", "conclusion", "event", "head_branch", "head_sha", "html_url", "run_number", "run_attempt", "created_at", "updated_at"):
              print(f"{key}={run.get(key)}")
          PY
