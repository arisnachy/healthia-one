name: Android bridge APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-health-bridge/**'
      - '.github/workflows/android-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'android-health-bridge/**'
      - '.github/workflows/android-bridge.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-health-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/HealthIA-Bridge-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Bridge-debug
          path: android-health-bridge/app/build/outputs/apk/debug/HealthIA-Bridge-debug.apk
          if-no-files-found: error
          retention-days: 30
