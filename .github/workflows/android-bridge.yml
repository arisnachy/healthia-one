name: Android bridge compile + FCM-ready APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-health-bridge/**'
      - 'scripts/extract_firebase_android_config.py'
      - 'tests/test_firebase_android_config_extractor.py'
      - '.github/workflows/android-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'android-health-bridge/**'
      - 'scripts/extract_firebase_android_config.py'
      - 'tests/test_firebase_android_config_extractor.py'
      - '.github/workflows/android-bridge.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      HEALTHIA_FIREBASE_ANDROID_CONFIG_B64: ${{ secrets.HEALTHIA_FIREBASE_ANDROID_CONFIG_B64 }}
      HEALTHIA_FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.HEALTHIA_FIREBASE_ANDROID_CONFIG_JSON }}
      HEALTHIA_FIREBASE_APP_ID: ${{ secrets.HEALTHIA_FIREBASE_APP_ID }}
      HEALTHIA_FIREBASE_API_KEY: ${{ secrets.HEALTHIA_FIREBASE_API_KEY }}
      HEALTHIA_FIREBASE_PROJECT_ID: ${{ secrets.HEALTHIA_FIREBASE_PROJECT_ID }}
      HEALTHIA_FIREBASE_SENDER_ID: ${{ secrets.HEALTHIA_FIREBASE_SENDER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Classify Firebase build readiness without exposing values
        id: firebase
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android-apk-readiness
          config_source=NONE
          env_file=/tmp/healthia-firebase.env
          rm -f "$env_file"

          # Preferred one-secret path: a single-line Base64 encoding of the official
          # google-services.json. The parser is unit-tested with synthetic config and
          # receives secret material only on stdin; it never prints extracted values.
          if [[ -n "${HEALTHIA_FIREBASE_ANDROID_CONFIG_B64:-}" ]]; then
            echo "::add-mask::$HEALTHIA_FIREBASE_ANDROID_CONFIG_B64"
            printf '%s' "$HEALTHIA_FIREBASE_ANDROID_CONFIG_B64" | \
              python scripts/extract_firebase_android_config.py \
                --format base64 \
                --package com.healthia.one.bridge \
                --project healthia-6088a \
                --output "$env_file"
            config_source=GOOGLE_SERVICES_JSON_BASE64_SECRET
          elif [[ -n "${HEALTHIA_FIREBASE_ANDROID_CONFIG_JSON:-}" ]]; then
            # Compatibility path for a pre-existing raw JSON secret.
            echo "::add-mask::$HEALTHIA_FIREBASE_ANDROID_CONFIG_JSON"
            printf '%s' "$HEALTHIA_FIREBASE_ANDROID_CONFIG_JSON" | \
              python scripts/extract_firebase_android_config.py \
                --format json \
                --package com.healthia.one.bridge \
                --project healthia-6088a \
                --output "$env_file"
            config_source=GOOGLE_SERVICES_JSON_SECRET
          fi

          if [[ -s "$env_file" ]]; then
            while IFS='=' read -r name value; do
              [[ -z "$name" || -z "$value" ]] && continue
              case "$name" in
                HEALTHIA_FIREBASE_APP_ID|HEALTHIA_FIREBASE_API_KEY|HEALTHIA_FIREBASE_PROJECT_ID|HEALTHIA_FIREBASE_SENDER_ID) ;;
                *) echo "Unexpected Firebase env name; refusing build." >&2; exit 1 ;;
              esac
              echo "::add-mask::$value"
              printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
              export "$name=$value"
            done < "$env_file"
            rm -f "$env_file"
          fi

          ready=true
          for name in \
            HEALTHIA_FIREBASE_APP_ID \
            HEALTHIA_FIREBASE_API_KEY \
            HEALTHIA_FIREBASE_PROJECT_ID \
            HEALTHIA_FIREBASE_SENDER_ID
          do
            value="${!name:-}"
            if [[ -z "$value" ]]; then
              ready=false
            else
              echo "::add-mask::$value"
            fi
          done

          if [[ "$ready" == true && "$config_source" == NONE ]]; then
            config_source=FOUR_ACTIONS_SECRETS
            if [[ "$HEALTHIA_FIREBASE_PROJECT_ID" != "healthia-6088a" ]]; then
              echo "Firebase config is present but belongs to an unexpected project." >&2
              exit 1
            fi
            python - <<'PY'
          import os, re
          checks = {
              'app_id_shape': bool(re.fullmatch(r'1:[0-9]+:android:[0-9A-Za-z]+', os.environ['HEALTHIA_FIREBASE_APP_ID'].strip())),
              'api_key_shape': len(os.environ['HEALTHIA_FIREBASE_API_KEY'].strip()) >= 20,
              'project_id_shape': os.environ['HEALTHIA_FIREBASE_PROJECT_ID'].strip() == 'healthia-6088a',
              'sender_id_shape': os.environ['HEALTHIA_FIREBASE_SENDER_ID'].strip().isdigit(),
          }
          if not all(checks.values()):
              raise SystemExit('Firebase fallback build configuration failed non-secret shape validation')
          PY
          fi

          echo "fcm_ready=$ready" >> "$GITHUB_OUTPUT"
          echo "config_source=$config_source" >> "$GITHUB_OUTPUT"
          export FCM_READY="$ready" CONFIG_SOURCE="$config_source"
          python - <<'PY'
          import json, os
          from pathlib import Path
          ready=os.environ.get('FCM_READY')=='true'
          out={
              'status':'FCM_READY_BUILD_CONFIG' if ready else 'BLOCKED_FIREBASE_CONFIG',
              'fcm_ready':ready,
              'config_source':os.environ.get('CONFIG_SOURCE','NONE'),
              'apk_publish_allowed':ready,
              'compile_allowed':True,
              'truth_rule':'CODE PASS != FCM-READY APK',
              'secret_material_exposed':False,
          }
          Path('dist/android-apk-readiness/status.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Compile Android debug application
        working-directory: android-health-bridge
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify generated BuildConfig is Firebase-capable without exposing values
        if: steps.firebase.outputs.fcm_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          build_config="$(find android-health-bridge/app/build/generated -type f -name 'BuildConfig.java' -path '*debug*' | head -n 1)"
          test -n "$build_config" && test -f "$build_config"
          python - "$build_config" <<'PY'
          import re, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          names = (
              "FIREBASE_APP_ID",
              "FIREBASE_API_KEY",
              "FIREBASE_PROJECT_ID",
              "FIREBASE_SENDER_ID",
          )
          for name in names:
              match = re.search(rf'{name}\s*=\s*"([^"]*)"', text)
              if not match or not match.group(1).strip():
                  raise SystemExit(f"Generated BuildConfig has empty {name}; refusing artifact upload")
          print("Generated BuildConfig contains all Firebase identifiers; values not printed.")
          PY

      - name: Rename FCM-ready APK
        if: steps.firebase.outputs.fcm_ready == 'true'
        run: cp android-health-bridge/app/build/outputs/apk/debug/app-debug.apk android-health-bridge/app/build/outputs/apk/debug/HealthIA-Bridge-debug.apk

      - name: Upload FCM-ready APK
        if: steps.firebase.outputs.fcm_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Bridge-debug
          path: android-health-bridge/app/build/outputs/apk/debug/HealthIA-Bridge-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove non-FCM-ready APK from workspace
        if: steps.firebase.outputs.fcm_ready != 'true'
        shell: bash
        run: rm -f android-health-bridge/app/build/outputs/apk/debug/*.apk

      - name: Upload Android readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Android-APK-Readiness
          path: dist/android-apk-readiness/status.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce release/manual FCM-ready gate
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.firebase.outputs.fcm_ready }}" != "true" ]]; then
            echo "FCM-ready APK cannot be published because Firebase build configuration is absent." >&2
            exit 1
          fi
