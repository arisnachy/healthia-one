name: KIRA Wave 3 Maps binding fix runner

on:
  push:
    branches:
      - kira/google-constellation-wave2-live
    paths:
      - .github/workflows/kira-wave3-maps-binding-fix-runner.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/google-constellation-wave2-live
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic Maps Secret Manager binding patch
        run: python .kira/apply_wave3_maps_secret_binding_fix.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run focused Maps and Wave 3 regressions
        run: |
          python -m pytest -q tests/test_wave3_repro_hardening.py tests/test_google_mission_location_consent.py tests/test_wave3_exact_head_one_take.py
      - name: Push only tested product contract files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KIRA Omega'
          git config user.email 'actions@users.noreply.github.com'
          git add deployment/deploy-cloud-demo.ps1 tests/test_wave3_repro_hardening.py
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git commit -m 'KIRA Wave 3: bind existing Maps key through Secret Manager'
          git push origin HEAD:kira/google-constellation-wave2-live
          echo HEALTHIA_WAVE3_MAPS_SECRET_BINDING_FIX_PUSHED
