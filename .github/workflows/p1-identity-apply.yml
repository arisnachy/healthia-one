name: P1 identity assembler

on:
  push:
    branches:
      - kira/omega-100-agentic-runtime
  pull_request:

permissions:
  contents: write

jobs:
  assemble:
    if: github.event_name == 'push' || github.head_ref == 'kira/omega-100-agentic-runtime'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/omega-100-agentic-runtime
          fetch-depth: 1
      - name: Apply P1 verified delta
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/p1-auth-1.patch ]; then
            echo "P1 patch set already assembled."
            exit 0
          fi
          for patch in .github/p1-auth-{1..4}.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          rm .github/p1-auth-{1..4}.patch
          git config user.name "KIRA FORJA verification"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add isolated patient identity and on-demand cloud policy"
          git push origin HEAD:kira/omega-100-agentic-runtime
