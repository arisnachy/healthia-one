name: P1 identity assembler

on:
  push:
    branches:
      - kira/omega-100-agentic-runtime

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/omega-100-agentic-runtime
          fetch-depth: 1
      - name: Apply exact P1 identity migration and self-clean
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/p1-auth-1.patch ]; then
            echo "P1 migration already assembled."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected source block not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Assumption-free production defaults; the synthetic demo now seeds its facts explicitly.
          replace("healthia_one/models.py",
              'class CarePlan(BaseModel):\n    conditions: list[str] = Field(default_factory=lambda: ["hypertension", "weight_management"])',
              'class CarePlan(BaseModel):\n    conditions: list[str] = Field(default_factory=list)')
          replace("healthia_one/models.py",
              '''class PatientProfile(BaseModel):\n    id: str = "patient_demo"\n    display_name: str = "Ana Martínez"\n    legal_name: str = ""\n    birth_date: date = date(1982, 2, 20)\n    sex_at_birth: Literal["female", "male", "intersex", "unknown"] = "female"\n    gender_identity: str = ""\n    preferred_pronouns: str = ""\n    blood_type: str = ""\n    height_cm: float | None = Field(default=165.0, ge=50, le=250)''',
              '''class PatientProfile(BaseModel):\n    id: str = "patient_demo"\n    display_name: str = "Paciente"\n    legal_name: str = ""\n    birth_date: date | None = None\n    sex_at_birth: Literal["female", "male", "intersex", "unknown"] = "unknown"\n    gender_identity: str = ""\n    preferred_pronouns: str = ""\n    blood_type: str = ""\n    height_cm: float | None = Field(default=None, ge=50, le=250)''')
          replace("healthia_one/models.py",
              '    medications: list[str] = Field(default_factory=lambda: ["Losartán 50 mg cada 24 horas"])\n    confirmed_conditions: list[str] = Field(default_factory=lambda: ["Hipertensión arterial"])',
              '    medications: list[str] = Field(default_factory=list)\n    confirmed_conditions: list[str] = Field(default_factory=list)')

          # Service identity binding and per-user event broker.
          replace("healthia_one/service.py", 'from datetime import datetime, timedelta, timezone', 'from datetime import date, datetime, timedelta, timezone')
          replace("healthia_one/service.py",
              'from healthia_one.control import audit, finding_allowed, snooze_consent, sync_consent_to_profile\n',
              'from healthia_one.control import audit, finding_allowed, snooze_consent, sync_consent_to_profile\nfrom healthia_one.identity import AuthPrincipal\nfrom healthia_one.identity_state import bind_state_identity, new_identity_state\n')
          replace("healthia_one/service.py",
              'from healthia_one.store import FirestoreStore, JsonStore, MemoryStore, StateStore\n',
              'from healthia_one.store import FirestoreStore, JsonStore, MemoryStore, StateStore\nfrom healthia_one.tenant import current_patient_id\n')
          replace("healthia_one/service.py",
              '''class EventBroker:\n    def __init__(self) -> None:\n        self._subscribers: set[asyncio.Queue[dict]] = set()\n\n    async def publish(self, payload: dict) -> None:\n        for queue in list(self._subscribers):\n            try:\n                queue.put_nowait(payload)\n            except asyncio.QueueFull:\n                self._subscribers.discard(queue)\n\n    async def subscribe(self) -> AsyncIterator[dict]:\n        queue: asyncio.Queue[dict] = asyncio.Queue(maxsize=100)\n        self._subscribers.add(queue)\n        try:\n            while True:\n                yield await queue.get()\n        finally:\n            self._subscribers.discard(queue)''',
              '''class EventBroker:\n    def __init__(self) -> None:\n        self._subscribers: dict[str, set[asyncio.Queue[dict]]] = {}\n\n    async def publish(self, payload: dict, patient_id: str | None = None) -> None:\n        scope = patient_id or current_patient_id()\n        for queue in list(self._subscribers.get(scope, set())):\n            try:\n                queue.put_nowait(payload)\n            except asyncio.QueueFull:\n                self._subscribers.get(scope, set()).discard(queue)\n\n    async def subscribe(self, patient_id: str | None = None) -> AsyncIterator[dict]:\n        scope = patient_id or current_patient_id()\n        queue: asyncio.Queue[dict] = asyncio.Queue(maxsize=100)\n        subscribers = self._subscribers.setdefault(scope, set())\n        subscribers.add(queue)\n        try:\n            while True:\n                yield await queue.get()\n        finally:\n            subscribers.discard(queue)\n            if not subscribers:\n                self._subscribers.pop(scope, None)''')
          replace("healthia_one/service.py",
              'def seed_state() -> PatientState:\n    now = datetime.now(timezone.utc)\n    state = PatientState()\n',
              'def seed_state() -> PatientState:\n    now = datetime.now(timezone.utc)\n    state = PatientState()\n    state.profile.display_name = "Ana Martínez"\n    state.profile.birth_date = date(1982, 2, 20)\n    state.profile.sex_at_birth = "female"\n    state.profile.height_cm = 165.0\n    state.profile.confirmed_conditions = ["Hipertensión arterial"]\n    state.profile.care_plan.conditions = ["hypertension", "weight_management"]\n')
          replace("healthia_one/service.py",
              '''    async def initialize(self) -> None:\n        state = await self.store.load()\n        if not state.messages and not state.vitals and not state.weights:\n            await self.store.save(seed_state())\n\n    async def snapshot(self) -> PatientState:\n        return await self.store.load()''',
              '''    async def initialize(self) -> None:\n        if self.settings.auth_required:\n            return\n        state = await self.store.load()\n        if not state.messages and not state.vitals and not state.weights:\n            await self.store.save(seed_state())\n\n    async def ensure_identity(self, principal: AuthPrincipal) -> PatientState:\n        async with self._mutation_lock:\n            state = await self.store.load()\n            empty = not any([state.messages, state.vitals, state.weights, state.activity, state.results, state.documents])\n            if empty:\n                state = new_identity_state(principal)\n                audit(state, actor="identity_platform", action="initialize_authenticated_patient", resource_type="patient_state", resource_id=principal.uid, details={"provider": principal.provider})\n            else:\n                bind_state_identity(state, principal.uid, display_name=principal.display_name, email=principal.email)\n            await self.store.save(state)\n            return state\n\n    async def snapshot(self) -> PatientState:\n        return await self.store.load()''')
          replace("healthia_one/service.py", '            state = seed_state()\n            await self.store.save(state)\n', '            state = bind_state_identity(seed_state(), current_patient_id())\n            await self.store.save(state)\n')
          replace("healthia_one/service.py", '            state = await self.store.load()\n            state.profile = profile\n', '            state = await self.store.load()\n            profile.id = current_patient_id()\n            state.profile = profile\n')
          replace("healthia_one/service.py", '            patient_message = ChatMessage(role="patient", author=state.profile.display_name, content=content)', '            patient_message = ChatMessage(patient_id=state.profile.id, role="patient", author=state.profile.display_name, content=content)')
          replace("healthia_one/service.py", '            if controlled_response is None:\n                response = await self.gemini.enhance(state, content, response)\n            state.messages.append(response.message)', '            if controlled_response is None:\n                response = await self.gemini.enhance(state, content, response)\n            response.message.patient_id = state.profile.id\n            state.messages.append(response.message)')
          replace("healthia_one/service.py", '            state = await self.store.load()\n            values = getattr(state, collection)\n', '            state = await self.store.load()\n            if hasattr(item, "patient_id"):\n                item.patient_id = state.profile.id\n            values = getattr(state, collection)\n')
          replace("healthia_one/service.py", '                    patient_id=vital.patient_id,', '                    patient_id=current_patient_id(),')

          # FastAPI token verification and identity-scoped APIs.
          replace("app/main.py", 'from healthia_one.control import export_patient_state\n', 'from healthia_one.control import export_patient_state\nfrom healthia_one.identity import IdentityError, IdentityVerifier\n')
          replace("app/main.py", 'from healthia_one.family import family_summary\n', 'from healthia_one.family import family_summary\nfrom healthia_one.tenant import current_patient_id, patient_scope\n')
          replace("app/main.py", 'pairing_manager = DevicePairingManager()\nROOT = Path(__file__).resolve().parents[1]\nWEB_ROOT = ROOT / "web"\nUPLOAD_ROOT = ROOT / "uploads" / "patient_demo"', 'pairing_manager = DevicePairingManager()\nidentity_verifier = IdentityVerifier(settings)\nROOT = Path(__file__).resolve().parents[1]\nWEB_ROOT = ROOT / "web"\nUPLOAD_ROOT = ROOT / "uploads"')
          replace("app/main.py",
              'app = FastAPI(title="HealthIA ONE", version="0.5.0", lifespan=lifespan)\napp.mount("/assets", StaticFiles(directory=WEB_ROOT), name="assets")\n',
              '''app = FastAPI(title="HealthIA ONE", version="0.5.0", lifespan=lifespan)\napp.mount("/assets", StaticFiles(directory=WEB_ROOT), name="assets")\n\nAUTH_EXEMPT_API_PATHS = {\n    "/api/auth/config", "/api/readiness", "/api/devices/pairing/claim",\n    "/api/devices/health-connect/sync", "/api/internal/pubsub/mission",\n}\n\n@app.middleware("http")\nasync def authenticated_patient_scope(request: Request, call_next):\n    path = request.url.path\n    requires_identity = settings.auth_required and path.startswith("/api/") and path not in AUTH_EXEMPT_API_PATHS\n    if not requires_identity:\n        return await call_next(request)\n    try:\n        principal = await identity_verifier.verify_bearer(request.headers.get("Authorization"))\n    except IdentityError as exc:\n        return JSONResponse(status_code=401, content={"detail": str(exc)})\n    with patient_scope(principal.uid):\n        await service.ensure_identity(principal)\n        request.state.principal = principal\n        return await call_next(request)\n''')
          replace("app/main.py", '@app.get("/api/readiness")\nasync def readiness() -> dict:', '@app.get("/api/auth/config")\nasync def auth_config() -> dict:\n    return identity_verifier.public_config()\n\n@app.get("/api/auth/me")\nasync def auth_me(request: Request) -> dict:\n    principal = request.state.principal\n    return {"uid": principal.uid, "email": principal.email, "display_name": principal.display_name, "provider": principal.provider}\n\n@app.get("/api/readiness")\nasync def readiness() -> dict:')
          replace("app/main.py", '        "pubsub_topic": settings.pubsub_topic if settings.event_dispatch_backend == "pubsub" else None,\n        "cost_control": service.gemini.cost_status(),', '        "pubsub_topic": settings.pubsub_topic if settings.event_dispatch_backend == "pubsub" else None,\n        "identity": {"mode": settings.auth_mode, "required": settings.auth_required, "web_ready": identity_verifier.web_ready},\n        "cloud_budget": {"target_usd": settings.cloud_budget_target_usd, "absolute_usd": settings.cloud_budget_absolute_usd},\n        "cost_control": service.gemini.cost_status(),')
          replace("app/main.py", '            "autonomous_closed_loop",\n', '            "autonomous_closed_loop",\n            "google_identity_platform",\n            "per_user_state_isolation",\n')
          replace("app/main.py", '    payload = pairing_manager.create()\n', '    payload = pairing_manager.create(current_patient_id())\n')
          replace("app/main.py", '        return pairing_manager.status(code)\n', '        return pairing_manager.status(code, current_patient_id())\n')
          replace("app/main.py", '    if not pairing_manager.validate(bearer_token(authorization), batch.device_id):\n        raise HTTPException(status_code=401, detail="Dispositivo no vinculado o token inválido.")\n    return await service.ingest_health_connect(batch)', '    patient_id = pairing_manager.resolve_patient(bearer_token(authorization), batch.device_id)\n    if not patient_id:\n        raise HTTPException(status_code=401, detail="Dispositivo no vinculado o token inválido.")\n    with patient_scope(patient_id):\n        return await service.ingest_health_connect(batch)')
          replace("app/main.py", '    run = await service.process_agentic_event(event)\n    return {', '    with patient_scope(event.patient_id):\n        run = await service.process_agentic_event(event)\n    return {')

          # One patient identity and login UI.
          replace("web/index.html", '<body>\n  <div id="app" class="app-shell">', '''<body>\n  <section id="authGate" class="auth-gate" hidden aria-label="Acceso seguro a HealthIA">\n    <div class="auth-card">\n      <div class="auth-brand"><div class="auth-mark">✦</div><div><strong>HealthIA ONE</strong><span>Tu continuidad, bajo tu control</span></div></div>\n      <div class="auth-copy"><span>ACCESO DEL PACIENTE</span><h1>Tu salud no vuelve a empezar desde cero.</h1><p>Inicia sesión para que HealthIA pueda separar tus datos, permisos, dispositivos y misiones de cualquier otra cuenta.</p></div>\n      <button id="googleSignIn" class="google-auth-button" type="button"><span>G</span> Continuar con Google</button>\n      <div class="auth-divider"><span>o</span></div>\n      <form id="emailAuthForm" class="auth-form">\n        <label hidden>Nombre<input id="authName" name="name" autocomplete="name" placeholder="Tu nombre"></label>\n        <label>Correo<input id="authEmail" name="email" type="email" autocomplete="email" required placeholder="tu@correo.com"></label>\n        <label>Contraseña<input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="6" required placeholder="••••••••"></label>\n        <button id="authSubmit" class="auth-submit" type="submit">Entrar</button>\n      </form>\n      <button id="authModeToggle" class="auth-mode-toggle" type="button">Crear cuenta con correo</button>\n      <p id="authMessage" class="auth-message" aria-live="polite"></p>\n      <small class="auth-trust">HealthIA no recibe tu contraseña de Google. El backend acepta únicamente un token de identidad verificado y usa tu UID para aislar tus datos.</small>\n    </div>\n  </section>\n\n  <div id="app" class="app-shell" hidden>''')
          replace("web/index.html", '''      <section class="rail-section">\n        <p>Módulos de salud</p>\n        <div class="agent-mini"><span>HX</span><div><strong>Health history</strong><small>Longitudinal memory</small></div></div>\n        <div class="agent-mini"><span>SM</span><div><strong>Safety monitoring</strong><small>Signals and trends</small></div></div>\n        <div class="agent-mini"><span>RV</span><div><strong>Results review</strong><small>Explain findings</small></div></div>\n        <div class="agent-mini"><span>HH</span><div><strong>Healthy habits</strong><small>Routines and barriers</small></div></div>\n        <div class="agent-mini"><span>FU</span><div><strong>Follow-up</strong><small>Next safe step</small></div></div>\n      </section>\n      </div>\n      <button id="accountPill" class="user-pill" type="button" aria-label="Perfil del usuario">\n        <div class="patient-avatar">AG</div>\n        <div><strong>Arisnachy Gomez</strong><span>Plus</span></div>\n      </button>\n      <div class="patient-chip"><div class="patient-avatar">AM</div><div><strong id="patientName">Paciente</strong><span>Sintético · demo segura</span></div></div>''', '''      <section class="rail-section">\n        <p>Áreas disponibles · se activan a demanda</p>\n        <div class="agent-mini"><span>HX</span><div><strong>Historia clínica</strong><small>Contexto longitudinal</small></div></div>\n        <div class="agent-mini"><span>SM</span><div><strong>Seguridad clínica</strong><small>Señales y tendencias</small></div></div>\n        <div class="agent-mini"><span>RV</span><div><strong>Resultados</strong><small>Explicación y límites</small></div></div>\n        <div class="agent-mini"><span>RX</span><div><strong>Farmacología</strong><small>Solo cuando aporta valor</small></div></div>\n        <div class="agent-mini"><span>FU</span><div><strong>Seguimiento</strong><small>Siguiente paso verificable</small></div></div>\n      </section>\n      </div>\n      <button id="accountPill" class="user-pill" type="button" aria-label="Cuenta del paciente">\n        <div id="accountAvatar" class="patient-avatar">AM</div>\n        <div><strong id="patientName">Paciente</strong><span id="accountMeta">Datos autorizados</span></div>\n      </button>\n      <div id="accountMenu" class="account-menu" hidden><button id="signOutButton" type="button">Cerrar sesión</button></div>''')
          replace("web/index.html", '<span id="agentStatus" class="status-pill">Equipo en segundo plano</span>', '<span id="agentStatus" class="status-pill">Agentes a demanda</span>')
          replace("web/index.html", '  <script src="/assets/app.js" defer></script>', '  <script src="/assets/auth.js" defer></script>\n  <script src="/assets/app.js" defer></script>')

          # Authenticated fetch and authenticated SSE reader.
          replace("web/app.js", '  expandLeft: $("#expandLeft")\n};', '  expandLeft: $("#expandLeft"), accountPill: $("#accountPill"), accountMenu: $("#accountMenu"),\n  signOutButton: $("#signOutButton"), accountMeta: $("#accountMeta"), accountAvatar: $("#accountAvatar")\n};')
          replace("web/app.js", 'async function api(path, options = {}) {\n  const response = await fetch(path, options);', 'async function healthiaFetch(path, options = {}) {\n  if (window.healthiaAuthReady) await window.healthiaAuthReady;\n  const headers = new Headers(options.headers || {});\n  if (window.healthiaAuth?.enabled) {\n    const token = await window.healthiaAuth.getToken();\n    if (token) headers.set("Authorization", `Bearer ${token}`);\n  }\n  return fetch(path, {...options, headers});\n}\nwindow.healthiaFetch = healthiaFetch;\n\nasync function api(path, options = {}) {\n  const response = await healthiaFetch(path, options);')
          replace("web/app.js", '  refs.patientName.textContent = data.profile.display_name;\n', '  refs.patientName.textContent = data.profile.display_name;\n  if (refs.accountMeta) refs.accountMeta.textContent = data.profile.email || (window.healthiaAuth?.enabled ? "Cuenta protegida" : "Demo local · cero gasto");\n  if (refs.accountAvatar) {\n    const parts = String(data.profile.display_name || "P").trim().split(/\\s+/).slice(0,2);\n    refs.accountAvatar.textContent = parts.map(part => part[0] || "").join("").toUpperCase() || "P";\n  }\n')
          old_events = '''function connectEvents() {\n  if (eventStream) return;\n  eventStream = new EventSource("/api/events/stream");\n  let refreshTimer = null;\n  eventStream.onmessage = async event => {\n    const payload = JSON.parse(event.data);\n    if (payload.type === "message" && !state.data.messages.some(item => item.id === payload.message.id)) {\n      state.data.messages.push(payload.message);\n      renderMessage(payload.message);\n      renderToday();\n      refs.chatScroll.scrollTop = refs.chatScroll.scrollHeight;\n      showToast("HealthIA se adelantó con una nueva observación.");\n    } else if (payload.type === "state") {\n      clearTimeout(refreshTimer);\n      refreshTimer = setTimeout(() => refresh(), 120);\n    } else if (payload.type === "runtime_error") showToast("El agente reportó un error auditable.");\n  };\n  eventStream.onerror = () => showToast("La conexión de eventos se reconectará automáticamente.");\n}'''
          new_events = '''function handleEventPayload(payload) {\n  if (payload.type === "message" && !state.data.messages.some(item => item.id === payload.message.id)) {\n    state.data.messages.push(payload.message); renderMessage(payload.message); renderToday();\n    refs.chatScroll.scrollTop = refs.chatScroll.scrollHeight;\n    showToast("HealthIA completó una nueva acción autorizada.");\n  } else if (payload.type === "state") {\n    clearTimeout(handleEventPayload.refreshTimer);\n    handleEventPayload.refreshTimer = setTimeout(() => refresh(), 120);\n  } else if (payload.type === "runtime_error") showToast("El agente reportó un error auditable.");\n}\n\nasync function connectEvents() {\n  if (eventStream) return;\n  const controller = new AbortController();\n  eventStream = controller;\n  try {\n    const response = await healthiaFetch("/api/events/stream", {signal: controller.signal, headers:{Accept:"text/event-stream"}});\n    if (!response.ok || !response.body) throw new Error(`Eventos ${response.status}`);\n    const reader = response.body.getReader(); const decoder = new TextDecoder(); let buffer = "";\n    while (!controller.signal.aborted) {\n      const {value, done} = await reader.read(); if (done) break;\n      buffer += decoder.decode(value, {stream:true});\n      let boundary;\n      while ((boundary = buffer.indexOf("\\n\\n")) >= 0) {\n        const frame = buffer.slice(0, boundary); buffer = buffer.slice(boundary + 2);\n        const data = frame.split(/\\r?\\n/).filter(line => line.startsWith("data:")).map(line => line.slice(5).trim()).join("\\n");\n        if (data) { try { handleEventPayload(JSON.parse(data)); } catch {} }\n      }\n    }\n  } catch (error) { if (!controller.signal.aborted) showToast("La conexión de eventos se reconectará automáticamente."); }\n  finally {\n    if (eventStream === controller) eventStream = null;\n    if (!controller.signal.aborted) setTimeout(() => connectEvents(), 1800);\n  }\n}'''
          replace("web/app.js", old_events, new_events)
          replace("web/app.js", 'refs.agentStatus.textContent = "Equipo en segundo plano";', 'refs.agentStatus.textContent = "Agentes a demanda";')
          replace("web/app.js", 'refs.agentStatus.textContent = "Equipo en segundo plano";', 'refs.agentStatus.textContent = "Agentes a demanda";')
          replace("web/app.js", 'refs.agentStatus.textContent = "Equipo en segundo plano";', 'refs.agentStatus.textContent = "Agentes a demanda";')
          replace("web/app.js", '$("#mobileMenu").addEventListener("click", () => refs.shell.classList.toggle("menu-open"));\nrefs.newConsultation?', '$("#mobileMenu").addEventListener("click", () => refs.shell.classList.toggle("menu-open"));\nrefs.accountPill?.addEventListener("click", () => { if (window.healthiaAuth?.enabled) refs.accountMenu.hidden = !refs.accountMenu.hidden; });\nrefs.signOutButton?.addEventListener("click", async () => { refs.accountMenu.hidden = true; await window.healthiaAuth?.signOut?.(); });\ndocument.addEventListener("healthia:identity-changed", async () => {\n  if (!state.data) return;\n  if (eventStream?.abort) eventStream.abort();\n  eventStream = null;\n  await refresh(true); connectEvents();\n});\nrefs.newConsultation?')
          replace("web/app.js", '(async function boot() {\n  try {\n    const readiness', '(async function boot() {\n  try {\n    if (window.healthiaAuthReady) await window.healthiaAuthReady;\n    const readiness')

          # Login/account styling.
          styles = Path("web/styles.css")
          text = styles.read_text(encoding="utf-8")
          css = '''\n\n/* Identity Platform login: one account, one patient scope. */\n.auth-gate{min-height:100vh;display:grid;place-items:center;padding:28px;background:#f8fafc}.auth-gate[hidden]{display:none!important}.auth-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 24px 70px rgba(33,51,78,.10)}.auth-brand{display:flex;gap:11px;align-items:center}.auth-mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;background:#344b70;font-size:22px}.auth-brand strong,.auth-brand span{display:block}.auth-brand strong{font-size:14px}.auth-brand span{color:var(--muted);font-size:10px;margin-top:2px}.auth-copy{margin:25px 0 18px}.auth-copy>span{font-size:8px;letter-spacing:.16em;font-weight:800;color:#4a628b}.auth-copy h1{font-size:24px;line-height:1.12;margin:7px 0}.auth-copy p{margin:0;color:var(--muted);font-size:11px;line-height:1.55}.google-auth-button,.auth-submit{width:100%;min-height:45px;border-radius:13px;font-weight:700;cursor:pointer}.google-auth-button{border:1px solid var(--line);background:#fff;color:var(--ink);display:flex;justify-content:center;gap:9px;align-items:center}.google-auth-button span{font-size:16px;color:#315eb6}.auth-submit{border:0;background:#344b70;color:#fff}.auth-divider{display:flex;align-items:center;gap:9px;margin:15px 0;color:var(--muted);font-size:9px}.auth-divider:before,.auth-divider:after{content:"";height:1px;background:var(--line);flex:1}.auth-form{display:grid;gap:10px}.auth-form label{display:grid;gap:5px;font-size:9px;font-weight:700}.auth-form input{width:100%;min-height:42px;border:1px solid var(--line);border-radius:11px;padding:0 12px;font:inherit;outline:none}.auth-form input:focus{border-color:#778bab;box-shadow:0 0 0 3px rgba(74,98,139,.10)}.auth-mode-toggle{display:block;margin:12px auto 0;border:0;background:transparent;color:#405b84;font-size:10px;cursor:pointer}.auth-message{min-height:17px;margin:12px 0 0;font-size:9px;text-align:center;color:var(--muted)}.auth-message[data-tone="error"]{color:#a43a3a}.auth-trust{display:block;margin-top:15px;padding-top:13px;border-top:1px solid var(--line);color:var(--muted);font-size:8px;line-height:1.5}.account-menu{position:absolute;left:12px;bottom:74px;width:calc(100% - 24px);background:#fff;border:1px solid var(--line);border-radius:13px;padding:6px;box-shadow:0 16px 40px rgba(33,51,78,.12);z-index:20}.account-menu[hidden]{display:none}.account-menu button{width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit}.account-menu button:hover{background:var(--surface-soft)}.left-rail{position:relative}.left-collapsed .account-menu{left:6px;width:56px}.left-collapsed .account-menu button{font-size:0;text-align:center}.left-collapsed .account-menu button:after{content:"↪";font-size:16px}\n'''
