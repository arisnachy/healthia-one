name: P1 identity assembler

on:
  push:
    branches:
      - kira/omega-100-agentic-runtime
    paths:
      - .github/p1-auth-*.patch
      - .github/workflows/p1-identity-apply.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/omega-100-agentic-runtime
          fetch-depth: 1
      - name: Apply P1 verified delta
        shell: bash
        run: |
          set -euo pipefail
          for patch in .github/p1-auth-{1..4}.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          rm .github/p1-auth-{1..4}.patch
          git config user.name "KIRA FORJA verification"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add isolated patient identity and on-demand cloud policy"
          git push origin HEAD:kira/omega-100-agentic-runtime
