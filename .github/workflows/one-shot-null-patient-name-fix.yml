name: One-shot null patient identity DOM fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true
      - name: Remove stale patientName DOM dependency and strengthen regression test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          app=Path('web/app.js')
          text=app.read_text(encoding='utf-8')
          old='''  runCheck: $("#runCheck"), patientName: $("#patientName"), todayBadge: $("#todayBadge"),'''
          new='''  runCheck: $("#runCheck"), todayBadge: $("#todayBadge"),'''
          if text.count(old) != 1:
              raise SystemExit('stale patientName ref declaration did not match exactly')
          text=text.replace(old,new,1)
          old2='''  refs.patientName.textContent = data.profile.display_name;\n  if (refs.heroPatientName) refs.heroPatientName.textContent = data.profile.display_name || "—";'''
          new2='''  if (refs.heroPatientName) refs.heroPatientName.textContent = data.profile.display_name || "—";'''
          if text.count(old2) != 1:
              raise SystemExit('unguarded patientName write did not match exactly')
          app.write_text(text.replace(old2,new2,1),encoding='utf-8')

          test=Path('tests/test_frontend_runtime_hygiene.py')
          body=test.read_text(encoding='utf-8')
          addition='''\n\ndef test_main_runtime_has_no_stale_patient_name_dom_reference() -> None:\n    app_js = (ROOT / "web" / "app.js").read_text(encoding="utf-8")\n    index_html = (ROOT / "web" / "index.html").read_text(encoding="utf-8")\n    assert '$("#patientName")' not in app_js\n    assert 'refs.patientName' not in app_js\n    assert 'id="heroPatientName"' in index_html\n'''
          if 'test_main_runtime_has_no_stale_patient_name_dom_reference' not in body:
              test.write_text(body.rstrip()+addition+'\n',encoding='utf-8')
          PY
          python -m pytest -q tests/test_frontend_runtime_hygiene.py tests/test_patient_auth_isolation.py
          rm .github/workflows/one-shot-null-patient-name-fix.yml
          git config user.name 'KIRA HealthIA CI'
          git config user.email 'actions@users.noreply.github.com'
          git add web/app.js tests/test_frontend_runtime_hygiene.py .github/workflows/one-shot-null-patient-name-fix.yml
          git diff --cached --check
          git commit -m 'fix: remove stale patient identity DOM write'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
