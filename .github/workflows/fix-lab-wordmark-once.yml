name: One-shot LAB wordmark fix

on:
  push:
    branches:
      - feature/patient-education-video-20260813
    paths:
      - .github/fix-lab-wordmark-trigger.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/patient-education-video-20260813
          fetch-depth: 0
      - name: Enforce marker and align LAB selector
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < .github/fix-lab-wordmark-trigger.txt)" = "FIX_LAB_AUTH_WORDMARK_20260813"
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/lab_omega.py')
          text = path.read_text(encoding='utf-8')
          old = 'page.locator(".brand-wordmark").inner_text()'
          new = 'page.locator(".auth-wordmark").inner_text()'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one legacy selector, found {text.count(old)}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/fix-lab-wordmark-trigger.txt .github/workflows/fix-lab-wordmark-once.yml
          git config user.name "HealthIA ONE CI"
          git config user.email "127772990+arisnachy@users.noreply.github.com"
          git add scripts/lab_omega.py .github
          git commit -m "Fix LAB OMEGA login wordmark selector"
          git push origin HEAD:feature/patient-education-video-20260813
