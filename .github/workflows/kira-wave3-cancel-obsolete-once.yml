name: KIRA Wave 3 cancel obsolete one-shots

on:
  pull_request:
    branches:
      - kira/golden-google-constellation-live-891745e1
    paths:
      - .github/workflows/kira-wave3-cancel-obsolete-once.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete:
    runs-on: ubuntu-22.04
    steps:
      - name: Cancel all active obsolete Wave 3 deploy-capable one-shots
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in kira-wave3-exact-head-authorized-once.yml kira-wave3-exact-head-authorized-once-v2.yml; do
            gh api "/repos/${REPO}/actions/workflows/${workflow}/runs?per_page=30" --jq '.workflow_runs[] | select(.event=="pull_request" and (.status=="queued" or .status=="in_progress")) | .id' | while read -r run_id; do
              [ -n "$run_id" ] || continue
              echo "Cancelling obsolete Wave 3 run ${run_id} from ${workflow}"
              gh api --method POST "/repos/${REPO}/actions/runs/${run_id}/cancel" || true
            done
          done
          echo "HEALTHIA_WAVE3_OBSOLETE_RUNS_CANCEL_REQUESTED"
