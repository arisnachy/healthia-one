name: Google OAuth live bootstrap

on:
  pull_request:
    paths:
      - ".github/workflows/google-oauth-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthia-google-oauth-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-health-constellation')
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-demo
      STATE_SECRET: healthia-google-oauth-state
      CLIENT_SECRET: healthia-google-oauth-client
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Bootstrap OAuth secrets and probe API promotion
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p dist/google-oauth-bootstrap
          out="dist/google-oauth-bootstrap/bootstrap.md"
          source_sha="$(git rev-parse HEAD)"
          service_url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          runtime_sa="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.serviceAccountName)')"
          test -n "$service_url" && test -n "$runtime_sa"
          callback="${service_url}/api/google-constellation/oauth/callback"

          secret_status="CREATED_OR_PRESENT"
          state_version=""
          client_version=""
          secret_error=""

          # Create app-global OAuth secrets first. Secret values never enter an
          # artifact or command line. A random state secret is generated only
          # inside the ephemeral runner and piped directly into Secret Manager.
          if ! gcloud secrets describe "$STATE_SECRET" --project "$PROJECT_ID" >/dev/null 2>&1; then
            state_value="$(openssl rand -base64 48 | tr -d '\n')"
            if ! printf '%s' "$state_value" | gcloud secrets create "$STATE_SECRET" \
              --project "$PROJECT_ID" --replication-policy=automatic --data-file=- --quiet >/dev/null 2>secret-error.txt; then
              secret_status="BLOCKED_IAM"
              secret_error="$(head -n 1 secret-error.txt | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[principal]/g')"
            fi
            unset state_value
          fi

          if [[ "$secret_status" != "BLOCKED_IAM" ]]; then
            state_version="$(gcloud secrets versions list "$STATE_SECRET" --project "$PROJECT_ID" \
              --filter='state=ENABLED' --sort-by='~createTime' --limit=1 --format='value(name)' 2>/dev/null || true)"
            if [[ -z "$state_version" ]]; then
              state_value="$(openssl rand -base64 48 | tr -d '\n')"
              if ! printf '%s' "$state_value" | gcloud secrets versions add "$STATE_SECRET" \
                --project "$PROJECT_ID" --data-file=- --quiet >/dev/null 2>secret-error.txt; then
                secret_status="BLOCKED_IAM"
                secret_error="$(head -n 1 secret-error.txt | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[principal]/g')"
              fi
              unset state_value
              state_version="$(gcloud secrets versions list "$STATE_SECRET" --project "$PROJECT_ID" \
                --filter='state=ENABLED' --sort-by='~createTime' --limit=1 --format='value(name)' 2>/dev/null || true)"
            fi
          fi

          if [[ "$secret_status" != "BLOCKED_IAM" ]]; then
            if ! gcloud secrets describe "$CLIENT_SECRET" --project "$PROJECT_ID" >/dev/null 2>&1; then
              if ! gcloud secrets create "$CLIENT_SECRET" --project "$PROJECT_ID" \
                --replication-policy=automatic --quiet >/dev/null 2>secret-error.txt; then
                secret_status="BLOCKED_IAM"
                secret_error="$(head -n 1 secret-error.txt | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[principal]/g')"
              fi
            fi
            client_version="$(gcloud secrets versions list "$CLIENT_SECRET" --project "$PROJECT_ID" \
              --filter='state=ENABLED' --sort-by='~createTime' --limit=1 --format='value(name)' 2>/dev/null || true)"
          fi
          rm -f secret-error.txt

          required_apis=(
            calendar-json.googleapis.com
            tasks.googleapis.com
            people.googleapis.com
            drive.googleapis.com
            places.googleapis.com
            routes.googleapis.com
          )
          api_results=()
          for api in "${required_apis[@]}"; do
            if gcloud services list --project "$PROJECT_ID" --enabled --filter="config.name=${api}" --format='value(config.name)' | grep -Fxq "$api"; then
              api_results+=("${api}|ALREADY_ENABLED")
              continue
            fi
            if gcloud services enable "$api" --project "$PROJECT_ID" --quiet >/dev/null 2>api-error.txt; then
              api_results+=("${api}|ENABLED_NOW")
            else
              reason="$(head -n 1 api-error.txt | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[principal]/g')"
              api_results+=("${api}|BLOCKED_IAM:${reason}")
            fi
          done
          rm -f api-error.txt

          {
            echo "# Google OAuth live bootstrap"
            echo
            echo "Exact source head: $source_sha"
            echo "Project: $PROJECT_ID"
            echo "Region: $REGION"
            echo "Cloud Run service: $SERVICE_NAME"
            echo "Runtime identity: $runtime_sa"
            echo "Exact HTTPS callback: $callback"
            echo
            echo "## Secret Manager"
            echo "- Bootstrap status: $secret_status"
            if [[ "$secret_status" == "BLOCKED_IAM" ]]; then
              echo "- Secret mutation blocker: ${secret_error:-permission denied}"
            else
              echo "- OAuth state secret version: projects/${PROJECT_ID}/secrets/${STATE_SECRET}/versions/${state_version}"
              echo "- OAuth client secret shell: projects/${PROJECT_ID}/secrets/${CLIENT_SECRET}"
              if [[ -n "$client_version" ]]; then
                echo "- OAuth client JSON version already exists: projects/${PROJECT_ID}/secrets/${CLIENT_SECRET}/versions/${client_version}"
              else
                echo "- OAuth client JSON version: PENDING HUMAN WEB-CLIENT CREATION"
              fi
            fi
            echo
            echo "## Mega-loop API promotion"
            for item in "${api_results[@]}"; do
              api="${item%%|*}"
              status="${item#*|}"
              echo "- ${api}: ${status}"
            done
            echo
            echo "No secret payload was printed or uploaded. No Gmail, Calendar, Tasks, Drive, People, Places or Routes request was executed."
          } > "$out"

          if grep -Eiq '(BEGIN PRIVATE KEY|client_secret["=: ]|refresh_token["=: ]|access_token["=: ]|ya29\.)' "$out"; then
            echo "Sensitive-looking material appeared in bootstrap evidence; refusing artifact upload."
            rm -f "$out"
            exit 1
          fi
          cat "$out"
      - name: Upload sanitized bootstrap receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Google-OAuth-bootstrap
          path: dist/google-oauth-bootstrap/bootstrap.md
          if-no-files-found: error
          retention-days: 14
