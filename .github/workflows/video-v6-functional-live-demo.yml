name: HealthIA V6 functional live demo

on:
  push:
    branches:
      - kira/video-v6-demo-final
    paths:
      - "scripts/record_v6_functional_demo.py"
      - "scripts/record_v6_functional_demo_final.py"
      - ".github/workflows/video-v6-functional-live-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthia-v6-functional-demo
  cancel-in-progress: true

env:
  PROJECT_ID: healthia-6088a
  REGION: us-central1
  MAPS_SECRET_NAME: healthia-google-maps-api-key
  HEALTHIA_DEMO_BASE_URL: http://127.0.0.1:8000
  HEALTHIA_DEMO_OUTPUT: dist/v6-functional-demo

jobs:
  record:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Authenticate to controlled Google Cloud project
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HealthIA and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m playwright install --with-deps chromium

      - name: Load Maps key without exposing it
        shell: bash
        run: |
          set -euo pipefail
          maps_key="$(gcloud secrets versions access latest --secret "$MAPS_SECRET_NAME" --project "$PROJECT_ID")"
          maps_key="$(printf '%s' "$maps_key" | sed 's/^﻿//' | tr -d '\r\n')"
          test -n "$maps_key"
          echo "::add-mask::$maps_key"
          echo "GOOGLE_MAPS_API_KEY=$maps_key" >> "$GITHUB_ENV"

      - name: Start real HealthIA browser application
        shell: bash
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
          HEALTHIA_ENV: local
          HEALTHIA_MODEL: gemini-3.5-flash
          HEALTHIA_LLM_BACKEND: gemini_api
          HEALTHIA_STORE_BACKEND: json
          HEALTHIA_DATA_PATH: /tmp/healthia-v6/state.json
          HEALTHIA_ACCOUNTS_PATH: /tmp/healthia-v6/accounts.json
          HEALTHIA_AUTH_REQUIRED: "true"
          HEALTHIA_ALLOW_REGISTRATION: "true"
          HEALTHIA_COST_MODE: cloud_demo
          HEALTHIA_AI_REQUEST_LIMIT: "6"
          HEALTHIA_COST_GUARD_START_ENABLED: "true"
          HEALTHIA_PROACTIVE_ENABLED: "false"
        run: |
          mkdir -p /tmp/healthia-v6 dist/v6-functional-demo
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > dist/v6-functional-demo/server.log 2>&1 &
          echo $! > dist/v6-functional-demo/server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat dist/v6-functional-demo/server.log
          exit 1

      - name: Record only working HealthIA product behavior
        shell: bash
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
        run: |
          set -euo pipefail
          python scripts/record_v6_functional_demo_final.py

      - name: Generate Charon narration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          text = """This is HealthIA ONE running as a real patient application, not a slide deck. A family autism need becomes a durable nearby-resource mission. After mission-scoped location permission, HealthIA executes Google Places and shows real addresses, phone numbers, websites, and Maps links. The second verified option can be selected exactly. Next, HealthIA's scientific radar queries current PubMed, Europe PMC, and ClinicalTrials.gov sources without an LLM retrieval call, then compares that evidence with the Losartan plan already stored in the living clinical twin. It shows an evidence timeline, not a fabricated outcome prediction. Finally, a missing creatinine test becomes another real nearby mission, returning places where the patient can complete it. One patient-owned system connects longitudinal health context, current evidence, family support, and real-world care navigation. Your health never starts over."""
          payload = {
            "input": {"text": text},
            "voice": {"languageCode": "en-US", "name": "en-US-Chirp3-HD-Charon"},
            "audioConfig": {"audioEncoding": "MP3", "speakingRate": 1.07, "pitch": 0.0}
          }
          open('dist/v6-functional-demo/tts-request.json','w',encoding='utf-8').write(json.dumps(payload))
          PY
          token="$(gcloud auth print-access-token)"
          curl -fsS -X POST "https://texttospeech.googleapis.com/v1/text:synthesize" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data-binary @dist/v6-functional-demo/tts-request.json \
            > dist/v6-functional-demo/tts-response.json
          python - <<'PY'
          import base64, json
          data=json.load(open('dist/v6-functional-demo/tts-response.json',encoding='utf-8'))
          audio=data.get('audioContent')
          if not audio:
              raise SystemExit(f'TTS failed: {data}')
          open('dist/v6-functional-demo/charon.mp3','wb').write(base64.b64decode(audio))
          PY

      - name: Build judge-ready MP4 under four minutes
        shell: bash
        run: |
          set -euo pipefail
          raw="dist/v6-functional-demo/healthia-v6-functional-live.webm"
          audio="dist/v6-functional-demo/charon.mp3"
          test -s "$raw" && test -s "$audio"
          raw_dur="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$raw")"
          audio_dur="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$audio")"
          echo "Raw browser duration: $raw_dur"
          echo "Narration duration: $audio_dur"
          read speed pad <<<"$(python - <<PY
          raw=float('$raw_dur'); audio=float('$audio_dur')
          target=min(232.0, max(audio + 1.5, raw))
          speed=max(1.0, raw/target)
          adjusted=raw/speed
          pad=max(0.0, audio + 1.0 - adjusted)
          print(speed, pad)
          PY
          )"
          vf="setpts=PTS/$speed,scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,tpad=stop_mode=clone:stop_duration=$pad"
          ffmpeg -y -i "$raw" -i "$audio" \
            -filter:v "$vf" -filter:a "apad=pad_dur=3" \
            -map 0:v:0 -map 1:a:0 \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
            -c:a aac -b:a 160k -ar 48000 -movflags +faststart -shortest \
            dist/v6-functional-demo/HealthIA_ONE_V6_FUNCTIONAL_LIVE_DEMO.mp4
          final_dur="$(ffprobe -v error -show_entries format=duration -of csv=p=0 dist/v6-functional-demo/HealthIA_ONE_V6_FUNCTIONAL_LIVE_DEMO.mp4)"
          echo "Final duration: $final_dur"
          python - <<PY
          d=float('$final_dur')
          assert d < 240.0, f'final video exceeds four minutes: {d}'
          PY
          sha256sum dist/v6-functional-demo/HealthIA_ONE_V6_FUNCTIONAL_LIVE_DEMO.mp4 | tee dist/v6-functional-demo/sha256.txt

      - name: Upload functional demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-ONE-V6-FUNCTIONAL-LIVE-DEMO
          path: |
            dist/v6-functional-demo/HealthIA_ONE_V6_FUNCTIONAL_LIVE_DEMO.mp4
            dist/v6-functional-demo/healthia-v6-functional-live.webm
            dist/v6-functional-demo/report.json
            dist/v6-functional-demo/server.log
            dist/v6-functional-demo/sha256.txt
          if-no-files-found: warn
          retention-days: 7
