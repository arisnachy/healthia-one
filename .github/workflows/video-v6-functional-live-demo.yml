name: HealthIA V10 master comprehensive live demo

on:
  push:
    branches: [kira/video-v6-demo-final]
    paths:
      - "scripts/record_v9_master_demo.py"
      - "scripts/record_v9_master_demo_entry.py"
      - ".github/workflows/video-v6-functional-live-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthia-v10-master
  cancel-in-progress: true

env:
  PROJECT_ID: healthia-6088a
  MAPS_SECRET_NAME: healthia-google-maps-api-key
  HEALTHIA_DEMO_BASE_URL: http://127.0.0.1:8000
  HEALTHIA_DEMO_OUTPUT: dist/v9-master-demo

jobs:
  record:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime and video tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m playwright install --with-deps chromium
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Load Google Maps key
        shell: bash
        run: |
          set -euo pipefail
          key="$(gcloud secrets versions access latest --secret "$MAPS_SECRET_NAME" --project "$PROJECT_ID")"
          key="$(printf '%s' "$key" | sed 's/^﻿//' | tr -d '\r\n')"
          test -n "$key"
          echo "::add-mask::$key"
          echo "GOOGLE_MAPS_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Start HealthIA ONE
        shell: bash
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
          HEALTHIA_ENV: local
          HEALTHIA_MODEL: gemini-3.5-flash
          HEALTHIA_LLM_BACKEND: gemini_api
          HEALTHIA_STORE_BACKEND: json
          HEALTHIA_DATA_PATH: /tmp/healthia-v9/state.json
          HEALTHIA_ACCOUNTS_PATH: /tmp/healthia-v9/accounts.json
          HEALTHIA_AUTH_REQUIRED: "true"
          HEALTHIA_ALLOW_REGISTRATION: "true"
          HEALTHIA_COST_MODE: cloud_demo
          HEALTHIA_AI_REQUEST_LIMIT: "6"
          HEALTHIA_COST_GUARD_START_ENABLED: "true"
          HEALTHIA_PROACTIVE_ENABLED: "false"
        run: |
          mkdir -p /tmp/healthia-v9 dist/v9-master-demo
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > dist/v9-master-demo/server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/healthz >/dev/null && exit 0
            sleep 1
          done
          cat dist/v9-master-demo/server.log
          exit 1

      - name: Record complete product story
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
        run: python scripts/record_v9_master_demo_entry.py

      - name: Generate V10 Charon narration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          text = "HealthIA ONE starts from one simple problem: a patient's health should not restart every time a new conversation begins. The system creates a patient-owned longitudinal health layer where profile, diagnoses, family history, pathological genogram, treatments, documents, appointments, visit preparation, health timeline, permissions and follow-up can remain connected. A patient can review the story in one place, keep treatment and medication check-ins organized, prepare for the next visit, preserve uploaded documents, control privacy, audit access and export information when needed. That continuity is the foundation. Now the main consultation flow. The patient speaks naturally instead of filling out a rigid form. HealthIA uses the context it already knows, identifies the goal, recalls relevant history, asks only the next useful questions and moves the clinical context forward. Gemini and Google ADK support adaptive reasoning, while deterministic rules protect identity, safety and exact state transitions. The consultation is not a disconnected chatbot exchange; each answer can update the living patient context for the next step. When evidence enters the conversation, the original source comes first. A laboratory result or clinical document is uploaded through the real product, preserved as evidence, parsed with provenance and linked to the longitudinal record. HealthIA can explain what it found, but if the evidence is incomplete or uncertain it fails closed instead of inventing a result. This evidence-first pattern also feeds the patient's digital clinical twin and future follow-up. HealthIA then turns unresolved needs into durable missions. A mission survives the conversation and waits for a real outcome instead of disappearing as a suggestion. Before an external action uses location or sensitive context, autonomy pauses for mission-scoped consent. After permission, HealthIA can use real Google Places to find validated nearby resources. If the patient says, the second one, the system selects that exact candidate, not a guessed substitute. Human choice remains the boundary. After sign-out and sign-in, the mission, evidence and patient state still belong to the same account. The platform also extends beyond the consultation. Authorized Health Connect data can add measurements such as activity, heart rate, sleep or weight, with device identity, allowed metrics and revocation controls. Opportunity Autopilot can watch authorized patient or family needs and surface discoveries only when they become useful. The scientific radar can query PubMed, Europe PMC and ClinicalTrials dot gov, compare new evidence with the current treatment context, and create a reviewable next step without silently changing therapy. A missing creatinine study, for example, can become a concrete mission with real nearby laboratory options. HealthIA Explain adds another layer: complex health information can be transformed into a patient-friendly explanation, automatically adapted to language, and presented with generated visual media using Gemini, Veo and Gemini text to speech. The purpose is not decoration; it is comprehension without losing the underlying evidence. Across every version, the same principle has become stronger: artificial intelligence when reasoning matters, deterministic systems when exactness matters, preserved evidence when trust matters, and human consent when the decision is human. HealthIA ONE is not one feature. It is the connected journey from consultation, evidence and family context to missions, devices, scientific discovery, explanations and real-world action. Your health never starts over."
          payload = {"input":{"text":text},"voice":{"languageCode":"en-US","name":"en-US-Chirp3-HD-Charon"},"audioConfig":{"audioEncoding":"MP3","speakingRate":1.08,"pitch":0.0}}
          open('dist/v9-master-demo/tts-request.json','w',encoding='utf-8').write(json.dumps(payload))
          open('dist/v9-master-demo/narration-v10.txt','w',encoding='utf-8').write(text)
          PY
          token="$(gcloud auth print-access-token)"
          curl -fsS -X POST "https://texttospeech.googleapis.com/v1/text:synthesize" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data-binary @dist/v9-master-demo/tts-request.json > dist/v9-master-demo/tts-response.json
          python - <<'PY'
          import base64, json
          data=json.load(open('dist/v9-master-demo/tts-response.json',encoding='utf-8'))
          if not data.get('audioContent'):
              raise SystemExit(data)
          open('dist/v9-master-demo/charon-v10.mp3','wb').write(base64.b64decode(data['audioContent']))
          PY
          ffprobe -v error -show_entries format=duration -of csv=p=0 dist/v9-master-demo/charon-v10.mp3 | tee dist/v9-master-demo/charon-v10-duration.txt

      - name: Build V10 provisional MP4
        shell: bash
        run: |
          set -euo pipefail
          raw="dist/v9-master-demo/healthia-v9-master-live.webm"
          audio="dist/v9-master-demo/charon-v10.mp3"
          test -s "$raw" && test -s "$audio"
          raw_dur="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$raw")"
          audio_dur="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$audio")"
          read speed pad <<<"$(python - <<PY
          raw=float('$raw_dur'); audio=float('$audio_dur')
          target=min(236.0, max(audio + 1.0, raw))
          speed=max(1.0, raw/target)
          adjusted=raw/speed
          pad=max(0.0, audio + 0.8 - adjusted)
          print(speed, pad)
          PY
          )"
          ffmpeg -y -i "$raw" -i "$audio" \
            -filter:v "setpts=PTS/$speed,scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,tpad=stop_mode=clone:stop_duration=$pad" \
            -filter:a "apad=pad_dur=2" -map 0:v:0 -map 1:a:0 \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
            -c:a aac -b:a 160k -ar 48000 -movflags +faststart -shortest \
            dist/v9-master-demo/HealthIA_ONE_V10_PROVISIONAL.mp4

      - name: Upload V10 source assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-ONE-V10-SOURCE-ASSETS
          path: |
            dist/v9-master-demo/HealthIA_ONE_V10_PROVISIONAL.mp4
            dist/v9-master-demo/healthia-v9-master-live.webm
            dist/v9-master-demo/charon-v10.mp3
            dist/v9-master-demo/charon-v10-duration.txt
            dist/v9-master-demo/narration-v10.txt
            dist/v9-master-demo/report.json
            dist/v9-master-demo/server.log
          if-no-files-found: warn
          retention-days: 7
