name: HealthIA V6 functional live demo

on:
  push:
    branches:
      - kira/video-v6-demo-final
    paths:
      - "scripts/record_v6_functional_demo.py"
      - ".github/workflows/video-v6-functional-live-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthia-v6-functional-demo
  cancel-in-progress: true

env:
  PROJECT_ID: healthia-6088a
  REGION: us-central1
  MAPS_SECRET_NAME: healthia-google-maps-api-key
  HEALTHIA_DEMO_BASE_URL: http://127.0.0.1:8000
  HEALTHIA_DEMO_OUTPUT: dist/v6-functional-demo

jobs:
  record:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Authenticate to controlled Google Cloud project
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HealthIA and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m playwright install --with-deps chromium

      - name: Load Maps key without exposing it
        shell: bash
        run: |
          set -euo pipefail
          maps_key="$(gcloud secrets versions access latest --secret "$MAPS_SECRET_NAME" --project "$PROJECT_ID")"
          maps_key="$(printf '%s' "$maps_key" | sed 's/^﻿//' | tr -d '\r\n')"
          test -n "$maps_key"
          echo "::add-mask::$maps_key"
          echo "GOOGLE_MAPS_API_KEY=$maps_key" >> "$GITHUB_ENV"

      - name: Start real HealthIA browser application
        shell: bash
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
          HEALTHIA_ENV: local
          HEALTHIA_MODEL: gemini-3.5-flash
          HEALTHIA_LLM_BACKEND: gemini_api
          HEALTHIA_STORE_BACKEND: json
          HEALTHIA_DATA_PATH: /tmp/healthia-v6/state.json
          HEALTHIA_ACCOUNTS_PATH: /tmp/healthia-v6/accounts.json
          HEALTHIA_AUTH_REQUIRED: "true"
          HEALTHIA_ALLOW_REGISTRATION: "true"
          HEALTHIA_COST_MODE: cloud_demo
          HEALTHIA_AI_REQUEST_LIMIT: "6"
          HEALTHIA_COST_GUARD_START_ENABLED: "true"
          HEALTHIA_PROACTIVE_ENABLED: "false"
        run: |
          mkdir -p /tmp/healthia-v6 dist/v6-functional-demo
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > dist/v6-functional-demo/server.log 2>&1 &
          echo $! > dist/v6-functional-demo/server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat dist/v6-functional-demo/server.log
          exit 1

      - name: Record only the working product UI
        shell: bash
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/record_v6_functional_demo.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("page.locator('[data-open=\"chat\"]').click()", "page.locator('[data-open=\"chat\"]').last.click()")
          p.write_text(s, encoding='utf-8')
          PY
          python scripts/record_v6_functional_demo.py

      - name: Generate Charon narration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/v6-functional-demo
          python - <<'PY'
          import json
          text = """This is HealthIA ONE running as a real patient application, not a slide presentation. We begin with a private account and a living clinical context. The first mission is for a family need: autism support near Santiago. HealthIA understands the request, creates durable work, and stops before using location. Only after the patient grants mission-scoped permission does it search Google Places. The results appear inside the product with real addresses, phone numbers, websites, and Google Maps links. The patient does not need to repeat everything. Saying the second one is enough for HealthIA to recover the mission and select the exact verified place. Next, the scientific radar checks current sources for an authorized health condition. A relevant discovery is stored with provenance, evidence level, reported benefits, and limitations. From the same interface, HealthIA compares that evidence with the medication and clinical context already recorded in the living twin. It organizes evidence for a professional conversation; it does not change treatment or pretend to predict an individual outcome. Finally, a missing creatinine study becomes another actionable mission. HealthIA searches for nearby places where the patient can complete the test and returns navigation links instead of leaving the patient with a reminder. HealthIA ONE combines a patient-owned clinical twin, current scientific evidence, family support, and real-world care navigation. Your health never starts over."""
          payload = {
            "input": {"text": text},
            "voice": {"languageCode": "en-US", "name": "en-US-Chirp3-HD-Charon"},
            "audioConfig": {"audioEncoding": "MP3", "speakingRate": 1.03, "pitch": 0.0}
          }
          open('dist/v6-functional-demo/tts-request.json','w',encoding='utf-8').write(json.dumps(payload))
          PY
          token="$(gcloud auth print-access-token)"
          curl -fsS -X POST "https://texttospeech.googleapis.com/v1/text:synthesize" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data-binary @dist/v6-functional-demo/tts-request.json \
            > dist/v6-functional-demo/tts-response.json
          python - <<'PY'
          import base64, json
          p='dist/v6-functional-demo/tts-response.json'
          data=json.load(open(p,encoding='utf-8'))
          audio=data.get('audioContent')
          if not audio:
              raise SystemExit(f'TTS failed: {data}')
          open('dist/v6-functional-demo/charon.mp3','wb').write(base64.b64decode(audio))
          PY

      - name: Build judge-ready MP4 under four minutes
        shell: bash
        run: |
          set -euo pipefail
          raw="dist/v6-functional-demo/healthia-v6-functional-live.webm"
          audio="dist/v6-functional-demo/charon.mp3"
          test -s "$raw" && test -s "$audio"
          raw_dur="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$raw")"
          echo "Raw browser recording duration: $raw_dur"
          speed="$(python - <<PY
          d=float('$raw_dur')
          target=226.0
          print(max(1.0, d/target))
          PY
          )"
          vf="setpts=PTS/$speed,scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2"
          ffmpeg -y -i "$raw" -i "$audio" \
            -filter:v "$vf" \
            -filter:a "apad=pad_dur=300" \
            -map 0:v:0 -map 1:a:0 \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
            -c:a aac -b:a 160k -ar 48000 \
            -movflags +faststart -shortest \
            dist/v6-functional-demo/HealthIA_ONE_V6_FUNCTIONAL_LIVE_DEMO.mp4
          final_dur="$(ffprobe -v error -show_entries format=duration -of csv=p=0 dist/v6-functional-demo/HealthIA_ONE_V6_FUNCTIONAL_LIVE_DEMO.mp4)"
          echo "Final duration: $final_dur"
          python - <<PY
          d=float('$final_dur')
          assert d < 240.0, f'final video exceeds four minutes: {d}'
          PY
          sha256sum dist/v6-functional-demo/HealthIA_ONE_V6_FUNCTIONAL_LIVE_DEMO.mp4 | tee dist/v6-functional-demo/sha256.txt

      - name: Upload functional demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-ONE-V6-FUNCTIONAL-LIVE-DEMO
          path: |
            dist/v6-functional-demo/HealthIA_ONE_V6_FUNCTIONAL_LIVE_DEMO.mp4
            dist/v6-functional-demo/healthia-v6-functional-live.webm
            dist/v6-functional-demo/report.json
            dist/v6-functional-demo/server.log
            dist/v6-functional-demo/sha256.txt
          if-no-files-found: warn
          retention-days: 7
