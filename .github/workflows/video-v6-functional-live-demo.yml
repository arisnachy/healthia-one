name: HealthIA V9 comprehensive live demo

on:
  push:
    branches:
      - kira/video-v6-demo-final
    paths:
      - "scripts/record_v6_functional_demo.py"
      - "scripts/record_v6_functional_demo_final.py"
      - "scripts/record_v7_functional_demo.py"
      - "scripts/record_v8_functional_demo.py"
      - "scripts/record_v9_master_demo.py"
      - ".github/workflows/video-v6-functional-live-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthia-v9-comprehensive-demo
  cancel-in-progress: true

env:
  PROJECT_ID: healthia-6088a
  REGION: us-central1
  MAPS_SECRET_NAME: healthia-google-maps-api-key
  HEALTHIA_DEMO_BASE_URL: http://127.0.0.1:8000
  HEALTHIA_DEMO_OUTPUT: dist/v9-master-demo

jobs:
  record:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Authenticate to controlled Google Cloud project
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HealthIA, Chromium and FFmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m playwright install --with-deps chromium
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Load Maps key without exposing it
        shell: bash
        run: |
          set -euo pipefail
          maps_key="$(gcloud secrets versions access latest --secret "$MAPS_SECRET_NAME" --project "$PROJECT_ID")"
          maps_key="$(printf '%s' "$maps_key" | sed 's/^﻿//' | tr -d '\r\n')"
          test -n "$maps_key"
          echo "::add-mask::$maps_key"
          echo "GOOGLE_MAPS_API_KEY=$maps_key" >> "$GITHUB_ENV"

      - name: Start real HealthIA browser application
        shell: bash
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
          HEALTHIA_ENV: local
          HEALTHIA_MODEL: gemini-3.5-flash
          HEALTHIA_LLM_BACKEND: gemini_api
          HEALTHIA_STORE_BACKEND: json
          HEALTHIA_DATA_PATH: /tmp/healthia-v9/state.json
          HEALTHIA_ACCOUNTS_PATH: /tmp/healthia-v9/accounts.json
          HEALTHIA_AUTH_REQUIRED: "true"
          HEALTHIA_ALLOW_REGISTRATION: "true"
          HEALTHIA_COST_MODE: cloud_demo
          HEALTHIA_AI_REQUEST_LIMIT: "6"
          HEALTHIA_COST_GUARD_START_ENABLED: "true"
          HEALTHIA_PROACTIVE_ENABLED: "false"
        run: |
          mkdir -p /tmp/healthia-v9 dist/v9-master-demo
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > dist/v9-master-demo/server.log 2>&1 &
          echo $! > dist/v9-master-demo/server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat dist/v9-master-demo/server.log
          exit 1

      - name: Record comprehensive working HealthIA product behavior
        shell: bash
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
        run: |
          set -euo pipefail
          python scripts/record_v9_master_demo.py

      - name: Generate Charon comprehensive narration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          text = "HealthIA ONE began with a simple problem: a patient's health story is fragmented across conversations, laboratory files, devices, family history, treatments, appointments and follow-up tasks. The goal is not another chatbot. It is continuity that belongs to the patient. Here a real patient account is created and the working HealthIA application opens. The longitudinal record connects confirmed conditions, a professional-confirmed Losartan plan, family context and care history. In chat, the patient speaks naturally about dizziness. HealthIA uses the context it already has and routes the conversation through its adaptive clinical workflow instead of restarting a fixed questionnaire every time. Gemini and Google ADK support adaptive reasoning, while safety rules and state transitions remain bounded by deterministic code. Next comes evidence. A synthetic laboratory file is uploaded through HealthIA. The original file is preserved, supported values are parsed, an educational explanation is generated, and the evidence is linked back to the living clinical twin. HealthIA keeps provenance before interpretation: when evidence is uncertain, it should fail closed rather than invent a value. The same patient record can receive authorized measurements and Health Connect data such as activity, heart rate and weight. Device identity, granted metrics and revocation matter because background data is not unlimited consent. HealthIA also turns needs into durable health missions. A family autism need becomes a real resource-navigation mission in Santiago. Before location is used, the mission is blocked at a mission-scoped consent boundary. After permission, the shipped HealthIA navigation engine executes Google Places and returns locality-validated candidates with addresses, Maps links, and phone or website data when available. When the patient says, the second one, HealthIA selects that exact verified candidate. Flexible reasoning is allowed; identity and external actions are exact. Opportunity Autopilot extends continuity beyond the current chat. HealthIA can watch authorized patient and family topics, keep discoveries quiet until relevant, and compare new evidence with the current record. In this demo the scientific radar queries PubMed, Europe PMC and ClinicalTrials.gov, chooses evidence relevant to hypertension, and compares it with the recorded Losartan treatment. It does not claim that a paper changes this patient's therapy or predict an outcome. Professional review remains the next boundary. A missing creatinine study becomes another actionable mission, and HealthIA finds real local places where that next step can be completed. Patient controls remain visible: permissions, quiet hours, snooze and mute, audit history, export, device revocation and Google mission connections are part of the product, not hidden behind the agent. Finally, the patient signs out and signs back in. The treatment, uploaded evidence, family context and longitudinal record are still there. That is the core promise carried from the first HealthIA demo through the system shown now: one patient-owned continuity layer, adaptive when reasoning matters, deterministic when exactness matters, and paused for human consent when the decision is human. Your health never starts over."
          payload = {
            "input": {"text": text},
            "voice": {"languageCode": "en-US", "name": "en-US-Chirp3-HD-Charon"},
            "audioConfig": {"audioEncoding": "MP3", "speakingRate": 1.05, "pitch": 0.0}
          }
          open('dist/v9-master-demo/tts-request.json','w',encoding='utf-8').write(json.dumps(payload))
          PY
          token="$(gcloud auth print-access-token)"
          curl -fsS -X POST "https://texttospeech.googleapis.com/v1/text:synthesize" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data-binary @dist/v9-master-demo/tts-request.json \
            > dist/v9-master-demo/tts-response.json
          python - <<'PY'
          import base64, json
          data=json.load(open('dist/v9-master-demo/tts-response.json',encoding='utf-8'))
          audio=data.get('audioContent')
          if not audio:
              raise SystemExit(f'TTS failed: {data}')
          open('dist/v9-master-demo/charon.mp3','wb').write(base64.b64decode(audio))
          PY

      - name: Build master MP4 under four minutes
        shell: bash
        run: |
          set -euo pipefail
          raw="dist/v9-master-demo/healthia-v9-master-live.webm"
          audio="dist/v9-master-demo/charon.mp3"
          test -s "$raw" && test -s "$audio"
          raw_dur="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$raw")"
          audio_dur="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$audio")"
          echo "Raw browser duration: $raw_dur"
          echo "Narration duration: $audio_dur"
          read speed pad <<<"$(python - <<PY
          raw=float('$raw_dur'); audio=float('$audio_dur')
          target=min(236.0, max(audio + 1.5, raw))
          speed=max(1.0, raw/target)
          adjusted=raw/speed
          pad=max(0.0, audio + 1.0 - adjusted)
          print(speed, pad)
          PY
          )"
          vf="setpts=PTS/$speed,scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,tpad=stop_mode=clone:stop_duration=$pad"
          ffmpeg -y -i "$raw" -i "$audio" \
            -filter:v "$vf" -filter:a "apad=pad_dur=3" \
            -map 0:v:0 -map 1:a:0 \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
            -c:a aac -b:a 160k -ar 48000 -movflags +faststart -shortest \
            dist/v9-master-demo/HealthIA_ONE_V9_MASTER_COMPREHENSIVE_LIVE_DEMO.mp4
          final_dur="$(ffprobe -v error -show_entries format=duration -of csv=p=0 dist/v9-master-demo/HealthIA_ONE_V9_MASTER_COMPREHENSIVE_LIVE_DEMO.mp4)"
          echo "Final duration: $final_dur"
          python - <<PY
          d=float('$final_dur')
          assert d < 240.0, f'final video exceeds four minutes: {d}'
          assert d > 150.0, f'comprehensive video is unexpectedly short: {d}'
          PY
          sha256sum dist/v9-master-demo/HealthIA_ONE_V9_MASTER_COMPREHENSIVE_LIVE_DEMO.mp4 | tee dist/v9-master-demo/sha256.txt

      - name: Upload comprehensive demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-ONE-V9-MASTER-COMPREHENSIVE-LIVE-DEMO
          path: |
            dist/v9-master-demo/HealthIA_ONE_V9_MASTER_COMPREHENSIVE_LIVE_DEMO.mp4
            dist/v9-master-demo/healthia-v9-master-live.webm
            dist/v9-master-demo/report.json
            dist/v9-master-demo/server.log
            dist/v9-master-demo/sha256.txt
          if-no-files-found: warn
          retention-days: 7
