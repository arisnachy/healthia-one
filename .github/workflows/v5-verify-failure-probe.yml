name: HealthIA V5 external execution probe

on:
  push:
    branches: [kira/live-product-film-20260819]
    paths:
      - ".github/workflows/v5-verify-failure-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-22.04
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      JOB_NAME: hfilm-28293833-fc48d9-await-email
      EXECUTION_NAME: hfilm-28293833-fc48d9-await-email-xl4qj
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/live-product-film-20260819
          fetch-depth: 0
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Capture sanitized execution state
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs executions describe "$EXECUTION_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/execution.json || true
          gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB_NAME}\"" --project "$PROJECT_ID" --freshness=1h --limit=100 --order=desc --format=json > /tmp/logs.json || echo '[]' > /tmp/logs.json
          python - <<'PY'
          import json
          text=open('/tmp/execution.json').read().strip(); exe=json.loads(text) if text else {}
          logs=json.load(open('/tmp/logs.json')); safe=[]
          for item in logs:
              msg=str(item.get('textPayload') or (item.get('jsonPayload') or {}).get('message') or '')
              if not msg: continue
              if any(word in msg.lower() for word in ('authorization:', 'bearer ', 'refresh_token', 'client_secret')): continue
              safe.append({'timestamp':item.get('timestamp'),'severity':item.get('severity'),'text':msg[:1200]})
          status=exe.get('status') or {}
          out={'execution':exe.get('metadata',{}).get('name'),'completionTime':status.get('completionTime'),'conditions':status.get('conditions'),'failedCount':status.get('failedCount'),'succeededCount':status.get('succeededCount'),'logs':safe[:40]}
          open('hackathon/v5_verify_failure.json','w').write(json.dumps(out,indent=2,default=str))
          PY
          git config user.name "healthia-v5-exec-probe"
          git config user.email "actions@users.noreply.github.com"
          git add hackathon/v5_verify_failure.json
          git commit -m "film: capture V5 external execution diagnostics"
          git push origin HEAD:kira/live-product-film-20260819
