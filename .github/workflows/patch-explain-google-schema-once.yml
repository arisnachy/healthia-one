name: Patch Google-compatible HealthIA Explain schema once

on:
  push:
    branches:
      - feature/patient-education-video-20260813
    paths:
      - .github/workflows/patch-explain-google-schema-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/patient-education-video-20260813
          fetch-depth: 0
      - name: Filter Pydantic schema to Google-supported JSON Schema keywords
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('healthia_one/education_video.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''def _validation_errors(exc: ValidationError) -> list[dict[str, Any]]:\n    return [\n        {\n            "type": str(item.get("type") or "validation_error"),\n            "loc": [str(part) for part in (item.get("loc") or ())],\n            "msg": str(item.get("msg") or "invalid structured field")[:240],\n        }\n        for item in exc.errors(include_url=False, include_input=False)[:12]\n    ]\n\n\ndef _silent_narration(seconds: int) -> NarrationAudio:\n'''
          replacement = '''def _validation_errors(exc: ValidationError) -> list[dict[str, Any]]:\n    return [\n        {\n            "type": str(item.get("type") or "validation_error"),\n            "loc": [str(part) for part in (item.get("loc") or ())],\n            "msg": str(item.get("msg") or "invalid structured field")[:240],\n        }\n        for item in exc.errors(include_url=False, include_input=False)[:12]\n    ]\n\n\n_GOOGLE_JSON_SCHEMA_KEYS = {\n    "$id", "$defs", "$ref", "$anchor", "type", "format", "title", "description",\n    "enum", "items", "prefixItems", "minItems", "maxItems", "minimum", "maximum",\n    "anyOf", "oneOf", "properties", "additionalProperties", "required",\n}\n\n\ndef _google_response_schema() -> dict[str, Any]:\n    """Return only JSON Schema keywords documented by Google Gen AI structured output."""\n    def clean(value: Any, parent_key: str = "") -> Any:\n        if isinstance(value, list):\n            return [clean(item) for item in value]\n        if not isinstance(value, dict):\n            return value\n        if parent_key in {"properties", "$defs"}:\n            return {str(name): clean(schema) for name, schema in value.items()}\n        return {\n            key: clean(item, key)\n            for key, item in value.items()\n            if key in _GOOGLE_JSON_SCHEMA_KEYS\n        }\n\n    return clean(EducationVideoPlan.model_json_schema())\n\n\ndef _silent_narration(seconds: int) -> NarrationAudio:\n'''
          if anchor not in text:
              raise SystemExit('validation helper anchor missing')
          text = text.replace(anchor, replacement, 1)
          old = '"response_json_schema": EducationVideoPlan.model_json_schema(),'
          new = '"response_json_schema": _google_response_schema(),'
          if old not in text:
              raise SystemExit('response_json_schema call anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_healthia_explain_planner_contract.py')
          t = test.read_text(encoding='utf-8')
          t = t.replace(
              '    _education_system_instruction,\n    _normalize_plan_payload,\n',
              '    _education_system_instruction,\n    _google_response_schema,\n    _normalize_plan_payload,\n',
              1,
          )
          insert = '''\n\ndef test_google_response_schema_keeps_supported_structure_and_drops_unsupported_pydantic_keywords():\n    schema = _google_response_schema()\n    encoded = json.dumps(schema)\n    assert schema["properties"]["scenes"]["minItems"] == 3\n    assert schema["properties"]["scenes"]["maxItems"] == 8\n    assert "$defs" in schema\n    assert "default" not in encoded\n    assert "minLength" not in encoded\n    assert "maxLength" not in encoded\n\n'''
          marker = '\n\n@pytest.mark.asyncio\nasync def test_gemini_plan_uses_pydantic_json_schema_and_accepts_safe_normalization():'
          if marker not in t:
              raise SystemExit('planner async test marker missing')
          t = t.replace(marker, insert + marker, 1)
          test.write_text(t, encoding='utf-8')
          PY
          git config user.name "healthia-one-maintenance"
          git config user.email "127772990+arisnachy@users.noreply.github.com"
          git add healthia_one/education_video.py tests/test_healthia_explain_planner_contract.py
          git commit -m "Filter Explain schema for Google structured output"
          git push origin HEAD:feature/patient-education-video-20260813
