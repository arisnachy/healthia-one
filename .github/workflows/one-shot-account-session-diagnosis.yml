name: One-shot Cloud account session diagnosis

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  account-session:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-judge
      EXPECTED_REVISION: healthia-one-judge-00003-dd9
    steps:
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install minimal browser probe
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Probe live session versus account dialog cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment/account-session-diagnosis
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          test "$revision" = "$EXPECTED_REVISION"
          token="$(gcloud auth print-identity-token --audiences="$url")"
          echo "::add-mask::$token"
          export TARGET_URL="$url" TARGET_TOKEN="$token"
          python - <<'PY'
          import json, os, uuid
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('deployment/account-session-diagnosis')
          suffix=uuid.uuid4().hex[:10]
          email=f'account-diag-{suffix}@example.test'
          password=f'AccountDiag!{suffix}Aa9'
          display='Paciente Account Diag'
          console=[]; errors=[]
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True,args=['--no-sandbox'])
              c=b.new_context(viewport={'width':1440,'height':900},extra_http_headers={'Authorization':f"Bearer {os.environ['TARGET_TOKEN']}"})
              page=c.new_page()
              page.on('console',lambda m: console.append({'type':m.type,'text':m.text}))
              page.on('pageerror',lambda e: errors.append(str(e)))
              page.goto(os.environ['TARGET_URL']+'/login',wait_until='networkidle',timeout=60000)
              page.locator('#registerTab').click()
              page.locator('#registerForm input[name="display_name"]').fill(display)
              page.locator('#registerForm input[name="email"]').fill(email)
              page.locator('#registerForm input[name="password"]').fill(password)
              page.locator('#registerForm button[type="submit"]').click()
              page.wait_for_url(os.environ['TARGET_URL']+'/',timeout=30000)
              page.wait_for_timeout(1200)
              live=page.evaluate("""async () => { const r=await fetch('/api/auth/session'); return await r.json(); }""")
              readiness=page.evaluate("""async () => { const r=await fetch('/api/readiness'); return await r.json(); }""")
              runtime=page.locator('#runtimeLabel').inner_text()
              pill=page.locator('#accountPill').inner_text()
              page.locator('#accountPill').click()
              page.wait_for_selector('#accountDialog[open]',timeout=10000)
              identity=page.locator('#accountIdentity').inner_text()
              html=page.locator('#accountIdentity').inner_html()
              page.screenshot(path=str(out/'account-dialog.png'),full_page=True)
              payload={
                'session_authenticated':live.get('authenticated'),
                'session_email_matches':(live.get('account') or {}).get('email') == email,
                'session_display_matches':(live.get('account') or {}).get('display_name') == display,
                'session_credential_persistence':live.get('credential_persistence'),
                'dialog_contains_email':email in identity,
                'dialog_text':identity,
                'dialog_html':html,
                'pill_text':pill,
                'runtime_label':runtime,
                'readiness_ai_ready':readiness.get('ai_ready'),
                'readiness_model':readiness.get('model'),
                'readiness_llm_backend':readiness.get('llm_backend'),
                'console':console,
                'page_errors':errors,
              }
              (out/'diagnosis.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
              c.close(); b.close()
          print(json.dumps(payload,ensure_ascii=False))
          assert payload['session_authenticated'] is True
          assert payload['session_email_matches'] is True
          PY
      - name: Upload account diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-cloud-account-session-diagnosis
          path: deployment/account-session-diagnosis
          if-no-files-found: error
          retention-days: 7
