name: One-shot run Vertex migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate-candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: kira/event-driven-results-twin-p1
          fetch-depth: 0

      - name: Execute migration script embedded in candidate one-shot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          yml = Path('.github/workflows/one-shot-vertex-migration.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          start = yml.index(start_marker) + len(start_marker)
          end = yml.index("\n          PY\n", start)
          code = yml[start:end]
          # Remove YAML indentation from the embedded heredoc body.
          lines = code.splitlines()
          code = "\n".join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, '<vertex-migration>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Verify migrated candidate
        shell: bash
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -e ".[test]" >/dev/null
          python -m pytest -q tests/test_vertex_backend.py tests/test_result_taskmaster_closure.py
          python -m compileall -q healthia_one deployment/verify_google_ai.py

      - name: Publish candidate and remove candidate one-shot
        shell: bash
        run: |
          git rm .github/workflows/one-shot-vertex-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add healthia_one .env.example deployment/verify_google_ai.py tests/test_vertex_backend.py
          git commit -m "feat: add native Vertex AI backend for hackathon cloud credits"
          git push origin HEAD:kira/event-driven-results-twin-p1

      - name: Remove this runner from main
        shell: bash
        run: |
          git fetch origin main
          git switch --force-create main origin/main
          if [ -f .github/workflows/one-shot-run-vertex-migration.yml ]; then
            git rm .github/workflows/one-shot-run-vertex-migration.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ci: remove completed Vertex migration runner"
            git push origin main
          fi
