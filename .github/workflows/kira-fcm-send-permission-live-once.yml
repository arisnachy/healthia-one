name: KIRA one-shot FCM send-permission LIVE proof

on:
  pull_request:
    paths:
      - '.github/workflows/kira-fcm-send-permission-live-once.yml'

permissions:
  contents: read

concurrency:
  group: kira-fcm-send-permission-live-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fcm-live-once:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live'
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    env:
      PROJECT_ID: healthia-6088a
      DEVICE_AUTHORIZATION: I_AUTHORIZE_CONTROLLED_FCM_PROOF
      TEMP_ROLE: roles/firebasecloudmessaging.admin
      SEND_PERMISSION: cloudmessaging.messages.create
    steps:
      - name: Refuse retries and require exact authorization
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_RUN_ATTEMPT}" == "1" ]] || { echo 'Refusing retry: authorization is one-shot.' >&2; exit 1; }
          [[ "$DEVICE_AUTHORIZATION" == "I_AUTHORIZE_CONTROLLED_FCM_PROOF" ]] || { echo 'Exact authorization missing.' >&2; exit 1; }

      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bind source SHA
        shell: bash
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Install Firestore client
        shell: bash
        run: python -m pip install --quiet "google-cloud-firestore>=2.21,<3"

      - name: Require exactly one active controlled device
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/fcm-send-live-once
          python - <<'PY'
          import json, os
          from pathlib import Path
          from google.cloud import firestore
          client=firestore.Client(project=os.environ['PROJECT_ID'])
          candidates=[]; total=0; token_bearing=0; valid_hashes=0
          for snapshot in client.collection_group('devices').stream():
              if not snapshot.reference.path.startswith('healthia_fcm_registrations/'):
                  continue
              f=snapshot.to_dict() or {}
              if not {'patient_id','connection_id','device_id','enabled'} <= set(f):
                  continue
              total += 1
              raw=str(f.get('registration_token') or '')
              digest=str(f.get('token_sha256') or '')
              if raw or digest: token_bearing += 1
              valid=len(digest)==64 and all(c in '0123456789abcdefABCDEF' for c in digest)
              if valid: valid_hashes += 1
              if bool(f.get('enabled',True)) and len(raw)>=16 and valid:
                  candidates.append({'path':snapshot.reference.path,'token':raw,'digest':digest})
          out={'status':'READY_DEVICE_PRESENT' if len(candidates)==1 else 'BLOCKED_DEVICE_COUNT','active_fcm_registration_count':len(candidates),'fcm_registration_documents':total,'fcm_token_bearing_documents':token_bearing,'registrations_with_valid_sha256':valid_hashes,'source_sha':os.environ.get('SOURCE_SHA',''),'raw_token_exposed':False,'iam_mutation':False,'secret_material_exposed':False}
          Path('dist/fcm-send-live-once/preflight.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          if len(candidates)!=1: raise SystemExit('Exactly one active controlled device required')
          Path('/tmp/fcm-token').write_text(candidates[0]['token'])
          Path('/tmp/fcm-path').write_text(candidates[0]['path'])
          Path('/tmp/fcm-digest').write_text(candidates[0]['digest'])
          PY

      - name: Grant temporary minimal predefined FCM API send role only if needed
        shell: bash
        run: |
          set -euo pipefail
          CI_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          test -n "$CI_ACCOUNT"
          echo "::add-mask::$CI_ACCOUNT"
          MEMBER="serviceAccount:$CI_ACCOUNT"
          echo "::add-mask::$MEMBER"
          printf '%s' "$MEMBER" > /tmp/fcm-member
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::$ACCESS_TOKEN"
          export ACCESS_TOKEN
          has_permission() {
            python - <<'PY'
          import json, os, urllib.request
          req=urllib.request.Request(
              f"https://cloudresourcemanager.googleapis.com/v1/projects/{os.environ['PROJECT_ID']}:testIamPermissions",
              data=json.dumps({'permissions':[os.environ['SEND_PERMISSION']]}).encode(),
              headers={'Authorization':'Bearer '+os.environ['ACCESS_TOKEN'],'Content-Type':'application/json'},
              method='POST')
          with urllib.request.urlopen(req,timeout=30) as r:
              body=json.loads(r.read().decode() or '{}')
          raise SystemExit(0 if os.environ['SEND_PERMISSION'] in body.get('permissions',[]) else 1)
          PY
          }
          if has_permission; then
            echo 'FCM send permission already effective; no temporary IAM grant required.'
          else
            gcloud projects add-iam-policy-binding "$PROJECT_ID" --member="$MEMBER" --role="$TEMP_ROLE" --condition=None --quiet >/dev/null
            touch /tmp/fcm-temp-role-granted
            echo 'Temporary FCM API send role granted; waiting for exact permission propagation.'
            for _ in $(seq 1 20); do
              ACCESS_TOKEN="$(gcloud auth print-access-token)"; echo "::add-mask::$ACCESS_TOKEN"; export ACCESS_TOKEN
              if has_permission; then
                touch /tmp/fcm-send-permission-effective
                break
              fi
              sleep 3
            done
            [[ -f /tmp/fcm-send-permission-effective ]] || { echo 'cloudmessaging.messages.create did not become effective.' >&2; exit 1; }
          fi

      - name: Send exactly one provider-accepted PHI-neutral message and require visible durable ACK
        shell: bash
        run: |
          set -euo pipefail
          registration_token="$(cat /tmp/fcm-token)"
          document_path="$(cat /tmp/fcm-path)"
          token_digest="$(cat /tmp/fcm-digest)"
          echo "::add-mask::$registration_token"
          access_token="$(gcloud auth print-access-token)"
          echo "::add-mask::$access_token"
          proof_id="fcmproof_$(python -c 'import secrets; print(secrets.token_hex(16))')"
          export REGISTRATION_TOKEN="$registration_token" DOCUMENT_PATH="$document_path" TOKEN_DIGEST="$token_digest" ACCESS_TOKEN="$access_token" PROOF_ID="$proof_id"
          python - <<'PY'
          import hashlib, json, os, time, urllib.error, urllib.request
          from pathlib import Path
          from google.cloud import firestore
          project=os.environ['PROJECT_ID']
          payload={'message':{'token':os.environ['REGISTRATION_TOKEN'],'data':{'kind':'healthia_update','proof_id':os.environ['PROOF_ID']},'android':{'priority':'HIGH'}}}
          req=urllib.request.Request(f'https://fcm.googleapis.com/v1/projects/{project}/messages:send',data=json.dumps(payload,separators=(',',':')).encode(),headers={'Authorization':'Bearer '+os.environ['ACCESS_TOKEN'],'Content-Type':'application/json'},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=60) as response:
                  result=json.loads(response.read().decode() or '{}')
          except urllib.error.HTTPError as exc:
              raise RuntimeError(f'FCM provider send failed before acceptance with HTTP {exc.code}') from None
          message_name=str(result.get('name') or '')
          if not message_name: raise RuntimeError('FCM provider did not return a message resource')
          reference=firestore.Client(project=project).document(os.environ['DOCUMENT_PATH'])
          acknowledged=False; shown=False; ack_at=None
          for _ in range(60):
              f=reference.get().to_dict() or {}
              if str(f.get('last_delivery_proof_id') or '') == os.environ['PROOF_ID']:
                  acknowledged=True; shown=f.get('last_delivery_notification_shown') is True; ack_at=f.get('last_delivery_ack_at'); break
              time.sleep(4)
          if not acknowledged: raise RuntimeError('FCM accepted exactly one message but no matching durable ACK arrived')
          if not shown: raise RuntimeError('Matching durable ACK arrived but Android did not confirm visible notification')
          out={'status':'LIVE_PASS','source_sha':os.environ.get('SOURCE_SHA',''),'provider':'fcm.googleapis.com','provider_message_name_sha256':hashlib.sha256(message_name.encode()).hexdigest(),'registration_token_sha256':os.environ['TOKEN_DIGEST'],'proof_id_sha256':hashlib.sha256(os.environ['PROOF_ID'].encode()).hexdigest(),'provider_message_accepted':True,'exactly_one_provider_accepted_message':True,'controlled_device_ack':True,'controlled_device_notification_shown':True,'acknowledged_at_present':ack_at is not None,'data_message_kind':'healthia_update','clinical_content':False,'raw_token_exposed':False,'raw_proof_id_exposed':False,'api_enable_mutation':False,'secret_material_exposed':False}
          Path('dist/fcm-send-live-once/live.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Remove temporary FCM API send role
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/fcm-temp-role-granted && -f /tmp/fcm-member ]]; then
            MEMBER="$(cat /tmp/fcm-member)"; echo "::add-mask::$MEMBER"
            gcloud projects remove-iam-policy-binding "$PROJECT_ID" --member="$MEMBER" --role="$TEMP_ROLE" --condition=None --quiet >/dev/null || gcloud projects remove-iam-policy-binding "$PROJECT_ID" --member="$MEMBER" --role="$TEMP_ROLE" --quiet >/dev/null
            echo 'Temporary FCM API send role removed.'
          fi

      - name: Verify temporary send role cleanup and build sanitized evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/fcm-send-live-once
          ROLE_LEFT=false
          if [[ -f /tmp/fcm-member ]]; then
            MEMBER="$(cat /tmp/fcm-member)"; echo "::add-mask::$MEMBER"
            if gcloud projects get-iam-policy "$PROJECT_ID" --flatten='bindings[].members' --filter="bindings.role:$TEMP_ROLE AND bindings.members:$MEMBER" --format='value(bindings.role)' | grep -Fxq "$TEMP_ROLE"; then ROLE_LEFT=true; fi
          fi
          export ROLE_LEFT
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('dist/fcm-send-live-once')
          live=json.loads((root/'live.json').read_text()) if (root/'live.json').exists() else None
          out={'status':'LIVE_PASS' if live and live.get('controlled_device_ack') and live.get('controlled_device_notification_shown') else 'NOT_LIVE_PASS','source_sha':os.environ.get('SOURCE_SHA',''),'temporary_send_role_granted':Path('/tmp/fcm-temp-role-granted').exists(),'temporary_send_role_removed':os.environ.get('ROLE_LEFT','true').lower()!='true','provider_message_accepted':bool(live and live.get('provider_message_accepted')),'exactly_one_provider_accepted_message':bool(live and live.get('exactly_one_provider_accepted_message')),'controlled_device_ack':bool(live and live.get('controlled_device_ack')),'controlled_device_notification_shown':bool(live and live.get('controlled_device_notification_shown')),'api_enable_mutation':False,'secret_material_exposed':False}
          (root/'summary.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          if not out['temporary_send_role_removed']: raise SystemExit('Temporary FCM send role cleanup failed')
          PY
          rm -f /tmp/fcm-token /tmp/fcm-path /tmp/fcm-digest /tmp/fcm-member /tmp/fcm-temp-role-granted /tmp/fcm-send-permission-effective
          if grep -R -Eiq '(BEGIN PRIVATE KEY|refresh_token|client_secret|access_token|id_token|ya29\.|registration_token["=: ]|proof_id["=: ]|@[A-Za-z0-9.-]+\.[A-Za-z]{2,})' dist/fcm-send-live-once; then
            rm -rf dist/fcm-send-live-once
            echo 'Sensitive-looking evidence detected; refusing upload.' >&2
            exit 1
          fi

      - name: Upload sanitized proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-FCM-LIVE-Permission-Transaction
          path: dist/fcm-send-live-once
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce LIVE PASS
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('dist/fcm-send-live-once/summary.json')
          if not p.exists(): raise SystemExit('LIVE summary missing')
          s=json.loads(p.read_text())
          if s.get('status')!='LIVE_PASS': raise SystemExit('FCM LIVE proof did not prove accepted message + visible durable ACK')
          print(json.dumps({'status':'LIVE_PASS','temporary_send_role_removed':s.get('temporary_send_role_removed'),'exactly_one_provider_accepted_message':s.get('exactly_one_provider_accepted_message')},sort_keys=True))
          PY
