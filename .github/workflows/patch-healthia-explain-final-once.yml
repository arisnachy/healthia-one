name: One-shot final HealthIA Explain hardening

# Retry after correcting the frontend player contract.
on:
  push:
    branches:
      - feature/patient-education-video-20260813
    paths:
      - .github/workflows/patch-healthia-explain-final-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/patient-education-video-20260813
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch deterministic topic extraction and Veo planning
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch_healthia_explain_final_once.py
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          pytest -q tests/test_education_video_core.py tests/test_healthia_multilingual.py tests/test_education_video_frontend.py
      - name: Self-clean and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch_healthia_explain_final_once.py .github/workflows/patch-healthia-explain-final-once.yml
          git config user.name "HealthIA ONE CI"
          git config user.email "127772990+arisnachy@users.noreply.github.com"
          git add healthia_one/education_video_models.py healthia_one/education_video.py tests/test_education_video_core.py scripts .github
          git commit -m "Fix HealthIA Explain topic extraction and Veo planning"
          git push origin HEAD:feature/patient-education-video-20260813
