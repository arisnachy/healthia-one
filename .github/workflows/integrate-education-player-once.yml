name: One-shot HealthIA Explain chat player integration

on:
  push:
    branches:
      - feature/patient-education-video-20260813
    paths:
      - .github/integrate-education-player-trigger.txt

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/patient-education-video-20260813
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce marker and patch player
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < .github/integrate-education-player-trigger.txt)" = "INTEGRATE_HEALTHIA_EXPLAIN_PLAYER_20260813_V3"
          python scripts/patch_healthia_explain_player_once.py

      - name: Validate frontend player
        shell: bash
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check web/auth.js
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          pytest -q tests/test_education_video_frontend.py tests/test_ui_locale_packs.py tests/test_education_video_core.py tests/test_education_renderer_smoke.py

      - name: Self-clean and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/integrate-education-player-trigger.txt .github/workflows/integrate-education-player-once.yml scripts/patch_healthia_explain_player_once.py
          git config user.name "HealthIA ONE CI"
          git config user.email "127772990+arisnachy@users.noreply.github.com"
          git add web tests/test_education_video_frontend.py .github scripts
          git commit -m "Embed HealthIA Explain video player in patient chat"
          git push origin HEAD:feature/patient-education-video-20260813
