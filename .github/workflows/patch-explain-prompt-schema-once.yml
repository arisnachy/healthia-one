name: Patch HealthIA Explain schema-only prompt once

on:
  push:
    branches:
      - feature/patient-education-video-20260813
    paths:
      - .github/workflows/patch-explain-prompt-schema-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/patient-education-video-20260813
          fetch-depth: 0
      - name: Remove duplicate JSON-shape prompt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('healthia_one/education_video.py')
          text = path.read_text(encoding='utf-8')
          old = '''- Keep narration within the requested duration.\n\nJSON shape:\n{{\n  "title": "...",\n  "summary": "...",\n  "patient_fact_keys": ["only keys from allowed_patient_facts that truly help"],\n  "scenes": [\n    {{"heading":"...","body":"...","narration":"...","visual_kind":"card|veo","veo_prompt":"generic English prompt only for veo"}}\n  ]\n}}\n""".strip()'''
          new = '''- Keep narration within the requested duration.\n- Return only the structured object required by the response schema; do not add markdown, commentary, or extra keys.\n""".strip()'''
          if old not in text:
              raise SystemExit('duplicate JSON-shape prompt block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_healthia_explain_planner_contract.py')
          t = test.read_text(encoding='utf-8')
          anchor = '''    assert 'exactly lowercase "card" or "veo"' in prompt\n'''
          replacement = anchor + '''    assert "JSON shape:" not in prompt\n    assert "structured object required by the response schema" in prompt\n'''
          if anchor not in t:
              raise SystemExit('planner prompt test anchor missing')
          test.write_text(t.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          git config user.name "healthia-one-maintenance"
          git config user.email "127772990+arisnachy@users.noreply.github.com"
          git add healthia_one/education_video.py tests/test_healthia_explain_planner_contract.py
          git commit -m "Use schema as the single HealthIA Explain JSON contract"
          git push origin HEAD:feature/patient-education-video-20260813
