name: Guardian Wave 14 Eventarc phase 7 definitive probe

on:
  pull_request:
    paths:
      - ".github/workflows/guardian-wave14-eventarc-phase7.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthia-wave14-eventarc-phase7
  cancel-in-progress: false

jobs:
  prove:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/guardian-wave14-eventarc-live')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      PRODUCT_SHA: f9a3906484095460916218623a919a01b4f87e30
      AUTOPILOT_SERVICE: healthia-one-autopilot
      AUTOPILOT_TRIGGER: healthia-opportunity-events
      EVENTARC_SA: healthia-autopilot-eventarc@healthia-6088a.iam.gserviceaccount.com
    steps:
      - name: Checkout exact merged Wave 14 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify existing private Eventarc topology
        id: topology
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/guardian-wave14-eventarc-phase7
          [[ "$(git rev-parse HEAD)" == "$PRODUCT_SHA" ]]
          [[ "$(python --version)" == Python\ 3.12* ]]
          gcloud run services describe "$AUTOPILOT_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/autopilot.json
          ready="$(jq -r '[.status.conditions[]? | select(.type=="Ready") | .status][0] // "False"' /tmp/autopilot.json)"
          revision="$(jq -r '.status.latestReadyRevisionName // empty' /tmp/autopilot.json)"
          url="$(jq -r '.status.url // empty' /tmp/autopilot.json)"
          [[ "$ready" == True ]]; test -n "$revision"; test -n "$url"
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$url/healthz" || true)"
          if [[ -z "$code" || "$code" =~ ^2 ]]; then echo "Autopilot unexpectedly public" >&2; exit 1; fi
          location="$(gcloud firestore databases describe --database='(default)' --project "$PROJECT_ID" --format='value(locationId)')"
          gcloud eventarc triggers describe "$AUTOPILOT_TRIGGER" --project "$PROJECT_ID" --location "$location" --format=json > /tmp/trigger.json
          [[ "$(jq -r '.destination.cloudRun.service // empty' /tmp/trigger.json)" == "$AUTOPILOT_SERVICE" ]]
          [[ "$(jq -r '.destination.cloudRun.region // empty' /tmp/trigger.json)" == "$REGION" ]]
          [[ "$(jq -r '.destination.cloudRun.path // empty' /tmp/trigger.json)" == "/events/firestore" ]]
          [[ "$(jq -r '.serviceAccount // empty' /tmp/trigger.json)" == "$EVENTARC_SA" ]]
          jq -e '.eventFilters[]? | select(.attribute=="type" and .value=="google.cloud.firestore.document.v1.created")' /tmp/trigger.json >/dev/null
          jq -e '.eventFilters[]? | select(.attribute=="database" and .value=="(default)")' /tmp/trigger.json >/dev/null
          jq -e '.eventFilters[]? | select(.attribute=="document" and .value=="healthia_autopilot_events/{eventId}")' /tmp/trigger.json >/dev/null
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "location=$location" >> "$GITHUB_OUTPUT"
          {
            echo "# HealthIA Wave 14 Eventarc definitive probe"
            echo "Product SHA: $PRODUCT_SHA"
            echo "Python: $(python --version)"
            echo "Autopilot revision: $revision"
            echo "Autopilot private: yes"
            echo "Eventarc trigger: $AUTOPILOT_TRIGGER"
            echo "Eventarc location: $location"
            echo "Exact trigger contract: verified"
          } > dist/guardian-wave14-eventarc-phase7/report.md
          # Allow trigger provisioning to settle before first proof event.
          sleep 25

      - name: Install exact product package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -e . >/dev/null
          python -c 'import healthia_one, google.cloud.firestore; print("probe_runtime_ready")'

      - name: Create isolated pending outbox event only
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_CLOUD_PROJECT="$PROJECT_ID"
          python - <<'PY' > /tmp/probe.json
          import json, os
          from google.cloud import firestore
          from healthia_one.autopilot_events import FirestoreEventOutboxStore
          from healthia_one.autopilot_runtime import AutopilotEvent
          from healthia_one.models import PatientState
          from healthia_one.store import PATIENT_STATE_COLLECTION

          project=os.environ['GOOGLE_CLOUD_PROJECT']
          patient_id=f"patient_eventarc_phase7_{os.environ['GITHUB_RUN_ID']}"
          state=PatientState()
          state.profile.id=patient_id
          state.profile.display_name='HealthIA Eventarc Definitive Synthetic Probe'
          state.profile.email=''
          state.consent.proactive_enabled=False
          state.consent.signal_types=[]
          client=firestore.Client(project=project)
          client.collection(PATIENT_STATE_COLLECTION).document(patient_id).set(state.model_dump(mode='json'))
          event=AutopilotEvent(
              patient_id=patient_id,
              event_type='patient_state_changed',
              subject_id='eventarc_probe',
              payload={'source':'eventarc_live_probe','notification_requested':False},
          )
          record=FirestoreEventOutboxStore(project=project).put(event)
          print(json.dumps({'patient_id':patient_id,'event_id':record.id,'initial_status':record.status}))
          PY
          patient_id="$(jq -r '.patient_id' /tmp/probe.json)"
          event_id="$(jq -r '.event_id' /tmp/probe.json)"
          initial="$(jq -r '.initial_status' /tmp/probe.json)"
          [[ "$event_id" == event_* ]]
          [[ "$initial" == pending ]]
          echo "patient_id=$patient_id" >> "$GITHUB_OUTPUT"
          echo "event_id=$event_id" >> "$GITHUB_OUTPUT"

      - name: Wait only for Eventarc autonomous processing
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_CLOUD_PROJECT="$PROJECT_ID"
          event_id="${{ steps.probe.outputs.event_id }}"
          status=pending; attempts=0; last_error=''
          for _ in $(seq 1 120); do
            readarray -t v < <(EVENT_ID="$event_id" python - <<'PY'
          import os
          from healthia_one.autopilot_events import FirestoreEventOutboxStore
          r=FirestoreEventOutboxStore(project=os.environ['GOOGLE_CLOUD_PROJECT']).get(os.environ['EVENT_ID'])
          print(r.status if r else 'missing')
          print(r.attempts if r else 0)
          print((r.last_error if r else 'missing').replace('\n',' ')[:300])
          PY
            )
            status="${v[0]:-missing}"; attempts="${v[1]:-0}"; last_error="${v[2]:-}"
            if [[ "$status" == processed ]]; then break; fi
            if [[ "$status" == failed ]]; then echo "Eventarc reached worker but processing failed: $last_error" >&2; exit 1; fi
            sleep 3
          done
          if [[ "$status" != processed ]]; then
            echo "Outbox stayed $status; definitive Eventarc processing not proven." >&2
            exit 1
          fi
          [[ "$attempts" -ge 1 ]]
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "attempts=$attempts" >> "$GITHUB_OUTPUT"

      - name: Record DEFINITIVE LIVE PASS
        shell: bash
        run: |
          set -euo pipefail
          {
            echo ""
            echo "## DEFINITIVE LIVE PASS"
            echo "Outbox initial status: pending"
            echo "Outbox final status: ${{ steps.verify.outputs.status }}"
            echo "Processing attempts: ${{ steps.verify.outputs.attempts }}"
            echo "Proven path: Firestore create -> Eventarc -> authenticated IAM -> private Cloud Run /events/firestore -> durable processed"
            echo "No direct invocation of /events/firestore was made."
            echo "Probe requested no Gmail, push, model, paid network, medication, treatment or clinical action."
          } >> dist/guardian-wave14-eventarc-phase7/report.md
          cat dist/guardian-wave14-eventarc-phase7/report.md

      - name: Cleanup isolated probe
        if: always() && steps.probe.outputs.event_id != ''
        shell: bash
        run: |
          set +e
          export GOOGLE_CLOUD_PROJECT="$PROJECT_ID"
          PATIENT_ID="${{ steps.probe.outputs.patient_id }}" EVENT_ID="${{ steps.probe.outputs.event_id }}" python - <<'PY'
          import os
          from google.cloud import firestore
          from healthia_one.autopilot_runtime import event_key
          from healthia_one.autopilot_events import FirestoreEventOutboxStore
          from healthia_one.store import PATIENT_STATE_COLLECTION
          project=os.environ['GOOGLE_CLOUD_PROJECT']; patient_id=os.environ['PATIENT_ID']; event_id=os.environ['EVENT_ID']; c=firestore.Client(project=project)
          r=FirestoreEventOutboxStore(project=project).get(event_id)
          if r:
              claim_id=event_key(r.event)
              c.collection('healthia_autopilot_claims').document(patient_id).collection('claims').document(claim_id).delete()
              c.collection('healthia_autopilot_receipts').document(patient_id).collection('receipts').document(claim_id).delete()
          c.collection('healthia_autopilot_events').document(event_id).delete()
          c.collection(PATIENT_STATE_COLLECTION).document(patient_id).delete()
          c.collection('healthia_opportunity_vaults').document(patient_id).delete()
          PY

      - name: Upload definitive live proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave14-Eventarc-PHASE7-DEFINITIVE-LIVE-proof
          path: dist/guardian-wave14-eventarc-phase7
          if-no-files-found: warn
          retention-days: 30
