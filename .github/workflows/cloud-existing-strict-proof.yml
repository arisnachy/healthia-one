name: Cloud existing service strict proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: healthia-cloud-existing-strict-proof
  cancel-in-progress: true

jobs:
  strict-proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-judge
      BUCKET_NAME: healthia-6088a-healthia-evidence
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a

      - name: Resolve Cloud service and prove real readiness route
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          if [ -z "$url" ] || [ -z "$revision" ]; then
            echo "::error::Cloud Run service URL/revision missing"
            exit 1
          fi
          token="$(gcloud auth print-identity-token --audiences="$url")"
          code="$(curl -sS -o /tmp/readiness.json -w '%{http_code}' -H "Authorization: Bearer ${token}" "$url/api/readiness" || true)"
          echo "Cloud readiness HTTP=$code"
          cat /tmp/readiness.json || true
          echo
          if [ "$code" != 200 ]; then
            echo "::error::Real Cloud readiness route did not return 200"
            exit 1
          fi
          python - <<'PY'
          import json
          d=json.load(open('/tmp/readiness.json'))
          expected={
            'ready': True,
            'llm_backend':'gemini_api',
            'model':'gemini-3.5-flash',
            'store_backend':'firestore',
            'evidence_backend':'gcs',
            'adk_ready': True,
            'auth_required': True,
          }
          bad={k:(v,d.get(k)) for k,v in expected.items() if d.get(k)!=v}
          if bad:
              raise SystemExit(f'Readiness mismatch: {bad}')
          PY
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact candidate verifier
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Execute strict Cloud Run + Gemini + ADK + Firestore + GCS proof
        shell: bash
        run: |
          set -euo pipefail
          python deployment/verify_cloud_demo.py \
            --url '${{ steps.cloud.outputs.url }}' \
            --project "$PROJECT_ID" \
            --bucket "$BUCKET_NAME" \
            --identity-token '${{ steps.cloud.outputs.token }}' \
            --json | tee deployment/cloud-proof-latest.json

      - name: Capture sanitized runtime evidence
        if: always()
        env:
          CLOUD_URL: ${{ steps.cloud.outputs.url }}
          CLOUD_REVISION: ${{ steps.cloud.outputs.revision }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload={
            'project': os.environ.get('PROJECT_ID',''),
            'region': os.environ.get('REGION',''),
            'service': os.environ.get('SERVICE_NAME',''),
            'url': os.environ.get('CLOUD_URL',''),
            'revision': os.environ.get('CLOUD_REVISION',''),
            'verifier_candidate_sha': os.environ.get('CANDIDATE_SHA',''),
            'model': 'gemini-3.5-flash',
            'vertex_adc': True,
            'gemini_api_key_used': False,
            'firestore': True,
            'private_gcs': True,
            'cloud_run_reserved_healthz_avoided': True,
          }
          Path('deployment/cloud-runtime-evidence.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          PY

      - name: Upload strict Cloud proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-cloud-existing-strict-proof
          path: |
            deployment/cloud-runtime-evidence.json
            deployment/cloud-proof-latest.json
          if-no-files-found: warn
          retention-days: 14
