name: One-shot attachment-fixed Cloud deploy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: healthia-attachment-fixed-deploy
  cancel-in-progress: false

jobs:
  deploy-prove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      VERTEX_LOCATION: global
      SERVICE_NAME: healthia-one-judge
      BUCKET_NAME: healthia-6088a-healthia-evidence
      CANDIDATE_SHA: 1df8237212ca79d4df46acb56fb8a1c344239fd3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
      - name: Verify exact candidate SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install proof dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Recheck permissions
        run: python deployment/check_cloud_permissions.py --project "$PROJECT_ID" --json-out deployment/attachment-fixed-permissions.json
      - name: Deploy exact candidate and run strict verifier
        shell: pwsh
        run: |
          ./deployment/deploy-cloud-demo.ps1 `
            -ProjectId $env:PROJECT_ID `
            -Region $env:REGION `
            -VertexLocation $env:VERTEX_LOCATION `
            -BucketName $env:BUCKET_NAME `
            -ServiceName $env:SERVICE_NAME `
            -RuntimeServiceAccount healthia-one-demo `
            -BuildServiceAccount healthia-one-build `
            -RequestLimit 20 `
            -MaxOutputTokens 1400 `
            -Confirmed
      - name: Capture exact deployed revision
        if: always()
        shell: bash
        run: |
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)' 2>/dev/null || true)"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)"
          image="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || true)"
          export FINAL_URL="$url" FINAL_REVISION="$revision" FINAL_IMAGE="$image"
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('deployment/attachment-fixed-runtime.json').write_text(json.dumps({
            'candidate_sha':os.environ['CANDIDATE_SHA'],
            'cloud_run_url':os.environ.get('FINAL_URL',''),
            'ready_revision':os.environ.get('FINAL_REVISION',''),
            'image':os.environ.get('FINAL_IMAGE',''),
            'project':os.environ['PROJECT_ID'],
            'region':os.environ['REGION'],
            'service':os.environ['SERVICE_NAME'],
            'model':'gemini-3.5-flash',
            'transport':'vertex_ai_adc',
            'store_backend':'firestore',
            'evidence_backend':'gcs',
            'gemini_api_key_used':False
          },indent=2),encoding='utf-8')
          PY
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-attachment-fixed-cloud-proof
          path: |
            deployment/attachment-fixed-permissions.json
            deployment/attachment-fixed-runtime.json
            deployment/cloud-proof-latest.json
          if-no-files-found: warn
          retention-days: 14
