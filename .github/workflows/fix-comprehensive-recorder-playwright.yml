name: Fix comprehensive recorder Playwright arg

on:
  push:
    branches:
      - feature/patient-education-video-20260813
    paths:
      - ".github/workflows/fix-comprehensive-recorder-playwright.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/patient-education-video-20260813
      - name: Fix wait_for_function keyword argument
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/record_final_comprehensive_demo.py')
          text = p.read_text(encoding='utf-8')
          old = '''    page.wait_for_function(\n        """view => document.getElementById(`view-${view}`)?.classList.contains('is-active') === true""",\n        view,\n        timeout=15_000,\n    )\n'''
          new = '''    page.wait_for_function(\n        """view => document.getElementById(`view-${view}`)?.classList.contains('is-active') === true""",\n        arg=view,\n        timeout=15_000,\n    )\n'''
          if old not in text:
              raise SystemExit('expected Playwright block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile scripts/record_final_comprehensive_demo.py
          git config user.name "healthia-recorder-bot"
          git config user.email "healthia-recorder-bot@users.noreply.github.com"
          git add scripts/record_final_comprehensive_demo.py
          git commit -m "Fix comprehensive recorder Playwright argument"
          git push origin HEAD:feature/patient-education-video-20260813
