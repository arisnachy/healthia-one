name: KIRA Wave 3 push tested product fix only

on:
  pull_request:
    branches:
      - kira/golden-google-constellation-live-891745e1
    paths:
      - .github/workflows/kira-wave3-product-fix-push-once.yml

permissions:
  contents: write

jobs:
  product-fix-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/google-constellation-wave2-live
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply the already-proven bilingual clinical detector fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('healthia_one/clinical_intake.py')
          text=path.read_text(encoding='utf-8')
          old='''    "palpitaciones",\n)\n\nDOMAIN_SIGNALS: dict[str, tuple[str, ...]] = {'''
          new='''    "palpitaciones",\n    # English clinical signals are first-class evidence, not translated hints.\n    "i have pain",\n    "burning pain",\n    "burning when",\n    "urinate",\n    "urinating",\n    "urination",\n    "urinary",\n    "frequent urination",\n    "pee",\n    "peeing",\n)\n\nDOMAIN_SIGNALS: dict[str, tuple[str, ...]] = {'''
          if old not in text: raise SystemExit('SYMPTOM_SIGNALS patch anchor missing')
          text=text.replace(old,new,1)
          old='    "urinary": ("orinar", "orina", "urinario", "ardor", "frecuencia urinaria", "flanco"),'
          new='    "urinary": ("orinar", "orina", "urinario", "ardor", "frecuencia urinaria", "flanco", "urinate", "urinating", "urination", "urinary", "pee", "peeing", "frequent urination"),'
          if old not in text: raise SystemExit('urinary domain patch anchor missing')
          text=text.replace(old,new,1)
          old='    score += 1 if re.search(r"\\b(duele|dolor|fiebre|ardor|mareo|tos|vomit|diarrea|sangr|debilidad|hinch)\\w*\\b", normalized) else 0\n    score += 1 if re.search(r"\\b(desde|hace)\\s+(hoy|ayer|\\d+|una|dos|tres|varios?)\\b", normalized) else 0'
          new='    score += 1 if re.search(r"\\b(duele|dolor|fiebre|ardor|mareo|tos|vomit|diarrea|sangr|debilidad|hinch|pain|burn|urinat|pee)\\w*\\b", normalized) else 0\n    score += 1 if re.search(r"\\b(desde|hace|since|for)\\s+(hoy|ayer|today|yesterday|\\d+|una|dos|tres|varios?|one|two|three|several)\\b", normalized) else 0'
          if old not in text: raise SystemExit('clinical regex patch anchor missing')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Add exact Cloud failure regression
        shell: bash
        run: |
          cat > tests/test_english_clinical_after_reference_clarification.py <<'PY'
          from __future__ import annotations

          from healthia_one.clinical_intake import detect_clinical_consultation
          from healthia_one.models import ChatMessage, PatientState
          from healthia_one.orchestrator import respond

          COMPLAINT = (
              "Since yesterday I have burning pain when I urinate and I need to go very often. "
              "Help me understand what information is still missing."
          )

          def _persist_exchange(state: PatientState, patient_text: str, response) -> None:
              state.messages.append(ChatMessage(role="patient", author="Patient", content=patient_text))
              state.messages.append(response.message)

          def test_natural_english_urinary_complaint_is_detected_without_translation_hint() -> None:
              is_clinical, domain = detect_clinical_consultation(COMPLAINT)
              assert is_clinical is True
              assert domain == "urinary"

          def test_clarification_turn_cannot_demote_next_explicit_english_symptom_turn() -> None:
              state = PatientState()
              first = respond(state, "What about that?")
              assert first.message.metadata["reference_clarification_required"] is True
              _persist_exchange(state, "What about that?", first)
              second = respond(state, COMPLAINT)
              assert second.message.metadata["intent"] == "clinical_consultation"
              interview = second.message.metadata["clinical_interview"]
              assert interview["status"] == "awaiting_answers"
              assert interview["domain"] == "urinary"
              assert interview["question_block"]["generation_required"] is True
              assert second.message.metadata.get("reference_clarification_required") is not True
          PY
      - name: Prove exact regression again
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest -q tests/test_english_clinical_after_reference_clarification.py tests/test_conversation_brain.py
      - name: Commit only product code and regression test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KIRA Omega'
          git config user.email 'actions@users.noreply.github.com'
          git add healthia_one/clinical_intake.py tests/test_english_clinical_after_reference_clarification.py
          git diff --cached --name-only | grep -Fx 'healthia_one/clinical_intake.py'
          git diff --cached --name-only | grep -Fx 'tests/test_english_clinical_after_reference_clarification.py'
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'KIRA Wave 3: fix natural English clinical routing after clarification'
          git push origin HEAD:kira/google-constellation-wave2-live
          echo "HEALTHIA_WAVE3_PRODUCT_FIX_PUSHED"
