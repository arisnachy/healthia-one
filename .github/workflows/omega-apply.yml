name: Omega branch assembler

on:
  push:
    branches:
      - kira/omega-100-agentic-runtime
    paths:
      - .github/omega-p*.patch
      - .github/workflows/omega-apply.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/omega-100-agentic-runtime
          fetch-depth: 1
      - name: Apply verified local delta
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --exclude=.github/workflows/ci.yml .github/omega-p1.patch
          git apply --exclude=.github/workflows/ci.yml .github/omega-p1.patch
          for patch in .github/omega-p{2..9}.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          rm .github/omega-p{1..9}.patch
          git config user.name "KIRA FORJA verification"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: assemble durable ADK agentic runtime"
          git push origin HEAD:kira/omega-100-agentic-runtime
