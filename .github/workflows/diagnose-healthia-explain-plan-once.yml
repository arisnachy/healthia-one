name: Diagnose HealthIA Explain planner once

on:
  push:
    branches:
      - feature/patient-education-video-20260813
    paths:
      - .github/workflows/diagnose-healthia-explain-plan-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    env:
      PROJECT_ID: healthia-6088a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/patient-education-video-20260813
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e "."
      - name: Probe exact planner contract with synthetic evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/healthia-explain-plan-diagnostic
          GOOGLE_CLOUD_PROJECT="$PROJECT_ID" GOOGLE_CLOUD_LOCATION=global GOOGLE_GENAI_USE_VERTEXAI=true python - <<'PY'
          import json
          from pathlib import Path
          from google import genai
          from pydantic import ValidationError
          from healthia_one.education_video import _education_system_instruction, _json_object
          from healthia_one.education_video_models import EducationVideoPlan

          payload = {
              "task": "build_evidence_grounded_patient_education_video",
              "topic": "my glucose result",
              "response_locale": "en",
              "requested_duration_seconds": 60,
              "target_total_narration_words": 120,
              "allowed_patient_facts": [
                  {
                      "key": "result_synthetic_glucose",
                      "label": "SYNTHETIC BROWSER JUDGE LAB: Glucose",
                      "value": "103 mg/dL",
                      "source_id": "result_synthetic",
                      "source_type": "health_result",
                      "certainty": "recorded",
                  }
              ],
              "rules": {
                  "patient_specific_values_only_from_allowed_facts": True,
                  "veo_must_be_generic_and_phi_free": True,
                  "max_veo_scenes": 1,
                  "exact_values_belong_on_controlled_cards": True,
              },
          }
          client = genai.Client(vertexai=True, project="healthia-6088a", location="global")
          interaction = client.interactions.create(
              model="gemini-3.5-flash",
              input=json.dumps(payload, ensure_ascii=False),
              system_instruction=_education_system_instruction("en"),
              generation_config={
                  "max_output_tokens": 1400,
                  "thinking_level": "minimal",
                  "response_mime_type": "application/json",
              },
              store=False,
          )
          raw = str(getattr(interaction, "output_text", "") or "")
          out = Path("dist/healthia-explain-plan-diagnostic")
          (out / "raw-plan.json.txt").write_text(raw, encoding="utf-8")
          report = {"status": "unknown", "raw_length": len(raw)}
          try:
              obj = _json_object(raw)
              report["parsed_keys"] = sorted(obj.keys())
              report["scene_count"] = len(obj.get("scenes") or []) if isinstance(obj.get("scenes"), list) else None
              report["visual_kinds"] = [str(x.get("visual_kind")) for x in (obj.get("scenes") or []) if isinstance(x, dict)]
              report["patient_fact_keys"] = obj.get("patient_fact_keys")
              plan = EducationVideoPlan.model_validate(obj)
              report["status"] = "PASS"
              report["validated_scene_count"] = len(plan.scenes)
          except ValidationError as exc:
              report["status"] = "VALIDATION_ERROR"
              report["errors"] = [
                  {"type": item.get("type"), "loc": list(item.get("loc") or []), "msg": item.get("msg")}
                  for item in exc.errors(include_url=False, include_input=False)
              ]
          except Exception as exc:
              report["status"] = "OTHER_ERROR"
              report["error_type"] = type(exc).__name__
              report["error"] = str(exc)[:1200]
          (out / "report.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: healthia-explain-plan-diagnostic
          path: dist/healthia-explain-plan-diagnostic
          if-no-files-found: error
