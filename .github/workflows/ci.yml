name: HealthIA ONE verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: healthia-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    env:
      HEALTHIA_LLM_BACKEND: mock
      HEALTHIA_STORE_BACKEND: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest
      - run: python -m compileall -q app healthia_one healthia_agent tests scripts
      - run: python scripts/smoke_test.py
      - name: Validate semantic frontend modules
        run: |
          node --check web/app.js
          node --check web/patient-record.js
          node --check web/family-documents.js
          node --check web/continuity.js
          node --check web/privacy-controls.js
          node --check web/profile-devices.js
          node --check web/icons.js
          node --check web/runtime-integrations.js
      - name: Reject version-number UI layers
        shell: bash
        run: |
          if find web -maxdepth 1 -type f -name 'ui-v*' | grep -q .; then
            echo "Version-number UI layers are not allowed after frontend consolidation."
            find web -maxdepth 1 -type f -name 'ui-v*'
            exit 1
          fi
      - name: Parse secure PowerShell launcher
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw "deployment/run-local-secure.ps1")) | Out-Null'
      - name: Build Android Health Connect bridge
        run: gradle -p android-health-bridge :app:assembleDebug --no-daemon
      - name: Upload Android bridge APK
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Android-Bridge-debug
          path: android-health-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Build verified release archive
        run: python scripts/build_release_zip.py --source-ref "$GITHUB_SHA"
      - name: Verify release archive
        run: python scripts/verify_release_zip.py dist/HealthIA-ONE-release-candidate.zip --source-ref "$GITHUB_SHA"
      - name: Upload verified release archive
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-ONE-release-candidate
          path: dist/HealthIA-ONE-release-candidate.zip
          if-no-files-found: error
          retention-days: 30
