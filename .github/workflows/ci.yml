name: HealthIA ONE verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: healthia-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      HEALTHIA_LLM_BACKEND: mock
      HEALTHIA_STORE_BACKEND: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Run pytest with diagnostic evidence
        shell: bash
        run: |
          mkdir -p dist/ci-diagnostics
          set -o pipefail
          python -m pytest -x -vv 2>&1 | tee dist/ci-diagnostics/pytest.log
      - name: Upload pytest diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-pytest-diagnostics
          path: dist/ci-diagnostics/pytest.log
          if-no-files-found: warn
          retention-days: 7
      - name: Full system verification
        run: python scripts/full_system_check.py
      - name: KIRA DialogBench multi-turn context gate
        run: python scripts/dialogbench.py
      - name: Upload KIRA DialogBench evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-KIRA-DialogBench
          path: dist/dialogbench
          if-no-files-found: warn
          retention-days: 30
      - name: Install Chromium for browser verification
        run: python -m playwright install --with-deps chromium
      - name: Browser clinical end-to-end verification
        run: python scripts/browser_smoke.py
      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-browser-smoke
          path: dist/browser-smoke
          if-no-files-found: warn
          retention-days: 30
      - name: LAB OMEGA core full-window functional laboratory
        shell: bash
        run: timeout 180s python scripts/lab_omega.py
      - name: Upload LAB OMEGA core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-LAB-OMEGA
          path: dist/lab-omega
          if-no-files-found: warn
          retention-days: 30
      - name: LAB OMEGA secondary windows and state-changing functions
        shell: bash
        run: timeout 240s python scripts/lab_omega_secondary.py
      - name: Upload LAB OMEGA secondary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-LAB-OMEGA-secondary
          path: dist/lab-omega-secondary
          if-no-files-found: warn
          retention-days: 30
      - run: python -m compileall -q app healthia_one healthia_agent tests scripts deployment/verify_google_ai.py deployment/verify_cloud_demo.py
      - run: python scripts/smoke_test.py
      - name: JUDGE OMEGA evidence review
        run: python scripts/judge_omega.py
      - name: Validate semantic frontend modules
        run: |
          node --check web/i18n.js
          node --check web/app.js
          node --check web/patient-record.js
          node --check web/family-documents.js
          node --check web/continuity.js
          node --check web/privacy-controls.js
          node --check web/profile-devices.js
          node --check web/icons.js
          node --check web/runtime-integrations.js
          node --check web/provider-integrations.js
          node --check web/clinical-council.js
          node --check web/account.js
          node --check web/auth.js
          node --check web/cost-control.js
          node --check web/opportunities-ui.js
      - name: Reject version-number UI layers
        shell: bash
        run: |
          if find web -maxdepth 1 -type f -name 'ui-v*' | grep -q .; then
            echo "Version-number UI layers are not allowed after frontend consolidation."
            find web -maxdepth 1 -type f -name 'ui-v*'
            exit 1
          fi
      - name: Parse secure PowerShell launchers
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw "deployment/run-local-secure.ps1")) | Out-Null
          [scriptblock]::Create((Get-Content -Raw "deployment/deploy-cloud-demo.ps1")) | Out-Null
          [scriptblock]::Create((Get-Content -Raw "deployment/remove-cloud-demo.ps1")) | Out-Null
          [scriptblock]::Create((Get-Content -Raw "deployment/deploy-autopilot-worker.ps1")) | Out-Null
          [scriptblock]::Create((Get-Content -Raw "deployment/deploy-autopilot-schedules.ps1")) | Out-Null
          [scriptblock]::Create((Get-Content -Raw "deployment/deploy-gmail-push-worker.ps1")) | Out-Null
          [scriptblock]::Create((Get-Content -Raw "deployment/configure-google-oauth.ps1")) | Out-Null
          [scriptblock]::Create((Get-Content -Raw "deployment/import-google-oauth-client.ps1")) | Out-Null
          [scriptblock]::Create((Get-Content -Raw "deployment/promote-google-live-prereqs.ps1")) | Out-Null
      - name: Build verified release archive
        run: python scripts/build_release_zip.py --source-ref "$GITHUB_SHA"
      - name: Verify release archive
        run: python scripts/verify_release_zip.py dist/HealthIA-ONE-release-candidate.zip --source-ref "$GITHUB_SHA"
      - name: Verify tests inside extracted release
        shell: bash
        run: |
          rm -rf dist/release-verification
          mkdir -p dist/release-verification
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path("dist/HealthIA-ONE-release-candidate.zip")
          target = Path("dist/release-verification")
          with ZipFile(archive) as bundle:
              bundle.extractall(target)
          PY
          release_root=$(find dist/release-verification -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$release_root"
          (cd "$release_root" && PYTHONPATH=. HEALTHIA_LLM_BACKEND=mock HEALTHIA_STORE_BACKEND=memory python -m pytest -q)
      - name: Upload verified release archive
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-ONE-release-candidate
          path: dist/HealthIA-ONE-release-candidate.zip
          if-no-files-found: error
          retention-days: 30

      - name: Authenticate Wave 2 Scheduler LIVE gate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud for Wave 2 Scheduler LIVE gate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a
      - name: Wave 2 Scheduler provider-truth gate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live'
        shell: bash
        env:
          PROJECT_ID: healthia-6088a
          REGION: us-central1
          SERVICE: healthia-gmail-worker
        run: |
          set -euo pipefail
          mkdir -p dist/wave2-scheduler-live
          summary="dist/wave2-scheduler-live/summary.json"
          source_sha="$(git rev-parse HEAD)"
          image_package="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/healthia-gmail-wave2"
          image="${image_package}:${source_sha}"
          original_image="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          original_revision="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          if [[ "$original_image" == *"/healthia-gmail-wave2:"* ]]; then
            echo "Previous failed proof image is still active; refusing to stack another promotion." >&2
            exit 1
          fi
          promoted=0
          rollback() {
            rc=$?
            if [[ $rc -ne 0 && $promoted -eq 1 && -n "$original_image" ]]; then
              echo "Scheduler provider gate failed; restoring previous worker image." >&2
              gcloud run services update "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --image "$original_image" --quiet >/dev/null 2>&1 || true
            fi
            if [[ $rc -ne 0 ]]; then
              gcloud artifacts docker images delete "$image" --project "$PROJECT_ID" --quiet --delete-tags >/dev/null 2>&1 || true
            fi
            exit $rc
          }
          trap rollback EXIT

          image_build_id="$(gcloud builds submit . --project "$PROJECT_ID" --region "$REGION" --tag "$image" --async --format='value(id)' --quiet)"
          test -n "$image_build_id"
          digest=""
          for _ in $(seq 1 60); do
            digest="$(gcloud artifacts docker images describe "$image" --project "$PROJECT_ID" --format='value(image_summary.digest)' 2>/dev/null || true)"
            [[ -n "$digest" ]] && break
            sleep 5
          done
          test -n "$digest"
          gcloud run services update "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --image "$image" --quiet
          promoted=1
          new_revision="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$new_revision" && test "$new_revision" != "$original_revision"

          cat > /tmp/wave2-scheduler-cloudbuild.yaml <<'YAML'
          steps:
            - name: python:3.12
              entrypoint: bash
              args:
                - -ceu
                - |
                  python -m pip install --quiet .
                  python scripts/run_scheduler_live_in_cloudbuild.py \
                    --project "$PROJECT_ID" \
                    --location us-central1 \
                    --job-name healthia-gmail-watch-renewal \
                    | tee /workspace/proof.json
                  python - <<'PY'
                  import json
                  p='/workspace/proof.json'
                  d=json.load(open(p, encoding='utf-8'))
                  assert d.get('proof_schema') == 'scheduler-live-v1', d
                  assert d.get('status') == 'LIVE_PASS', d
                  assert d.get('watch_expiration_future') is True, d
                  assert d.get('second_run_noop') is True, d
                  assert d.get('secret_material_exposed') is False, d
                  PY
            - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
              entrypoint: bash
              args:
                - -ceu
                - |
                  gcloud storage cp /workspace/proof.json \
                    "gs://${PROJECT_ID}_cloudbuild/wave2-scheduler/${BUILD_ID}/proof.json"
          options:
            logging: CLOUD_LOGGING_ONLY
          YAML

          operator_build_id="$(gcloud builds submit . \
            --project "$PROJECT_ID" --region "$REGION" \
            --config /tmp/wave2-scheduler-cloudbuild.yaml \
            --async --format='value(id)' --quiet)"
          test -n "$operator_build_id"
          operator_status=""
          operator_sa=""
          for _ in $(seq 1 90); do
            operator_status="$(gcloud builds describe "$operator_build_id" --project "$PROJECT_ID" --region "$REGION" --format='value(status)' 2>/dev/null || true)"
            operator_sa="$(gcloud builds describe "$operator_build_id" --project "$PROJECT_ID" --region "$REGION" --format='value(serviceAccount)' 2>/dev/null || true)"
            case "$operator_status" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) break ;;
            esac
            sleep 5
          done
          [[ "$operator_status" == "SUCCESS" ]]

          proof_uri="gs://${PROJECT_ID}_cloudbuild/wave2-scheduler/${operator_build_id}/proof.json"
          if gcloud storage cp "$proof_uri" dist/wave2-scheduler-live/proof.json >/dev/null 2>&1; then
            python - <<'PY'
            import json
            p='dist/wave2-scheduler-live/proof.json'
            d=json.load(open(p,encoding='utf-8'))
            assert d.get('proof_schema') == 'scheduler-live-v1', d
            assert d.get('status') == 'LIVE_PASS', d
            assert d.get('watch_expiration_future') is True, d
            assert d.get('second_run_noop') is True, d
            assert d.get('secret_material_exposed') is False, d
            PY
            if grep -Eiq '(refresh_token|client_secret|access_token|id_token|ya29\.|@[A-Za-z0-9.-]+\.[A-Za-z]{2,})' dist/wave2-scheduler-live/proof.json; then
              rm -f dist/wave2-scheduler-live/proof.json
              exit 1
            fi
          fi

          python - <<PY
          import json
          summary = {
              'status': 'LIVE_PASS',
              'source_sha': '$source_sha',
              'image_build_id': '$image_build_id',
              'image_digest': '$digest',
              'worker_revision': '$new_revision',
              'previous_worker_revision': '$original_revision',
              'operator_build_id': '$operator_build_id',
              'operator_service_account_resource': '$operator_sa',
              'proof_uri': '$proof_uri',
              'iam_mutation': False,
          }
          open('$summary','w',encoding='utf-8').write(json.dumps(summary,sort_keys=True,indent=2)+'\n')
          PY
          cat "$summary"
          trap - EXIT
      - name: Upload Wave 2 Scheduler LIVE evidence
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live'
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-Wave2-Scheduler-LIVE
          path: dist/wave2-scheduler-live
          if-no-files-found: warn
          retention-days: 30

  submission-demo-gate:
    name: Submission demo opt-in gate
    runs-on: ubuntu-22.04
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit recording opt-in
        id: gate
        shell: bash
        run: |
          if grep -Eq '^enabled=true$' .github/submission-demo-trigger.txt; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "HEALTHIA_SUBMISSION_DEMO_ENABLED"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "HEALTHIA_SUBMISSION_DEMO_DISABLED"
          fi

  submission-demo:
    name: One-take live Cloud judge demo
    needs: [verify, submission-demo-gate]
    if: needs.submission-demo-gate.outputs.enabled == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-demo
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Bind recording to the existing private Cloud Run revision
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          image="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          token="$(gcloud auth print-identity-token --audiences="$url")"
          test -n "$url" && test -n "$revision" && test -n "$image" && test -n "$token"
          echo "::add-mask::$token"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated browser recorder
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Record one continuous unmocked English submission demo
        env:
          HEALTHIA_CLOUD_URL: ${{ steps.cloud.outputs.url }}
          HEALTHIA_CLOUD_ID_TOKEN: ${{ steps.cloud.outputs.token }}
          HEALTHIA_CLOUD_REVISION: ${{ steps.cloud.outputs.revision }}
          HEALTHIA_CLOUD_IMAGE: ${{ steps.cloud.outputs.image }}
          HEALTHIA_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          HEALTHIA_CLOUD_REGION: ${{ env.REGION }}
          HEALTHIA_DEMO_TARGET_SECONDS: "235"
        run: python scripts/record_submission_demo.py
      - name: Verify recording duration
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          video="$(find dist/submission-demo/video -type f -name '*.webm' | head -n 1)"
          test -n "$video"
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$video")"
          python - "$duration" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if not 230 <= duration <= 245:
              raise SystemExit(f"submission demo must stay inside the 3:50–4:05 target window: {duration:.2f}s")
          print(f"HEALTHIA_SUBMISSION_DEMO_DURATION_OK {duration:.2f}s")
          PY
      - name: Upload final judge demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-ONE-final-judge-demo
          path: dist/submission-demo
          if-no-files-found: error
          retention-days: 30
