name: HealthIA ONE verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HEALTHIA_LLM_BACKEND: mock
      HEALTHIA_STORE_BACKEND: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest
      - run: python -m compileall -q app healthia_one healthia_agent tests scripts
      - run: python scripts/smoke_test.py
      - run: node --check web/app.js
      - run: node --check web/ui-v2.js
      - run: node --check web/ui-v3.js
      - run: node --check web/ui-v4.js
      - run: node --check web/ui-v5.js
      - name: Parse secure PowerShell launcher
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw "deployment/run-local-secure.ps1")) | Out-Null'
      - name: Build verified release archive
        run: python scripts/build_release_zip.py --source-ref "$GITHUB_SHA"
      - name: Upload verified release archive
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-ONE-release-candidate
          path: dist/HealthIA-ONE-release-candidate.zip
          if-no-files-found: error
          retention-days: 30
