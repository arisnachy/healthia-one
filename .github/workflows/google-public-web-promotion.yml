name: HealthIA ONE public web promotion

on:
  pull_request:
    paths:
      - ".github/workflows/google-public-web-promotion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthia-public-web-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-health-constellation')
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      BASE_SERVICE: healthia-one-demo
      WEB_SERVICE: healthia-one-web-demo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Build exact head and promote isolated web service
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/google-public-web
          receipt="dist/google-public-web/promotion.md"
          source_sha="$(git rev-parse HEAD)"
          package="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/healthia-one-web-demo"
          image="${package}:${source_sha}"
          created_this_run=false

          cleanup_on_failure() {
            code=$?
            if [[ $code -ne 0 && "$created_this_run" == "true" ]]; then
              gcloud run services delete "$WEB_SERVICE" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null 2>&1 || true
            fi
            exit $code
          }
          trap cleanup_on_failure EXIT

          gcloud run services describe "$BASE_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > base-service.json
          runtime_sa="$(python - <<'PY'
          import json
          d=json.load(open('base-service.json'))
          print((((d.get('spec') or {}).get('template') or {}).get('spec') or {}).get('serviceAccountName') or '')
          PY
          )"
          test -n "$runtime_sa"

          build_id="$(gcloud builds submit . --project "$PROJECT_ID" --region "$REGION" --tag "$image" --async --format='value(id)' --quiet)"
          test -n "$build_id"
          digest=""
          for _ in $(seq 1 60); do
            digest="$(gcloud artifacts docker images describe "$image" --project "$PROJECT_ID" --format='value(image_summary.digest)' 2>/dev/null || true)"
            [[ -n "$digest" ]] && break
            sleep 5
          done
          test -n "$digest"

          python - <<'PY'
          import json, os
          d=json.load(open('base-service.json'))
          d.pop('status',None)
          md=d.setdefault('metadata',{})
          md['name']=os.environ['WEB_SERVICE']
          for key in ['uid','resourceVersion','generation','creationTimestamp','selfLink']:
              md.pop(key,None)
          ann=md.setdefault('annotations',{})
          for key in list(ann):
              if key in {
                  'run.googleapis.com/operation-id','serving.knative.dev/creator','serving.knative.dev/lastModifier',
                  'client.knative.dev/user-image','run.googleapis.com/client-name','run.googleapis.com/client-version'
              }:
                  ann.pop(key,None)
          tmpl=((d.setdefault('spec',{})).setdefault('template',{}))
          tmd=tmpl.setdefault('metadata',{})
          tmd.pop('name',None)
          for key in ['uid','resourceVersion','generation','creationTimestamp']:
              tmd.pop(key,None)
          containers=((tmpl.setdefault('spec',{})).setdefault('containers',[]))
          if not containers:
              raise SystemExit('Base Cloud Run service has no container')
          containers[0]['image']=os.environ['IMAGE_URI']
          d['spec']['traffic']=[{'latestRevision':True,'percent':100}]
          json.dump(d,open('web-service.json','w'),separators=(',',':'))
          PY
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/healthia-one-web-demo:${{ github.event.pull_request.head.sha || github.sha }}
      - name: Deploy and enforce public-web/application-auth boundary
        shell: bash
        run: |
          set -euo pipefail
          receipt="dist/google-public-web/promotion.md"
          source_sha="$(git rev-parse HEAD)"
          package="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/healthia-one-web-demo"
          image="${package}:${source_sha}"

          existed=false
          if gcloud run services describe "$WEB_SERVICE" --project "$PROJECT_ID" --region "$REGION" >/dev/null 2>&1; then existed=true; fi

          # JSON is valid YAML input. It contains configuration references but no
          # Secret Manager payload values and is never uploaded as an artifact.
          gcloud run services replace web-service.json --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null
          if [[ "$existed" == "false" ]]; then echo "created" > dist/google-public-web/created-this-run; fi

          public_status="PROMOTED"
          if ! gcloud run services update "$WEB_SERVICE" --project "$PROJECT_ID" --region "$REGION" --no-invoker-iam-check --quiet >/dev/null 2>public-error.txt; then
            public_status="BLOCKED_IAM"
          fi

          url="$(gcloud run services describe "$WEB_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$WEB_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$url" && test -n "$revision"

          probe() { curl -sS -o /dev/null --max-time 10 -w '%{http_code}' "$1" || true; }
          health="$(probe "$url/healthz")"
          login="$(probe "$url/login")"
          root="$(probe "$url/")"
          session="$(probe "$url/api/auth/session")"
          bootstrap="$(probe "$url/api/bootstrap")"
          opportunities="$(probe "$url/api/opportunities")"
          google_caps="$(probe "$url/api/google-constellation/capabilities")"
          oauth_ready="$(probe "$url/api/google-constellation/oauth/readiness")"

          security_ok=false
          if [[ "$public_status" == "PROMOTED" && "$health" == "200" && "$login" == "200" && "$session" == "200" && "$bootstrap" == "401" && "$opportunities" == "401" && "$google_caps" == "401" && "$oauth_ready" == "401" ]]; then
            security_ok=true
          fi

          {
            echo "# HealthIA ONE public web promotion"
            echo
            echo "Exact source head: $source_sha"
            echo "Service: $WEB_SERVICE"
            echo "URL: $url"
            echo "Revision: $revision"
            echo "Public transport status: $public_status"
            echo "Application security gate: $security_ok"
            echo "OAuth callback candidate: ${url}/api/google-constellation/oauth/callback"
            echo
            echo "## Anonymous probes"
            echo "- /healthz: $health"
            echo "- /login: $login"
            echo "- /: $root"
            echo "- /api/auth/session: $session"
            echo "- /api/bootstrap: $bootstrap"
            echo "- /api/opportunities: $opportunities"
            echo "- /api/google-constellation/capabilities: $google_caps"
            echo "- /api/google-constellation/oauth/readiness: $oauth_ready"
            echo
            echo "The private base service $BASE_SERVICE was not made public or modified."
          } > "$receipt"

          if [[ "$security_ok" != "true" ]]; then
            echo "Public web security gate failed; removing the isolated web service." >&2
            gcloud run services delete "$WEB_SERVICE" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null 2>&1 || true
            exit 1
          fi
          rm -f base-service.json web-service.json public-error.txt
          cat "$receipt"
      - name: Upload sanitized promotion receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-ONE-public-web-promotion
          path: dist/google-public-web/promotion.md
          if-no-files-found: warn
          retention-days: 14
