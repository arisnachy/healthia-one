name: HealthIA reproducible release gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: healthia-reproducible-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pinned-python-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      HEALTHIA_ENV: local
      HEALTHIA_LLM_BACKEND: mock
      HEALTHIA_STORE_BACKEND: memory
      HEALTHIA_AUTH_REQUIRED: "false"
      HEALTHIA_PROACTIVE_ENABLED: "false"
      HEALTHIA_COST_MODE: local
      HEALTHIA_AI_REQUEST_LIMIT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install exact release-direct dependency set
        run: python -m pip install -c constraints-release.txt -e ".[test]"
      - name: Prove production entrypoint cold boot and restart
        run: python -m pytest -q tests/test_cold_boot_contract.py
      - name: Run repository test suite under pinned release dependencies
        run: python -m pytest -q
      - name: Compile production Python surfaces
        run: python -m compileall -q app healthia_one healthia_agent
      - name: Verify release archive carries reproducibility contract
        shell: bash
        run: |
          python scripts/build_release_zip.py --source-ref "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("dist/HealthIA-ONE-release-candidate.zip")
          with ZipFile(archive) as bundle:
              names = set(bundle.namelist())
          required = {
              "healthia-one/constraints-release.txt",
              "healthia-one/Dockerfile",
              "healthia-one/pyproject.toml",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"release archive missing reproducibility files: {missing}")
          print("HEALTHIA_RELEASE_REPRODUCIBILITY_PASS")
          PY
