name: HealthIA Scheduler inventory

on:
  push:
    branches: [kira/autonomous-continuity-mainline]
    paths: [".github/workflows/scheduler-inventory.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PROJECT_ID: healthia-6088a
    steps:
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: List existing Scheduler jobs read-only
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Scheduler locations with accessible jobs ==='
          for location in $(gcloud scheduler locations list --project "$PROJECT_ID" --format='value(locationId)' 2>/dev/null); do
            rows="$(gcloud scheduler jobs list --project "$PROJECT_ID" --location "$location" --format='csv[no-heading](name.basename(),state,schedule,timeZone,httpTarget.uri,httpTarget.oidcToken.serviceAccountEmail)' 2>/dev/null || true)"
            if [[ -n "$rows" ]]; then
              echo "LOCATION=${location}"
              printf '%s\n' "$rows" | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[service-account]/g'
            fi
          done
