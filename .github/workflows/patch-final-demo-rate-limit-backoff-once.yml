name: Patch final demo rate-limit backoff once

on:
  push:
    branches:
      - feature/patient-education-video-20260813
    paths:
      - .github/workflows/patch-final-demo-rate-limit-backoff-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/patient-education-video-20260813
          fetch-depth: 0

      - name: Add rate-limit-safe assistant polling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/record_final_live_english_demo.py')
          text = path.read_text(encoding='utf-8')
          old = '''def wait_for_assistant_after(page: Page, previous_id: str = "", timeout_s: float = 30.0) -> dict:\n    deadline = time.time() + timeout_s\n    while time.time() < deadline:\n        message = latest_assistant_message(page)\n        if message.get("id") and message.get("id") != previous_id:\n            return message\n        page.wait_for_timeout(250)\n    raise RuntimeError("assistant did not produce a new response in time")\n'''
          new = '''def wait_for_assistant_after(\n    page: Page,\n    previous_id: str = "",\n    timeout_s: float = 30.0,\n    *,\n    poll_ms: int = 750,\n    rate_limit_backoff_ms: int = 3000,\n) -> dict:\n    deadline = time.time() + timeout_s\n    while time.time() < deadline:\n        try:\n            message = latest_assistant_message(page)\n        except Exception as exc:\n            if "HTTP 429" not in str(exc):\n                raise\n            page.wait_for_timeout(max(rate_limit_backoff_ms, poll_ms))\n            continue\n        if message.get("id") and message.get("id") != previous_id:\n            return message\n        page.wait_for_timeout(max(250, poll_ms))\n    raise RuntimeError("assistant did not produce a new response in time")\n'''
          if old not in text:
              raise SystemExit('assistant polling helper not found; refusing blind patch')
          text = text.replace(old, new, 1)
          old_video = 'video_reply = wait_for_assistant_after(page, str(before_video.get("id") or ""), timeout_s=190.0)'
          new_video = '''video_reply = wait_for_assistant_after(\n            page,\n            str(before_video.get("id") or ""),\n            timeout_s=210.0,\n            poll_ms=2000,\n            rate_limit_backoff_ms=5000,\n        )'''
          if old_video not in text:
              raise SystemExit('HealthIA Explain wait call not found; refusing blind patch')
          text = text.replace(old_video, new_video, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "healthia-one-maintenance"
          git config user.email "127772990+arisnachy@users.noreply.github.com"
          git add scripts/record_final_live_english_demo.py
          git commit -m "Back off recorder polling during HealthIA Explain"
          git push origin HEAD:feature/patient-education-video-20260813
