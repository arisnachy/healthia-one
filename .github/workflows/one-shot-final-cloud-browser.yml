name: One-shot final real Cloud browser proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: healthia-final-real-cloud-browser
  cancel-in-progress: false

jobs:
  browser-proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-judge
      CANDIDATE_SHA: 928ad1a2b666f3ffe5e2c83891fb2dfef9c5ec9a
      EXPECTED_REVISION: healthia-one-judge-00003-dd9
    steps:
      - name: Checkout exact deployed candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact candidate and Chromium
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m playwright install --with-deps chromium
      - name: Bind proof to exact deployed revision
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          test "$revision" = "$EXPECTED_REVISION"
          token="$(gcloud auth print-identity-token --audiences="$url")"
          echo "::add-mask::$token"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          code="$(curl -sS -o /tmp/readiness.json -w '%{http_code}' -H "Authorization: Bearer ${token}" "$url/api/readiness")"
          test "$code" = 200
      - name: Execute real browser journey with live Gemini/ADK
        env:
          HEALTHIA_CLOUD_URL: ${{ steps.cloud.outputs.url }}
          HEALTHIA_CLOUD_ID_TOKEN: ${{ steps.cloud.outputs.token }}
        run: |
          set -euo pipefail
          python scripts/cloud_browser_judge_proof.py
      - name: Add sanitized runtime binding
        if: always()
        env:
          CLOUD_URL: ${{ steps.cloud.outputs.url }}
          CLOUD_REVISION: ${{ steps.cloud.outputs.revision }}
        run: |
          mkdir -p dist/cloud-browser-judge-proof
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('dist/cloud-browser-judge-proof/runtime.json').write_text(json.dumps({
            'candidate_sha': os.environ['CANDIDATE_SHA'],
            'cloud_url': os.environ.get('CLOUD_URL',''),
            'cloud_revision': os.environ.get('CLOUD_REVISION',''),
            'project':os.environ['PROJECT_ID'],
            'region':os.environ['REGION'],
            'service':os.environ['SERVICE_NAME'],
            'model':'gemini-3.5-flash',
            'transport':'vertex_ai_adc',
            'store_backend':'firestore',
            'evidence_backend':'gcs',
            'mocked':False,
          }, indent=2),encoding='utf-8')
          PY
      - name: Upload browser screenshots video and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-final-real-cloud-browser-proof
          path: dist/cloud-browser-judge-proof
          if-no-files-found: warn
          retention-days: 14
