name: Migrate candidate to Vertex AI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: kira/event-driven-results-twin-p1
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply Vertex transport migration
        run: python scripts/apply_vertex_transport_migration.py

      - name: Install candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run focused migration regressions
        run: |
          python -m pytest -q tests/test_vertex_transport.py tests/test_result_taskmaster_closure.py tests/test_patient_auth_isolation.py
          python -m compileall -q healthia_one scripts deployment

      - name: Run complete deterministic verification
        env:
          HEALTHIA_LLM_BACKEND: mock
          HEALTHIA_STORE_BACKEND: memory
        run: |
          python -m pytest -q
          python scripts/full_system_check.py

      - name: Publish only after all tests pass
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/apply_vertex_transport_migration.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example healthia_one scripts/live_taskmaster_proof.py tests/test_vertex_transport.py
          git commit -m "feat: route HealthIA Google AI through Vertex ADC"
          git push origin HEAD:kira/event-driven-results-twin-p1
