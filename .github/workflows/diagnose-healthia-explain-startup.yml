name: Diagnose HealthIA Explain Cloud Run startup

on:
  push:
    branches:
      - feature/patient-education-video-20260813
    paths:
      - .github/workflows/diagnose-healthia-explain-startup.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a
      - name: Read exact failed revision logs
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="healthia-one-explain-final" AND resource.labels.revision_name="healthia-one-explain-final-00001-mpg"' \
            --project healthia-6088a \
            --freshness=2h \
            --limit=100 \
            --order=asc \
            --format='value(timestamp,severity,textPayload,jsonPayload.message)' \
            | tee /tmp/healthia-startup.log
          test -s /tmp/healthia-startup.log
