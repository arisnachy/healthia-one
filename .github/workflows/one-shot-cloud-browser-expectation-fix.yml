name: One-shot Cloud browser truth assertions

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true
      - name: Align browser assertions with live account and Vertex truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/cloud_browser_judge_proof.py')
          text=p.read_text(encoding='utf-8')
          old='''        require(page.locator("#accountPill strong").inner_text().strip() == display_name, "account pill did not render authenticated identity")\n        screenshot(page, "02-authenticated-home.png")\n\n        page.locator("#accountPill").click()\n        page.wait_for_selector("#accountDialog[open]", timeout=10_000)\n        require(page.get_by_text(email, exact=True).count() == 1, "account settings did not show authenticated email")\n        report["checks"].append("account_settings_dialog")\n'''
          new='''        require(page.locator("#accountPill strong").inner_text().strip() == display_name, "account pill did not render authenticated identity")\n        readiness_before = api_json(page, "/api/readiness")\n        runtime_label = page.locator("#runtimeLabel").inner_text().strip()\n        require(readiness_before.get("ai_ready") is True, "Cloud browser started without live Google AI readiness")\n        require(readiness_before.get("model") == "gemini-3.5-flash", f"unexpected browser model: {readiness_before.get('model')}")\n        require("falta" not in runtime_label.lower() and "no disponible" not in runtime_label.lower(), f"runtime label contradicts live AI readiness: {runtime_label}")\n        require("vertex" in runtime_label.lower() or "google ai" in runtime_label.lower(), f"runtime label does not expose active Google AI transport: {runtime_label}")\n        report["runtime_label"] = runtime_label\n        report["checks"].append("browser_runtime_label_matches_live_vertex_readiness")\n        screenshot(page, "02-authenticated-home.png")\n\n        page.locator("#accountPill").click()\n        page.wait_for_selector("#accountDialog[open]", timeout=10_000)\n        account_identity = page.locator("#accountIdentity").inner_text()\n        require(email in account_identity, "account settings did not show authenticated email")\n        require(display_name in account_identity, "account settings did not show authenticated display name")\n        report["checks"].append("account_settings_dialog")\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one account assertion block, found {text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile scripts/cloud_browser_judge_proof.py
          rm .github/workflows/one-shot-cloud-browser-expectation-fix.yml
          git config user.name 'KIRA HealthIA CI'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/cloud_browser_judge_proof.py .github/workflows/one-shot-cloud-browser-expectation-fix.yml
          git diff --cached --check
          git commit -m 'test: assert Cloud browser account and Vertex runtime truth'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
