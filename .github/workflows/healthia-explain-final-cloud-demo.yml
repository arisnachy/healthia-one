name: HealthIA Explain final exact-head Cloud demo

on:
  push:
    branches:
      - feature/patient-education-video-20260813
    paths:
      - .github/workflows/healthia-explain-final-cloud-demo.yml
      - scripts/record_healthia_explain_final_demo.py

permissions:
  contents: read

concurrency:
  group: healthia-explain-final-exact-head-cloud-demo
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-explain-final
      BUCKET_NAME: healthia-6088a-healthia-evidence
      BUILD_SA: projects/healthia-6088a/serviceAccounts/healthia-one-build@healthia-6088a.iam.gserviceaccount.com
      RUNTIME_SA: healthia-one-demo@healthia-6088a.iam.gserviceaccount.com
      EXPECTED_COMMIT_MESSAGE: Run one bounded final HealthIA Explain Cloud proof
    steps:
      - name: Check out exact authorized candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Enforce one-shot cost authorization and exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%s)" = "$EXPECTED_COMMIT_MESSAGE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "HEALTHIA_EXPLAIN_EXACT_HEAD_AUTHORIZED $GITHUB_SHA"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify existing APIs and private evidence bucket
        shell: bash
        run: |
          set -euo pipefail
          enabled="$(gcloud services list --project "$PROJECT_ID" --enabled --format='value(config.name)')"
          for api in run.googleapis.com cloudbuild.googleapis.com aiplatform.googleapis.com texttospeech.googleapis.com firestore.googleapis.com storage.googleapis.com; do
            grep -Fxq "$api" <<<"$enabled" || { echo "Required pre-enabled API missing: $api" >&2; exit 1; }
          done
          gcloud storage buckets describe "gs://${BUCKET_NAME}" --project "$PROJECT_ID" >/dev/null
          echo "HEALTHIA_EXPLAIN_CLOUD_PREREQUISITES_PASS"

      - name: Deploy exact candidate to bounded private Cloud Run
        shell: bash
        run: |
          set -euo pipefail
          VEO_PREFIX="gs://${BUCKET_NAME}/healthia-explain-final-proof/${GITHUB_RUN_ID}"
          echo "VEO_PREFIX=$VEO_PREFIX" >> "$GITHUB_ENV"
          gcloud run deploy "$SERVICE_NAME" \
            --source . \
            --build-service-account "$BUILD_SA" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --min 0 \
            --max 1 \
            --concurrency 8 \
            --cpu 2 \
            --memory 2Gi \
            --timeout 600 \
            --set-env-vars "HEALTHIA_ENV=cloud,HEALTHIA_LLM_BACKEND=gemini_api,HEALTHIA_MODEL=gemini-3.5-flash,HEALTHIA_STORE_BACKEND=firestore,HEALTHIA_AUTH_REQUIRED=true,HEALTHIA_ALLOW_REGISTRATION=true,HEALTHIA_COST_MODE=cloud_demo,HEALTHIA_AI_REQUEST_LIMIT=12,HEALTHIA_COST_GUARD_START_ENABLED=true,HEALTHIA_COST_CONTROL_UI=false,HEALTHIA_AI_MAX_OUTPUT_TOKENS=1400,HEALTHIA_PROACTIVE_ENABLED=false,HEALTHIA_GCS_BUCKET=${BUCKET_NAME},HEALTHIA_EDUCATION_MEDIA_ENABLED=true,HEALTHIA_EDUCATION_VEO_ENABLED=true,HEALTHIA_EDUCATION_VEO_MODEL=veo-3.1-fast-generate-001,HEALTHIA_EDUCATION_VEO_WAIT_SECONDS=120,HEALTHIA_EDUCATION_TTS_MODEL=gemini-2.5-pro-tts,HEALTHIA_EDUCATION_TTS_VOICE=Charon,HEALTHIA_VEO_REGION=us-central1,HEALTHIA_VEO_PRIVATE_GCS_PREFIX=${VEO_PREFIX},GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global" \
            --set-secrets "HEALTHIA_DEVICE_TOKEN_SECRET=healthia-device-token-secret:latest,HEALTHIA_SESSION_SECRET=healthia-session-secret:latest" \
            --no-allow-unauthenticated \
            --quiet

      - name: Bind recorder to exact deployed revision
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          image="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          token="$(gcloud auth print-identity-token --audiences="$url")"
          test -n "$url" && test -n "$revision" && test -n "$image" && test -n "$token"
          echo "::add-mask::$token"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "HEALTHIA_EXPLAIN_DEPLOYED revision=$revision image=$image"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser and media verification tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Record real multilingual HealthIA Explain journey
        env:
          HEALTHIA_CLOUD_URL: ${{ steps.cloud.outputs.url }}
          HEALTHIA_CLOUD_ID_TOKEN: ${{ steps.cloud.outputs.token }}
          HEALTHIA_CLOUD_REVISION: ${{ steps.cloud.outputs.revision }}
          HEALTHIA_CLOUD_IMAGE: ${{ steps.cloud.outputs.image }}
          HEALTHIA_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          HEALTHIA_CLOUD_REGION: ${{ env.REGION }}
          HEALTHIA_CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/record_healthia_explain_final_demo.py

      - name: Verify produced media and exact-head report
        shell: bash
        run: |
          set -euo pipefail
          base=dist/healthia-explain-final-cloud-demo
          product="$base/product-video/HealthIA-Explain-real-patient-video.mp4"
          report="$base/report.json"
          browser_video="$(find "$base/browser-video" -type f -name '*.webm' -print -quit)"
          test -s "$product" && test -s "$report" && test -n "$browser_video" && test -s "$browser_video"
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration,size -of json "$product" > "$base/product-video/ffprobe.json"
          python - "$report" "$product" "$GITHUB_SHA" <<'PY'
          import hashlib, json, subprocess, sys
          report_path, product_path, expected_sha = sys.argv[1:]
          report=json.load(open(report_path, encoding='utf-8'))
          if report.get('status') != 'PASS':
              raise SystemExit(f"cloud demo report not PASS: {report}")
          if report.get('candidate_sha') != expected_sha:
              raise SystemExit('candidate SHA mismatch')
          required={
              'os_browser_locale_selects_english_ui',
              'live_google_cloud_runtime',
              'synthetic_patient_evidence_persisted',
              'patient_message_language_overrides_os_locale',
              'gemini_tts_patient_language_narration',
              'real_phi_free_veo_enrichment',
              'durable_patient_education_video_mission',
              'private_authenticated_video_manifest',
              'embedded_private_video_player_visible',
              'real_private_product_mp4_downloaded',
              'logout_login_restores_education_video_and_mission',
              'visible_exact_candidate_cloud_proof',
              'zero_material_browser_errors',
          }
          missing=required-set(report.get('checks') or [])
          if missing:
              raise SystemExit(f"missing final proof checks: {sorted(missing)}")
          data=open(product_path,'rb').read()
          if hashlib.sha256(data).hexdigest() != report.get('product_video_sha256'):
              raise SystemExit('product video SHA mismatch')
          duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',product_path], text=True).strip())
          if duration < 40 or duration > 90:
              raise SystemExit(f'patient education video duration outside expected bounded range: {duration:.2f}s')
          print(f"HEALTHIA_EXPLAIN_FINAL_MEDIA_PASS duration={duration:.2f}s bytes={len(data)}")
          PY

      - name: Upload exact-head Cloud proof and real product video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-ONE-Explain-final-exact-head-proof
          path: dist/healthia-explain-final-cloud-demo
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary Veo generation objects
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${VEO_PREFIX:-}" ]]; then
            gcloud storage rm --recursive "${VEO_PREFIX}/**" >/dev/null 2>&1
          fi
          exit 0

      - name: Delete temporary Cloud Run service
        if: always()
        shell: bash
        run: |
          set +e
          gcloud run services delete "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null 2>&1
          exit 0
