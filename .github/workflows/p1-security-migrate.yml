name: P1 security hardening migration

on:
  push:
    branches:
      - kira/omega-100-agentic-runtime

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/omega-100-agentic-runtime
          fetch-depth: 1
      - name: Harden authenticated streams and internal push then self-clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path); text = p.read_text(encoding="utf-8")
              if old not in text: raise SystemExit(f"Missing block in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace("app/main.py",
              '''@app.post("/api/internal/pubsub/mission")\nasync def pubsub_mission(request: Request) -> dict:\n    """Authenticated Cloud Run target for durable Pub/Sub push delivery."""\n    try:\n        payload = await request.json()''',
              '''@app.post("/api/internal/pubsub/mission")\nasync def pubsub_mission(request: Request) -> dict:\n    """OIDC-verified Pub/Sub push target, safe even when the judge UI is public."""\n    try:\n        await identity_verifier.verify_google_service_bearer(\n            request.headers.get("Authorization"),\n            audience=str(request.base_url).rstrip("/"),\n            expected_email=settings.pubsub_push_service_account,\n        )\n    except IdentityError as exc:\n        raise HTTPException(status_code=401, detail=str(exc)) from exc\n    try:\n        payload = await request.json()''')
          replace("app/main.py",
              '''@app.get("/api/events/stream")\nasync def events() -> StreamingResponse:\n    async def generate():\n        yield "event: ready\\ndata: {}\\n\\n"\n        async for payload in service.broker.subscribe():''',
              '''@app.get("/api/events/stream")\nasync def events() -> StreamingResponse:\n    patient_id = current_patient_id()\n\n    async def generate():\n        yield "event: ready\\ndata: {}\\n\\n"\n        async for payload in service.broker.subscribe(patient_id):''')

          deploy = Path("deployment/deploy-cloud-demo.ps1")
          text = deploy.read_text(encoding="utf-8")
          needle = '    "HEALTHIA_PUBSUB_TOPIC=$TopicName",\n    "HEALTHIA_CLOUD_REGION=$Region",'
          replacement = '    "HEALTHIA_PUBSUB_TOPIC=$TopicName",\n    "HEALTHIA_PUBSUB_PUSH_SERVICE_ACCOUNT=$PushServiceAccount",\n    "HEALTHIA_CLOUD_REGION=$Region",'
          if needle not in text: raise SystemExit("Deploy Pub/Sub env insertion point missing")
          deploy.write_text(text.replace(needle, replacement, 1), encoding="utf-8")

          app = Path("web/app.js")
          text = app.read_text(encoding="utf-8")
          needle = '''document.addEventListener("healthia:identity-changed", async () => {\n  if (!state.data) return;\n  if (eventStream?.abort) eventStream.abort();\n  eventStream = null;\n  await refresh(true); connectEvents();\n});'''
          replacement = needle + '''\ndocument.addEventListener("healthia:signed-out", () => {\n  if (eventStream?.abort) eventStream.abort();\n  eventStream = null;\n  state.data = null;\n  refs.messageList?.replaceChildren();\n  refs.missionList?.replaceChildren();\n  refs.missionRunList?.replaceChildren();\n  refs.resultList?.replaceChildren();\n});'''
          if needle not in text: raise SystemExit("Identity-change handler missing in web/app.js")
          app.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          PY
          rm .github/workflows/p1-security-migrate.yml
          git config user.name "KIRA FORJA verification"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden public auth boundaries and patient streams"
          git push origin HEAD:kira/omega-100-agentic-runtime
