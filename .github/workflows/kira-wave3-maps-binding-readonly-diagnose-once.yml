name: KIRA Wave 3 Maps binding read-only diagnosis once

on:
  pull_request:
    branches:
      - kira/golden-google-constellation-live-891745e1
    paths:
      - .github/workflows/kira-wave3-maps-binding-readonly-diagnose-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      REVISION: healthia-one-demo-00020-mhq
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 888d54171b08fd26347cf3e688d02690da99221b
      - name: Authenticate diagnostic identity
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Firestore client only
        run: python -m pip install 'google-cloud-firestore>=2.21,<3'
      - name: Read sanitized Cloud Run binding and durable mission truth
        shell: bash
        run: |
          set -euo pipefail
          gcloud run revisions describe "$REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/revision.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from google.cloud import firestore

          rev=json.load(open('/tmp/revision.json',encoding='utf-8'))
          containers=((rev.get('spec') or {}).get('containers') or (rev.get('spec') or {}).get('template',{}).get('spec',{}).get('containers') or [])
          env=[]
          for container in containers:
              env.extend(container.get('env') or [])
          env_names=sorted(str(item.get('name') or '') for item in env if item.get('name'))

          def dt(v):
              if isinstance(v, datetime): return v if v.tzinfo else v.replace(tzinfo=timezone.utc)
              if isinstance(v,str) and v.strip():
                  try:
                      p=datetime.fromisoformat(v.strip().replace('Z','+00:00'))
                      return p if p.tzinfo else p.replace(tzinfo=timezone.utc)
                  except ValueError: pass
              return datetime.min.replace(tzinfo=timezone.utc)

          db=firestore.Client(project='healthia-6088a')
          threshold=datetime(2026,8,11,19,14,0,tzinfo=timezone.utc)
          missions=[]
          for snap in db.collection_group('missions').stream():
              raw=snap.to_dict() or {}
              if dt(raw.get('created_at')) < threshold: continue
              loc=raw.get('location') or {}
              text=str(loc.get('text') or '')
              if 'santiago de los caballeros' not in text.casefold(): continue
              missions.append((dt(raw.get('updated_at')),raw))
          missions.sort(key=lambda x:x[0],reverse=True)
          mission=missions[0][1] if missions else {}
          mid=str(mission.get('id') or '')
          receipts=[]
          if mid:
              for snap in db.collection_group('receipts').stream():
                  raw=snap.to_dict() or {}
                  if str(raw.get('mission_id') or '') != mid: continue
                  receipts.append({
                      'action':str(raw.get('action') or ''),
                      'status':str(raw.get('status') or ''),
                      'safe_summary':str(raw.get('safe_summary') or '')[:240],
                      'service':str(raw.get('service') or raw.get('provider') or ''),
                  })
          outputs=mission.get('tool_outputs') or {}
          out={
              'status':'PASS',
              'revision':'healthia-one-demo-00020-mhq',
              'google_maps_api_key_env_present':'GOOGLE_MAPS_API_KEY' in env_names,
              'env_names_only':True,
              'env_value_exposed':False,
              'mission_found':bool(mission),
              'mission_state':str(mission.get('state') or ''),
              'provider_query':str(mission.get('provider_query') or '')[:160],
              'location_text':str((mission.get('location') or {}).get('text') or '')[:200],
              'authorization_boundary_kind':str((outputs.get('authorization_boundary') or {}).get('kind') or ''),
              'location_evidence_mode':str((outputs.get('location_evidence') or {}).get('mode') or ''),
              'candidate_count':len(outputs.get('place_candidates') or []),
              'maps_related_receipts':[r for r in receipts if 'maps' in r['action'].lower() or 'place' in r['safe_summary'].lower()],
              'all_receipt_statuses':[{'action':r['action'],'status':r['status'],'safe_summary':r['safe_summary']} for r in receipts],
              'patient_identifier_exposed':False,
              'mission_identifier_exposed':False,
              'secret_material_exposed':False,
              'provider_write':False,
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
