name: Patch HealthIA Explain structured planner once

on:
  push:
    branches:
      - feature/patient-education-video-20260813
    paths:
      - .github/workflows/patch-explain-structured-plan-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/patient-education-video-20260813
          fetch-depth: 0

      - name: Harden storyboard schema and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('healthia_one/education_video.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from typing import Any, Awaitable, Callable, Protocol\n\n'
          new_import = 'from typing import Any, Awaitable, Callable, Protocol\n\nfrom pydantic import ValidationError\n\n'
          if old_import not in text:
              raise SystemExit('typing import anchor missing')
          text = text.replace(old_import, new_import, 1)

          old_rules = '''- Use at most ONE scene with visual_kind="veo"; all other scenes are controlled cards. For a physiological topic where motion materially improves understanding (for example blood flow, breathing, digestion, joint motion, or cardiac function), use exactly ONE generic Veo scene.\n- Do not use a talking doctor avatar or person generation.\n- Keep narration within the requested duration.\n'''
          new_rules = '''- Return between THREE and SIX education scenes. Even a short video must contain at least THREE concise scenes; HealthIA adds intro, patient-fact and safety cards separately.\n- Every scene must include non-empty heading, body and narration strings. Keep them concise enough for the requested duration.\n- visual_kind must be exactly lowercase "card" or "veo".\n- Use at most ONE scene with visual_kind="veo"; all other scenes are controlled cards. For a physiological topic where motion materially improves understanding (for example blood flow, breathing, digestion, joint motion, or cardiac function), use exactly ONE generic Veo scene.\n- Do not use a talking doctor avatar or person generation.\n- Keep narration within the requested duration.\n'''
          if old_rules not in text:
              raise SystemExit('education rules anchor missing')
          text = text.replace(old_rules, new_rules, 1)

          json_func_end = '''    return json.loads(text[start : end + 1])\n\n\ndef _silent_narration(seconds: int) -> NarrationAudio:\n'''
          helper_block = '''    return json.loads(text[start : end + 1])\n\n\nclass EducationPlanValidationError(ValueError):\n    """Sanitized structured-output failure; never stores raw patient/model content."""\n\n    def __init__(self, validation_errors: list[dict[str, Any]]) -> None:\n        super().__init__("Gemini returned an education storyboard outside the structured HealthIA contract")\n        self.validation_errors = validation_errors\n\n\ndef _normalize_plan_payload(payload: dict[str, Any]) -> dict[str, Any]:\n    """Normalize harmless formatting variance without inventing clinical content."""\n    normalized = dict(payload)\n    if normalized.get("title") is not None:\n        normalized["title"] = str(normalized["title"]).strip()\n    if normalized.get("summary") is not None:\n        normalized["summary"] = str(normalized["summary"]).strip()\n    keys = normalized.get("patient_fact_keys")\n    if isinstance(keys, list):\n        normalized["patient_fact_keys"] = [str(key).strip() for key in keys if str(key).strip()]\n\n    raw_scenes = normalized.get("scenes")\n    if not isinstance(raw_scenes, list):\n        return normalized\n    scenes: list[dict[str, Any]] = []\n    for raw in raw_scenes[:8]:\n        if not isinstance(raw, dict):\n            continue\n        scene = dict(raw)\n        for field in ("heading", "body", "narration"):\n            if scene.get(field) is not None:\n                scene[field] = str(scene[field]).strip()\n        kind = str(scene.get("visual_kind") or "card").strip().lower()\n        scene["visual_kind"] = kind if kind in {"card", "veo"} else "card"\n        prompt = str(scene.get("veo_prompt") or "").strip()\n        scene["veo_prompt"] = prompt if scene["visual_kind"] == "veo" else ""\n        scenes.append(scene)\n    normalized["scenes"] = scenes\n    return normalized\n\n\ndef _validation_errors(exc: ValidationError) -> list[dict[str, Any]]:\n    return [\n        {\n            "type": str(item.get("type") or "validation_error"),\n            "loc": [str(part) for part in (item.get("loc") or ())],\n            "msg": str(item.get("msg") or "invalid structured field")[:240],\n        }\n        for item in exc.errors(include_url=False, include_input=False)[:12]\n    ]\n\n\ndef _silent_narration(seconds: int) -> NarrationAudio:\n'''
          if json_func_end not in text:
              raise SystemExit('json helper insertion anchor missing')
          text = text.replace(json_func_end, helper_block, 1)

          old_config = '''            generation_config={\n                "max_output_tokens": min(int(self.cost_guard.max_output_tokens), 1400),\n                "thinking_level": "minimal",\n                "response_mime_type": "application/json",\n            },\n            store=False,\n        )\n        return EducationVideoPlan.model_validate(_json_object(str(getattr(interaction, "output_text", "") or "")))\n'''
          new_config = '''            generation_config={\n                "max_output_tokens": min(int(self.cost_guard.max_output_tokens), 1400),\n                "thinking_level": "minimal",\n                "response_mime_type": "application/json",\n                "response_json_schema": EducationVideoPlan.model_json_schema(),\n            },\n            store=False,\n        )\n        payload = _normalize_plan_payload(\n            _json_object(str(getattr(interaction, "output_text", "") or ""))\n        )\n        try:\n            return EducationVideoPlan.model_validate(payload)\n        except ValidationError as exc:\n            raise EducationPlanValidationError(_validation_errors(exc)) from exc\n'''
          if old_config not in text:
              raise SystemExit('Gemini plan generation anchor missing')
          text = text.replace(old_config, new_config, 1)

          old_audit = '''                details={"error_type": type(exc).__name__, "locale": locale, "no_fake_video": True},\n'''
          new_audit = '''                details={\n                    "error_type": type(exc).__name__,\n                    "locale": locale,\n                    "no_fake_video": True,\n                    "validation_errors": getattr(exc, "validation_errors", []),\n                },\n'''
          if old_audit not in text:
              raise SystemExit('failure audit anchor missing')
          text = text.replace(old_audit, new_audit, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_healthia_explain_planner_contract.py')
          test.write_text('''import json\nfrom types import SimpleNamespace\n\nimport pytest\n\nfrom healthia_one.education_video import (\n    EducationPlanValidationError,\n    PatientEducationVideoRouter,\n    _education_system_instruction,\n    _normalize_plan_payload,\n)\nfrom healthia_one.education_video_models import EducationFact\nfrom healthia_one.models import PatientState\n\n\nclass FakeCostGuard:\n    max_output_tokens = 1400\n\n    def __init__(self):\n        self.actions = []\n\n    def authorize(self, action):\n        self.actions.append(action)\n\n\nclass FakeInteractions:\n    def __init__(self, payload):\n        self.payload = payload\n        self.calls = []\n\n    def create(self, **kwargs):\n        self.calls.append(kwargs)\n        return SimpleNamespace(output_text=json.dumps(self.payload))\n\n\nclass FakeClient:\n    def __init__(self, payload):\n        self.interactions = FakeInteractions(payload)\n\n\ndef live_settings():\n    return SimpleNamespace(llm_backend="gemini_api", adk_ready=True, model="gemini-3.5-flash")\n\n\ndef valid_payload():\n    return {\n        "title": " Understanding glucose ",\n        "summary": " A short explanation ",\n        "patient_fact_keys": ["result_glucose"],\n        "scenes": [\n            {"heading": " What glucose is ", "body": " General education. ", "narration": " Glucose is a source of energy. ", "visual_kind": "CARD"},\n            {"heading": " Your result ", "body": " Your recorded value stays on a controlled card. ", "narration": " HealthIA separates your value from general education. ", "visual_kind": "card"},\n            {"heading": " Follow up ", "body": " Keep the result for your next conversation. ", "narration": " Use the result to prepare questions. ", "visual_kind": "VEO", "veo_prompt": "Generic medical education animation of glucose moving through the bloodstream, no people, no text"},\n        ],\n    }\n\n\ndef test_system_prompt_explicitly_locks_scene_count_and_kind():\n    prompt = _education_system_instruction("en")\n    assert "between THREE and SIX education scenes" in prompt\n    assert 'exactly lowercase "card" or "veo"' in prompt\n\n\ndef test_plan_normalizer_only_repairs_harmless_shape_variance():\n    payload = valid_payload()\n    normalized = _normalize_plan_payload(payload)\n    assert normalized["title"] == "Understanding glucose"\n    assert normalized["scenes"][0]["visual_kind"] == "card"\n    assert normalized["scenes"][0]["veo_prompt"] == ""\n    assert normalized["scenes"][2]["visual_kind"] == "veo"\n\n\n@pytest.mark.asyncio\nasync def test_gemini_plan_uses_pydantic_json_schema_and_accepts_safe_normalization():\n    client = FakeClient(valid_payload())\n    guard = FakeCostGuard()\n    router = PatientEducationVideoRouter(live_settings(), client_provider=lambda: client, cost_guard=guard)\n    state = PatientState()\n    facts = [EducationFact(key="result_glucose", label="Glucose", value="103 mg/dL", source_id="result_glucose", source_type="health_result")]\n    plan = await router._gemini_plan(state, "glucose", "en", 60, facts)\n    call = client.interactions.calls[0]\n    schema = call["generation_config"]["response_json_schema"]\n    assert schema["properties"]["scenes"]["minItems"] == 3\n    assert schema["properties"]["scenes"]["maxItems"] == 8\n    assert guard.actions == ["patient_education_video_plan"]\n    assert len(plan.scenes) == 3\n    assert plan.scenes[2].visual_kind == "veo"\n\n\n@pytest.mark.asyncio\nasync def test_invalid_short_storyboard_fails_with_sanitized_validation_metadata():\n    payload = valid_payload()\n    payload["scenes"] = payload["scenes"][:1]\n    client = FakeClient(payload)\n    router = PatientEducationVideoRouter(live_settings(), client_provider=lambda: client, cost_guard=FakeCostGuard())\n    with pytest.raises(EducationPlanValidationError) as raised:\n        await router._gemini_plan(PatientState(), "glucose", "en", 60, [])\n    assert raised.value.validation_errors\n    assert any("scenes" in item["loc"] for item in raised.value.validation_errors)\n    assert all("103" not in item["msg"] for item in raised.value.validation_errors)\n''', encoding='utf-8')
          PY

          git config user.name "healthia-one-maintenance"
          git config user.email "127772990+arisnachy@users.noreply.github.com"
          git add healthia_one/education_video.py tests/test_healthia_explain_planner_contract.py
          git commit -m "Harden HealthIA Explain structured storyboard contract"
          git push origin HEAD:feature/patient-education-video-20260813
