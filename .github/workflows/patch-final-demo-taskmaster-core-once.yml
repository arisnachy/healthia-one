name: Patch focused Taskmaster final demo once

on:
  push:
    branches:
      - feature/patient-education-video-20260813
    paths:
      - .github/workflows/patch-final-demo-taskmaster-core-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/patient-education-video-20260813
          fetch-depth: 0
      - name: Focus recording on deterministic evidence-to-outcome Taskmaster path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/record_final_live_english_demo.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('        before = latest_assistant_message(page)\n        send_chat(page, "I have had burning with urination')
          end_marker = '        page.locator("#resultFile").set_input_files(str(pdf_path))\n'
          end = text.index(end_marker, start)
          replacement = '''        cloud_runtime = (\n            f"Gemini {readiness.get('model')} · Google ADK ready: {readiness.get('adk_ready')} · "\n            f"State: {readiness.get('store_backend')} · Evidence: {readiness.get('evidence_backend')}"\n        )\n        overlay(page, "Exact Google Cloud runtime", cloud_runtime, 4)\n        clear_overlay(page)\n\n        page.locator('.main-nav [data-open="results"]').click()\n        page.wait_for_function("document.getElementById('view-results')?.classList.contains('is-active') === true", timeout=15_000)\n        report["checks"].append("results_workspace_opened")\n        checkpoint(report)\n        overlay(page, "Evidence becomes durable work", "The patient opens Results and adds original evidence. HealthIA preserves the source before interpretation, then carries the outcome forward as patient-scoped state and missions.", 4)\n        clear_overlay(page)\n\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "healthia-one-maintenance"
          git config user.email "127772990+arisnachy@users.noreply.github.com"
          git add scripts/record_final_live_english_demo.py
          git commit -m "Focus final demo on Taskmaster evidence-to-outcome path"
          git push origin HEAD:feature/patient-education-video-20260813
