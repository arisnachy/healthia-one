name: HealthIA autonomy Cloud Run diagnostic

on:
  push:
    branches:
      - kira/autonomous-continuity-mainline
    paths:
      - ".github/workflows/autonomy-live-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
    steps:
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Inspect private autonomy services without mutation
        shell: bash
        run: |
          set -euo pipefail
          for service in healthia-one-autopilot healthia-gmail-worker; do
            gcloud run services describe "$service" --project "$PROJECT_ID" --region "$REGION" --format=json > "/tmp/${service}.json"
            echo "=== ${service} ==="
            jq '{
              latestCreatedRevision: .status.latestCreatedRevisionName,
              latestReadyRevision: .status.latestReadyRevisionName,
              ready: ([.status.conditions[]? | select(.type=="Ready") | .status][0] // "unknown"),
              image: .spec.template.spec.containers[0].image,
              proactive: ([.spec.template.spec.containers[0].env[]? | select(.name=="HEALTHIA_PROACTIVE_ENABLED") | .value][0] // "unset"),
              traffic: .status.traffic
            }' "/tmp/${service}.json"
          done
