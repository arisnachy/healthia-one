name: HealthIA autonomy Cloud Run diagnostic

on:
  push:
    branches:
      - kira/autonomous-continuity-mainline
    paths:
      - ".github/workflows/autonomy-live-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      FAILED_JOB: healthia-mainline-31971215610-setup
    steps:
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Inspect services, execution and sanitized traceback without mutation
        shell: bash
        run: |
          set -euo pipefail
          for service in healthia-one-autopilot healthia-gmail-worker; do
            gcloud run services describe "$service" --project "$PROJECT_ID" --region "$REGION" --format=json > "/tmp/${service}.json"
            echo "=== ${service} ==="
            jq '{
              latestCreatedRevision: .status.latestCreatedRevisionName,
              latestReadyRevision: .status.latestReadyRevisionName,
              ready: ([.status.conditions[]? | select(.type=="Ready") | .status][0] // "unknown"),
              image: .spec.template.spec.containers[0].image,
              proactive: ([.spec.template.spec.containers[0].env[]? | select(.name=="HEALTHIA_PROACTIVE_ENABLED") | .value][0] // "unset"),
              traffic: .status.traffic
            }' "/tmp/${service}.json"
          done
          echo "=== failed setup execution ==="
          gcloud run jobs executions list \
            --project "$PROJECT_ID" --region "$REGION" --job "$FAILED_JOB" --limit 5 \
            --format='table(metadata.name,status.conditions[0].type,status.conditions[0].status,status.conditions[0].message,status.startTime,status.completionTime)' || true
          echo "=== sanitized stderr / exception lines ==="
          gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${FAILED_JOB}\"" \
            --project "$PROJECT_ID" --freshness=2h --limit=200 --order=asc --format='value(textPayload)' \
            | grep -E 'Traceback|Error|Exception|ModuleNotFound|ImportError|AttributeError|TypeError|ValueError|Permission|denied|failed|File \"|line [0-9]+' \
            | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[redacted-email]/g' \
            | tail -n 80 || true
