name: KIRA Wave 3 Places zero-result read-only diagnosis once

on:
  pull_request:
    branches:
      - kira/golden-google-constellation-live-891745e1
    paths:
      - .github/workflows/kira-wave3-places-diagnose-readonly-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      PROJECT_ID: healthia-6088a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0a0eb9e2f79f920514192a9e8373c33bf4aefbe5
      - name: Authenticate read-only diagnostic identity
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Firestore client only
        run: python -m pip install 'google-cloud-firestore>=2.21,<3'
      - name: Read only sanitized current Wave 3 Places mission and receipt truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from google.cloud import firestore

          db=firestore.Client(project='healthia-6088a')
          threshold=datetime(2026,8,11,18,8,0,tzinfo=timezone.utc)
          matches=[]
          for snap in db.collection_group('missions').stream():
              raw=snap.to_dict() or {}
              created=raw.get('created_at')
              if not created or created < threshold:
                  continue
              location=raw.get('location') or {}
              text=str(location.get('text') or '')
              if 'santiago' not in text.casefold():
                  continue
              matches.append((raw.get('updated_at') or created, raw))
          if not matches:
              raise SystemExit('No recent synthetic Santiago mission found')
          matches.sort(key=lambda item:item[0], reverse=True)
          mission=matches[0][1]
          mission_id=str(mission.get('id') or '')
          outputs=mission.get('tool_outputs') or {}
          receipts=[]
          for snap in db.collection_group('receipts').stream():
              raw=snap.to_dict() or {}
              if str(raw.get('mission_id') or '') != mission_id:
                  continue
              receipts.append({
                  'action':str(raw.get('action') or ''),
                  'status':str(raw.get('status') or ''),
                  'safe_summary':str(raw.get('safe_summary') or '')[:300],
                  'provider':str(raw.get('provider') or ''),
              })
          out={
              'status':'PASS',
              'synthetic_scope':'latest Wave3 Santiago care-navigation mission after 18:08Z',
              'mission_state':str(mission.get('state') or ''),
              'condition_or_need':str(mission.get('condition_or_need') or '')[:240],
              'provider_query':str(mission.get('provider_query') or '')[:240],
              'location_text':str((mission.get('location') or {}).get('text') or '')[:120],
              'location_source':str((mission.get('location') or {}).get('source') or ''),
              'candidate_count':len(outputs.get('place_candidates') or []),
              'authorization_boundary_kind':str((outputs.get('authorization_boundary') or {}).get('kind') or ''),
              'location_evidence_mode':str((outputs.get('location_evidence') or {}).get('mode') or ''),
              'public_events':[
                  {'event_type':str(e.get('event_type') or ''),'summary':str(e.get('summary') or '')[:300]}
                  for e in (mission.get('public_events') or [])[-8:]
              ],
              'maps_receipts':[r for r in receipts if 'maps.' in r['action']],
              'patient_identifier_exposed':False,
              'mission_identifier_exposed':False,
              'place_identifier_exposed':False,
              'secret_material_exposed':False,
              'provider_write':False,
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
