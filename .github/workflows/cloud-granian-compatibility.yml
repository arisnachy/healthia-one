name: Cloud Granian compatibility probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: healthia-cloud-granian-compatibility
  cancel-in-progress: true

jobs:
  compatibility:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SOURCE_SERVICE: healthia-one-judge
      CONTROL_SERVICE: healthia-granian-control
      AR_REPO: cloud-run-source-deploy
      PROVISION_PRINCIPAL: healthia-github-vertex-9@healthia-6088a.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a

      - name: Resolve immutable current HealthIA image
        id: base
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          curl -fsSL -H "Authorization: Bearer ${token}" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${SOURCE_SERVICE}" > /tmp/source.json
          image="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/source.json'))
          print(((d.get('template') or {}).get('containers') or [{}])[0].get('image',''))
          PY
          )"
          if [[ -z "$image" || "$image" != *@sha256:* ]]; then
            echo "::error::Could not resolve immutable base image: '$image'"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Base image: $image"

      - name: Build single-variable Granian child image
        id: build
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet >/dev/null
          cat > /tmp/Dockerfile.granian <<'EOF'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          RUN pip install --no-cache-dir 'granian==2.7.9'
          CMD ["sh", "-c", "granian --interface asgi --host 0.0.0.0 --port ${PORT} --workers 1 app.main:app"]
          EOF
          local_image="healthia-granian:${GITHUB_SHA:0:12}"
          remote_image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/healthia-granian:${GITHUB_SHA:0:12}"
          docker build --pull --build-arg BASE_IMAGE='${{ steps.base.outputs.image }}' -f /tmp/Dockerfile.granian -t "$local_image" /tmp
          version="$(docker run --rm --entrypoint python "$local_image" -c 'import importlib.metadata; print(importlib.metadata.version("granian"))')"
          echo "Resolved Granian version: $version"
          test "$version" = "2.7.9"
          echo "local_image=$local_image" >> "$GITHUB_OUTPUT"
          echo "remote_image=$remote_image" >> "$GITHUB_OUTPUT"

      - name: Prove Granian child locally
        id: local
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run -d -p 18087:8080 '${{ steps.build.outputs.local_image }}')"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          code=000
          for i in {1..40}; do
            code="$(curl -sS -o /tmp/local-health.json -w '%{http_code}' http://127.0.0.1:18087/healthz || true)"
            echo "local attempt=$i HTTP=$code"
            if [ "$code" = 200 ]; then
              cat /tmp/local-health.json
              echo
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            running="$(docker inspect "$cid" --format='{{.State.Running}}' 2>/dev/null || echo false)"
            if [ "$running" != true ]; then
              echo "::error::Granian child exited during local probe"
              docker logs "$cid" 2>&1 || true
              exit 1
            fi
            sleep 1
          done
          echo "::error::Granian child never passed local /healthz"
          docker logs "$cid" 2>&1 || true
          exit 1

      - name: Temporarily grant push and Cloud Run administration
        if: steps.local.outputs.ok == 'true'
        run: |
          set -euo pipefail
          for role in roles/artifactregistry.writer roles/run.admin; do
            gcloud projects add-iam-policy-binding "$PROJECT_ID" \
              --member="serviceAccount:${PROVISION_PRINCIPAL}" \
              --role="$role" --condition=None --quiet >/dev/null
          done

      - name: Push Granian child image
        if: steps.local.outputs.ok == 'true'
        id: push
        shell: bash
        run: |
          set -euo pipefail
          docker tag '${{ steps.build.outputs.local_image }}' '${{ steps.build.outputs.remote_image }}'
          docker push '${{ steps.build.outputs.remote_image }}'
          digest="$(docker inspect '${{ steps.build.outputs.remote_image }}' --format='{{index .RepoDigests 0}}' | sed 's/.*@//')"
          if [[ "$digest" != sha256:* ]]; then
            echo "::error::Could not resolve Granian child digest: '$digest'"
            exit 1
          fi
          immutable="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/healthia-granian@${digest}"
          echo "immutable=$immutable" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Child image: $immutable"

      - name: Deploy Granian child to ephemeral Cloud Run
        if: steps.push.outputs.immutable != ''
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$CONTROL_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image '${{ steps.push.outputs.immutable }}' \
            --min 0 --max 1 \
            --no-invoker-iam-check \
            --quiet >/dev/null
          token="$(gcloud auth print-access-token)"
          curl -fsSL -H "Authorization: Bearer ${token}" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${CONTROL_SERVICE}" > /tmp/cloud.json
          python - <<'PY' > /tmp/urls.txt
          import json
          d=json.load(open('/tmp/cloud.json'))
          print('\n'.join(d.get('urls') or [d.get('uri','')]))
          PY
          success_url=""
          final_code=000
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            for i in {1..25}; do
              final_code="$(curl -sS -o /tmp/cloud-health.json -w '%{http_code}' "$url/healthz" || true)"
              echo "cloud url=$url attempt=$i HTTP=$final_code"
              if [ "$final_code" = 200 ]; then
                success_url="$url"
                break 2
              fi
              sleep 2
            done
          done < /tmp/urls.txt
          echo "http=$final_code" >> "$GITHUB_OUTPUT"
          echo "url=$success_url" >> "$GITHUB_OUTPUT"
          if [ -z "$success_url" ]; then
            echo "::error::Granian also failed on Cloud Run"
            exit 1
          fi
          echo "HEALTHIA_GRANIAN_CLOUD_OK url=$success_url"
          cat /tmp/cloud-health.json
          echo

      - name: Capture sanitized compatibility result
        if: always()
        env:
          BASE_IMAGE: ${{ steps.base.outputs.image }}
          CHILD_DIGEST: ${{ steps.push.outputs.digest }}
          CLOUD_HTTP: ${{ steps.cloud.outputs.http }}
          CLOUD_URL: ${{ steps.cloud.outputs.url }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p deployment
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload={
            'candidate_sha': os.environ.get('CANDIDATE_SHA',''),
            'base_image': os.environ.get('BASE_IMAGE',''),
            'only_runtime_change': 'granian==2.7.9 as ASGI server',
            'local_health_ok': True,
            'cloud_http': os.environ.get('CLOUD_HTTP',''),
            'cloud_url': os.environ.get('CLOUD_URL',''),
            'child_digest': os.environ.get('CHILD_DIGEST',''),
          }
          print(json.dumps(payload,indent=2))
          Path('deployment/cloud-granian-compatibility.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          PY

      - name: Delete ephemeral Granian control service
        if: always()
        run: |
          gcloud run services delete "$CONTROL_SERVICE" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null 2>&1 || true

      - name: Remove temporary roles
        if: always()
        run: |
          for role in roles/artifactregistry.writer roles/run.admin; do
            gcloud projects remove-iam-policy-binding "$PROJECT_ID" \
              --member="serviceAccount:${PROVISION_PRINCIPAL}" \
              --role="$role" --condition=None --quiet >/dev/null 2>&1 || true
          done

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-cloud-granian-compatibility
          path: deployment/cloud-granian-compatibility.json
          if-no-files-found: warn
          retention-days: 7
