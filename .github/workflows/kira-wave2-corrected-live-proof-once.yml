name: KIRA corrected STT DocumentAI Healthcare LIVE proof once

on:
  pull_request:
    paths:
      - '.github/workflows/kira-wave2-corrected-live-proof-once.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: kira-wave2-corrected-live-proof-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  live-proof:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PROJECT_ID: healthia-6088a
      HEALTHCARE_LOCATION: us-central1
      TARGET_BRANCH: kira/google-constellation-wave2-live
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      AUTHORIZATION: I_AUTHORIZE_STT_DOCUMENTAI_HEALTHCARE_LIVE
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enforce exact one-shot authorization
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]] || { echo 'Retry refused: corrected LIVE proof is one-shot.' >&2; exit 1; }
          [[ "$AUTHORIZATION" == "I_AUTHORIZE_STT_DOCUMENTAI_HEALTHCARE_LIVE" ]] || { echo 'Exact authorization missing.' >&2; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify only authorized APIs are enabled
        shell: bash
        run: |
          set -euo pipefail
          enabled="$(gcloud services list --project "$PROJECT_ID" --enabled --format='value(config.name)')"
          for api in speech.googleapis.com documentai.googleapis.com healthcare.googleapis.com; do
            grep -Fxq "$api" <<<"$enabled" || { echo "Authorized API is not enabled: $api" >&2; exit 1; }
          done

      - name: Grant only temporary LIVE provider roles not already present
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          test -n "$ACCOUNT"
          echo "::add-mask::$ACCOUNT"
          MEMBER="serviceAccount:$ACCOUNT"
          echo "::add-mask::$MEMBER"
          printf '%s' "$MEMBER" > /tmp/wave2-member
          : > /tmp/wave2-granted-roles
          roles=(
            roles/speech.client
            roles/documentai.editor
            roles/storage.admin
            roles/healthcare.datasetAdmin
            roles/healthcare.fhirStoreAdmin
            roles/healthcare.fhirResourceEditor
            roles/healthcare.dicomStoreAdmin
            roles/healthcare.dicomEditor
          )
          for role in "${roles[@]}"; do
            if gcloud projects get-iam-policy "$PROJECT_ID" --flatten='bindings[].members' --filter="bindings.role:$role AND bindings.members:$MEMBER" --format='value(bindings.role)' | grep -Fxq "$role"; then
              echo "Preserving pre-existing role: $role"
            else
              gcloud projects add-iam-policy-binding "$PROJECT_ID" --member="$MEMBER" --role="$role" --condition=None --quiet >/dev/null
              printf '%s\n' "$role" >> /tmp/wave2-granted-roles
            fi
          done
          echo 'Waiting for provider-side IAM propagation before any LIVE call.'
          sleep 90

      - name: Speech-to-Text LIVE proof with robust synthetic control audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/kira-wave2-corrected-live
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          espeak-ng -v en-us -s 95 -g 22 -w /tmp/healthia-wave2-raw.wav "one. two. three. one. two. three. healthia synthetic control."
          ffmpeg -v error -y -i /tmp/healthia-wave2-raw.wav -ar 16000 -ac 1 -c:a pcm_s16le /tmp/healthia-wave2.wav
          rm -f /tmp/healthia-wave2-raw.wav
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          test -n "$ACCESS_TOKEN"
          echo "::add-mask::$ACCESS_TOKEN"
          export ACCESS_TOKEN
          python - <<'PY'
          import base64, hashlib, json, os, re, time, urllib.error, urllib.request, wave
          from pathlib import Path
          wav_path=Path('/tmp/healthia-wave2.wav')
          with wave.open(str(wav_path),'rb') as wav:
              rate=wav.getframerate(); channels=wav.getnchannels(); width=wav.getsampwidth()
          if (rate,channels,width)!=(16000,1,2): raise SystemExit('Synthetic WAV normalization failed')
          payload={'config':{'encoding':'LINEAR16','sampleRateHertz':16000,'languageCode':'en-US','speechContexts':[{'phrases':['one','two','three','healthia synthetic control'],'boost':18.0}]},'audio':{'content':base64.b64encode(wav_path.read_bytes()).decode('ascii')}}
          transcript=''; http_status=0
          for attempt in range(1,5):
              access=os.environ['ACCESS_TOKEN'] if attempt==1 else __import__('subprocess').check_output(['gcloud','auth','print-access-token'],text=True).strip()
              req=urllib.request.Request('https://speech.googleapis.com/v1/speech:recognize',data=json.dumps(payload,separators=(',',':')).encode(),headers={'Authorization':'Bearer '+access,'Content-Type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=90) as response:
                      http_status=response.status; body=json.loads(response.read().decode() or '{}')
                  transcripts=[]
                  for result in body.get('results') or []:
                      alts=result.get('alternatives') or []
                      if alts: transcripts.append(str(alts[0].get('transcript') or ''))
                  transcript=' '.join(transcripts).strip(); break
              except urllib.error.HTTPError as exc:
                  http_status=exc.code
                  if exc.code!=403 or attempt==4: raise
                  time.sleep(30)
          tokens=set(re.findall(r'[a-z0-9]+',transcript.lower()))
          controls=[{'one','1'},{'two','2'},{'three','3'}]
          hits=sum(1 for group in controls if group & tokens)
          if not transcript or hits < 2: raise SystemExit('Speech recognition did not match at least two independent numeric control concepts')
          out={'status':'LIVE_PASS','provider':'speech.googleapis.com','http_status':http_status,'recognized_text_sha256':hashlib.sha256(transcript.encode()).hexdigest(),'expected_control_concept_hits':hits,'synthetic_audio':True,'normalized_pcm_16khz_mono':True,'clinical_content':False,'raw_transcript_exposed':False,'secret_material_exposed':False}
          Path('dist/kira-wave2-corrected-live/stt.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          wav_path.unlink(missing_ok=True)
          PY

      - name: Dispatch mission-faithful Document AI private-GCS LIVE proof
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run google-wave2-documentai-gcs-proof.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH" -f mode=live -f cost_authorization="$AUTHORIZATION"
          run_id=''
          for _ in $(seq 1 40); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow google-wave2-documentai-gcs-proof.yml --branch "$TARGET_BRANCH" --event workflow_dispatch --limit 30 --json databaseId,headSha,createdAt | jq -r --arg sha "$TARGET_SHA" '[.[] | select(.headSha==$sha)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          [[ -n "$run_id" ]] || { echo 'Document AI/GCS LIVE run not observed.' >&2; exit 1; }
          echo "DOCUMENTAI_GCS_RUN_ID=$run_id" >> "$GITHUB_ENV"
          for _ in $(seq 1 240); do
            state="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '[.status,(.conclusion // "")]|join("|")' 2>/dev/null || true)"
            [[ "$state" == completed\|success ]] && break
            if [[ "$state" == completed\|* ]]; then echo "Document AI/GCS LIVE run failed: $state" >&2; exit 1; fi
            sleep 5
          done
          state="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '[.status,(.conclusion // "")]|join("|")' 2>/dev/null || true)"
          [[ "$state" == completed\|success ]] || { echo "Document AI/GCS LIVE run did not finish successfully: $state" >&2; exit 1; }
          jq -n --arg run_id "$run_id" '{status:"LIVE_PASS",provider:"documentai.googleapis.com",input_source:"private_gcs_document",provider_run_id:$run_id,clinical_content:false,secret_material_exposed:false}' > dist/kira-wave2-corrected-live/documentai.json

      - name: Cloud Healthcare FHIR R4 + DICOM LIVE synthetic proof
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          test -n "$ACCESS_TOKEN"
          echo "::add-mask::$ACCESS_TOKEN"
          export ACCESS_TOKEN
          python - <<'PY'
          import hashlib, json, os, struct, time, uuid, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          project=os.environ['PROJECT_ID']; location=os.environ['HEALTHCARE_LOCATION']; token=os.environ['ACCESS_TOKEN']
          run_id=''.join(ch for ch in os.environ.get('GITHUB_RUN_ID','run') if ch.isalnum())[-24:]
          dataset_id=('wave2'+run_id).lower(); fhir_id=('fhir'+run_id).lower(); dicom_id=('dicom'+run_id).lower(); patient_id=('synthetic'+run_id).lower()
          root=f'https://healthcare.googleapis.com/v1/projects/{project}/locations/{location}'
          dataset_name=f'projects/{project}/locations/{location}/datasets/{dataset_id}'; fhir_name=dataset_name+f'/fhirStores/{fhir_id}'; dicom_name=dataset_name+f'/dicomStores/{dicom_id}'
          def access():
              return __import__('subprocess').check_output(['gcloud','auth','print-access-token'],text=True).strip()
          def call(method,url,body=None,content_type='application/json',accept='application/json',retry_403=True):
              data=json.dumps(body,separators=(',',':')).encode() if isinstance(body,(dict,list)) else (bytes(body) if isinstance(body,(bytes,bytearray)) else None)
              for attempt in range(1,5):
                  headers={'Authorization':'Bearer '+access(),'Accept':accept}
                  if data is not None: headers['Content-Type']=content_type
                  req=urllib.request.Request(url,data=data,headers=headers,method=method)
                  try:
                      with urllib.request.urlopen(req,timeout=120) as response: return response.status,response.read(),response.headers.get('Content-Type','')
                  except urllib.error.HTTPError as exc:
                      if exc.code==403 and retry_403 and attempt<4:
                          time.sleep(30); continue
                      raise RuntimeError(f'Healthcare REST call failed with HTTP {exc.code}') from None
          def json_call(method,url,body=None,content_type='application/json',accept='application/json'):
              status,raw,_=call(method,url,body,content_type,accept); return status,json.loads(raw.decode() or '{}')
          def uid(label): return '2.25.'+str(uuid.uuid5(uuid.NAMESPACE_URL,f'healthia-wave2:{run_id}:{label}').int)
          def pad_text(vr,value):
              raw=value.encode('ascii'); pad=b'\0' if vr=='UI' else b' '; return raw if len(raw)%2==0 else raw+pad
          long_vr={'OB','OD','OF','OL','OW','SQ','UC','UR','UT','UN'}
          def element(group,elem,vr,value):
              raw=struct.pack('<H',int(value)) if vr=='US' else (struct.pack('<I',int(value)) if vr=='UL' else (value if isinstance(value,bytes) and len(value)%2==0 else (value+b'\0' if isinstance(value,bytes) else pad_text(vr,str(value)))))
              head=struct.pack('<HH',group,elem)+vr.encode('ascii'); return head+(b'\0\0'+struct.pack('<I',len(raw))+raw if vr in long_vr else struct.pack('<H',len(raw))+raw)
          sop_class='1.2.840.10008.5.1.4.1.1.7'; study_uid=uid('study'); series_uid=uid('series'); sop_uid=uid('instance'); impl_uid=uid('implementation')
          meta_parts=[element(0x0002,0x0001,'OB',b'\0\1'),element(0x0002,0x0002,'UI',sop_class),element(0x0002,0x0003,'UI',sop_uid),element(0x0002,0x0010,'UI','1.2.840.10008.1.2.1'),element(0x0002,0x0012,'UI',impl_uid)]
          meta_payload=b''.join(meta_parts); file_meta=element(0x0002,0x0000,'UL',len(meta_payload))+meta_payload
          dataset=b''.join([element(0x0008,0x0016,'UI',sop_class),element(0x0008,0x0018,'UI',sop_uid),element(0x0008,0x0020,'DA','20260810'),element(0x0008,0x0060,'CS','OT'),element(0x0010,0x0010,'PN','SYNTHETIC^HEALTHIA'),element(0x0010,0x0020,'LO','SYNTHETIC'),element(0x0020,0x000D,'UI',study_uid),element(0x0020,0x000E,'UI',series_uid),element(0x0020,0x0011,'IS','1'),element(0x0020,0x0013,'IS','1'),element(0x0028,0x0002,'US',1),element(0x0028,0x0004,'CS','MONOCHROME2'),element(0x0028,0x0010,'US',1),element(0x0028,0x0011,'US',1),element(0x0028,0x0100,'US',8),element(0x0028,0x0101,'US',8),element(0x0028,0x0102,'US',7),element(0x0028,0x0103,'US',0),element(0x7FE0,0x0010,'OB',b'\0\0')])
          dicom=b'\0'*128+b'DICM'+file_meta+dataset
          created={'dataset':False,'fhir':False,'dicom':False}; cleanup={'dicom':False,'fhir':False,'dataset':False}
          try:
              json_call('POST',root+'/datasets?datasetId='+urllib.parse.quote(dataset_id),{}); created['dataset']=True
              json_call('POST','https://healthcare.googleapis.com/v1/'+dataset_name+'/fhirStores?fhirStoreId='+urllib.parse.quote(fhir_id),{'version':'R4','enableUpdateCreate':True}); created['fhir']=True
              json_call('POST','https://healthcare.googleapis.com/v1/'+dataset_name+'/dicomStores?dicomStoreId='+urllib.parse.quote(dicom_id),{}); created['dicom']=True
              fhir_url='https://healthcare.googleapis.com/v1/'+fhir_name+'/fhir/Patient/'+patient_id
              json_call('PUT',fhir_url,{'resourceType':'Patient','id':patient_id,'active':True,'meta':{'tag':[{'system':'https://healthia.invalid/proof','code':'synthetic-wave2'}]}},content_type='application/fhir+json',accept='application/fhir+json')
              _,reread=json_call('GET',fhir_url,accept='application/fhir+json')
              if reread.get('resourceType')!='Patient' or reread.get('id')!=patient_id: raise RuntimeError('FHIR create+reread failed')
              boundary='healthia-wave2-boundary'; multipart=(('--'+boundary+'\r\nContent-Type: application/dicom\r\n\r\n').encode()+dicom+('\r\n--'+boundary+'--\r\n').encode())
              stow_url='https://healthcare.googleapis.com/v1/'+dicom_name+'/dicomWeb/studies'; status,_,_=call('POST',stow_url,multipart,content_type=f'multipart/related; type="application/dicom"; boundary={boundary}',accept='application/dicom+json')
              if status not in {200,202}: raise RuntimeError('DICOM STOW failed')
              metadata_url='https://healthcare.googleapis.com/v1/'+dicom_name+'/dicomWeb/studies/'+urllib.parse.quote(study_uid,safe='.')+'/series/'+urllib.parse.quote(series_uid,safe='.')+'/instances/'+urllib.parse.quote(sop_uid,safe='.')+'/metadata'
              _,metadata,_=call('GET',metadata_url,accept='application/dicom+json'); parsed=json.loads(metadata.decode() or '[]')
              if not isinstance(parsed,list) or not parsed: raise RuntimeError('DICOM metadata reread was empty')
              out={'status':'LIVE_PASS','provider':'healthcare.googleapis.com','fhir_create_reread':True,'dicom_stow_metadata_reread':True,'dicom_instance_sha256':hashlib.sha256(dicom).hexdigest(),'synthetic_resources_only':True,'clinical_content':False,'secret_material_exposed':False}
              Path('dist/kira-wave2-corrected-live/healthcare.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n'); print(json.dumps(out,sort_keys=True))
          finally:
              for key,name in [('dicom',dicom_name),('fhir',fhir_name),('dataset',dataset_name)]:
                  if not created[key]: continue
                  ok=False
                  for _ in range(6):
                      try: call('DELETE','https://healthcare.googleapis.com/v1/'+name,retry_403=False); ok=True; break
                      except Exception: time.sleep(5)
                  cleanup[key]=ok
              Path('dist/kira-wave2-corrected-live/healthcare-cleanup.json').write_text(json.dumps({'cleanup_requested':cleanup,'secret_material_exposed':False},sort_keys=True,indent=2)+'\n')
          PY

      - name: Remove only temporary roles granted by this proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/wave2-member && -f /tmp/wave2-granted-roles ]]; then
            MEMBER="$(cat /tmp/wave2-member)"; echo "::add-mask::$MEMBER"
            while IFS= read -r role; do
              [[ -z "$role" ]] && continue
              gcloud projects remove-iam-policy-binding "$PROJECT_ID" --member="$MEMBER" --role="$role" --condition=None --quiet >/dev/null || gcloud projects remove-iam-policy-binding "$PROJECT_ID" --member="$MEMBER" --role="$role" --quiet >/dev/null
            done < /tmp/wave2-granted-roles
          fi

      - name: Build sanitized final truth and verify cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/kira-wave2-corrected-live
          left=0; granted=0
          if [[ -f /tmp/wave2-member && -f /tmp/wave2-granted-roles ]]; then
            MEMBER="$(cat /tmp/wave2-member)"; echo "::add-mask::$MEMBER"; granted="$(grep -cve '^$' /tmp/wave2-granted-roles || true)"
            while IFS= read -r role; do
              [[ -z "$role" ]] && continue
              if gcloud projects get-iam-policy "$PROJECT_ID" --flatten='bindings[].members' --filter="bindings.role:$role AND bindings.members:$MEMBER" --format='value(bindings.role)' | grep -Fxq "$role"; then left=$((left+1)); fi
            done < /tmp/wave2-granted-roles
          fi
          export LEFT="$left" GRANTED="$granted"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('dist/kira-wave2-corrected-live')
          def read(name):
              p=root/name
              return json.loads(p.read_text()) if p.exists() else {}
          stt=read('stt.json'); doc=read('documentai.json'); health=read('healthcare.json'); cleanup=read('healthcare-cleanup.json')
          live=stt.get('status')=='LIVE_PASS' and doc.get('status')=='LIVE_PASS' and health.get('status')=='LIVE_PASS'
          out={'status':'LIVE_PASS' if live else 'INCOMPLETE','stt_live_pass':stt.get('status')=='LIVE_PASS','documentai_private_gcs_live_pass':doc.get('status')=='LIVE_PASS','healthcare_fhir_dicom_live_pass':health.get('status')=='LIVE_PASS','healthcare_cleanup':cleanup.get('cleanup_requested',{}),'temporary_roles_granted_count':int(os.environ.get('GRANTED','0') or 0),'temporary_roles_remaining_count':int(os.environ.get('LEFT','0') or 0),'authorized_apis_remain_enabled':True,'veo_authorized':False,'clinical_content':False,'secret_material_exposed':False,'source_sha':os.environ.get('TARGET_SHA','')}
          (root/'summary.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n'); print(json.dumps(out,sort_keys=True))
          if out['temporary_roles_remaining_count']!=0: raise SystemExit('Temporary role cleanup failed')
          if out['status']!='LIVE_PASS': raise SystemExit('All three authorized provider LIVE proofs are not complete')
          PY
          rm -f /tmp/wave2-member /tmp/wave2-granted-roles
          if grep -R -Eiq '(BEGIN PRIVATE KEY|refresh_token|client_secret|access_token|id_token|ya29\.|@[A-Za-z0-9.-]+\.[A-Za-z]{2,})' dist/kira-wave2-corrected-live; then rm -rf dist/kira-wave2-corrected-live; echo 'Sensitive-looking material detected; refusing evidence upload.' >&2; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HealthIA-STT-DocumentAI-Healthcare-Corrected-LIVE
          path: dist/kira-wave2-corrected-live
          if-no-files-found: warn
          retention-days: 30
