name: HealthIA live product film probe 2026-08-19

on:
  push:
    branches: [kira/live-product-film-20260819]
    paths:
      - ".github/workflows/live-product-film-probe-20260819.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/live-product-film-20260819
      - name: Find latest live-product film run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/live-product-film-20260819.yml/runs?branch=kira/live-product-film-20260819&per_page=10" > /tmp/runs.json
          run_id="$(jq -r '.workflow_runs[0].id // 0' /tmp/runs.json)"
          head_sha="$(jq -r '.workflow_runs[0].head_sha // ""' /tmp/runs.json)"
          status="$(jq -r '.workflow_runs[0].status // "unknown"' /tmp/runs.json)"
          conclusion="$(jq -r '.workflow_runs[0].conclusion // ""' /tmp/runs.json)"
          test "$run_id" != "0"
          mkdir -p hackathon
          jq -n --argjson run_id "$run_id" --arg head_sha "$head_sha" --arg status "$status" --arg conclusion "$conclusion" \
            '{schema:"healthia-live-product-film-probe/v1",run_id:$run_id,head_sha:$head_sha,status:$status,conclusion:$conclusion}' \
            > hackathon/live_product_film_probe_20260819.json
          git config user.name "healthia-film-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hackathon/live_product_film_probe_20260819.json
          git commit -m "film: publish live product run probe" || exit 0
          git push origin HEAD:kira/live-product-film-20260819
# refresh: appointment-response-gate-v2
