name: One-shot browser DOM contract fix

on:
  push:
    branches:
      - kira/event-driven-results-twin-p1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/event-driven-results-twin-p1
          fetch-depth: 0
      - name: Repair consolidated patient-name selector and remove this workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('web/app.js')
          text = path.read_text(encoding='utf-8')
          old = '  patientName: $("#patientName"),'
          new = '  patientName: $("#patientName") || $("#heroPatientName"),'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected patientName selector contract was not found')
          PY
          git rm .github/workflows/one-shot-browser-dom-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: resolve consolidated patient identity in browser"
          git push origin HEAD:kira/event-driven-results-twin-p1
