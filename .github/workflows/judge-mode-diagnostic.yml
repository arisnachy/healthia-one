name: HealthIA Judge Mode diagnostic

on:
  push:
    branches:
      - kira/autonomous-continuity-mainline
    paths:
      - ".github/workflows/judge-mode-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE: healthia-one-judge
    steps:
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Inspect running revision and compare anonymous/authenticated responses
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/service.json
          project_number="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          url="https://${SERVICE}-${project_number}.${REGION}.run.app"
          echo '=== sanitized service runtime ==='
          jq '{
            latestCreated: .status.latestCreatedRevisionName,
            latestReady: .status.latestReadyRevisionName,
            ready: ([.status.conditions[]? | select(.type=="Ready") | .status][0] // "unknown"),
            ingress: (.metadata.annotations["run.googleapis.com/ingress"] // "unset"),
            image: .spec.template.spec.containers[0].image,
            command: .spec.template.spec.containers[0].command,
            args: .spec.template.spec.containers[0].args,
            envNames: [.spec.template.spec.containers[0].env[]?.name],
            traffic: .status.traffic
          }' /tmp/service.json

          echo '=== anonymous /healthz ==='
          curl -sS --max-time 15 -D /tmp/anon.headers -o /tmp/anon.body "$url/healthz" || true
          cat /tmp/anon.headers | sed -E 's/(set-cookie:).*/\1 [redacted]/I'
          echo 'BODY:'; head -c 600 /tmp/anon.body; echo

          echo '=== authenticated /healthz ==='
          token="$(gcloud auth print-identity-token --audiences="$url" 2>/dev/null || true)"
          if [[ -n "$token" ]]; then
            curl -sS --max-time 15 -H "Authorization: Bearer $token" -D /tmp/auth.headers -o /tmp/auth.body "$url/healthz" || true
            cat /tmp/auth.headers | sed -E 's/(set-cookie:).*/\1 [redacted]/I'
            echo 'BODY:'; head -c 600 /tmp/auth.body; echo
          else
            echo 'CI identity could not mint an audience-bound identity token.'
          fi

          echo '=== anonymous root ==='
          curl -sS --max-time 15 -D /tmp/root.headers -o /tmp/root.body "$url/" || true
          cat /tmp/root.headers | sed -E 's/(set-cookie:).*/\1 [redacted]/I'
          echo 'BODY:'; head -c 600 /tmp/root.body; echo
