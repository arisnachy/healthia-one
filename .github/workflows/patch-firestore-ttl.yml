name: HealthIA guarded Firestore TTL patch

on:
  push:
    branches:
      - kira/architecture-100-20260821
    paths:
      - scripts/patch_firestore_ttl.py
      - .github/workflows/patch-firestore-ttl.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply exact-anchor patch
        run: python scripts/patch_firestore_ttl.py
      - name: Verify patch scope
        run: |
          git diff --check
          git diff -- deployment/deploy-cloud-demo.ps1
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "healthia-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add deployment/deploy-cloud-demo.ps1
          git commit -m "architecture: enable TTL for ephemeral Firestore coordination state"
          git push origin HEAD:kira/architecture-100-20260821
