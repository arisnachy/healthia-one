name: Real Cloud browser judge proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: healthia-real-cloud-browser-judge-proof
  cancel-in-progress: true

jobs:
  live-browser:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE_NAME: healthia-one-judge
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact candidate and Chromium
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m playwright install --with-deps chromium

      - name: Resolve private Cloud Run service and mint browser invocation token
        id: cloud
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$url" && test -n "$revision"
          token="$(gcloud auth print-identity-token --audiences="$url")"
          echo "::add-mask::$token"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          code="$(curl -sS -o /tmp/browser-readiness.json -w '%{http_code}' -H "Authorization: Bearer ${token}" "$url/api/readiness")"
          test "$code" = 200
          python - <<'PY'
          import json
          p=json.load(open('/tmp/browser-readiness.json',encoding='utf-8'))
          assert p.get('ready') is True
          assert p.get('model') == 'gemini-3.5-flash'
          assert p.get('store_backend') == 'firestore'
          assert p.get('evidence_backend') == 'gcs'
          assert p.get('adk_ready') is True and p.get('ai_ready') is True
          PY
          echo "Cloud browser target revision: $revision"

      - name: Execute unmocked browser journey against deployed Cloud Run
        env:
          HEALTHIA_CLOUD_URL: ${{ steps.cloud.outputs.url }}
          HEALTHIA_CLOUD_ID_TOKEN: ${{ steps.cloud.outputs.token }}
        run: |
          set -euo pipefail
          python scripts/cloud_browser_judge_proof.py

      - name: Add sanitized Cloud runtime metadata
        if: always()
        env:
          CLOUD_URL: ${{ steps.cloud.outputs.url }}
          CLOUD_REVISION: ${{ steps.cloud.outputs.revision }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p dist/cloud-browser-judge-proof
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('dist/cloud-browser-judge-proof/runtime.json')
          p.write_text(json.dumps({
            'cloud_url': os.environ.get('CLOUD_URL',''),
            'cloud_revision': os.environ.get('CLOUD_REVISION',''),
            'candidate_sha': os.environ.get('CANDIDATE_SHA',''),
            'project':'healthia-6088a',
            'region':'us-central1',
            'service':'healthia-one-judge',
            'model':'gemini-3.5-flash',
            'transport':'vertex_ai_adc',
            'store_backend':'firestore',
            'evidence_backend':'gcs',
            'mocked':False,
          },indent=2),encoding='utf-8')
          PY

      - name: Upload real browser video, screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-real-cloud-browser-judge-proof
          path: dist/cloud-browser-judge-proof
          if-no-files-found: warn
          retention-days: 14
