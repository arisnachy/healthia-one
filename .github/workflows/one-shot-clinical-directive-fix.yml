name: One-shot clinical directive guard repair

on:
  push:
    branches:
      - kira/event-driven-results-twin-p1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kira/event-driven-results-twin-p1
          fetch-depth: 0
      - name: Repair directive detector, add regression tests, and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('healthia_one/clinical_planner.py')
          text = path.read_text(encoding='utf-8')

          old_constants = '''FORBIDDEN_CLINICAL_DIRECTIVES = (\n    "toma ",\n    "tome ",\n    "suspende ",\n    "suspenda ",\n    "aumenta la dosis",\n    "reduce la dosis",\n    "diagnostico confirmado",\n    "definitivamente tienes",\n)\n'''
          new_constants = '''FORBIDDEN_CLINICAL_DIRECTIVES = (\n    "suspende ",\n    "suspenda ",\n    "empieza a tomar ",\n    "comienza a tomar ",\n    "deja de tomar ",\n    "debe tomar ",\n    "debes tomar ",\n    "te recomiendo tomar ",\n    "aumenta la dosis",\n    "aumente la dosis",\n    "reduce la dosis",\n    "reduzca la dosis",\n    "disminuye la dosis",\n    "disminuya la dosis",\n    "diagnostico confirmado",\n    "definitivamente tienes",\n)\n'''
          if old_constants not in text:
              raise SystemExit('old forbidden-directive constants not found')
          text = text.replace(old_constants, new_constants, 1)

          normalize_fn = '''def _normalize(value: str) -> str:\n    text = unicodedata.normalize("NFKD", str(value).lower())\n    return "".join(char for char in text if not unicodedata.combining(char)).strip()\n'''
          helper = normalize_fn + '''\n\ndef _contains_forbidden_clinical_directive(value: str) -> bool:\n    """Reject treatment commands without rejecting legitimate medication-history questions."""\n    normalized = _normalize(value)\n    if any(directive in normalized for directive in FORBIDDEN_CLINICAL_DIRECTIVES):\n        return True\n\n    # "¿Toma algún medicamento?" is a legitimate interview question. By\n    # contrast, standalone imperative clauses such as "Toma ciprofloxacino" or\n    # "No tome este medicamento" are treatment directives and remain blocked.\n    for fragment in re.split(r"[.!;\\n]+", normalized):\n        clause = fragment.strip()\n        if not clause:\n            continue\n        if "?" in clause or clause.startswith("¿"):\n            continue\n        command = clause.lstrip("¡!:- ")\n        if re.match(r"^(?:por favor\\s+)?(?:no\\s+)?(?:toma|tome)\\s+", command):\n            return True\n    return False\n'''
          if normalize_fn not in text:
              raise SystemExit('normalize helper anchor not found')
          text = text.replace(normalize_fn, helper, 1)

          old_check = '''    combined = _normalize(\n        " ".join(\n            [question["prompt"] for question in questions]\n            + [option for question in questions for option in question["options"]]\n        )\n    )\n    if any(directive in combined for directive in FORBIDDEN_CLINICAL_DIRECTIVES):\n        raise ValueError("El bloque dinámico contiene una indicación clínica no permitida")\n'''
          new_check = '''    patient_visible_fragments = [question["prompt"] for question in questions] + [\n        option for question in questions for option in question["options"]\n    ]\n    if any(_contains_forbidden_clinical_directive(fragment) for fragment in patient_visible_fragments):\n        raise ValueError("El bloque dinámico contiene una indicación clínica no permitida")\n'''
          if old_check not in text:
              raise SystemExit('old raw-substring directive check not found')
          text = text.replace(old_check, new_check, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_clinical_directive_guard.py')
          test.write_text(r'''import pytest

from healthia_one.clinical_planner import normalize_dynamic_question_block


def payload(first_prompt: str, first_options: list[str] | None = None) -> dict:
    return {
        "questions": [
            {
                "id": "medicacion",
                "prompt": first_prompt,
                "options": first_options or ["No", "Sí, uno", "Sí, varios"],
                "multiple": False,
            },
            {
                "id": "fiebre",
                "prompt": "¿Has tenido fiebre o escalofríos desde que comenzó?",
                "options": ["No", "Fiebre", "Fiebre con escalofríos"],
                "multiple": False,
            },
            {
                "id": "dolor",
                "prompt": "¿Dónde sientes dolor además de la molestia principal?",
                "options": ["En ningún otro lugar", "Bajo vientre", "Espalda o costado"],
                "multiple": False,
            },
            {
                "id": "vomitos",
                "prompt": "¿Has tenido vómitos o dificultad para retener líquidos?",
                "options": ["No", "Una vez", "Varias veces"],
                "multiple": False,
            },
            {
                "id": "sangre",
                "prompt": "¿Has notado sangre visible o un empeoramiento rápido?",
                "options": ["No", "Sangre visible", "Empeoramiento rápido"],
                "multiple": False,
            },
        ]
    }


def test_medication_history_question_is_not_mistaken_for_prescribing() -> None:
    block = normalize_dynamic_question_block(
        payload("¿Toma algún medicamento o antibiótico actualmente?"),
        1,
    )
    assert block["questions"][0]["prompt"].startswith("¿Toma")


def test_direct_medication_command_remains_blocked() -> None:
    with pytest.raises(ValueError, match="indicación clínica no permitida"):
        normalize_dynamic_question_block(payload("Toma ciprofloxacino 500 mg cada 12 horas."), 1)


def test_stop_or_dose_change_commands_remain_blocked() -> None:
    for directive in ("Suspenda el medicamento actual.", "Aumente la dosis del medicamento."):
        with pytest.raises(ValueError, match="indicación clínica no permitida"):
            normalize_dynamic_question_block(payload(directive), 1)
''', encoding='utf-8')
          PY

          python -m pytest -q tests/test_clinical_directive_guard.py
          git rm .github/workflows/one-shot-clinical-directive-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add healthia_one/clinical_planner.py tests/test_clinical_directive_guard.py
          git commit -m "fix: distinguish medication questions from treatment commands"
          git push origin HEAD:kira/event-driven-results-twin-p1
