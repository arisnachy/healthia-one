name: KIRA one-shot FCM proof backend deploy

on:
  pull_request:
    paths:
      - '.github/workflows/fcm-proof-backend-deploy-once.yml'

concurrency:
  group: healthia-fcm-proof-backend-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deploy-fcm-proof-backend:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'kira/google-constellation-wave2-live'
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SERVICE: healthia-one-fcm
      RUNTIME_SA: healthia-one-demo@healthia-6088a.iam.gserviceaccount.com
      BUILD_SA: projects/healthia-6088a/serviceAccounts/healthia-one-build@healthia-6088a.iam.gserviceaccount.com
      TEMP_RUN_ROLE: roles/run.admin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Bind exact source head
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "${{ github.event.pull_request.head.sha }}"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo 'TEMP_RUN_ADMIN_GRANTED=false' >> "$GITHUB_ENV"
          echo 'TEMP_RUN_ADMIN_REMOVED=false' >> "$GITHUB_ENV"
          echo 'SERVICE_CREATED_THIS_RUN=false' >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify required APIs are already enabled
        shell: bash
        run: |
          set -euo pipefail
          enabled="$(gcloud services list --enabled --project "$PROJECT_ID" --format='value(config.name)')"
          for api in run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com firestore.googleapis.com secretmanager.googleapis.com; do
            grep -Fxq "$api" <<<"$enabled" || { echo "Required pre-enabled API missing: $api" >&2; exit 1; }
          done
          echo 'Required APIs already enabled; no service enablement mutation will occur.'

      - name: Ensure isolated zero-AI FCM proof backend exists
        shell: bash
        run: |
          set -euo pipefail
          if gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(metadata.name)' >/tmp/fcm-service-name.txt 2>/dev/null; then
            rm -f /tmp/fcm-service-name.txt
            echo 'Existing isolated FCM service found; reusing deployed application revision.'
            exit 0
          fi
          rm -f /tmp/fcm-service-name.txt
          gcloud run deploy "$SERVICE" \
            --source . \
            --build-service-account "$BUILD_SA" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --min 0 \
            --max 1 \
            --concurrency 10 \
            --cpu 1 \
            --memory 512Mi \
            --timeout 300 \
            --set-env-vars 'HEALTHIA_ENV=cloud,HEALTHIA_LLM_BACKEND=mock,HEALTHIA_STORE_BACKEND=firestore,HEALTHIA_AUTH_REQUIRED=true,HEALTHIA_ALLOW_REGISTRATION=true,HEALTHIA_COST_MODE=local,HEALTHIA_AI_REQUEST_LIMIT=0,HEALTHIA_COST_GUARD_START_ENABLED=false,HEALTHIA_COST_CONTROL_UI=false,HEALTHIA_PROACTIVE_ENABLED=false,GOOGLE_CLOUD_PROJECT=healthia-6088a' \
            --set-secrets 'HEALTHIA_DEVICE_TOKEN_SECRET=healthia-device-token-secret:latest,HEALTHIA_SESSION_SECRET=healthia-session-secret:latest' \
            --no-allow-unauthenticated \
            --quiet >/tmp/fcm-cloud-run-deploy.txt
          rm -f /tmp/fcm-cloud-run-deploy.txt
          echo 'SERVICE_CREATED_THIS_RUN=true' >> "$GITHUB_ENV"

      - name: Grant temporary Cloud Run Admin only to publish this isolated service
        shell: bash
        run: |
          set -euo pipefail
          account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n 1)"
          test -n "$account"
          case "$account" in
            *.iam.gserviceaccount.com) ;;
            *) echo 'Active CI identity is not a service account.' >&2; exit 1 ;;
          esac
          echo "::add-mask::$account"
          echo "CI_ACCOUNT=$account" >> "$GITHUB_ENV"
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${account}" \
            --role="$TEMP_RUN_ROLE" \
            --condition=None \
            --quiet >/tmp/run-admin-grant.txt
          rm -f /tmp/run-admin-grant.txt
          echo 'TEMP_RUN_ADMIN_GRANTED=true' >> "$GITHUB_ENV"

      - name: Disable Cloud Run Invoker IAM check for phone access
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --no-invoker-iam-check \
            --quiet >/tmp/run-public-update.txt
          rm -f /tmp/run-public-update.txt

      - name: Remove temporary Cloud Run Admin
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          removed=false
          if [[ "${TEMP_RUN_ADMIN_GRANTED:-false}" == 'true' ]]; then
            test -n "${CI_ACCOUNT:-}"
            gcloud projects remove-iam-policy-binding "$PROJECT_ID" \
              --member="serviceAccount:${CI_ACCOUNT}" \
              --role="$TEMP_RUN_ROLE" \
              --condition=None \
              --quiet >/tmp/run-admin-remove.txt
            rm -f /tmp/run-admin-remove.txt
            removed=true
          fi
          echo "removed=$removed" >> "$GITHUB_OUTPUT"
          echo "TEMP_RUN_ADMIN_REMOVED=$removed" >> "$GITHUB_ENV"

      - name: Verify temporary Cloud Run Admin is absent
        if: always() && steps.cleanup.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CI_ACCOUNT:-}"
          if gcloud projects get-iam-policy "$PROJECT_ID" --format=json | python -c 'import json,sys,os; p=json.load(sys.stdin); member="serviceAccount:"+os.environ["CI_ACCOUNT"]; role=os.environ["TEMP_RUN_ROLE"]; raise SystemExit(1 if any(b.get("role")==role and member in (b.get("members") or []) for b in p.get("bindings",[])) else 0)'; then
            echo 'Temporary Cloud Run Admin binding is absent.'
          else
            echo 'Temporary Cloud Run Admin binding still present; refusing proof.' >&2
            exit 1
          fi

      - name: Prove deployed FCM surface without patient data
        id: proof
        if: steps.cleanup.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/fcm-proof-backend
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$url"
          test -n "$revision"

          readiness_code="$(curl -sS -o /tmp/readiness.json -w '%{http_code}' "$url/api/readiness" || true)"
          [[ "$readiness_code" == '200' ]] || { rm -f /tmp/readiness.json; echo "Readiness HTTP $readiness_code" >&2; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/readiness.json').read_text(encoding='utf-8'))
          text=json.dumps(payload,sort_keys=True)
          if 'fcm_private_notifications' not in text:
              raise SystemExit('Deployed readiness does not expose fcm_private_notifications')
          if payload.get('store_backend') != 'firestore':
              raise SystemExit('Deployed service is not using Firestore')
          if payload.get('auth_required') is not True:
              raise SystemExit('HealthIA application auth is not required')
          if payload.get('llm_backend') != 'mock':
              raise SystemExit('FCM proof backend unexpectedly enables an LLM backend')
          PY
          rm -f /tmp/readiness.json

          fcm_status_code="$(curl -sS -o /tmp/fcm-status.json -w '%{http_code}' "$url/api/devices/fcm/status/kira-proof-device" || true)"
          rm -f /tmp/fcm-status.json
          [[ "$fcm_status_code" == '401' ]] || { echo "Expected FCM route auth boundary HTTP 401, got $fcm_status_code" >&2; exit 1; }

          export SERVICE_URL="$url" REVISION="$revision" READINESS_CODE="$readiness_code" FCM_STATUS_CODE="$fcm_status_code"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          account=os.environ.get('CI_ACCOUNT','')
          out={
              'status':'LIVE_PASS',
              'source_sha':os.environ['SOURCE_SHA'],
              'project_id':os.environ['PROJECT_ID'],
              'region':os.environ['REGION'],
              'service':os.environ['SERVICE'],
              'service_url':os.environ['SERVICE_URL'],
              'revision':os.environ['REVISION'],
              'readiness_http_status':int(os.environ['READINESS_CODE']),
              'fcm_status_without_device_bearer_http_status':int(os.environ['FCM_STATUS_CODE']),
              'firestore_backend':True,
              'healthia_auth_required':True,
              'cloud_run_invoker_iam_check_disabled':True,
              'llm_backend':'mock',
              'ai_request_limit':0,
              'min_instances':0,
              'max_instances':1,
              'service_created_this_run':os.environ.get('SERVICE_CREATED_THIS_RUN')=='true',
              'temporary_run_admin_granted':os.environ.get('TEMP_RUN_ADMIN_GRANTED')=='true',
              'temporary_run_admin_removed':os.environ.get('TEMP_RUN_ADMIN_REMOVED')=='true',
              'active_service_account_sha256':hashlib.sha256(account.encode()).hexdigest() if account else None,
              'provider_write':True,
              'api_enable_mutation':False,
              'secret_material_exposed':False,
          }
          Path('dist/fcm-proof-backend/result.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Build failure evidence when proof did not pass
        if: always() && steps.proof.conclusion != 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/fcm-proof-backend
          export PROOF_CONCLUSION="${{ steps.proof.conclusion }}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          out={
              'status':'FAILED',
              'source_sha':os.environ.get('SOURCE_SHA',''),
              'project_id':os.environ['PROJECT_ID'],
              'region':os.environ['REGION'],
              'service':os.environ['SERVICE'],
              'proof_conclusion':os.environ.get('PROOF_CONCLUSION',''),
              'temporary_run_admin_granted':os.environ.get('TEMP_RUN_ADMIN_GRANTED')=='true',
              'temporary_run_admin_removed':os.environ.get('TEMP_RUN_ADMIN_REMOVED')=='true',
              'api_enable_mutation':False,
              'secret_material_exposed':False,
          }
          Path('dist/fcm-proof-backend/result.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Refuse secret-like evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -Eiq '(BEGIN PRIVATE KEY|client_secret|access_token|refresh_token|ya29\.|AIza[0-9A-Za-z_-]{20,}|iam\.gserviceaccount\.com)' dist/fcm-proof-backend; then
            rm -rf dist/fcm-proof-backend
            echo 'Sensitive-looking material detected; refusing upload.' >&2
            exit 1
          fi

      - name: Upload sanitized FCM proof backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthIA-FCM-Proof-Backend
          path: dist/fcm-proof-backend/result.json
          if-no-files-found: error
          retention-days: 30
