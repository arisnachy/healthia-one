name: KIRA Wave 3 singleton guard once

on:
  pull_request:
    branches:
      - kira/golden-google-constellation-live-891745e1
    paths:
      - .github/workflows/kira-wave3-singleton-guard-once.yml

permissions:
  actions: write
  contents: read

jobs:
  enforce-singleton:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      KEEP_V3_RUN_ID: "31510556686"
    steps:
      - name: Cancel every obsolete or duplicate Wave 3 one-shot except the active recorder
        shell: bash
        run: |
          set -euo pipefail
          for workflow in kira-wave3-exact-head-authorized-once.yml kira-wave3-exact-head-authorized-once-v2.yml; do
            gh api "/repos/${REPO}/actions/workflows/${workflow}/runs?per_page=30" --jq '.workflow_runs[] | select(.status!="completed") | .id' | while read -r run_id; do
              [ -n "$run_id" ] || continue
              gh api --method POST "/repos/${REPO}/actions/runs/${run_id}/cancel" || true
            done
          done
          gh api "/repos/${REPO}/actions/workflows/kira-wave3-record-existing-revision-v3.yml/runs?per_page=30" --jq '.workflow_runs[] | select(.status!="completed") | .id' | while read -r run_id; do
            [ -n "$run_id" ] || continue
            if [ "$run_id" != "$KEEP_V3_RUN_ID" ]; then
              echo "Cancelling duplicate v3 run $run_id"
              gh api --method POST "/repos/${REPO}/actions/runs/${run_id}/cancel" || true
            fi
          done
          echo "HEALTHIA_WAVE3_SINGLETON_ENFORCED keep=${KEEP_V3_RUN_ID}"
