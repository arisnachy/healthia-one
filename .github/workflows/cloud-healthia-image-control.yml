name: Cloud HealthIA image control

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: healthia-cloud-image-control
  cancel-in-progress: true

jobs:
  image-control:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      SOURCE_SERVICE: healthia-one-judge
      CONTROL_SERVICE: healthia-image-control
      PROVISION_PRINCIPAL: healthia-github-vertex-9@healthia-6088a.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: healthia-6088a

      - name: Read judge startup/app logs
        shell: bash
        run: |
          set +e
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${SOURCE_SERVICE} AND (logName=\"projects/${PROJECT_ID}/logs/run.googleapis.com%2Fstdout\" OR logName=\"projects/${PROJECT_ID}/logs/run.googleapis.com%2Fstderr\")" \
            --project="$PROJECT_ID" --freshness=60m --limit=80 --format='value(textPayload)' \
            | tee deployment/healthia-judge-startup.log
          exit 0

      - name: Temporarily grant Cloud Run Admin
        run: |
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${PROVISION_PRINCIPAL}" \
            --role="roles/run.admin" --condition=None --quiet >/dev/null

      - name: Resolve immutable HealthIA image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          curl -fsSL -H "Authorization: Bearer ${token}" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${SOURCE_SERVICE}" > /tmp/service.json
          image="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/service.json'))
          print(((d.get('template') or {}).get('containers') or [{}])[0].get('image',''))
          PY
          )"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "image=$image"

      - name: Deploy same HealthIA image with minimal Cloud Run configuration
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$CONTROL_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image '${{ steps.image.outputs.image }}' \
            --min 0 --max 1 \
            --no-invoker-iam-check \
            --quiet >/dev/null
          token="$(gcloud auth print-access-token)"
          curl -fsSL -H "Authorization: Bearer ${token}" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${CONTROL_SERVICE}" > /tmp/control.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/control.json'))
          print('urls=',d.get('urls'))
          print('ready=',(d.get('terminalCondition') or {}).get('state'))
          print('serviceAccount=',(d.get('template') or {}).get('serviceAccount'))
          print('envNames=',[e.get('name') for c in ((d.get('template') or {}).get('containers') or []) for e in (c.get('env') or [])])
          PY
          url="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/control.json'))
          urls=d.get('urls') or []
          print(urls[0] if urls else d.get('uri',''))
          PY
          )"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Probe minimal HealthIA image route and logs
        id: probe
        shell: bash
        run: |
          set +e
          url='${{ steps.deploy.outputs.url }}'
          : > deployment/healthia-image-control-results.txt
          code=000
          for i in {1..15}; do
            code="$(curl -sS -o /tmp/body.txt -w '%{http_code}' "$url/healthz" || true)"
            echo "attempt=$i HTTP=$code" | tee -a deployment/healthia-image-control-results.txt
            [ "$code" = 200 ] && break
            sleep 3
          done
          echo "final_http=$code" | tee -a deployment/healthia-image-control-results.txt
          echo '--- app logs ---' | tee -a deployment/healthia-image-control-results.txt
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${CONTROL_SERVICE} AND (logName=\"projects/${PROJECT_ID}/logs/run.googleapis.com%2Fstdout\" OR logName=\"projects/${PROJECT_ID}/logs/run.googleapis.com%2Fstderr\")" \
            --project="$PROJECT_ID" --freshness=20m --limit=60 --format='value(textPayload)' \
            | tee -a deployment/healthia-image-control-results.txt
          echo '--- request log count ---' | tee -a deployment/healthia-image-control-results.txt
          count="$(gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${CONTROL_SERVICE} AND logName=\"projects/${PROJECT_ID}/logs/run.googleapis.com%2Frequests\"" \
            --project="$PROJECT_ID" --freshness=20m --limit=60 --format=json 2>/dev/null | jq 'length' 2>/dev/null || echo unknown)"
          echo "request_log_count=$count" | tee -a deployment/healthia-image-control-results.txt
          if [ "$code" = 200 ]; then
            echo "HEALTHIA_IMAGE_MINIMAL_ROUTE_OK"
            exit 0
          fi
          echo "::error::Same HealthIA image still fails under minimal Cloud Run configuration"
          exit 1

      - name: Delete ephemeral image control
        if: always()
        run: |
          gcloud run services delete "$CONTROL_SERVICE" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null || true

      - name: Remove temporary Cloud Run Admin
        if: always()
        run: |
          gcloud projects remove-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${PROVISION_PRINCIPAL}" \
            --role="roles/run.admin" --condition=None --quiet >/dev/null || true

      - name: Upload image-control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthia-cloud-image-control
          path: |
            deployment/healthia-judge-startup.log
            deployment/healthia-image-control-results.txt
          if-no-files-found: warn
          retention-days: 7
