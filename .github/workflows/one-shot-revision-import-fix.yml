name: One-shot revision verifier import fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Make deployment verifier executable as a script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('deployment/verify_cloud_revision_continuity.py')
          text=p.read_text(encoding='utf-8')
          if 'import sys\n' not in text:
              text=text.replace('import json\n', 'import json\nimport sys\n', 1)
          marker='from uuid import uuid4\n\nfrom deployment.verify_cloud_demo import ('
          replacement='''from uuid import uuid4\n\n\nROOT = Path(__file__).resolve().parents[1]\nif str(ROOT) not in sys.path:\n    sys.path.insert(0, str(ROOT))\n\nfrom deployment.verify_cloud_demo import (  # noqa: E402'''
          if marker not in text:
              raise SystemExit('Expected revision-verifier import marker not found')
          text=text.replace(marker,replacement,1)
          p.write_text(text,encoding='utf-8')
          PY
          rm .github/workflows/one-shot-revision-import-fix.yml
          git config user.name 'KIRA HealthIA CI'
          git config user.email 'actions@users.noreply.github.com'
          git add deployment/verify_cloud_revision_continuity.py .github/workflows/one-shot-revision-import-fix.yml
          git diff --cached --check
          git commit -m 'cloud: make revision continuity verifier directly executable'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
