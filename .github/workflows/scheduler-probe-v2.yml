name: HealthIA Scheduler probe v2

on:
  push:
    branches: [kira/autonomous-continuity-mainline]
    paths: [".github/workflows/scheduler-probe-v2.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      AUTOPILOT_SERVICE: healthia-one-autopilot
      AUTOPILOT_TRIGGER: healthia-opportunity-events
      PROBE_JOB: healthia-care-scheduler-probe-v2
    steps:
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Probe exact Scheduler create permission safely
        shell: bash
        run: |
          set -uo pipefail
          project_number="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          auto_url="https://${AUTOPILOT_SERVICE}-${project_number}.${REGION}.run.app"
          location="$(gcloud firestore databases describe --database='(default)' --project "$PROJECT_ID" --format='value(locationId)')"
          trigger_sa="$(gcloud eventarc triggers describe "$AUTOPILOT_TRIGGER" --project "$PROJECT_ID" --location "$location" --format='value(serviceAccount)')"
          echo "Resolved Eventarc identity: [redacted-service-account]"
          gcloud scheduler jobs delete "$PROBE_JOB" --project "$PROJECT_ID" --location "$REGION" --quiet >/dev/null 2>&1 || true
          set +e
          output="$(gcloud scheduler jobs create http "$PROBE_JOB" --project "$PROJECT_ID" --location "$REGION" --schedule='0 0 1 1 *' --time-zone=UTC --uri="${auto_url}/scheduled/care" --http-method=POST --oidc-service-account-email="$trigger_sa" --oidc-token-audience="$auto_url" --attempt-deadline=300s --description='temporary permission probe - never run' --quiet 2>&1)"
          code=$?
          set -e
          echo "SCHEDULER_PROBE_EXIT=${code}"
          printf '%s\n' "$output" | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[redacted-service-account]/g'
          if [[ $code -eq 0 ]]; then
            gcloud scheduler jobs pause "$PROBE_JOB" --project "$PROJECT_ID" --location "$REGION" --quiet >/dev/null || true
            echo "SCHEDULER_CREATE=PASS"
          else
            echo "SCHEDULER_CREATE=FAIL"
          fi
          gcloud scheduler jobs delete "$PROBE_JOB" --project "$PROJECT_ID" --location "$REGION" --quiet >/dev/null 2>&1 || true
          exit 0
