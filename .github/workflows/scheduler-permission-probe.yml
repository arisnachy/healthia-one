name: HealthIA Scheduler permission probe

on:
  push:
    branches:
      - kira/autonomous-continuity-mainline
    paths:
      - ".github/workflows/scheduler-permission-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PROJECT_ID: healthia-6088a
      REGION: us-central1
      AUTOPILOT_SERVICE: healthia-one-autopilot
      AUTOPILOT_TRIGGER: healthia-opportunity-events
      PROBE_JOB: healthia-care-scheduler-permission-probe
    steps:
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Resolve existing private identities
        id: ids
        shell: bash
        run: |
          set -euo pipefail
          project_number="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          auto_url="https://${AUTOPILOT_SERVICE}-${project_number}.${REGION}.run.app"
          location="$(gcloud firestore databases describe --database='(default)' --project "$PROJECT_ID" --format='value(locationId)')"
          gcloud eventarc triggers describe "$AUTOPILOT_TRIGGER" --project "$PROJECT_ID" --location "$location" --format=json > /tmp/trigger.json
          trigger_sa="$(jq -r '.serviceAccount // empty' /tmp/trigger.json)"
          runtime_sa="$(gcloud run services describe "$AUTOPILOT_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.serviceAccountName)')"
          test -n "$project_number" && test -n "$trigger_sa" && test -n "$runtime_sa"
          echo "auto_url=$auto_url" >> "$GITHUB_OUTPUT"
          echo "trigger_sa=$trigger_sa" >> "$GITHUB_OUTPUT"
          echo "runtime_sa=$runtime_sa" >> "$GITHUB_OUTPUT"
          echo "Eventarc SA: $trigger_sa"
          echo "Autopilot runtime SA: $runtime_sa"

      - name: Inspect existing scheduler state
        shell: bash
        run: |
          set -euo pipefail
          gcloud scheduler jobs list --project "$PROJECT_ID" --location "$REGION" \
            --format='table(name.basename(),state,httpTarget.oidcToken.serviceAccountEmail,httpTarget.uri,schedule)' || true

      - name: Test service-account actAs permission through IAM API
        id: iam
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          for label in trigger runtime; do
            if [[ "$label" == trigger ]]; then sa="${{ steps.ids.outputs.trigger_sa }}"; else sa="${{ steps.ids.outputs.runtime_sa }}"; fi
            encoded="$(python - <<PY
import urllib.parse
print(urllib.parse.quote('''$sa''', safe=''))
PY
)"
            body="$(curl -fsS -X POST \
              -H "Authorization: Bearer ${token}" \
              -H 'Content-Type: application/json' \
              -d '{"permissions":["iam.serviceAccounts.actAs"]}' \
              "https://iam.googleapis.com/v1/projects/-/serviceAccounts/${encoded}:testIamPermissions")"
            allowed="$(jq -r '(.permissions // []) | index("iam.serviceAccounts.actAs") != null' <<<"$body")"
            echo "${label}_actas=${allowed}" >> "$GITHUB_OUTPUT"
            echo "${label} iam.serviceAccounts.actAs = ${allowed}"
          done

      - name: Create paused annual OIDC probe using Eventarc identity
        id: create
        shell: bash
        run: |
          set -uo pipefail
          gcloud scheduler jobs delete "$PROBE_JOB" --project "$PROJECT_ID" --location "$REGION" --quiet >/dev/null 2>&1 || true
          set +e
          output="$(gcloud scheduler jobs create http "$PROBE_JOB" \
            --project "$PROJECT_ID" --location "$REGION" \
            --schedule '0 0 1 1 *' --time-zone 'UTC' \
            --uri '${{ steps.ids.outputs.auto_url }}/scheduled/care' \
            --http-method POST \
            --oidc-service-account-email '${{ steps.ids.outputs.trigger_sa }}' \
            --oidc-token-audience '${{ steps.ids.outputs.auto_url }}' \
            --attempt-deadline 300s \
            --description 'Temporary permission probe; never intended to execute' \
            --quiet 2>&1)"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$output" \
            | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[service-account]/g' \
            | tail -n 30
          if [[ $code -eq 0 ]]; then
            gcloud scheduler jobs pause "$PROBE_JOB" --project "$PROJECT_ID" --location "$REGION" --quiet >/dev/null
            gcloud scheduler jobs describe "$PROBE_JOB" --project "$PROJECT_ID" --location "$REGION" --format=json > /tmp/probe.json
            echo 'Probe creation PASS; job immediately paused.'
            jq '{state,schedule,timeZone,uri:.httpTarget.uri,oidcServiceAccount:(.httpTarget.oidcToken.serviceAccountEmail|if . then "[service-account]" else null end)}' /tmp/probe.json
          else
            echo 'Probe creation FAILED as expected diagnostic evidence.'
          fi

      - name: Cleanup probe
        if: always()
        shell: bash
        run: |
          set +e
          gcloud scheduler jobs delete "$PROBE_JOB" --project "$PROJECT_ID" --location "$REGION" --quiet >/dev/null 2>&1

      - name: Emit diagnosis
        if: always()
        shell: bash
        run: |
          echo "trigger_actAs=${{ steps.iam.outputs.trigger_actas }}"
          echo "runtime_actAs=${{ steps.iam.outputs.runtime_actas }}"
          echo "scheduler_create_exit=${{ steps.create.outputs.exit_code }}"
