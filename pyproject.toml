[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthia-one"
version = "0.1.0"
description = "Patient-owned, demand-driven health continuity OS with evidence-grounded agents."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Arisnachy Gomez Diaz"}]
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "google-adk>=2.5,<3",
  "google-auth>=2.47,<3",
  "google-genai>=2.13,<3",
  "google-cloud-firestore>=2.21,<3",
  "google-cloud-secret-manager>=2.25,<3",
  "google-cloud-storage>=3.3,<4",
  "google-cloud-modelarmor>=0.7,<1",
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
  "opentelemetry-exporter-gcp-trace>=1.12,<2",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "playwright>=1.54,<2",
]

[tool.setuptools.packages.find]
include = ["healthia_one*", "healthia_agent*", "app*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100