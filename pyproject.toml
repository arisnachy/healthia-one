[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthia-one"
version = "0.1.0"
description = "Patient-owned health continuity OS with proactive multi-agent follow-up."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Arisnachy Gomez Diaz"}]
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "google-adk[gcp]>=2.5,<3",
  "google-genai>=2.13,<3",
  "google-cloud-firestore>=2.21,<3",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "playwright>=1.54,<2",
]

[tool.setuptools.packages.find]
include = ["healthia_one*", "healthia_agent*", "app*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
